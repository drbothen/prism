[package]
name = "prism-mcp"
version = "0.1.0"
edition = "2021"
description = "Prism MCP transport layer — safety envelope middleware, tool registry (SS-10)"
license = "MIT"
publish = false

[lib]
name = "prism_mcp"

[dependencies]
prism-core = { path = "../prism-core", version = "0.2.0" }
prism-security = { path = "../prism-security", version = "0.1.0" }
prism-query = { path = "../prism-query", version = "0.1.0" }
prism-sensors = { path = "../prism-sensors", version = "0.2.0" }
prism-ocsf = { path = "../prism-ocsf", version = "0.1.0" }
prism-audit = { path = "../prism-audit", version = "0.1.0" }
# prism-spec-engine: config manager, sensor spec tools (CRIT-4 — reload/list/validate/add tools).
prism-spec-engine = { path = "../prism-spec-engine", version = "0.9.0" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
# tokio: async runtime for serve_stdio and signal handling (BC-2.10.006, BC-2.10.010).
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "time"] }
# rmcp 1.7: Official Rust MCP SDK — server transport, macro-driven tool router, schemars integration.
# Required for PrismServer ServerHandler impl and stdio transport (BC-2.10.001, BC-2.10.006).
rmcp = { workspace = true }
# schemars 1.x: JSON Schema generation for rmcp tool parameter types.
# rmcp re-exports schemars as rmcp::schemars; we depend on it directly for derive macros.
schemars = { workspace = true }
# arc-swap: lock-free ArcSwap<ConfigManager> — same version used by prism-spec-engine.
arc-swap = "1"
# async-trait: `#[async_trait]` macro for dyn-compatible async trait methods.
# Required by `SchemaChangeNotifier` (BC-2.10.013 subscribe/notify) — production code
# in schema.rs uses `Arc<dyn SchemaChangeNotifier>` which requires object safety.
async-trait = "0.1"
# arrow-json: RecordBatch → JSON rows serialization for the query tool (CRIT-1).
# Transitive via arrow←datafusion; explicit dep pins the same version.
arrow-json = "58"

[dev-dependencies]
proptest = "1"
serde_json = "1"
prism-security = { path = "../prism-security", version = "0.1.0" }
# prism-credentials: needed to construct InMemoryCredentialStore for QueryEngine in MED-1 test.
# Already a transitive dependency via prism-query; test-helpers feature exposes
# InMemoryCredentialStore for in-process unit test injection (SID-1 compliance).
prism-credentials = { path = "../prism-credentials", version = "0.1.0", features = ["test-helpers"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "test-util"] }
tempfile = "3"
# tracing-subscriber: used in shutdown tests to capture tracing event fields
# and assert that event_type + path fields are emitted by production code paths
# (F-PASS7-MED-1, F-PASS7-MED-2 fix: replace vacuous string-literal tests).
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }
# async-trait + ulid: needed for AuditWriter stub in F-PASS13-HIGH-2 AC-7 test.
# Both are already transitive dependencies via prism-query; pinned here for test stability.
async-trait = "0.1"
ulid = { version = "1", features = ["serde"] }
# toml + uuid: needed for IMP-8 per-org scoping test fixtures (OverlayLoader::merge_overlay_onto_type_spec
# requires SensorInstanceOverlay TOML deserialization; OrgId::new() mints a fresh UUID).
toml = "0.8"
uuid = { version = "1", features = ["v7"] }
# prism-storage: needed to build QueryEngine::new_full for F-S503-ADV-001 per-client scoping test.
# test-utils feature exposes InMemoryBackend (filesystem-free RocksStorageBackend stub).
# Already a transitive dep via prism-query; explicit pin for test-binary compilation.
prism-storage = { path = "../prism-storage", features = ["test-utils"] }
# secrecy: needed by NullCredStore stub implementing CredentialStore (SecretString param).
# Already a transitive dep via prism-credentials; explicit pin for test-binary compilation.
secrecy = "0.8"

[lints.clippy]
# From workspace
await_holding_lock = "deny"
# Test files use .unwrap() by design — test-writer generated them;
# cannot be modified per story constraints. Allow so -D warnings passes test binaries.
unwrap_used = "allow"

[lints.rust]
# From workspace
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(kani)'] }
# Test files use BC-style naming (test_BC_2_09_NNN_...) — generated by test-writer,
# cannot be modified per story constraints.
non_snake_case = "allow"
# Test files import items used only in certain cfg combinations.
unused_imports = "allow"
