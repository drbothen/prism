[package]
name = "prism-dtu-cyberint"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false
description = "L2-fidelity behavioral clone of the Cyberint API"

[lib]
name = "prism_dtu_cyberint"

# Per ADR-002: dtu feature declared per-crate. Gate: #[cfg(any(test, feature = "dtu"))]
# ensures this crate never links into a production binary.
[features]
dtu = []
tls = ["dep:axum-server", "prism-dtu-common/tls"]
# chrono under fixture-gen: time_anchor threading (review-2026-06-10 P1-01/P1-02).
fixture-gen = ["prism-dtu-common/fixture-gen", "dep:rand_chacha", "dep:rand", "dep:chrono"]

[dependencies]
prism-dtu-common = { path = "../prism-dtu-common", version = "0.1.0", features = ["dtu"] }
rand = { version = "0.8", optional = true }
rand_chacha = { version = "0.3", optional = true }
chrono = { version = "0.4", features = ["serde"], optional = true }
prism-core = { path = "../prism-core" }
axum-server = { version = "0.7", features = ["tls-rustls"], optional = true }
axum = "0.7"
tokio = { version = "1", features = ["full"] }
tower = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
http = "1"
async-trait = "0.1"
tracing = "0.1"
anyhow = "1"
uuid = { version = "1", features = ["v4"] }
subtle = "2"

[dev-dependencies]
chrono = { version = "0.4", features = ["serde"] }
jsonschema = "0.18"
proptest = "1"
prism-dtu-harness = { path = "../prism-dtu-harness", features = ["dtu"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "cookies", "rustls-tls"] }
serde_json = "1"
toml = "0.8"
tokio = { version = "1", features = ["full"] }

[[test]]
name = "ac_1_cookie_auth_roundtrip"
path = "tests/ac_1_cookie_auth_roundtrip.rs"
required-features = ["dtu"]

[[test]]
name = "ac_2_unauthenticated_returns_401"
