[package]
name = "prism-dtu-demo-server"
version = "0.1.0"
edition = "2021"
description = "Unified multi-clone demo harness for Prism DTU clones"
license = "MIT"
publish = false

[features]
default = ["dtu"]
# F9 / DTU-04 (review 2026-06-10): jira/pagerduty clone wiring removed — the demo
# server never constructed either clone. Re-add the deps + dtu/tls feature fan-out
# entries when wave-4 S-4.08 action demos materialize.
dtu = [
    "prism-dtu-crowdstrike/dtu",
    "prism-dtu-claroty/dtu",
    "prism-dtu-cyberint/dtu",
    "prism-dtu-armis/dtu",
    "prism-dtu-threatintel/dtu",
    "prism-dtu-nvd/dtu",
]
# S-DEMO-DTU-LIVE-SCENARIO-001-A: fixture-gen activates new_with_seed constructors on all 4
# generator-backed clones (BC-2.06.018 postcondition 1 / ADR-036 §2.3).
# Gate 4 implementer must fan this feature out to all 4 clone crates + prism-dtu-common.
# Declared here in Gate 3 so #[cfg(feature = "fixture-gen")] stubs in harness.rs compile cleanly.
fixture-gen = [
    "prism-dtu-crowdstrike/fixture-gen",
    "prism-dtu-armis/fixture-gen",
    "prism-dtu-claroty/fixture-gen",
    "prism-dtu-cyberint/fixture-gen",
    "prism-dtu-common/fixture-gen",
    "prism-dtu-threatintel/fixture-gen",
    "prism-dtu-nvd/fixture-gen",
    "dep:chrono",
]
tls = [
    "dep:axum-server",
    "dep:rustls",
    "dep:rcgen",
    "dep:sha2",
    "dep:time",
    "prism-dtu-common/tls",
    "prism-dtu-crowdstrike/tls",
    "prism-dtu-claroty/tls",
    "prism-dtu-cyberint/tls",
    "prism-dtu-armis/tls",
    "prism-dtu-threatintel/tls",
    "prism-dtu-nvd/tls",
]

[[bin]]
name = "prism-dtu-demo-server"
path = "src/main.rs"
required-features = ["dtu"]

[dependencies]
prism-dtu-common = { path = "../prism-dtu-common", version = "0.1.0", features = ["dtu"] }
prism-dtu-crowdstrike = { path = "../prism-dtu-crowdstrike", version = "0.1.0" }
prism-dtu-claroty = { path = "../prism-dtu-claroty", version = "0.1.0" }
prism-dtu-cyberint = { path = "../prism-dtu-cyberint", version = "0.1.0" }
prism-dtu-armis = { path = "../prism-dtu-armis", version = "0.1.0" }
prism-dtu-threatintel = { path = "../prism-dtu-threatintel", version = "0.1.0" }
prism-dtu-nvd = { path = "../prism-dtu-nvd", version = "0.1.0" }
# S-DEMO-DTU-LIVE-SCENARIO-001-A: uuid for parsing org_id strings; prism-core for OrgId type
# (BC-2.06.018 E-DEMO-005 guard in build_clone_pairs — ADR-036 §6)
uuid = { version = "1", features = ["v4"] }
# S-DEMO-DTU-LIVE-SCENARIO-001-B: chrono required for scenario time_anchor derivation
# (build_clone_pairs scenario context — BC-2.06.019 §2.3; gated under fixture-gen)
chrono = { version = "0.4", features = ["serde"], optional = true }
prism-core = { path = "../../crates/prism-core" }


tokio = { version = "1", features = ["full"] }
axum = "0.7"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
anyhow = "1"
serde_json = "1"
async-trait = "0.1"
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }

# Optional TLS deps
axum-server = { version = "0.7", features = ["tls-rustls"], optional = true }
rustls = { version = "0.23", features = ["aws-lc-rs"], optional = true }
rcgen = { version = "0.13", optional = true }
sha2 = { version = "0.10", optional = true }
time = { version = "0.3", optional = true }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[[test]]
name = "ac_1_all_clones_start"
path = "tests/ac_1_all_clones_start.rs"
required-features = ["dtu"]

[[test]]
name = "ac_2_crowdstrike_fixture"
path = "tests/ac_2_crowdstrike_fixture.rs"
required-features = ["dtu"]

[[test]]
name = "ac_3_configure_endpoint"
path = "tests/ac_3_configure_endpoint.rs"
required-features = ["dtu"]

[[test]]
name = "ac_4_tls"
path = "tests/ac_4_tls.rs"
required-features = ["dtu", "tls"]

[[test]]
name = "ac_5_graceful_shutdown"
path = "tests/ac_5_graceful_shutdown.rs"
required-features = ["dtu"]

[[test]]
name = "ac_6_prism_demo_toml"
path = "tests/ac_6_prism_demo_toml.rs"
required-features = ["dtu"]

[[test]]
name = "ac_7_determinism"
path = "tests/ac_7_determinism.rs"
required-features = ["dtu"]

[[test]]
name = "ac_8_feature_gate"
path = "tests/ac_8_feature_gate.rs"
required-features = ["dtu"]

[[test]]
name = "ac_9_bind_security"
path = "tests/ac_9_bind_security.rs"
required-features = ["dtu"]

[[test]]
name = "ac_10_health_endpoints"
path = "tests/ac_10_health_endpoints.rs"
required-features = ["dtu"]

[[test]]
name = "ac_11_partial_startup_cleanup"
path = "tests/ac_11_partial_startup_cleanup.rs"
required-features = ["dtu"]

[[test]]
name = "ac_12_continue_on_error"
path = "tests/ac_12_continue_on_error.rs"
required-features = ["dtu"]

[[test]]
name = "ac_13_start_report_semantics"
path = "tests/ac_13_start_report_semantics.rs"
required-features = ["dtu"]

[[test]]
name = "behavioral_clone_override_check"
path = "tests/behavioral_clone_override_check.rs"
required-features = ["dtu"]

# S-DEMO-DTU-LIVE-SCENARIO-001-A: Red Gate tests RG-5 through RG-10 (BC-2.06.018)
[[test]]
name = "bc_2_06_018_seeding"
path = "tests/bc_2_06_018_seeding.rs"
required-features = ["dtu"]

[[test]]
name = "td_wv1_04_harness_tls"
path = "tests/td_wv1_04_harness_tls.rs"
required-features = ["dtu", "tls"]

[[test]]
name = "td_wv1_04_binary_tls_e2e"
path = "tests/td_wv1_04_binary_tls_e2e.rs"
required-features = ["dtu", "tls"]

# S-DEMO-DTU-LIVE-SCENARIO-001-B: Red Gate tests 9-11, 15 (BC-2.06.019)
# Cross-DTU coherence + guard-order test (E-DEMO-002 before E-DEMO-004)
[[test]]
name = "bc_2_06_019_scenario_progression"
path = "tests/bc_2_06_019_scenario_progression.rs"
required-features = ["dtu", "fixture-gen"]

# TD-VSDD-060 sibling-sweep: differential archetype test was missing [[test]] entry
[[test]]
name = "bc_2_06_018_archetype_differential"
path = "tests/bc_2_06_018_archetype_differential.rs"
required-features = ["dtu", "fixture-gen"]

# BPRL-P12-01: genuine Cyberint→NVD end-to-end pivot integration test (VP-020-K/TV-020-013)
# RGT #22 — S-DEMO-DTU-LIVE-SCENARIO-001-B v2.10
[[test]]
name = "bc_2_06_020_cyberint_nvd_pivot"
path = "tests/bc_2_06_020_cyberint_nvd_pivot.rs"
required-features = ["dtu", "fixture-gen"]

# S-DEMO-MULTI-TENANT-DTU-001 Red Gate: multi-instance demo-server tests (BC-2.06.017)
[[test]]
name = "multi_instance_tests"
path = "tests/multi_instance_tests.rs"
required-features = ["dtu"]

# S-DEMO-LAUNCHER-CONSOLIDATION-001 Red Gate: multi-org start-multi tests (RG-001..RG-005)
# required-features = ["dtu", "fixture-gen"] mirrors bc_2_06_018_archetype_differential and
# bc_2_06_019_scenario_progression — omitting fixture-gen would cause build_multi_clone_factory
# to hard-error (runtime panic), not silently fall back to unseeded new() (GAP-1).
[[test]]
name = "multi_org"
path = "tests/multi_org.rs"
required-features = ["dtu", "fixture-gen"]

# S-DEMO-ENRICHMENT-PIVOT-003: Red Gate tests 8 and 9
# BC-2.06.019 v1.12 PC-4 + BC-2.06.020 INV-THREATINTEL/NVD-CORRELATION-001
# Canonical ThreatIntel pivot (stage >= 3) and NVD pivot (stage >= 4) queries
[[test]]
name = "bc_2_06_019_canonical_pivot_queries"
path = "tests/bc_2_06_019_canonical_pivot_queries.rs"
required-features = ["fixture-gen"]

# F-PIVOT003-R3-001: genuine E2E enrich pipeline tests (Tests 10 + 11)
# These drive InfusionAsyncUdf → InfusionSource → ThreatIntelState/NvdState
# to close the finding that Tests 8+9 only hand-correlate the data layer.
[[test]]
name = "bc_2_06_019_enrich_pipeline_e2e"
path = "tests/bc_2_06_019_enrich_pipeline_e2e.rs"
required-features = ["fixture-gen"]

[dev-dependencies]
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
serde_json = "1"
sha2 = "0.10"
time = "0.3"
rustls = { version = "0.23", features = ["aws-lc-rs"] }
serial_test = "3"
tempfile = "3"
chrono = { version = "0.4", features = ["serde"] }
# F-PIVOT003-R3-001: genuine E2E enrich pipeline tests (Tests 10 + 11)
# These bring in the DataFusion UDF registration infrastructure so the tests can
# drive InfusionAsyncUdf::invoke_async_with_args → InfusionSource::enrich_single
# against scenario-seeded ThreatIntelState / NvdState instances.
prism-query = { path = "../../crates/prism-query" }
prism-spec-engine = { path = "../prism-spec-engine" }
datafusion = "53.1"

[lints]
workspace = true
