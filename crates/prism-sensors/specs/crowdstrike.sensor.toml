# crowdstrike.sensor.toml — Production TOML sensor spec
#
# Authored per PLUGIN-MIGRATION-001-D Task 3.
# Grounding order: see ADR-053 §D1.
# auth_type = "oauth2_client_credentials" is the D-747 LOCKED value.
#
# Two-step pipeline pattern:
#   Step 1 (QueryV2): GET /detects/queries/detects/v1 → produces array of IDs
#   Step 2 (PostEntities): POST /detects/entities/summaries/GET/v1 → fan_out batch on IDs
# fan_out_batch_size = 100 per CROWDSTRIKE_BATCH_SIZE constant in adapter.

sensor_id = "crowdstrike"
# probe_table: table routed to by LIMIT-0 health probe (BC-2.08.001 postcondition 5 / S-5.04 AC-10).
probe_table = "detections"
name = "CrowdStrike Falcon"
auth_type = "oauth2_client_credentials"
# PLUGIN-MIGRATION-001-E: routes auth through the crowdstrike-oauth2 .prx WASM plugin.
# Validated at spec-load time: PluginRuntime.registry must contain this plugin_id
# or E-SPEC-012 is emitted (AC-007 / Task 1 validation rule).
# ADR-028 §D10 co-merge: PLUGIN-MIGRATION-001-A deletion of crowdstrike.rs is
# GATED on this story shipping the plugin replacement.
auth_plugin = "crowdstrike-oauth2"
# CrowdStrike Falcon API region base URLs (set CROWDSTRIKE_BASE_URL to the tenant's region):
#   us-1 (default):  https://api.crowdstrike.com
#   us-2:            https://api.us-2.crowdstrike.com
#   eu-1:            https://api.eu-1.crowdstrike.com
#   gov:             https://api.laggar.gcw.crowdstrike.com
base_url = "${env.CROWDSTRIKE_BASE_URL}"
version = "1.0.0"

# ---------------------------------------------------------------------------
# Credential references (BC-2.06.003 v1.3 / ADR-032)
# ---------------------------------------------------------------------------
# crowdstrike-oauth2 WASM plugin resolves both refs at acquire_token() time.
# BC-2.06.003 resolution chain: PRISM_CLIENTS_{ID}_SENSORS_CROWDSTRIKE_{REF}_FILE >
#   PRISM_CLIENTS_{ID}_SENSORS_CROWDSTRIKE_{REF} > keyring.
[[credential_refs]]
name = "client_id"
description = "CrowdStrike OAuth2 client ID"

[[credential_refs]]
name = "client_secret"
description = "CrowdStrike OAuth2 client secret"

[rate_limit_hints]
requests_per_second = 10.0

# ---------------------------------------------------------------------------
# Table: detections
# Two-step QueryV2 → PostEntities pipeline (DTU-grounded routes)
# ---------------------------------------------------------------------------
[[tables]]
table_name = "detections"
ocsf_class = "detection_finding"

  # detection_id is CrowdStrike's native detection primary key.
  # DTU fixture keys records by detection_id (routes/detections.rs: record.get("detection_id")).
  # Gap-CS-001 fix: renamed from "id" to "detection_id" to match DTU fixture and real API field.
  [[tables.columns]]
  name = "detection_id"
  column_type = "string"
  ocsf_field = "finding.uid"
  options = ["REQUIRED"]

  [[tables.columns]]
  name = "created_timestamp"
  column_type = "datetime"
  ocsf_field = "time"
  # options = ["INDEX"]: push-down-eligible datetime column. Required for extract_time_window_from_ast
  # (ADR-033 T1) to identify created_timestamp as the CrowdStrike FQL time-window push-down column.
  # Without this, Option T1 cannot extract time bounds from `created_timestamp > 'T'` predicates.
  # F-P1-CRIT-001 / AC-INDEX-CWS-001 / BC-2.01.013 v1.14 CrowdStrike FQL time-window.
  options = ["INDEX"]

  [[tables.columns]]
  name = "status"
  column_type = "string"
  ocsf_field = "status"

  [[tables.columns]]
  name = "severity"
  column_type = "string"
  ocsf_field = "severity"

  [[tables.columns]]
  name = "device_id"
  column_type = "string"
  ocsf_field = "device.uid"

  [[tables.columns]]
  name = "tactic"
  column_type = "string"
  ocsf_field = "attack.tactic.name"

  [[tables.columns]]
  name = "technique"
  column_type = "string"
  ocsf_field = "attack.technique.name"

  # ---------------------------------------------------------------------------
  # ENRICH-1: behaviors[] IOC columns — migrated from bracket-in-name convention (PIVOT-003)
  # to clean SQL identifiers + source_path (sensor-column-source-path-design.md §DD-3).
  # BC-2.06.019 Per-Sensor IOC-Surface Matrix: CrowdStrike detections carry
  # real IOC fields in behaviors[] array (corrected ioc_type enum: hash_sha256,
  # hash_md5, domain, filename, registry_key — NOT bare 'hash'/'registry').
  #
  # SAP-2 compliance: column names match JSON keys in make_detection() in
  # crates/prism-dtu-crowdstrike/src/generator.rs (untyped serde_json::Value path).
  # Wire keys confirmed: "ioc_type", "ioc_value", "ioc_source", "ioc_description"
  # (generator.rs lines ~751-755, NOT the Ioc struct serde convention).
  # Adversary MUST verify against generator.rs — no typed Detection/Behavior struct.
  #
  # Tolerant-unknown-type policy: unknown ioc_type tokens (not in corrected enum)
  # are preserved as raw strings (non-fatal, log only) per BC-2.06.019.
  # Wildcard [*] → JSON-list string (Design Decision 2: sensor-column-source-path-design.md).
  # ---------------------------------------------------------------------------

  # DTU: behaviors[0].ioc_type — algorithm-qualified token (hash_sha256, hash_md5,
  # domain, filename, registry_key). 'cmdline' is a SEPARATE sibling field, NOT an ioc_type.
  # ENRICH-1: renamed from "behaviors[].ioc_type" → "behaviors_ioc_type" + source_path.
  [[tables.columns]]
  name = "behaviors_ioc_type"
  column_type = "string"
  source_path = "$.behaviors[*].ioc_type"

  # DTU: behaviors[0].ioc_value — the IOC value (hash hex string, domain name, etc.).
  # ENRICH-1: renamed from "behaviors[].ioc_value" → "behaviors_ioc_value" + source_path.
  # THIS IS THE PRIMARY DEMO COLUMN used in pivot_enrich:
  #   SELECT detection_id, severity, behaviors_ioc_value
  #   FROM crowdstrike_detections
  #   WHERE pivot_enrich(behaviors_ioc_value) IS NOT NULL
  # Wildcard [*] → JSON-list string e.g. ["hash_sha256_abc123","hash_md5_def456"].
  [[tables.columns]]
  name = "behaviors_ioc_value"
  column_type = "string"
  source_path = "$.behaviors[*].ioc_value"

  # ADR-051 D4 Scalar-Input rule (S-DEMO-ENRICHMENT-TYPED-OUTPUT-001):
  # Scalar companion to `behaviors_ioc_value`. Extracts the FIRST behavior's IOC value
  # as a plain string rather than a JSON-list. Typed enrichment UDFs receive this scalar
  # so coerce_to_typed() gets a plain string, not a "[...]" list.
  [[tables.columns]]
  name = "behaviors_ioc_value_first"
  column_type = "string"
  source_path = "$.behaviors[0].ioc_value"
  description = "Scalar companion to behaviors_ioc_value: first behavior IOC value (ADR-051 D4)"

  # DTU: behaviors[0].ioc_source — provenance label (e.g., "catalog", "crowdstrike").
  # ENRICH-1: renamed from "behaviors[].ioc_source" → "behaviors_ioc_source" + source_path.
  [[tables.columns]]
  name = "behaviors_ioc_source"
  column_type = "string"
  source_path = "$.behaviors[*].ioc_source"

  # DTU: behaviors[0].ioc_description — human-readable description (e.g., "scenario IOC").
  # ENRICH-1: renamed from "behaviors[].ioc_description" → "behaviors_ioc_description" + source_path.
  [[tables.columns]]
  name = "behaviors_ioc_description"
  column_type = "string"
  source_path = "$.behaviors[*].ioc_description"

  # Step 1: QueryV2 — GET detection IDs
  # DTU route: GET /detects/queries/detects/v1 (mod.rs line ~189)
  # FQL time-window injection: ${query.filter._fql} carries the CrowdStrike FQL filter string
  # (e.g., "created_timestamp:>'T1'+created_timestamp:<'T2'"). The value is seeded by
  # SpecDrivenSensorAdapter::fetch() from QueryParams.start_time/end_time (ADR-033 T1).
  # When no time predicates are present, _fql = "" and the filter param is ignored by the DTU.
  # BC-2.01.013 v1.14 Pagination/Push-Down Scope Clause — CrowdStrike FQL wiring.
  #
  # Limit push-down: ${query.limit} carries the PrismQL LIMIT clause value so the DTU
  # honors DetectionListParams.limit and returns at most that many detection IDs.
  # When no LIMIT is provided, query.limit = "" and the &limit= param is stripped by
  # PipelineExecutor.strip_empty_url_params — the DTU defaults to limit=100.
  # AC-CWS-001 / BC-2.01.013 v1.14 Pagination/Push-Down Scope Clause — limit wiring.
  # F-PUSHDOWN-001 invariant: limit push-down applies ONLY to this first/query step.
  # Step 2 (fetch_detections POST) does NOT carry a limit param.
  [[tables.steps]]
  name = "query_detection_ids"
  method = "GET"
  path_template = "/detects/queries/detects/v1?filter=${query.filter._fql}&limit=${query.limit}"
  response_path = "$.resources"
  # OBS-003 (2026-07-10): "detection_ids" was declared but never materialized — the
  # body_template uses ${query_detection_ids.resources}, which is produced automatically
  # from response_path = "$.resources".  Declaring a redundant named variable causes a
  # spec-validation warning; cleared to [] to match query_device_ids / query_incident_ids.
  variables_produced = []

  # Step 2: PostEntities — POST IDs to get full detection records
  # DTU route: POST /detects/entities/summaries/GET/v1 (mod.rs line ~193)
  # fan_out_batch_size = 100 per CROWDSTRIKE_BATCH_SIZE (capped by API limit)
  # Fan-out batch: body_template uses ${step_name.field} interpolation.
  # Step 1 (query_detection_ids) stores results under:
  #   - ${query_detection_ids.resources}  (last segment of response_path "$.resources")
  # The variable reference must include the step name prefix and field name (no bare names).
  [[tables.steps]]
  name = "fetch_detections"
  method = "POST"
  path_template = "/detects/entities/summaries/GET/v1"
  body_template = '{"ids": ${query_detection_ids.resources}}'
  response_path = "$.resources"
  variables_produced = []
  fan_out_batch_size = 100

# ---------------------------------------------------------------------------
# Table: devices
# Two-step QueryV2 → GetEntities pipeline (DTU-grounded routes)
# ---------------------------------------------------------------------------
[[tables]]
table_name = "devices"
ocsf_class = "device"
# Column surface intentionally minimal for DEFECT-CSDEVICES-EMPTY-PIPELINE-001;
# expansion (os_version, agent_version, external_ip, local_ip, containment_status)
# is human-adjudicated D-1666 as DRIFT-SAP2-DEVICES-TOML-SURFACE-001, queued as a
# dedicated story after this PR merges.

  [[tables.columns]]
  name = "device_id"
  column_type = "string"
  ocsf_field = "device.uid"
  options = ["REQUIRED"]

  [[tables.columns]]
  name = "hostname"
  column_type = "string"
  ocsf_field = "device.hostname"

  [[tables.columns]]
  name = "platform_name"
  column_type = "string"
  ocsf_field = "device.os.name"

  [[tables.columns]]
  name = "status"
  column_type = "string"
  ocsf_field = "status"

  [[tables.columns]]
  name = "first_seen"
  column_type = "datetime"
  ocsf_field = "device.first_seen_time"

  [[tables.columns]]
  name = "last_seen"
  column_type = "datetime"
  ocsf_field = "device.last_seen_time"

  # Step 1: QueryV2 — GET device IDs
  # DTU route: GET /devices/queries/devices/v1 (mod.rs line ~197)
  [[tables.steps]]
  name = "query_device_ids"
  method = "GET"
  path_template = "/devices/queries/devices/v1"
  response_path = "$.resources"
  # OBS-003 (2026-07-10): "device_ids" was declared but never materialized — the
  # CrowdStrike API returns at "$.resources", not "$.device_ids". The downstream
  # body_template uses ${query_device_ids.resources}, which is produced automatically
  # by store_step_vars via the response_path last-segment fallback. Corrected to [].
  variables_produced = []

  # Step 2: PostDeviceDetailsV2 — POST IDs to get full device records
  # DTU route: POST /devices/entities/devices/v2 (added per DEFECT-CSDEVICES-EMPTY-PIPELINE-001 ratification)
  # Real-API canonical: CrowdStrike PostDeviceDetailsV2 (official; introduced FalconPy v1.2.0;
  #   POST body {"ids": [...]} supports up to 5000 IDs vs GET's 100; body format identical to
  #   POST /detects/entities/summaries/GET/v1 detections pipeline).
  # fan_out_batch_size = 100 per CROWDSTRIKE_BATCH_SIZE (conservative; POST API supports up to 5000;
  #   tuning evaluation folded into DRIFT-SAP2-DEVICES-TOML-SURFACE-001 devices-surface story, D-1666 queue).
  [[tables.steps]]
  name = "fetch_devices"
  method = "POST"
  path_template = "/devices/entities/devices/v2"
  body_template = '{"ids": ${query_device_ids.resources}}'
  response_path = "$.resources"
  variables_produced = []
  fan_out_batch_size = 100

# ---------------------------------------------------------------------------
# Table: incidents
# DTU-EXT-001 gap: Incidents route not yet registered in prism-dtu-crowdstrike.
# Spec is authored per ADR-028 §D5 (spec never ahead of DTU — include as
# documented gap). Parity test RG-04 does NOT exercise incidents in v1 cycle.
# Follow-up work tracked under DTU-EXT-001.
# ---------------------------------------------------------------------------
[[tables]]
table_name = "incidents"
ocsf_class = "incident_finding"

  [[tables.columns]]
  name = "incident_id"
  column_type = "string"
  ocsf_field = "finding.uid"
  options = ["REQUIRED"]

  [[tables.columns]]
  name = "created"
  column_type = "datetime"
  ocsf_field = "time"

  [[tables.columns]]
  name = "status"
  column_type = "string"
  ocsf_field = "status"

  [[tables.columns]]
  name = "severity"
  column_type = "string"
  ocsf_field = "severity"

  # Step 1: QueryV2 — GET incident IDs
  # DTU-EXT-001: no incidents route in prism-dtu-crowdstrike yet.
  # Using canonical CrowdStrike 2-step pattern per ADR-028 §D5.
  [[tables.steps]]
  name = "query_incident_ids"
  method = "GET"
  path_template = "/incidents/queries/incidents/v1"
  response_path = "$.resources"
  # OBS-003 (2026-07-10): "incident_ids" was declared but never materialized — the
  # CrowdStrike API returns at "$.resources", not "$.incident_ids". The downstream
  # body_template uses ${query_incident_ids.resources}, which is produced automatically
  # by store_step_vars via the response_path last-segment fallback. Corrected to [].
  variables_produced = []

  # Step 2: GetEntities — POST full incident records
  # (CrowdStrike Incidents API requires POST with JSON body containing ids array)
  # Method = POST per DEFECT-CSDEVICES-EMPTY-PIPELINE-001 ratification.
  # DTU-EXT-001: incidents routes not yet in prism-dtu-crowdstrike; this TOML fix
  # is for the production pipeline only. DTU incidents route stays anchored to DTU-EXT-001.
  [[tables.steps]]
  name = "fetch_incidents"
  method = "POST"
  path_template = "/incidents/entities/incidents/GET/v1"
  body_template = '{"ids": ${query_incident_ids.resources}}'
  response_path = "$.resources"
  variables_produced = []
  fan_out_batch_size = 100
