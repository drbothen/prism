# cyberint.sensor.toml — Production TOML sensor spec
#
# Authored per PLUGIN-MIGRATION-001-D Task 5.
# This file is superseded by ADR-053 §D3-a; deletion owner: S-WAVE-A-CYBERINT-SPEC-001.
# S-WAVE-A-CYBERINT-PATCH-001 co-lands with S-WAVE-A-ENGINE-001 (SPEC-001 does not; see PATCH-001 §MERGE-GATE-ENGINE-001).
# Grounding order: see ADR-053 §D1.
# D-747 lock superseded by ADR-053 §D3, effective 2026-07-22 (D-1943).
#   See ADR-053 §D3-a, §D3-c for split schema and auth confirmation.
#   Owner: S-WAVE-A-CYBERINT-SPEC-001 (defect record: ARCH-CYBERINT-AUTH-READJUDICATION-001).
# NOTE: legacy CyberintAuth::auth_type_name() returned "bearer_static" — latent label bug
#   deleted by PLUGIN-MIGRATION-001-A.
#
# incidents table: CRITICAL fidelity defect; see DEFECT-CYBERINT-SPEC-FIDELITY-001.
#   Retained until deleted atomically by S-WAVE-A-CYBERINT-SPEC-001.

sensor_id = "cyberint"
# probe_table: table routed to by LIMIT-0 health probe (BC-2.08.001 postcondition 5 / S-5.04 AC-10).
probe_table = "alerts"
name = "Cyberint"
# MISSING-FIELD-S-WAVE-A-CYBERINT-PATCH-001: header_scheme = "cookie:access_token" required
#   (BC-2.16.009 Rule 9). MUST NOT be added until S-WAVE-A-CYBERINT-PATCH-001 lands with
#   S-WAVE-A-ENGINE-001. Owner: S-WAVE-A-CYBERINT-PATCH-001 AC-001 RG-001.
auth_type = "cookie_roundtrip"
base_url = "https://${env.CYBERINT_ENVIRONMENT}.cyberint.io"
version = "1.0.0"

# ---------------------------------------------------------------------------
# Credential references
# ---------------------------------------------------------------------------
# Credential resolution chain: see BC-2.06.003.
# SUPERSEDED-PENDING-S-WAVE-A-CYBERINT-SPEC-001: superseded per ADR-053 §D3/§D5.
#   Owner: S-WAVE-A-CYBERINT-SPEC-001 AC-005 RG-011. See ADR-053 §D5 for credential ref rename target.
#   RG-010. name = "api_key" below is the LIVE credential-resolution key and MUST NOT be
#   changed until S-WAVE-A-CYBERINT-SPEC-001 lands.
[[credential_refs]]
name = "api_key"
description = "Cyberint API access token (injected as access_token cookie)"

# ---------------------------------------------------------------------------
# Table: alerts
# GET with cursor pagination
# DTU route: GET /api/v1/alerts (crates/prism-dtu-cyberint/src/clone.rs build_router())
# DTU-grounded per ADR-028 §D1 (historical — §D1 superseded by ADR-053 §D1 2026-07-22):
#   real third-party API verification deferred to DTU-validator.
# F-LP3-HIGH-001: reauthored to match DTU Alert struct exactly (8 fields):
#   alert_id, title, severity, status, created_at, source, type, affected_assets.
#   Removed spurious 'id' (DTU never emits it) and 'source_url' (no such DTU field).
#   'description' → 'title'; 'source_url' → 'source'.
#   'affected_assets' (Vec<serde_json::Value>) deferred: array column type is not yet
#   supported in the column grammar — track as future story when Array ColumnType lands.
# ---------------------------------------------------------------------------
[[tables]]
table_name = "alerts"
ocsf_class = "detection_finding"

  # alert_id is Cyberint's native alert identifier (the field used for status transitions
  # in the Cyberint API and DTU). Maps to finding.uid as the vendor-native security finding ID.
  # DTU Alert struct field: alert_id: String (see prism-dtu-cyberint/src/types.rs).
  [[tables.columns]]
  name = "alert_id"
  column_type = "string"
  ocsf_field = "finding.uid"
  options = ["REQUIRED"]

  # DTU Alert.title: human-readable alert title. Maps to OCSF finding.title.
  [[tables.columns]]
  name = "title"
  column_type = "string"
  ocsf_field = "finding.title"

  [[tables.columns]]
  name = "type"
  column_type = "string"
  ocsf_field = "type_name"

  [[tables.columns]]
  name = "severity"
  column_type = "string"
  ocsf_field = "severity"

  [[tables.columns]]
  name = "status"
  column_type = "string"
  ocsf_field = "status"

  # Multi-format timestamp: Cyberint Alert.created_at is typed as serde_json::Value
  # (per prism-dtu-cyberint/src/types.rs) — accepts ISO 8601, epoch seconds, or epoch millis.
  # timestamp_formats declares the ordered parse chain per ADR-028 §D8-A (Option A LOCKED):
  #   1. iso8601     — ISO 8601 UTC "2024-01-15T10:30:00Z" (primary; most common)
  #   2. unix_epoch_seconds — integer epoch (legacy alert payloads)
  # On all-formats failure: emit E-SPEC-018 (TimestampParseFailure) per BC-2.16.013 §O-001.
  [[tables.columns]]
  name = "created_at"
  column_type = "datetime"
  ocsf_field = "time"
  timestamp_formats = ["iso8601", "unix_epoch_seconds"]

  # DTU Alert.source: vendor name string (e.g., "crowdstrike", "threatintel").
  # Maps to OCSF metadata.product.vendor_name — the vendor that produced the finding.
  [[tables.columns]]
  name = "source"
  column_type = "string"
  ocsf_field = "metadata.product.vendor_name"

  # ---------------------------------------------------------------------------
  # ENRICH-1: IOC columns — migrated from bracket-in-name convention (PIVOT-003)
  # to clean SQL identifiers + source_path (sensor-column-source-path-design.md §DD-3).
  # BC-2.06.019 Per-Sensor IOC-Surface Matrix: Cyberint alerts carry IOC fields.
  # SAP-2 compliance: all columns have matching fields in prism-dtu-cyberint/src/types.rs
  # Alert struct (ioc: Option<Ioc>, iocs: Vec<Ioc>, alert_data: Option<AlertData>).
  #
  # Wire-key note: the DTU `Ioc` struct serializes with `#[serde(rename = "type")]` on
  # `ioc_type` and no rename on `value`. The wire JSON from the DTU has keys `"type"` and
  # `"value"`. source_path uses `$.iocs[*].type` and `$.iocs[*].value` accordingly.
  # The serde alias `ioc_type` is a deserialization convenience only — it does NOT appear
  # in serialized JSON.
  # (BC-2.06.019 INCONCLUSIVE inner-key pending live-tenant validation)
  # ---------------------------------------------------------------------------

  # Singleton top-level IOC — PENDING-LIVE-VALIDATION (may be removed if absent in live API).
  # DTU: Alert.ioc.ioc_type (primary wire key: "type" via serde rename).
  # ENRICH-1: renamed from "ioc.type" → "ioc_type" + source_path.
  [[tables.columns]]
  name = "ioc_type"
  column_type = "string"
  source_path = "$.ioc.type"

  # DTU: Alert.ioc.value (primary wire key: "value").
  # ENRICH-1: renamed from "ioc.value" → "ioc_value_singleton" + source_path.
  # Name "ioc_value_singleton" avoids collision with the iocs array column below.
  [[tables.columns]]
  name = "ioc_value_singleton"
  column_type = "string"
  source_path = "$.ioc.value"

  # List-form IOC array — CONFIRMED via Check Point sk182975 + FortiSOAR connector.
  # DTU: Alert.iocs[].ioc_type (primary wire key: "type" via serde rename).
  # ENRICH-1: renamed from "iocs[].type" → "iocs_type" + source_path with wildcard.
  # Wildcard [*] → JSON-list string e.g. ["hash","domain"] (Design Decision 2).
  [[tables.columns]]
  name = "iocs_type"
  column_type = "string"
  source_path = "$.iocs[*].type"

  # DTU: Alert.iocs[].value (primary wire key: "value").
  # ENRICH-1: renamed from "iocs[].value" → "iocs_value" + source_path with wildcard.
  # THIS IS THE PRIMARY DEMO COLUMN used in pivot_enrich:
  #   SELECT alert_id, severity, iocs_value FROM cyberint_alerts
  #   WHERE pivot_enrich(iocs_value) IS NOT NULL
  # Wildcard [*] → JSON-list string e.g. ["hash1","hash2"] (Design Decision 2).
  [[tables.columns]]
  name = "iocs_value"
  column_type = "string"
  source_path = "$.iocs[*].value"

  # ADR-051 D4 Scalar-Input rule (S-DEMO-ENRICHMENT-TYPED-OUTPUT-001):
  # Scalar companion to `iocs_value`. Extracts the FIRST IOC value as a plain string
  # rather than a JSON-list. Typed enrichment UDFs (integer/float/boolean/datetime output)
  # receive this scalar so coerce_to_typed() gets a plain string, not a "[...]" list.
  # Paired with `threatintel.infusion.toml` fields `threat_score` and `threat_is_known_malicious`
  # which declare `input_field = "iocs_value_first"`.
  [[tables.columns]]
  name = "iocs_value_first"
  column_type = "string"
  source_path = "$.iocs[0].value"
  description = "Scalar companion to iocs_value: the first IOC value as a plain string (ADR-051 D4)"

  # Network IOC surface — alert_data.ip, alert_data.domain, alert_data.url.
  # `url` CONFIRMED via FortiSOAR connector; `ip`/`domain` UNCONFIRMED-plausible.
  # DTU: Alert.alert_data.ip / .domain / .url (Option<String> each).
  # ENRICH-1: renamed from "alert_data.ip" → "alert_data_ip" + source_path (nested scalar).
  [[tables.columns]]
  name = "alert_data_ip"
  column_type = "string"
  source_path = "$.alert_data.ip"

  # ENRICH-1: renamed from "alert_data.domain" → "alert_data_domain" + source_path.
  [[tables.columns]]
  name = "alert_data_domain"
  column_type = "string"
  source_path = "$.alert_data.domain"

  # ENRICH-1: renamed from "alert_data.url" → "alert_data_url" + source_path.
  [[tables.columns]]
  name = "alert_data_url"
  column_type = "string"
  source_path = "$.alert_data.url"

  # Cursor-based pagination
  # DTU route: GET /api/v1/alerts (crates/prism-dtu-cyberint/src/clone.rs build_router())
  # response_path: Cyberint DTU returns {"data": [...], "next_cursor": "..."} per routes::alerts::list_alerts
  # page_size: OMITTED — DTU AlertListParams has cursor field only (no page_size in the struct).
  #   F-LP2-MEDIUM-001 (arch-handoff#2): page_size removed. DTU-EXT-005 RETIRED (D-1949).
  #   page_size present in replacement spec per ADR-053 §D1 + S-WAVE-A-CYBERINT-SPEC-001 AC-004.
  [[tables.steps]]
  name = "fetch_alerts"
  method = "GET"
  path_template = "/api/v1/alerts"
  response_path = "$.data"
  variables_produced = []
  [tables.steps.pagination]
  type = "cursor_token"
  cursor_response_path = "$.next_cursor"

# ---------------------------------------------------------------------------
# Table: incidents
# CRITICAL fidelity defect: see DEFECT-CYBERINT-SPEC-FIDELITY-001.
#   This table is retained until deleted atomically by S-WAVE-A-CYBERINT-SPEC-001. Owner: AC-007 RG-013.
# DTU gap — EC-016-013-002: no incidents route in prism-dtu-cyberint.
# ADR-028 §D5 (spec never ahead of DTU) is historical — §D5 superseded by ADR-053 §D1.
# Parity test returns explicit SKIP (NOT #[ignore]) per AC-009.
# ---------------------------------------------------------------------------
[[tables]]
table_name = "incidents"
ocsf_class = "incident_finding"

  [[tables.columns]]
  name = "id"
  column_type = "string"
  ocsf_field = "finding.uid"
  options = ["REQUIRED"]

  [[tables.columns]]
  name = "type"
  column_type = "string"
  ocsf_field = "type_name"

  [[tables.columns]]
  name = "severity"
  column_type = "string"
  ocsf_field = "severity"

  [[tables.columns]]
  name = "status"
  column_type = "string"
  ocsf_field = "status"

  # Multi-format timestamp: consistent with alerts.created_at sibling column.
  # F-LP3-MEDIUM-004: added timestamp_formats to match alerts table sibling.
  # DTU has no incidents route (EC-016-013-002), but when implemented the created_at
  # field is expected to match the Cyberint API time format pattern (ISO 8601 primary,
  # unix_epoch_seconds legacy fallback). Using same chain as alerts.created_at.
  [[tables.columns]]
  name = "created_at"
  column_type = "datetime"
  ocsf_field = "time"
  timestamp_formats = ["iso8601", "unix_epoch_seconds"]

  # EC-016-013-002: DTU gap — no incidents route. Using cursor pattern consistent
  # with alerts table. Parity test for this table is explicit SKIP per AC-009.
  # page_size: OMITTED — table is deleted, not migrated: see S-WAVE-A-CYBERINT-SPEC-001 AC-007 RG-013.
  [[tables.steps]]
  name = "fetch_incidents"
  method = "GET"
  path_template = "/api/v1/incidents"
  response_path = "$.data"
  variables_produced = []
  [tables.steps.pagination]
  type = "cursor_token"
  cursor_response_path = "$.next_cursor"
