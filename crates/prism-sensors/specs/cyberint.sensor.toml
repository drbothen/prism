# cyberint.sensor.toml — Production TOML sensor spec
#
# Authored per PLUGIN-MIGRATION-001-D Task 5.
# URLs grounded from DTU clone routes (ADR-028 §D1):
#   crates/prism-dtu-cyberint/src/clone.rs build_router()
# auth_type grounded from DTU enforcement (ADR-028 §D2):
#   DTU routes/alerts.rs::extract_session_token() extracts cyberint_session cookie
#   → cookie-roundtrip auth flow.
# auth_type = "cookie_roundtrip" is the D-747 LOCKED value.
# NOTE: legacy CyberintAuth::auth_type_name() returned "bearer_static" — latent label bug
#   deleted by PLUGIN-MIGRATION-001-A. Spec follows DTU per CLAUDE.md §Source-of-Truth #7.
#
# URL correction: Rust adapter used /api/alerts (no /v1) — latent bug.
# DTU models real Cyberint API: /api/v1/alerts. Spec follows DTU per CLAUDE.md §Source-of-Truth #7.
#
# incidents table: included as documented gap per EC-016-013-002. DTU has no incidents route.
# Parity test returns explicit SKIP (NOT #[ignore]) per AC-009 spec.
#
# timestamp column: uses column_type = "datetime" — multi-format parsing is
# handled at the normalization layer; no grammar extension required for basic datetime type.

sensor_id = "cyberint"
name = "Cyberint"
auth_type = "cookie_roundtrip"
base_url = "https://${env.CYBERINT_ENVIRONMENT}.cyberint.io"
version = "1.0.0"

# ---------------------------------------------------------------------------
# Table: alerts
# GET with cursor pagination
# DTU route: GET /api/v1/alerts (build_router() line 115)
# URL correction: real Cyberint API uses /api/v1/alerts, not /api/alerts
# ---------------------------------------------------------------------------
[[tables]]
table_name = "alerts"
ocsf_class = "security_finding"

  [[tables.columns]]
  name = "id"
  column_type = "string"
  ocsf_field = "finding.uid"
  options = ["REQUIRED"]

  [[tables.columns]]
  name = "alert_id"
  column_type = "string"
  ocsf_field = "finding.src_url"

  [[tables.columns]]
  name = "type"
  column_type = "string"
  ocsf_field = "type_name"

  [[tables.columns]]
  name = "severity"
  column_type = "string"
  ocsf_field = "severity"

  [[tables.columns]]
  name = "status"
  column_type = "string"
  ocsf_field = "status"

  # Multi-format timestamp: Cyberint returns timestamps in multiple formats.
  # column_type = "datetime" — normalization layer handles multi-format parsing.
  # O-001 grammar extension option not required; datetime type is sufficient for the
  # TOML grammar constraint (no timestamp_format = "multi" field needed in spec).
  [[tables.columns]]
  name = "timestamp"
  column_type = "datetime"
  ocsf_field = "time"

  [[tables.columns]]
  name = "description"
  column_type = "string"
  ocsf_field = "message"

  [[tables.columns]]
  name = "source_url"
  column_type = "string"
  ocsf_field = "src_url"

  # Cursor-based pagination
  # DTU route: GET /api/v1/alerts (build_router() line 115)
  [[tables.steps]]
  name = "fetch_alerts"
  method = "GET"
  path_template = "/api/v1/alerts"
  response_path = "$.data"
  variables_produced = []
  [tables.steps.pagination]
  type = "cursor_token"
  cursor_response_path = "$.next_cursor"
  page_size = 100

# ---------------------------------------------------------------------------
# Table: incidents
# DTU gap — EC-016-013-002: no incidents route in prism-dtu-cyberint.
# Spec is authored per ADR-028 §D5 (spec never ahead of DTU — include as
# documented gap with cursor pagination pattern matching alerts).
# Parity test returns explicit SKIP (NOT #[ignore]) per AC-009.
# ---------------------------------------------------------------------------
[[tables]]
table_name = "incidents"
ocsf_class = "incident_finding"

  [[tables.columns]]
  name = "id"
  column_type = "string"
  ocsf_field = "finding.uid"
  options = ["REQUIRED"]

  [[tables.columns]]
  name = "type"
  column_type = "string"
  ocsf_field = "type_name"

  [[tables.columns]]
  name = "severity"
  column_type = "string"
  ocsf_field = "severity"

  [[tables.columns]]
  name = "status"
  column_type = "string"
  ocsf_field = "status"

  [[tables.columns]]
  name = "created_at"
  column_type = "datetime"
  ocsf_field = "time"

  # EC-016-013-002: DTU gap — no incidents route. Using cursor pattern consistent
  # with alerts table. Parity test for this table is explicit SKIP per AC-009.
  [[tables.steps]]
  name = "fetch_incidents"
  method = "GET"
  path_template = "/api/v1/incidents"
  response_path = "$.data"
  variables_produced = []
  [tables.steps.pagination]
  type = "cursor_token"
  cursor_response_path = "$.next_cursor"
  page_size = 100
