# claroty.sensor.toml — Production TOML sensor spec
#
# Authored per PLUGIN-MIGRATION-001-D Task 4.
# URLs grounded from DTU clone routes (ADR-028 §D1):
#   crates/prism-dtu-claroty/src/clone.rs build_router()
# auth_type grounded from DTU enforcement (ADR-028 §D2):
#   DTU enforces Authorization: Bearer {non-empty} in routes/alerts.rs and routes/devices.rs
# auth_type = "bearer_static" is the D-747 LOCKED value.
# NOTE: legacy ClarotyAuth::auth_type_name() returned "cookie_roundtrip" — latent label bug
#   deleted by PLUGIN-MIGRATION-001-A. Spec follows DTU per CLAUDE.md §Source-of-Truth #7.
#
# POST-for-read pattern: alerts and audit_logs use method = "POST" with body template.
# Pagination: OffsetLimit engine appends ?offset=N&limit=M to URL query params
#   (pipeline.rs::build_paged_url_impl). Body template does NOT include pagination fields.
# Polymorphic ID: id column uses column_type = "string" to handle int and UUID IDs
#   (EC-016-013-004): JSON int IDs normalized to string at parser boundary.
# No /xdome prefix anywhere (ADR-028 §D1 footnote).
#
# DTU-EXT-002: assets table deferred. DTU has /api/v1/devices (POST), not /api/v1/assets.
#   Orchestrator follow-up required to reconcile. Only alerts is DTU-grounded here.

sensor_id = "claroty"
name = "Claroty xDome"
auth_type = "bearer_static"
base_url = "${env.CLAROTY_INSTANCE_URL}"
version = "1.0.0"

# ---------------------------------------------------------------------------
# Table: alerts
# POST-for-read pattern; offset pagination (page_size = 100)
# DTU route: POST /api/v1/alerts (crates/prism-dtu-claroty/src/clone.rs build_router())
# ---------------------------------------------------------------------------
[[tables]]
table_name = "alerts"
ocsf_class = "security_finding"

  # Polymorphic ID: Claroty returns IDs as JSON integers or UUID strings.
  # Normalized to string at the spec parser boundary (EC-016-013-004).
  [[tables.columns]]
  name = "id"
  column_type = "string"
  ocsf_field = "finding.uid"
  options = ["REQUIRED"]

  [[tables.columns]]
  name = "type"
  column_type = "string"
  ocsf_field = "type_name"

  [[tables.columns]]
  name = "severity"
  column_type = "string"
  ocsf_field = "severity"

  [[tables.columns]]
  name = "status"
  column_type = "string"
  ocsf_field = "status"

  [[tables.columns]]
  name = "created_at"
  column_type = "datetime"
  ocsf_field = "time"

  [[tables.columns]]
  name = "updated_at"
  column_type = "datetime"
  ocsf_field = "end_time"

  [[tables.columns]]
  name = "device_id"
  column_type = "string"
  ocsf_field = "device.uid"

  [[tables.columns]]
  name = "description"
  column_type = "string"
  ocsf_field = "message"

  # POST-for-read step with offset pagination
  # DTU route: POST /api/v1/alerts (crates/prism-dtu-claroty/src/clone.rs build_router())
  # response_path: DTU returns {"alerts": [...], "total": N, "page": N} per routes::alerts::list_alerts
  # body_template: OffsetLimit pagination engine handles offset via URL query params
  #   (pipeline.rs::build_paged_url_impl appends ?offset=N&limit=M). No body pagination field needed.
  # F-LP3-HIGH-004: removed '{"size": 100}' from body_template. The OffsetLimit engine
  #   appends ?offset=N&limit=M to URL — embedding a hardcoded size in the body conflicts
  #   with URL-based page_size semantics. Using empty JSON object body instead.
  [[tables.steps]]
  name = "fetch_alerts"
  method = "POST"
  path_template = "/api/v1/alerts"
  body_template = '{}'
  response_path = "$.alerts"
  variables_produced = []
  [tables.steps.pagination]
  type = "offset_limit"
  page_size = 100

# ---------------------------------------------------------------------------
# Table: audit_logs
# POST-for-read pattern; offset pagination
# Note: no DTU route registered yet for audit_logs — included as documented gap.
# DTU-audit-gap: Claroty DTU does not yet expose /api/v1/audit_logs.
# Orchestrator follow-up required to add this route to prism-dtu-claroty.
# ---------------------------------------------------------------------------
[[tables]]
table_name = "audit_logs"
ocsf_class = "audit_activity"

  [[tables.columns]]
  name = "id"
  column_type = "string"
  ocsf_field = "activity_uid"
  options = ["REQUIRED"]

  [[tables.columns]]
  name = "action"
  column_type = "string"
  ocsf_field = "activity_name"

  [[tables.columns]]
  name = "actor"
  column_type = "string"
  ocsf_field = "actor.user.name"

  [[tables.columns]]
  name = "timestamp"
  column_type = "datetime"
  ocsf_field = "time"

  [[tables.columns]]
  name = "resource"
  column_type = "string"
  ocsf_field = "dst_resource.name"

  # POST-for-read step with offset pagination
  # DTU gap: no /api/v1/audit_logs route in prism-dtu-claroty yet.
  # response_path: forward-looking placeholder — real Claroty xDome API uses
  #   {"audit_logs": [...]} response shape (consistent with per-resource wrapping convention).
  # body_template: OffsetLimit pagination handles offset via URL params (not body fields).
  #   ${page_offset} is NOT a valid step variable; removed per CRIT-002 (ADR-028 §D1).
  # F-LP3-HIGH-004: removed '{"size": 100}' from body_template (consistent with alerts fix).
  #   OffsetLimit engine appends ?offset=N&limit=M to URL; body size would conflict.
  [[tables.steps]]
  name = "fetch_audit_logs"
  method = "POST"
  path_template = "/api/v1/audit_logs"
  body_template = '{}'
  response_path = "$.audit_logs"
  variables_produced = []
  [tables.steps.pagination]
  type = "offset_limit"
  page_size = 100
