# claroty.sensor.toml — Production TOML sensor spec
#
# Authored per PLUGIN-MIGRATION-001-D Task 4.
# URLs grounded from DTU clone routes (ADR-028 §D1):
#   crates/prism-dtu-claroty/src/clone.rs build_router()
# auth_type grounded from DTU enforcement (ADR-028 §D2):
#   DTU enforces Authorization: Bearer {non-empty} in routes/alerts.rs and routes/devices.rs
# auth_type = "bearer_static" is the D-747 LOCKED value.
# NOTE: legacy ClarotyAuth::auth_type_name() returned "cookie_roundtrip" — latent label bug
#   deleted by PLUGIN-MIGRATION-001-A. Spec follows DTU per CLAUDE.md §Source-of-Truth #7.
#
# POST-for-read pattern: alerts and audit_logs use method = "POST" with body template.
# Polymorphic ID: id column uses column_type = "string" to handle int and UUID IDs
#   (EC-016-013-004): JSON int IDs normalized to string at parser boundary.
# No /xdome prefix anywhere (ADR-028 §D1 footnote).
#
# DTU-EXT-002: assets table deferred. DTU has /api/v1/devices (POST), not /api/v1/assets.
#   Orchestrator follow-up required to reconcile. Only alerts is DTU-grounded here.

sensor_id = "claroty"
name = "Claroty xDome"
auth_type = "bearer_static"
base_url = "${env.CLAROTY_INSTANCE_URL}"
version = "1.0.0"

# ---------------------------------------------------------------------------
# Table: alerts
# POST-for-read pattern; offset pagination (page_size = 100)
# DTU route: POST /api/v1/alerts (build_router() line 86)
# ---------------------------------------------------------------------------
[[tables]]
table_name = "alerts"
ocsf_class = "security_finding"

  # Polymorphic ID: Claroty returns IDs as JSON integers or UUID strings.
  # Normalized to string at the spec parser boundary (EC-016-013-004).
  [[tables.columns]]
  name = "id"
  column_type = "string"
  ocsf_field = "finding.uid"
  options = ["REQUIRED"]

  [[tables.columns]]
  name = "type"
  column_type = "string"
  ocsf_field = "type_name"

  [[tables.columns]]
  name = "severity"
  column_type = "string"
  ocsf_field = "severity"

  [[tables.columns]]
  name = "status"
  column_type = "string"
  ocsf_field = "status"

  [[tables.columns]]
  name = "created_at"
  column_type = "datetime"
  ocsf_field = "time"

  [[tables.columns]]
  name = "updated_at"
  column_type = "datetime"
  ocsf_field = "end_time"

  [[tables.columns]]
  name = "device_id"
  column_type = "string"
  ocsf_field = "device.uid"

  [[tables.columns]]
  name = "description"
  column_type = "string"
  ocsf_field = "message"

  # POST-for-read step with offset pagination
  # DTU route: POST /api/v1/alerts (build_router() line 86)
  [[tables.steps]]
  name = "fetch_alerts"
  method = "POST"
  path_template = "/api/v1/alerts"
  body_template = '{"page": ${page_offset}, "size": 100}'
  response_path = "$.objects"
  variables_produced = []
  [tables.steps.pagination]
  type = "offset_limit"
  page_size = 100

# ---------------------------------------------------------------------------
# Table: audit_logs
# POST-for-read pattern; offset pagination
# Note: no DTU route registered yet for audit_logs — included as documented gap.
# DTU-audit-gap: Claroty DTU does not yet expose /api/v1/audit_logs.
# Orchestrator follow-up required to add this route to prism-dtu-claroty.
# ---------------------------------------------------------------------------
[[tables]]
table_name = "audit_logs"
ocsf_class = "audit_activity"

  [[tables.columns]]
  name = "id"
  column_type = "string"
  ocsf_field = "activity_uid"
  options = ["REQUIRED"]

  [[tables.columns]]
  name = "action"
  column_type = "string"
  ocsf_field = "activity_name"

  [[tables.columns]]
  name = "actor"
  column_type = "string"
  ocsf_field = "actor.user.name"

  [[tables.columns]]
  name = "timestamp"
  column_type = "datetime"
  ocsf_field = "time"

  [[tables.columns]]
  name = "resource"
  column_type = "string"
  ocsf_field = "dst_resource.name"

  # POST-for-read step with offset pagination
  [[tables.steps]]
  name = "fetch_audit_logs"
  method = "POST"
  path_template = "/api/v1/audit_logs"
  body_template = '{"page": ${page_offset}, "size": 100}'
  response_path = "$.objects"
  variables_produced = []
  [tables.steps.pagination]
  type = "offset_limit"
  page_size = 100
