  [[tables.columns]]
  name = "network_signature_severity"
  column_type = "string"

  # DTU ClarotyDeviceAlertRelation.network_signature_confidence: Option<String>.
  # Absent when no network signature matched. Verified in AlertedDevicesPairs__fields_enum.
  [[tables.columns]]
  name = "network_signature_confidence"
