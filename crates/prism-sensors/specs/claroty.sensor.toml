# claroty.sensor.toml — Production TOML sensor spec
#
# Authored per PLUGIN-MIGRATION-001-D Task 4.
# Grounding: ADR-028 §D1/§D2 remain authoritative; see BC-2.16.013 §Postconditions §1.
# ADR-053 §D5 excludes this sensor from ADR-053 supersession scope.
# auth_type = "bearer_static" is the D-747 LOCKED value.
# NOTE: legacy ClarotyAuth::auth_type_name() returned "cookie_roundtrip" — latent label bug
#   deleted by PLUGIN-MIGRATION-001-A.
#
# POST-for-read pattern: alerts, audit_logs, and devices use method = "POST" with body template.
# Pagination: POST steps with OffsetLimit pagination inject offset+limit into the JSON
#   request body (pipeline.rs::build_request — BC-2.16.002 §Postconditions
#   "OffsetLimit Pagination Dispatch: POST-body vs GET-URL (DRIFT-D850-001)").
#   Gap-CL-004: CLOSED by S-DEMO-CLAROTY-PAGINATION-001. Offset/limit now sent in the
#   POST body (not URL params). Multi-page queries (>page_size rows) are fully supported.
# Polymorphic ID: alerts.id column uses column_type = "string" to handle int and UUID IDs
#   (EC-016-013-004): JSON int IDs normalized to string at parser boundary.
# No /xdome prefix anywhere — see BC-2.16.013 §Postconditions §1 (claroty audit_logs).
#
# Gap-CL-001: CLOSED by S-DEMO-CLAROTY-TRAILING-SLASH-001.
#   path_templates updated to trailing-slash form to match the real Claroty xDome API
#   (poller-bear reference). DTU clone now wraps with NormalizePathLayer::trim_trailing_slash()
#   at the outer service so both slashed and non-slashed inbound requests are handled.
#   NormalizePathLayer is STRIP-ONLY — inbound /api/v1/alerts/ → /api/v1/alerts.
#
# Fidelity audit 2026-05-29 fixes applied:
#   Gap-CS-001 (crowdstrike): n/a
#   Gap-CL-003: added [[tables]] block for devices (DTU-grounded: POST /api/v1/devices)
#   Gap-CL-005: renamed alert columns to match DTU ClarotyAlert struct field names
#   Gap-CL-002: fixed audit_log path from /api/v1/audit_logs to /api/v1/audit_log/get

sensor_id = "claroty"
# probe_table: table routed to by LIMIT-0 health probe (BC-2.08.001 postcondition 5 / S-5.04 AC-10).
probe_table = "devices"
name = "Claroty xDome"
auth_type = "bearer_static"
base_url = "${env.CLAROTY_INSTANCE_URL}"
version = "1.0.0"
# ADR-058 Stage 2: activates OCSF field-name routing for this sensor. Arrow schema
# field names use ocsf_field_to_arrow_name(col.ocsf_field) for Tier-1 columns;
# Tier-2 columns (ocsf_field absent) aggregate into raw_extensions. (AC-005)
ocsf_column_naming = true

# ---------------------------------------------------------------------------
# Credential references
# ---------------------------------------------------------------------------
# Credential resolution chain: see BC-2.06.003.
[[credential_refs]]
name = "bearer_token"

# ---------------------------------------------------------------------------
# Table: alerts
# POST-for-read pattern; offset pagination (page_size = 1000)
# DTU route: POST /api/v1/alerts (crates/prism-dtu-claroty/src/clone.rs build_router())
#
# Gap-CL-005 fix (2026-05-29): column names updated to match DTU ClarotyAlert struct
#   (crates/prism-dtu-claroty/src/types.rs). Previous column names had 4 mismatches:
#   - "type" → "alert_type_name" (DTU field is alert_type_name)
#   - "severity" → removed (no severity field in Claroty alerts API or DTU struct)
#   - "created_at" → "detected_time" (DTU field is detected_time)
#   - "updated_at" → "updated_time" (DTU field is updated_time)
#   - "device_id" → removed (no device_id field; device association is via devices_count)
#   Added: "category" (DTU field), "devices_count" (DTU field integer)
# Not included (intentional exclusions from ClarotyAlert struct):
#   iot_devices_count (u32): IoT-device-count aggregate; excluded — same category as
#     devices_count which is already declared; IoT sub-type aggregates are low-query-value
#   it_devices_count (u32): IT-device-count aggregate; same rationale as iot_devices_count
#   medical_devices_count (u32): medical-device-count aggregate; same rationale
#   unresolved_devices_count (u32): unresolved-device-count aggregate; same rationale
#   mitre_technique_enterprise_ids (Vec<String>): array type; ENRICH-1 wildcard support
#     exists for devices table but alerts MITRE arrays are not yet surfaced via PrismQL
#     queries; deferred to S-ADR058-OCSF-COERCION-001 MITRE-column scope
#   mitre_technique_enterprise_names (Vec<String>): same rationale as _ids above
#   mitre_technique_ics_ids (Vec<String>): ICS-specific MITRE array; same rationale
#   mitre_technique_ics_names (Vec<String>): ICS-specific MITRE array; same rationale
# ---------------------------------------------------------------------------
[[tables]]
table_name = "alerts"
ocsf_class = "detection_finding"

  # Polymorphic ID: Claroty returns IDs as JSON integers or UUID strings.
  # Normalized to string at the spec parser boundary (EC-016-013-004).
  # DTU ClarotyAlert.id: u32 — normalized to string by pipeline.
  # KF-03: finding.uid → finding_info.uid (OCSF v1.7.0 restructuring; ADR-058 §K5 Divergence 1).
  [[tables.columns]]
  name = "id"
  column_type = "string"
  ocsf_field = "finding_info.uid"
  options = ["REQUIRED"]

  # DTU ClarotyAlert.alert_type_name: String — the alert type label.
  # KF-09: ocsf_field removed — no matching OCSF v1.7.0 field_path for detection_finding.
  # Tier-2 column: aggregates into raw_extensions under ocsf_column_naming = true.
  [[tables.columns]]
  name = "alert_type_name"
  column_type = "string"

  # DTU ClarotyAlert.category: String — alert category.
  # KF-08: ocsf_field removed — class_name is a computed field, not a detection_finding attribute.
  # Tier-2 column: aggregates into raw_extensions under ocsf_column_naming = true.
  [[tables.columns]]
  name = "category"
  column_type = "string"

  [[tables.columns]]
  name = "status"
  column_type = "string"
  ocsf_field = "status"

  # DTU ClarotyAlert.detected_time: String — ISO 8601 detection timestamp.
  [[tables.columns]]
  name = "detected_time"
  column_type = "datetime"
  ocsf_field = "time"

  # DTU ClarotyAlert.updated_time: String — ISO 8601 last update timestamp.
  # KF-12: end_time → finding_info.modified_time (OCSF v1.7.0; ADR-058 §K5 Divergence 1).
  [[tables.columns]]
  name = "updated_time"
  column_type = "datetime"
  ocsf_field = "finding_info.modified_time"

  # DTU ClarotyAlert.devices_count: u32 — count of affected devices.
  # KF-10: ocsf_field removed — "count" is not an OCSF v1.7.0 detection_finding attribute.
  # Tier-2 column: aggregates into raw_extensions under ocsf_column_naming = true.
  [[tables.columns]]
  name = "devices_count"
  column_type = "integer"

  [[tables.columns]]
  name = "description"
  column_type = "string"
  ocsf_field = "message"

  # DTU ClarotyAlert.alert_class: String — classification of the alert (e.g. "OT", "IT").
  # Tier 2 column: in Alert fields_enum (xDome OpenAPI 2026-06-20, verified 2026-08-11).
  [[tables.columns]]
  name = "alert_class"
  column_type = "string"

  # DTU ClarotyAlert.ot_devices_count: u32 — count of OT devices involved in the alert.
  # Tier 2 column: in Alert fields_enum (xDome OpenAPI 2026-06-20, verified 2026-08-11).
  [[tables.columns]]
  name = "ot_devices_count"
  column_type = "integer"

  # DTU ClarotyAlert.alert_name: String — human-readable alert name (distinct from type).
  # KF-04: finding.title → finding_info.title (OCSF v1.7.0; ADR-058 §K5 Divergence 1).
  # Tier-1 column: ocsf_field present → Arrow field name = "finding_info_title".
  [[tables.columns]]
  name = "alert_name"
  column_type = "string"
  ocsf_field = "finding_info.title"

  # POST-for-read step with offset pagination
  # DTU route: POST /api/v1/alerts (crates/prism-dtu-claroty/src/clone.rs build_router())
  # response_path: DTU returns {"alerts": [...], "total": N, "page": N} per routes::alerts::list_alerts
  # body_template: fields projection is REQUIRED by GetAlertsParameters (minItems: 1); covers all
  #   declared alert columns. OffsetLimit POST-body injection merges {"offset": N, "limit": 1000}
  #   into this body at request time (pipeline.rs::build_request — BC-2.16.002 §Postconditions "OffsetLimit
  #   Pagination Dispatch: POST-body vs GET-URL"). Do not add hardcoded offset/limit here.
  [[tables.steps]]
  name = "fetch_alerts"
  method = "POST"
  path_template = "/api/v1/alerts/"
  body_template = '{"fields": ["id", "alert_type_name", "category", "status", "detected_time", "updated_time", "devices_count", "description", "alert_class", "ot_devices_count", "alert_name"]}'
  response_path = "$.alerts"
  variables_produced = []
  [tables.steps.pagination]
  type = "offset_limit"
  page_size = 1000

# ---------------------------------------------------------------------------
# Table: audit_logs
# POST-for-read pattern; offset pagination
# DTU route: POST /api/v1/audit_log/get — implemented and parity-validated
#   by S-DEMO-CLAROTY-AUDIT-DTU-001 / PR #167 (crates/prism-dtu-claroty/src/routes/audit_log.rs).
# Gap-CL-002 fix (2026-05-29): corrected path from /api/v1/audit_logs to
#   /api/v1/audit_log/get per poller-bear reference (poller-express semport
#   broad-sweep §4.3: POST /api/v1/audit_log/get).
# ---------------------------------------------------------------------------
[[tables]]
table_name = "audit_logs"
# KF-01: audit_activity → entity_management (OCSF v1.7.0 class_uid=3004; ADR-058 §K5 Divergence 3).
# entity_management carries the `comment` attribute required for note→comment mapping;
# account_change (3001) lacks it, causing silent data loss of every `note` value.
ocsf_class = "entity_management"
# Gap-CL-006 CLOSED by S-DEMO-CLAROTY-AUDIT-DTU-001.
# POST /api/v1/audit_log/get route registered in prism-dtu-claroty.

  # OQ-005 (human decision 2026-08-21): audit record ID maps to OCSF metadata.uid —
  # first-class Tier-1 Arrow column "metadata_uid" under ocsf_column_naming = true.
  # ocsf_field_to_arrow_name("metadata.uid") = "metadata_uid".
  # Overrides KF-05 (which had removed ocsf_field entirely).
  [[tables.columns]]
  name = "id"
  column_type = "string"
  ocsf_field = "metadata.uid"
  options = ["REQUIRED"]

  [[tables.columns]]
  name = "action"
  column_type = "string"
  ocsf_field = "activity_name"

  # Real xDome field: user_display_name — display name of the user who performed the action.
  # (actor/resource do NOT exist in the xDome audit_log API — LIVE-DRIFT-003)
  [[tables.columns]]
  name = "user_display_name"
  column_type = "string"
  ocsf_field = "actor.user.name"

  # Real xDome field: category — audit event category.
  # KF-11: ocsf_field removed — category_name is a computed field, not an OCSF v1.7.0
  # entity_management attribute. Tier-2: aggregates into raw_extensions.
  [[tables.columns]]
  name = "category"
  column_type = "string"

  [[tables.columns]]
  name = "timestamp"
  column_type = "datetime"
  ocsf_field = "time"
  # options = ["INDEX"]: push-down-eligible datetime column. Required for extract_time_window_from_ast
  # (ADR-033 T1) to identify timestamp as the Claroty audit_logs time-window push-down column.
  # Without this, Option T1 cannot extract time bounds from `timestamp > 'T'` predicates.
  # AC-INDEX-CLARO-001 / RG-007 / BC-2.01.013 Claroty audit_logs time-window / EC-01-034.
  options = ["INDEX"]

  # Real xDome field: details — description of what was done.
  [[tables.columns]]
  name = "details"
  column_type = "string"
  ocsf_field = "message"

  # Real xDome field: username — the user identifier (login name).
  # column_type = "string" ensures any value is preserved as string even when ocsf_field
  # "actor.user.uid" would otherwise trigger the numeric-suffix heuristic in coerce_value.
  [[tables.columns]]
  name = "username"
  column_type = "string"
  ocsf_field = "actor.user.uid"

  # Real xDome field: note — optional note about the audit activity (absent from some records).
  [[tables.columns]]
  name = "note"
  column_type = "string"
  ocsf_field = "comment"

  # POST-for-read step with offset pagination
  # DTU route: POST /api/v1/audit_log/get — implemented by S-DEMO-CLAROTY-AUDIT-DTU-001.
  # response_path: DTU returns {"audit_log": [...]} per GetAuditLogResponse
  #   (routes/audit_log.rs), matching poller-bear reference.
  # body_template: Layer-2 variable form (S-CLAROTY-AUDITLOG-TIMEBOX-001 AC-005).
  #   `spec_driven_adapter.rs` injects `_claroty_audit_filter_by` into FetchContext.query_filters
  #   (a JSON-object string); `pipeline.rs` auto-parses it to Value::Object so
  #   `${query.filter._claroty_audit_filter_by}` expands inline in the POST body.
  #   OffsetLimit POST-body injection merges {"offset": N, "limit": 1000} AFTER template
  #   expansion (pipeline.rs::build_request — BC-2.16.002 §Postconditions).
  #   Final POST body: {"filter_by": {...}, "offset": 0, "limit": 1000}
  # path_template: /api/v1/audit_log/get WITHOUT trailing slash — OpenAPI declares this path
  #   without a trailing slash (unlike alerts/devices which use trailing slash by convention).
  [[tables.steps]]
  name = "fetch_audit_logs"
  method = "POST"
  path_template = "/api/v1/audit_log/get"
  body_template = '{"filter_by": ${query.filter._claroty_audit_filter_by}}'
  response_path = "$.audit_log"
  variables_produced = []
  [tables.steps.pagination]
  type = "offset_limit"
  page_size = 1000

# ---------------------------------------------------------------------------
# Table: devices
# POST-for-read pattern; offset pagination (page_size = 1000)
# DTU route: POST /api/v1/devices (crates/prism-dtu-claroty/src/clone.rs build_router())
#
# Gap-CL-003 fix (2026-05-29): added this table. Previously absent from TOML despite
#   a fully working DTU route and production poller support.
# PR #236 expansion (2026-08-12): added 12 additional columns from DTU ClarotyDevice
#   struct (crates/prism-dtu-claroty/src/types.rs). Table now covers all 20 queryable
#   fields: uid, asset_id, device_category, device_type, ip_list, mac_list, network_list,
#   vlan_list, purdue_level, site_name, device_subcategory, device_type_family,
#   criticality, is_online, device_name, manufacturer, model, os_category,
#   risk_score, retired.
#   ip_list, mac_list, network_list, vlan_list use ENRICH-1 source_path wildcard
#   (source_path = "$.X[*]") for array column extraction.
#   Not included (DTU-internal or write-path only — no entry in xDome Device fields_enum):
#     assignees (Vec<String>): xDome user assignment list; not returned in Device query responses
#     labels (Vec<String>): user-defined labels; excluded from standard Device API response fields
#     tags (Vec<String>): write-path only; used by tag-management endpoints, not POST /api/v1/devices
# Gap-CL-004: CLOSED by S-DEMO-CLAROTY-PAGINATION-001. Offset/limit now sent in POST body.
# ---------------------------------------------------------------------------
[[tables]]
table_name = "devices"
# KF-02: device → inventory_info (OCSF v1.7.0 class_uid=5001; ADR-058 §K5 Divergence 2).
ocsf_class = "inventory_info"

  # DTU ClarotyDevice.uid: String — Claroty's unique device identifier (UUID form).
  [[tables.columns]]
  name = "uid"
  column_type = "string"
  ocsf_field = "device.uid"
  options = ["REQUIRED"]

  # DTU ClarotyDevice.asset_id: String — asset tracking identifier.
  [[tables.columns]]
  name = "asset_id"
  column_type = "string"
  ocsf_field = "device.instance_uid"

  # DTU ClarotyDevice.device_category: String — high-level device category
  #   (e.g. "OT Device", "IT Device", "Medical Device").
  # §J1 shadow fix: device.type → device.type_category to avoid §J1 A≠B shadow with sibling
  # device_type column (col.name). Without this fix, ocsf_field_to_arrow_name("device.type")
  # = "device_type" would equal the sibling device_type column's raw col.name — a §J1 A≠B
  # shadow collision (RG-010 / ADR-058 §J1) → ArrowError::SchemaError; the fix
  # (device.type_category, flattening to device_type_category) avoids it.
  [[tables.columns]]
  name = "device_category"
  column_type = "string"
  ocsf_field = "device.type_category"

  # DTU ClarotyDevice.device_type: String — device type within category.
  # KF-06: device.type_name → device.type_label (OCSF v1.7.0; ADR-058 §K5 Divergence 4).
  [[tables.columns]]
  name = "device_type"
  column_type = "string"
  ocsf_field = "device.type_label"

  # DTU ClarotyDevice.risk_score: String — Claroty risk score (string-typed in DTU;
  #   may be numeric string like "7.5" or label like "High"). String column to preserve
  #   exact DTU value; consumer normalizes for display.
  [[tables.columns]]
  name = "risk_score"
  column_type = "string"
  ocsf_field = "risk_score"

  # DTU ClarotyDevice.retired: bool — whether the device is marked as retired/decommissioned.
  [[tables.columns]]
  name = "retired"
  column_type = "boolean"
  ocsf_field = "status_code"

  # DTU ClarotyDevice.ip_list: Vec<String> — list of IP addresses.
  # ENRICH-1 wildcard: source_path = "$.ip_list[*]" extracts all elements and serializes
  # as a compact JSON-list string (e.g. '["10.0.1.1","10.0.1.2"]').
  # Tier 2 column: in Device fields_enum (xDome OpenAPI 2026-06-20, verified 2026-08-11).
  [[tables.columns]]
  name = "ip_list"
  column_type = "string"
  source_path = "$.ip_list[*]"

  # DTU ClarotyDevice.mac_list: Vec<String> — list of MAC addresses.
  # ENRICH-1 wildcard: serializes as compact JSON-list string.
  # Tier 2 column: in Device fields_enum (xDome OpenAPI 2026-06-20, verified 2026-08-11).
  [[tables.columns]]
  name = "mac_list"
  column_type = "string"
  source_path = "$.mac_list[*]"

  # DTU ClarotyDevice.network_list: Vec<String> — list of network segment names.
  # ENRICH-1 wildcard: serializes as compact JSON-list string.
  # Tier 2 column: in Device fields_enum (xDome OpenAPI 2026-06-20, verified 2026-08-11).
  [[tables.columns]]
  name = "network_list"
  column_type = "string"
  source_path = "$.network_list[*]"

  # DTU ClarotyDevice.vlan_list: Vec<u32> — list of VLAN IDs.
  # ENRICH-1 wildcard: integer elements are stringified in JSON-list output
  # (e.g. ["100","200"]). column_type = "string" because the output is a JSON-list string.
  # Tier 2 column: in Device fields_enum (xDome OpenAPI 2026-06-20, verified 2026-08-11).
  [[tables.columns]]
  name = "vlan_list"
  column_type = "string"
  source_path = "$.vlan_list[*]"

  # DTU ClarotyDevice.purdue_level: String — Purdue model level (e.g. "Level 1", "Level 2").
  # Tier 2 column: in Device fields_enum (xDome OpenAPI 2026-06-20, verified 2026-08-11).
  [[tables.columns]]
  name = "purdue_level"
  column_type = "string"

  # DTU ClarotyDevice.site_name: String — physical site name where device is located.
  # Tier 2 column: in Device fields_enum (xDome OpenAPI 2026-06-20, verified 2026-08-11).
  [[tables.columns]]
  name = "site_name"
  column_type = "string"

  # DTU ClarotyDevice.device_subcategory: String — subcategory within device_category.
  # Tier 2 column: in Device fields_enum (xDome OpenAPI 2026-06-20, verified 2026-08-11).
  [[tables.columns]]
  name = "device_subcategory"
  column_type = "string"

  # DTU ClarotyDevice.device_type_family: String — device type family grouping.
  # Tier 2 column: in Device fields_enum (xDome OpenAPI 2026-06-20, verified 2026-08-11).
  [[tables.columns]]
  name = "device_type_family"
  column_type = "string"

  # DTU ClarotyDevice.criticality: String — asset criticality level (e.g. "High", "Low").
  # Tier 2 column: in Device fields_enum (xDome OpenAPI 2026-06-20, verified 2026-08-11).
  [[tables.columns]]
  name = "criticality"
  column_type = "string"

  # DTU ClarotyDevice.is_online: bool — whether device is currently online.
  # Tier 2 column: in Device fields_enum (xDome OpenAPI 2026-06-20, verified 2026-08-11).
  [[tables.columns]]
  name = "is_online"
  column_type = "boolean"

  # DTU ClarotyDevice.device_name: String — device display name.
  # Tier 2 column: in Device fields_enum (xDome OpenAPI 2026-06-20, verified 2026-08-11).
  [[tables.columns]]
  name = "device_name"
  column_type = "string"
  ocsf_field = "device.name"

  # DTU ClarotyDevice.manufacturer: String — hardware manufacturer.
  # Tier 2 column: in Device fields_enum (xDome OpenAPI 2026-06-20, verified 2026-08-11).
  [[tables.columns]]
  name = "manufacturer"
  column_type = "string"

  # DTU ClarotyDevice.model: String — device model identifier.
  # Tier 2 column: in Device fields_enum (xDome OpenAPI 2026-06-20, verified 2026-08-11).
  [[tables.columns]]
  name = "model"
  column_type = "string"

  # DTU ClarotyDevice.os_category: String — operating system category.
  # Tier 2 column: in Device fields_enum (xDome OpenAPI 2026-06-20, verified 2026-08-11).
  [[tables.columns]]
  name = "os_category"
  column_type = "string"
  ocsf_field = "device.os.name"

  # POST-for-read step with offset pagination
  # DTU route: POST /api/v1/devices (crates/prism-dtu-claroty/src/clone.rs build_router())
  # response_path: DTU returns {"devices": [...], "total": N, "page": N} per GetDevicesResponse.
  # body_template: fields projection is REQUIRED by GetDevicesParameters (minItems: 1); covers all
  #   declared device columns. OffsetLimit POST-body injection merges {"offset": N, "limit": 1000}
  #   at request time (pipeline.rs::build_request — Gap-CL-004 CLOSED by S-DEMO-CLAROTY-PAGINATION-001).
  # NOTE: ip_list/mac_list/network_list/vlan_list use source_path (ENRICH-1) but are still
  #   valid GetDevicesParameters.fields values — the xDome API returns them in the JSON object.
  [[tables.steps]]
  name = "fetch_devices"
  method = "POST"
  path_template = "/api/v1/devices/"
  body_template = '{"fields": ["uid", "asset_id", "device_category", "device_type", "risk_score", "retired", "ip_list", "mac_list", "network_list", "vlan_list", "purdue_level", "site_name", "device_subcategory", "device_type_family", "criticality", "is_online", "device_name", "manufacturer", "model", "os_category"]}'
  response_path = "$.devices"
  variables_produced = []
  [tables.steps.pagination]
  type = "offset_limit"
  page_size = 1000

# ---------------------------------------------------------------------------
# Table: device_alert_relations
# POST-for-read pattern; offset pagination
# DTU route: POST /api/v1/device_alert_relations/ (Tier 3)
#
# Returns device-alert pair records (AlertedDevicesPairs) from the xDome API.
# Response envelope: {"devices_alerts": [...], "count": N_or_null}
#   - Key is `devices_alerts` (NOT `device_alert_relations`)
#   - Uses `count` (NOT `total`) per GetDeviceAlertsResponse schema
#   - TOML response_path = "$.devices_alerts" matches the DTU envelope key
#
# fields projection: REQUIRED by GetDeviceAlertsParameters (minItems: 1);
#   all 10 columns verified in the 92-value AlertedDevicesPairs__fields_enum
#   in xDome OpenAPI 2026-06-20 (confirmed 2026-08-11).
# ---------------------------------------------------------------------------
[[tables]]
table_name = "device_alert_relations"
ocsf_class = "detection_finding"

  # DTU ClarotyDeviceAlertRelation.device_uid: String — Claroty device UUID.
  # Verified in AlertedDevicesPairs__fields_enum (xDome OpenAPI 2026-06-20).
  [[tables.columns]]
  name = "device_uid"
  column_type = "string"
  ocsf_field = "device.uid"
  options = ["REQUIRED"]

  # DTU ClarotyDeviceAlertRelation.alert_id: u32 — normalized to string by pipeline (polymorphic alert-ID support at the real-API boundary; matches alerts.id per EC-016-013-004).
  # KF-07: finding.uid → finding_info.uid (OCSF v1.7.0; ADR-058 §K5 Divergence 1).
  [[tables.columns]]
