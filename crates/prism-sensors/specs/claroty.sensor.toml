# ---------------------------------------------------------------------------
# Table: vulnerabilities
# POST-for-read pattern; offset pagination (page_size = 1000)
# DTU route: POST /api/v1/vulnerabilities/ (crates/prism-dtu-claroty/src/routes/vulnerabilities.rs)
#
# Gap-CL-007 (new): added this table. OCSF class = vulnerability_finding.
#   Response envelope: {"vulnerabilities": [...], "total": N, "page": N}
#   Key is `vulnerabilities` (matching response_path = "$.vulnerabilities").
#
# DTU-deferred: SAP-2 parity between the 18-field TOML body_template and the
#   DTU ClarotyVulnerability struct is parked per D-2200. The DTU route
#   (list_vulnerabilities) serves from fixtures/vulnerabilities.json and does
#   not enforce a fields projection; the SAP-2 parity check against the
#   DTU emission site is deferred to S-ADR058-DTU-PARITY-MIGRATION-001 (D-2200).
#
# SAP-2-deferred: source_url and source_name appear in the xDome API vulnerability
#   fields_enum but are absent from the DTU ClarotyVulnerability struct; DTU struct
#   parity deferred to S-ADR058-DTU-PARITY-MIGRATION-001 per D-2200. Columns are
#   included in TOML per BC-2.16.015 §2 / spike-findings §Spike 1.
#
# body_template: fields projection covers all 18 TOML columns (excludes `id`,
#   which uses source_path = "$.id" from the root-level id key — NOT in fields
#   projection per BC-2.16.015 §Postconditions §2).
# OffsetLimit POST-body injection merges {"offset": N, "limit": 1000} into this
#   body at request time (pipeline.rs::build_request — BC-2.16.002 §Postconditions
#   "OffsetLimit Pagination Dispatch: POST-body vs GET-URL (DRIFT-D850-001)").
# ---------------------------------------------------------------------------
[[tables]]
table_name = "vulnerabilities"
ocsf_class = "vulnerability_finding"

  # Tier-1 #1: OCSF finding_info.title — the vulnerability name/title.
  # ocsf_field_to_arrow_name("finding_info.title") = "finding_info_title" under
  # ocsf_column_naming = true (ADR-058 §C2 Option 4). Push-down eligible (REQUIRED).
  # options = ["REQUIRED"]: index-based push-down eligibility only (not an extraction gate).
  [[tables.columns]]
  name = "name"
  column_type = "string"
  ocsf_field = "finding_info.title"
  options = ["REQUIRED"]

  # Tier-1 #2: OCSF message — the vulnerability description text.
  # ocsf_field_to_arrow_name("message") = "message" (single-segment, unchanged).
  [[tables.columns]]
  name = "description"
  column_type = "string"
  ocsf_field = "message"

  # Tier-2 columns below (no ocsf_field) — aggregate into raw_extensions under
  # ocsf_column_naming = true (ADR-058 §J6). Not push-down eligible.

  # xDome Vulnerability fields_enum: vulnerability_type — vulnerability classification
  # (e.g., "CVE", "CWE", "RHSA"). Verified in xDome OpenAPI vulnerability fields_enum.
  [[tables.columns]]
  name = "vulnerability_type"
  column_type = "string"

  # xDome Vulnerability fields_enum: cve_ids — associated CVE identifier list.
  # column_type = "json": native JSON array on the wire (e.g., ["CVE-2024-1234"] or []).
  [[tables.columns]]
  name = "cve_ids"
  column_type = "json"

  # xDome Vulnerability fields_enum: cvss_v3_score — CVSS v3 base score (0.0–10.0).
  [[tables.columns]]
  name = "cvss_v3_score"
  column_type = "float"

  # xDome Vulnerability fields_enum: cvss_v3_exploitability_subscore — CVSS v3
  # exploitability sub-score component.
  [[tables.columns]]
  name = "cvss_v3_exploitability_subscore"
  column_type = "float"

  # xDome Vulnerability fields_enum: cvss_v3_vector_string — CVSS v3 vector string
  # (e.g., "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:H").
  [[tables.columns]]
  name = "cvss_v3_vector_string"
  column_type = "string"

  # xDome Vulnerability fields_enum: cvss_v2_score — CVSS v2 base score (0.0–10.0).
  [[tables.columns]]
  name = "cvss_v2_score"
  column_type = "float"

  # xDome Vulnerability fields_enum: is_known_exploited — whether a known exploit exists
  # (CISA KEV membership or equivalent).
  [[tables.columns]]
  name = "is_known_exploited"
  column_type = "boolean"

  # xDome Vulnerability fields_enum: affected_devices_count — total count of affected devices.
  [[tables.columns]]
  name = "affected_devices_count"
  column_type = "integer"

  # xDome Vulnerability fields_enum: affected_ot_devices_count — count of affected OT devices.
  [[tables.columns]]
  name = "affected_ot_devices_count"
  column_type = "integer"

  # xDome Vulnerability fields_enum: published_date — ISO 8601 publication date.
  # column_type = "datetime": no timestamp_formats key — resolves to implicit ["iso8601"]
  # default via effective_formats (ADR-028 §D8-B backward compatibility).
  [[tables.columns]]
  name = "published_date"
  column_type = "datetime"

  # xDome Vulnerability fields_enum: epss_score — EPSS probability score (0.0–1.0).
  [[tables.columns]]
  name = "epss_score"
  column_type = "float"

  # xDome Vulnerability fields_enum: adjusted_vulnerability_score — Claroty-adjusted
  # composite risk score.
  [[tables.columns]]
  name = "adjusted_vulnerability_score"
  column_type = "float"

  # xDome Vulnerability fields_enum: adjusted_vulnerability_score_level — risk level
  # label corresponding to adjusted_vulnerability_score (e.g., "High", "Medium", "Low").
  [[tables.columns]]
  name = "adjusted_vulnerability_score_level"
  column_type = "string"

  # xDome Vulnerability fields_enum: exploits_count — number of known public exploits.
  [[tables.columns]]
  name = "exploits_count"
  column_type = "integer"

  # xDome Vulnerability fields_enum: source_name — name of the vulnerability source
  # (e.g., "NVD", "CISA", "vendor advisory").
  # SAP-2-deferred: absent from DTU ClarotyVulnerability struct; parity deferred to
  # S-ADR058-DTU-PARITY-MIGRATION-001 per D-2200. Tier-2: aggregates into raw_extensions.
  [[tables.columns]]
  name = "source_name"
  column_type = "string"

  # xDome Vulnerability fields_enum: source_url — link to the vulnerability advisory page.
  # SAP-2-deferred: absent from DTU ClarotyVulnerability struct; parity deferred to
  # S-ADR058-DTU-PARITY-MIGRATION-001 per D-2200. Tier-2: aggregates into raw_extensions.
  [[tables.columns]]
  name = "source_url"
  column_type = "string"

  # id column: source_path = "$.id" extracts the root-level opaque Claroty CJYASHKR id.
  # No ocsf_field (not a push-down column); not in body_template fields projection
  # per BC-2.16.015 §Postconditions §2.
  # source_path miss (absent "id" key) → column skipped silently by map_record (ENRICH-1).
  [[tables.columns]]
  name = "id"
  column_type = "string"
  source_path = "$.id"

  # POST-for-read step with offset pagination
  # DTU route: POST /api/v1/vulnerabilities/ (crates/prism-dtu-claroty/src/routes/vulnerabilities.rs)
  # response_path: DTU returns {"vulnerabilities": [...], "total": N, "page": N} per
  #   GetVulnerabilitiesResponse (routes/vulnerabilities.rs).
  # body_template: fields projection covers all 18 declared columns (excludes `id` which
  #   uses source_path = "$.id"). OffsetLimit POST-body injection merges {"offset": N,
  #   "limit": 1000} at request time (pipeline.rs::build_request — BC-2.16.002 §Postconditions
  #   "OffsetLimit Pagination Dispatch: POST-body vs GET-URL (DRIFT-D850-001)").
  # Do not add hardcoded offset/limit here — pipeline injects them.
  [[tables.steps]]
  name = "fetch_vulnerabilities"
  method = "POST"
  path_template = "/api/v1/vulnerabilities/"
  body_template = '{"fields": ["name", "vulnerability_type", "cve_ids", "cvss_v3_score", "cvss_v3_exploitability_subscore", "cvss_v3_vector_string", "cvss_v2_score", "description", "is_known_exploited", "affected_devices_count", "affected_ot_devices_count", "published_date", "epss_score", "adjusted_vulnerability_score", "adjusted_vulnerability_score_level", "exploits_count", "source_name", "source_url"]}'
  response_path = "$.vulnerabilities"
  variables_produced = []
  [tables.steps.pagination]
  type = "offset_limit"
  page_size = 1000

# ---------------------------------------------------------------------------
# Table: ot_activity_events  (registered as: claroty_ot_activity_events)
# POST-for-read pattern; offset pagination (page_size = 1000)
# Wave A G2 — S-CLAROTY-OT-EVENTS-001
#
# OCSF class: detection_finding / class_uid 2004 — Option B per spike-findings §Spike 2
#   §Decision. The governing plan constraint ("NO new OCSF class_selector arms required")
#   is satisfied — the detection_finding arm already exists (used by alerts and
#   device_alert_relations). See BC-2.16.016 §Postconditions §3.
#
# DTU: NONE — no DTU clone exists for this endpoint.
#   SAP-2 probe is N/A for this story (deferred D-2200; OT-events DTU out of scope for Wave G2).
#
# Tier-1 columns (ocsf_field present) → exposed as OCSF Arrow field names under
#   ocsf_column_naming = true (event_id→finding_info_uid, detection_time→time,
#   event_type→activity_name, description→message).
# Tier-2 columns (no ocsf_field) → aggregate into raw_extensions.
#   Network 5-tuple (source_ip, dest_ip, protocol, dest_port, source_port, ip_protocol)
#   is intentionally Tier-2 per BC-2.16.016 §Postconditions §3 Option B.
# ---------------------------------------------------------------------------
[[tables]]
table_name = "ot_activity_events"
ocsf_class = "detection_finding"

  # ── Tier-1 columns (4) ───────────────────────────────────────────────────

  # OTActivityEvent.event_id: Integer — platform-unique event identifier.
  # REQUIRED = mandatory push-down parameter (BC-2.11.007 / ColumnOptions::Required),
  # consistent with sibling id/uid columns (e.g., alerts.id, devices.uid, device_alert_relations.device_uid).
  # Absent event_id → finding_info.uid null via build_column_array within
  # pipeline_result_to_record_batch (reached via SpecDrivenSensorAdapter::fetch) — NOT a
  # REQUIRED-option effect. (map_record is a non-production reference mirror; zero production callers.)
  # ocsf_field_to_arrow_name("finding_info.uid") = "finding_info_uid" (ADR-058 §C2 Option 4).
  [[tables.columns]]
  name = "event_id"
  column_type = "integer"
  ocsf_field = "finding_info.uid"
  options = ["REQUIRED"]

  # OTActivityEvent.detection_time: String (ISO 8601) — detection timestamp.
  # No timestamp_formats: implicit iso8601 default per ADR-028 §D8-B.
  # ocsf_field_to_arrow_name("time") = "time".
  [[tables.columns]]
  name = "detection_time"
  column_type = "datetime"
  ocsf_field = "time"

  # OTActivityEvent.event_type: String — OT activity type label.
  # ocsf_field_to_arrow_name("activity_name") = "activity_name".
  [[tables.columns]]
  name = "event_type"
  column_type = "string"
  ocsf_field = "activity_name"

  # OTActivityEvent.description: String — human-readable event description.
  # ocsf_field_to_arrow_name("message") = "message".
  [[tables.columns]]
  name = "description"
  column_type = "string"
  ocsf_field = "message"

  # ── Tier-2 columns (17): aggregate into raw_extensions ───────────────────
  # Network 5-tuple is Tier-2 per BC-2.16.016 §Postconditions §3 Option B.

  [[tables.columns]]
  name = "source_ip"
  column_type = "string"

  [[tables.columns]]
  name = "dest_ip"
  column_type = "string"

  [[tables.columns]]
  name = "protocol"
  column_type = "string"

  [[tables.columns]]
  name = "dest_port"
  column_type = "integer"

  [[tables.columns]]
  name = "source_port"
  column_type = "integer"

  [[tables.columns]]
  name = "ip_protocol"
  column_type = "string"

  [[tables.columns]]
  name = "source_asset_id"
  column_type = "string"

  [[tables.columns]]
  name = "dest_asset_id"
  column_type = "string"

  [[tables.columns]]
  name = "source_device_name"
  column_type = "string"

  [[tables.columns]]
  name = "dest_device_name"
  column_type = "string"

  [[tables.columns]]
  name = "source_device_type"
  column_type = "string"

  [[tables.columns]]
  name = "dest_device_type"
  column_type = "string"

  [[tables.columns]]
  name = "source_site_name"
  column_type = "string"

  [[tables.columns]]
  name = "dest_site_name"
  column_type = "string"

  [[tables.columns]]
  name = "source_username"
  column_type = "string"

  # OTActivityEvent.related_alert_ids: Array of alert IDs linking this event to
  # Claroty alerts (confirms Option B detection_finding class).
  # column_type = "json": uses json column type; the pipeline preserves the array
  # natively in raw_extensions, per the vulnerabilities.cve_ids precedent. The value
  # is a native JSON array (e.g. [101, 202] or []); must NOT be stringified.
  # EC-016-016-002: empty array → [] in raw_extensions (not null).
  [[tables.columns]]
  name = "related_alert_ids"
  column_type = "json"

  [[tables.columns]]
  name = "mode"
  column_type = "string"

  # POST-for-read step with offset pagination
  # response_path: "$.ot_activity_events" — envelope key from the xDome API.
  # body_template: 21-field projection per BC-2.16.016 §Postconditions §1.
  #   OffsetLimit POST-body injection merges {"offset": N, "limit": 1000} at request time.
  [[tables.steps]]
  name = "fetch_ot_activity_events"
  method = "POST"
  path_template = "/api/v1/ot_activity_events/"
  body_template = '{"fields": ["event_id", "detection_time", "event_type", "description", "source_ip", "dest_ip", "protocol", "dest_port", "source_port", "ip_protocol", "source_asset_id", "dest_asset_id", "source_device_name", "dest_device_name", "source_device_type", "dest_device_type", "source_site_name", "dest_site_name", "source_username", "related_alert_ids", "mode"]}'
  response_path = "$.ot_activity_events"
  variables_produced = []
  [tables.steps.pagination]
  type = "offset_limit"
  page_size = 1000

# ---------------------------------------------------------------------------
# Table: claroty_device_vulnerability_relations
# Wave B G3 — POST /api/v1/device_vulnerability_relations/ → envelope key: devices_vulnerabilities
# (note: envelope key "devices_vulnerabilities" diverges from table name —
#   response_path = "$.devices_vulnerabilities" exactly; NOT "$.device_vulnerability_relations")
# OCSF class: vulnerability_finding (class_uid 2002; existing arm in class_selector.rs;
#   same arm used by claroty_vulnerabilities — no new arm required per BC-2.16.017 §PC3)
# Composite PK: (vulnerability_name, device_uid) — see BC-2.16.017 §PC3
#   vulnerability_name carries REQUIRED; device_uid does NOT (null device_uid is valid)
# DTU status: NONE — SAP-2 probe N/A per BC-2.16.017 §PC5 + D-2200 (no DTU route for
#   device_vulnerability_relations; DTU creation deferred to xdome-endpoint-expansion-plan.md
#   §Deferred DTU-Creation Stories)
# 201 of 214 DeviceVulnerability enum fields deferred per BC-2.16.017 §PC4 Groups A/B/C
# ---------------------------------------------------------------------------
[[tables]]
table_name = "device_vulnerability_relations"
ocsf_class = "vulnerability_finding"   # class_uid 2002 (existing arm; same as claroty_vulnerabilities)

  # Tier-1: vulnerability_name → finding_info.title → Arrow "finding_info_title" (REQUIRED)
  # ocsf_field_to_arrow_name("finding_info.title") = "finding_info_title" (ADR-058 §C)
  [[tables.columns]]
  name = "vulnerability_name"
  column_type = "string"
  ocsf_field = "finding_info.title"
  options = ["REQUIRED"]

  # Tier-1: device_vulnerability_detection_date → time → Arrow "time"
  # ocsf_field_to_arrow_name("time") = "time" (ADR-058 §C)
  # timestamp_formats omitted — ADR-028 §D8-B implicit iso8601 default applies
  [[tables.columns]]
  name = "device_vulnerability_detection_date"
  column_type = "datetime"
  ocsf_field = "time"

  # Tier-2: composite PK join key to claroty_devices (device_uid → claroty_devices.uid)
  # No REQUIRED option — null device_uid is valid per BC-2.16.017 §Invariants
  [[tables.columns]]
  name = "device_uid"
  column_type = "string"

  # Tier-2: human-readable device name
  [[tables.columns]]
  name = "device_name"
  column_type = "string"

  # Tier-2: alternative device asset identifier
  [[tables.columns]]
  name = "device_asset_id"
  column_type = "string"

  # Tier-2: opaque Claroty vulnerability ID (CJYASHKR format); joins to claroty_vulnerabilities
  # via its `id` field (vulnerability_name → name is the BC-2.16.017 §PC3 composite-PK join key;
  # vulnerability_id → id is the opaque-ID alternative join per endpoint-spike-findings.md §Spike-1)
  [[tables.columns]]
  name = "vulnerability_id"
  column_type = "string"

  # Tier-2: CVSS v3 base score — primary risk-triage field (0.0–10.0)
  [[tables.columns]]
  name = "vulnerability_cvss_v3_score"
  column_type = "float"

  # Tier-2: CISA KEV indicator (true = known exploited in the wild)
  [[tables.columns]]
  name = "vulnerability_is_known_exploited"
  column_type = "boolean"

  # Tier-2: EPSS exploit probability score (0.0–1.0)
  [[tables.columns]]
  name = "vulnerability_epss_score"
  column_type = "float"

  # Tier-2: nullable — absent when vulnerability is still open on this device (EC-016-017-002)
  # timestamp_formats omitted — ADR-028 §D8-B implicit iso8601 default applies
  [[tables.columns]]
  name = "device_vulnerability_resolution_date"
  column_type = "datetime"

  # Tier-2: array of strings describing relevance classification (e.g. ["Software", "Configuration"])
  # column_type = "json" — value stored as Value::Array in raw_extensions; serializes as "[]" when empty
  # (EC-016-017-004: empty array "[]" must NOT be null; wire-shape discipline applies)
  [[tables.columns]]
  name = "device_vulnerability_relevance_reasons"
  column_type = "json"

  # Tier-2: nullable — absent when device has not been patched (EC-016-017-003)
  # timestamp_formats omitted — ADR-028 §D8-B implicit iso8601 default applies
  [[tables.columns]]
  name = "patch_install_date"
  column_type = "datetime"

  # Tier-2: physical or logical site/location of the device
  [[tables.columns]]
  name = "device_site_name"
  column_type = "string"

  # POST-for-read step with offset pagination
  # response_path: "$.devices_vulnerabilities" — key in GetDeviceVulnerabilitiesResponse envelope
  # body_template: fields projection is REQUIRED by GetDeviceVulnerabilitiesParameters (minItems: 1);
  #   all 13 declared column names are valid DeviceVulnerability__fields_enum values
  #   (verified 2026-08-31 against xDome OpenAPI GetDeviceVulnerabilitiesParameters schema).
  # OffsetLimit POST-body injection merges {"offset": N, "limit": 1000} at request time
  #   (pipeline.rs::build_request — BC-2.16.002 §Postconditions OffsetLimit Pagination Dispatch).
  # NOTE: include_count NOT set — OpenAPI default false; offset-0-only; short-page halt (page_record_count < page_size) is the
  #   termination mechanism; empty-page is the degenerate case (BC-2.16.017 §PC1 Envelope note, EC-016-017-005, AC-007).
  [[tables.steps]]
  name = "fetch_device_vulnerability_relations"
  method = "POST"
  path_template = "/api/v1/device_vulnerability_relations/"
  body_template = '{"fields": ["vulnerability_name", "device_uid", "device_name", "device_asset_id", "vulnerability_id", "vulnerability_cvss_v3_score", "vulnerability_is_known_exploited", "vulnerability_epss_score", "device_vulnerability_detection_date", "device_vulnerability_resolution_date", "device_vulnerability_relevance_reasons", "patch_install_date", "device_site_name"]}'
  response_path = "$.devices_vulnerabilities"
  variables_produced = []
  [tables.steps.pagination]
  type = "offset_limit"
  page_size = 1000

# ---------------------------------------------------------------------------
# Table: claroty_servers  (Wave C G4)
# POST /api/v1/servers/ → envelope key: servers
# OCSF class: inventory_info (class_uid 5001; existing arm in class_selector.rs)
# PK: server_name (String, REQUIRED, single-column)
# DTU status: NONE — SAP-2 probe N/A per D-2200; near-term tests against live monroe only
# Tier-1: server_name → device_name (REQUIRED); server_status → status_code
# Tier-2 (15 cols): all remaining aggregate into raw_extensions under ocsf_column_naming=true
# ---------------------------------------------------------------------------
[[tables]]
table_name = "servers"
ocsf_class = "inventory_info"   # class_uid 5001 (existing arm; same as claroty_devices)

  # Tier-1: server_name → device_name (REQUIRED; primary key)
  [[tables.columns]]
  name = "server_name"
  column_type = "string"
  ocsf_field = "device.name"
  options = ["REQUIRED"]

  # Tier-1: server_status → status_code ("Up" / "Down" / "Pending")
  [[tables.columns]]
  name = "server_status"
  column_type = "string"
  ocsf_field = "status_code"

  # Tier-2: physical location of the collection server appliance
  [[tables.columns]]
  name = "server_location"
  column_type = "string"

  # Tier-2: unique site identifier; numeric comparison operators supported
  [[tables.columns]]
  name = "site_id"
  column_type = "integer"

  # Tier-2: server model string (e.g. "MCS R340" or "R640")
  [[tables.columns]]
  name = "model"
  column_type = "string"

  # Tier-2: Ubuntu OS version string
  [[tables.columns]]
  name = "os_version"
  column_type = "string"

  # Tier-2: server serial number
  [[tables.columns]]
  name = "serial_number"
  column_type = "string"

  # Tier-2: count of network interfaces on the server
  [[tables.columns]]
  name = "num_of_interfaces"
  column_type = "integer"

  # Tier-2: data/management port IP address
  [[tables.columns]]
  name = "management_ip"
  column_type = "string"

  # Tier-2: iDRAC IP address
  [[tables.columns]]
  name = "idrac_ip"
  column_type = "string"

  # Tier-2: data/management port MAC address
  [[tables.columns]]
  name = "management_mac"
  column_type = "string"

  # Tier-2: days the server has been up; confirmed fractional (OpenAPI example: 667.233661)
  # BC-2.16.018 §PC2 uptime_days Float — CONFIRMED from xdome_openapi_06.20.2026.json
  [[tables.columns]]
  name = "uptime_days"
  column_type = "float"

  # Tier-2: avg traffic past month (Mbps)
  [[tables.columns]]
  name = "avg_traffic_past_month_mbps"
  column_type = "float"

  # Tier-2: avg traffic past week (Mbps)
  [[tables.columns]]
  name = "avg_traffic_past_week_mbps"
  column_type = "float"

  # Tier-2: avg traffic past hour (Mbps)
  [[tables.columns]]
  name = "avg_traffic_past_hour_mbps"
  column_type = "float"

  # Tier-2: count of open incidents associated with this server
  [[tables.columns]]
  name = "num_of_open_incidents"
  column_type = "integer"

  # Tier-2: free-text analyst notes
  [[tables.columns]]
  name = "notes"
  column_type = "string"

  # POST-for-read step with offset pagination
  # response_path: "$.servers" matches GetServersResponse envelope key (xDome OpenAPI 2026-06-20)
  # body_template: fields projection required by GetServersParameters; all 17 declared columns.
  #   OffsetLimit POST-body injection merges {"offset": N, "limit": 1000} at request time.
  # path_template: trailing slash per xDome API convention (S-DEMO-CLAROTY-TRAILING-SLASH-001).
  [[tables.steps]]
  name = "fetch_servers"
  method = "POST"
  path_template = "/api/v1/servers/"
  body_template = '{"fields": ["server_name", "server_location", "server_status", "site_id", "model", "os_version", "serial_number", "num_of_interfaces", "management_ip", "idrac_ip", "management_mac", "uptime_days", "avg_traffic_past_month_mbps", "avg_traffic_past_week_mbps", "avg_traffic_past_hour_mbps", "num_of_open_incidents", "notes"]}'
  response_path = "$.servers"
  variables_produced = []
  [tables.steps.pagination]
  type = "offset_limit"
  page_size = 1000

# ---------------------------------------------------------------------------
# Table: claroty_server_interfaces  (Wave C G4)
# SEPARATE endpoint: POST /api/v1/server_interfaces/ → envelope key: server_interfaces
# (NOT a sub-path of /api/v1/servers/; operationId: get_servers_api_v1_server_interfaces__post)
# OCSF class: inventory_info (class_uid 5001; existing arm; same as claroty_servers)
# Composite PK: (server_name, interface_name) — server_name REQUIRED; interface_name Tier-2
# DTU status: NONE — SAP-2 probe N/A per D-2200; near-term tests against live monroe only
# Tier-1: server_name → device_name (REQUIRED); interface_status → status_code
# Tier-2 (8 cols, incl. composite PK element interface_name): aggregate into raw_extensions
# ---------------------------------------------------------------------------
[[tables]]
table_name = "server_interfaces"
ocsf_class = "inventory_info"   # class_uid 5001 (existing arm; same as claroty_servers)

  # Tier-1: server_name → device_name (REQUIRED; composite PK anchor)
  [[tables.columns]]
  name = "server_name"
  column_type = "string"
  ocsf_field = "device.name"
  options = ["REQUIRED"]

  # Tier-1: interface_status → status_code ("Up" / "No Carrier")
  [[tables.columns]]
  name = "interface_status"
  column_type = "string"
  ocsf_field = "status_code"

  # Tier-2: composite PK join key — interface name (e.g. "eth0", "ens3")
  # No REQUIRED option per BC-2.16.019 §Invariants: null interface_name is degraded, not dropped
  [[tables.columns]]
  name = "interface_name"
  column_type = "string"

  # Tier-2: interface type ("SPAN" or "Management")
  [[tables.columns]]
  name = "interface_type"
  column_type = "string"

  # Tier-2: physical connection type ("SFP+" or "RJ45 (Copper)")
  [[tables.columns]]
  name = "interface_connection_type"
  column_type = "string"

  # Tier-2: unique site identifier for the site to which the interface belongs
  [[tables.columns]]
  name = "site_id"
  column_type = "integer"

  # Tier-2: avg traffic past month via this interface (Mbps)
  [[tables.columns]]
  name = "avg_traffic_past_month_mbps"
  column_type = "float"

  # Tier-2: avg traffic past week via this interface (Mbps)
  [[tables.columns]]
  name = "avg_traffic_past_week_mbps"
  column_type = "float"

  # Tier-2: avg traffic past hour via this interface (Mbps)
  [[tables.columns]]
  name = "avg_traffic_past_hour_mbps"
  column_type = "float"

  # Tier-2: free-text notes about the interface
  [[tables.columns]]
  name = "notes"
  column_type = "string"

  # POST-for-read step with offset pagination
  # response_path: "$.server_interfaces" matches GetServerInterfacesResponse envelope key.
  # body_template: fields projection required by GetServerInterfacesParameters; all 10 declared columns.
  #   OffsetLimit POST-body injection merges {"offset": N, "limit": 1000} at request time.
  # path_template: /api/v1/server_interfaces/ is SEPARATE from /api/v1/servers/ (endpoint correction
  #   confirmed from OpenAPI operationId get_servers_api_v1_server_interfaces__post).
  [[tables.steps]]
  name = "fetch_server_interfaces"
  method = "POST"
  path_template = "/api/v1/server_interfaces/"
  body_template = '{"fields": ["server_name", "interface_name", "interface_status", "interface_type", "interface_connection_type", "site_id", "avg_traffic_past_month_mbps", "avg_traffic_past_week_mbps", "avg_traffic_past_hour_mbps", "notes"]}'
  response_path = "$.server_interfaces"
  variables_produced = []
  [tables.steps.pagination]
  type = "offset_limit"
  page_size = 1000

