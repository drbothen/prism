# armis.sensor.toml — Production TOML sensor spec
#
# Authored per PLUGIN-MIGRATION-001-D Task 6.
# URLs grounded from DTU clone routes (ADR-028 §D1):
#   crates/prism-dtu-armis/src/clone.rs build_router()
# auth_type grounded from DTU enforcement (ADR-028 §D2):
#   crates/prism-dtu-armis/src/lib.rs module-level //! enforces
#   Authorization: Bearer {non-empty} with HTTP 403 on missing/invalid token.
# auth_type = "bearer_static" is the D-747 LOCKED value.
# NOTE: legacy ArmisAuth::auth_type_name() returned "api_key" — latent label bug
#   deleted by PLUGIN-MIGRATION-001-A. Spec follows DTU per CLAUDE.md §Source-of-Truth #7.
#
# DTU-EXT-003: devices table — DTU registers GET /api/v1/devices (not AQL /api/v1/search).
# DTU-EXT-004: alerts table — DTU registers GET /api/v1/alerts (not AQL /api/v1/search).
# Both tables are authored using DTU-registered endpoints per ADR-028 §D5.
# AQL forwarding via ${query.filter.aql} is documented per O-001 grammar support.
# Timestamp fallback chain (last_seen → first_seen → now()) is expressed via
# ColumnSpec::timestamp_fallback_chain = ["first_seen"] on the primary timestamp column per ADR-028 §D8-B.
# F-LP2-HIGH-004 (arch-handoff#1): chain is ["first_seen"] only — primary column is checked first
# by the normalization layer; self-referential entries yield the same absent value and are skipped
# by the defensive guard in normalize_timestamp_fields (pipeline.rs).
# A tracing::warn! with event_type = "timestamp.fallback_to_now" is emitted by the
# normalization layer when all chain fields are absent (BC-2.16.002 row 35).

sensor_id = "armis"
name = "Armis Centrix"
auth_type = "bearer_static"
base_url = "${env.ARMIS_INSTANCE_URL}"
version = "1.0.0"

# ---------------------------------------------------------------------------
# Table: devices
# DTU-EXT-003: DTU registers GET /api/v1/devices (not AQL /api/v1/search).
# Using DTU-registered endpoint. AQL forwarding via query.filter.aql supported
# when DTU-EXT-003 is resolved and /api/v1/search route is added.
# Timestamp fallback: lastSeen (primary) → firstSeen (fallback) → now() (WARN).
# Per ADR-028 v1.9 §D8-B: canonical chain is last_seen → first_seen → now().
# Expressed via timestamp_fallback_chain on the primary timestamp column.
# ---------------------------------------------------------------------------
[[tables]]
table_name = "devices"
ocsf_class = "device"

  # DeviceRecord fields per prism-dtu-armis/src/types.rs:
  # device_id (String), name, ip_address, mac_address, device_type, manufacturer,
  # os_name, os_version, risk_score, risk_factors, last_seen, first_seen, network_id, site, tags
  [[tables.columns]]
  name = "device_id"
  column_type = "string"
  ocsf_field = "device.uid"
  options = ["REQUIRED"]

  [[tables.columns]]
  name = "name"
  column_type = "string"
  ocsf_field = "device.name"

  [[tables.columns]]
  name = "type"
  column_type = "string"
  ocsf_field = "device.type"

  # DTU DeviceRecord.manufacturer: the device OEM (Cisco, HP, etc.) — NOT the CPU silicon vendor.
  # F-LP3-HIGH-002: corrected from copy-paste defect (was device.hw_info.cpu_vendor, semantically wrong).
  # OCSF device.hw_info.vendor_name is the hardware OEM vendor, distinct from cpu_vendor (CPU chip maker).
  [[tables.columns]]
  name = "manufacturer"
  column_type = "string"
  ocsf_field = "device.hw_info.vendor_name"

  # Primary timestamp column: last_seen (may be null per DTU fixture d-001).
  # timestamp_fallback_chain per ADR-028 v1.9 §D8-B (Option A LOCKED):
  #   last_seen → first_seen → DateTime::now() UTC with tracing::warn!(event_type = "timestamp.fallback_to_now")
  # DTU DeviceRecord: last_seen: Option<String> (primary), first_seen: Option<String> (secondary).
  # Fixture d-001 has last_seen: null + first_seen: "2024-01-15T10:00:00Z" to exercise fallback path.
  # F-LP2-HIGH-004 (arch-handoff#1): removed redundant "last_seen" entry from chain —
  #   the primary column is always checked first by normalize_timestamp_fields; a self-referential
  #   chain entry yields the same absent value already confirmed. Chain = ["first_seen"] only.
  #   The defensive skip guard in pipeline.rs still protects against accidental re-introduction.
  [[tables.columns]]
  name = "last_seen"
  column_type = "datetime"
  ocsf_field = "device.last_seen_time"
  timestamp_fallback_chain = ["first_seen"]

  # Secondary timestamp (fallback source — also stored as its own column for querying).
  [[tables.columns]]
  name = "first_seen"
  column_type = "datetime"
  ocsf_field = "device.first_seen_time"

  [[tables.columns]]
  name = "ip_address"
  column_type = "string"
  ocsf_field = "device.ip"

  [[tables.columns]]
  name = "mac_address"
  column_type = "string"
  ocsf_field = "device.mac_addr"

  [[tables.columns]]
  name = "os_name"
  column_type = "string"
  ocsf_field = "device.os.name"

  # DTU DeviceRecord.risk_score: Option<u32> — JSON integer 0–100.
  # F-LP3-HIGH-003: corrected from string (type mismatch; Arrow materialization would coerce/reject).
  # column_type = "integer" matches DTU u32 emission and prism_core::column::ColumnType::Integer (ADR-024).
  [[tables.columns]]
  name = "risk_score"
  column_type = "integer"
  ocsf_field = "risk_score"

  # DTU-EXT-003: DTU has GET /api/v1/devices (crates/prism-dtu-armis/src/clone.rs build_router()).
  # AQL forwarding via ${query.filter.aql} is supported when the caller populates
  # FetchContext.query_filters["aql"]. The DTU endpoint accepts an optional ?aql=
  # query parameter for filtering. Production AQL forwarding via /api/v1/search
  # is tracked under DTU-EXT-003.
  # response_path: DTU types.rs DevicesResponse { data: DevicesData { devices: [...] } }
  #   → must extract at $.data.devices (not $.data which returns the DevicesData object).
  # pagination: DTU routes::devices::paginate_devices uses page/size offset params
  #   (size.unwrap_or(25) default). No cursor/next field in response. Using OffsetLimit
  #   per CRIT-004 fix (ADR-028 §D1 DTU-grounded pagination type).
  [[tables.steps]]
  name = "fetch_devices"
  method = "GET"
  path_template = "/api/v1/devices"
  response_path = "$.data.devices"
  variables_produced = []
  [tables.steps.pagination]
  type = "offset_limit"
  page_size = 25

# ---------------------------------------------------------------------------
# Table: alerts
# DTU-EXT-004: DTU registers GET /api/v1/alerts (crates/prism-dtu-armis/src/clone.rs build_router()).
# Using DTU-registered endpoint per ADR-028 §D5.
# ---------------------------------------------------------------------------
[[tables]]
table_name = "alerts"
ocsf_class = "security_finding"

  # AlertRecord fields per prism-dtu-armis/src/types.rs:
  # alert_id (String), name (String), severity, status, policy_name, device_id, created_at, updated_at
  [[tables.columns]]
  name = "alert_id"
  column_type = "string"
  ocsf_field = "finding.uid"
  options = ["REQUIRED"]

  [[tables.columns]]
  name = "name"
  column_type = "string"
  ocsf_field = "message"

  [[tables.columns]]
  name = "severity"
  column_type = "string"
  ocsf_field = "severity"

  [[tables.columns]]
  name = "status"
  column_type = "string"
  ocsf_field = "status"

  [[tables.columns]]
  name = "policy_name"
  column_type = "string"
  ocsf_field = "type_name"

  [[tables.columns]]
  name = "device_id"
  column_type = "string"
  ocsf_field = "device.uid"

  [[tables.columns]]
  name = "created_at"
  column_type = "datetime"
  ocsf_field = "time"

  [[tables.columns]]
  name = "updated_at"
  column_type = "datetime"
  ocsf_field = "end_time"

  # DTU-EXT-004: DTU has GET /api/v1/alerts (crates/prism-dtu-armis/src/clone.rs build_router()).
  # response_path: DTU types.rs AlertsResponse { data: AlertsData { alerts: [...] } }
  #   → must extract at $.data.alerts (not $.data which returns the AlertsData object).
  # pagination: DTU uses offset-based pagination (consistent with devices endpoint).
  #   No cursor/next field in AlertsResponse. Using OffsetLimit per CRIT-003/004 fix.
  [[tables.steps]]
  name = "fetch_alerts"
  method = "GET"
  path_template = "/api/v1/alerts"
  response_path = "$.data.alerts"
  variables_produced = []
  [tables.steps.pagination]
  type = "offset_limit"
  page_size = 25
