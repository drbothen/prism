# armis.sensor.toml — Production TOML sensor spec
#
# Authored per PLUGIN-MIGRATION-001-D Task 6.
# URLs grounded from DTU clone routes (ADR-028 §D1):
#   crates/prism-dtu-armis/src/clone.rs build_router()
# auth_type grounded from DTU enforcement (ADR-028 §D2) — historical provenance only:
#   prism-dtu-armis crate module-level //! enforces Authorization: Bearer {non-empty}
#   with HTTP 403 on missing/invalid token (remains true at DTU level).
# D-747 lock SUPERSEDED by ADR-053 §D2, effective 2026-07-22 (D-1943).
# Declared value "bearer_static" is the pre-supersession value — known-stale-but-intentional;
# ratified target per ADR-053 §D2 + ADR-054 is auth_type = "token_exchange" backed by
# DeclarativeHttpAuthProvider with [auth_acquisition] block and header_scheme = "raw".
# Value change sequenced behind story S-ARMIS-AUTH-FIDELITY-001.
# NOTE: legacy ArmisAuth::auth_type_name() returned "api_key" — latent label bug
#   deleted by PLUGIN-MIGRATION-001-A. Spec follows DTU per CLAUDE.md §Source-of-Truth #7.
#
# DTU-EXT-003: CLOSED by S-DEMO-ARMIS-AQL-001. devices table now uses GET /api/v1/search
#   (the real Armis Centrix AQL endpoint per ADR-031 §D8-a). Back-compat: GET /api/v1/devices
#   remains registered in build_router() but is no longer the primary path.
# DTU-EXT-004: CLOSED by S-DEMO-ARMIS-AQL-001. alerts table now uses GET /api/v1/search.
#   Back-compat: GET /api/v1/alerts remains registered in build_router().
# AQL forwarding via ${query.filter.aql} is documented per O-001 grammar support.
# Timestamp fallback chain (last_seen → first_seen → now()) is expressed via
# ColumnSpec::timestamp_fallback_chain = ["first_seen"] on the primary timestamp column per ADR-028 §D8-B.
# F-LP2-HIGH-004 (arch-handoff#1): chain is ["first_seen"] only — primary column is checked first
# by the normalization layer; self-referential entries yield the same absent value and are skipped
# by the defensive guard in normalize_timestamp_fields (pipeline.rs).
# A tracing::warn! with event_type = "timestamp.fallback_to_now" is emitted by the
# prism-spec-engine pipeline normalization pass (normalize_timestamp_fields in
# crates/prism-spec-engine/src/pipeline.rs, invoked by PipelineExecutor for every
# table fetch) when all chain fields are absent (BC-2.16.002 row 35). There is no
# Armis-specific adapter emission — the legacy ArmisAdapter was deleted by
# PLUGIN-MIGRATION-001-A. Engagement for THIS spec is pinned by the pipeline unit
# test test_f11_sns04_armis_devices_last_seen_fallback_engages (loads this file).

sensor_id = "armis"
# probe_table: table routed to by LIMIT-0 health probe (BC-2.08.001 postcondition 5 / S-5.04 AC-10).
probe_table = "devices"
name = "Armis Centrix"
auth_type = "bearer_static"
base_url = "${env.ARMIS_INSTANCE_URL}"
version = "1.0.0"

# ---------------------------------------------------------------------------
# Credential references (ADV-SDEMO002-P01-CRIT-001 fix)
# ---------------------------------------------------------------------------
# BC-2.06.003 resolution chain: ARMIS_BEARER_TOKEN_FILE > ARMIS_BEARER_TOKEN > keyring.
# BearerStaticCredentialAuthProvider resolves "bearer_token" at acquire_token() time.
[[credential_refs]]
name = "bearer_token"

# ---------------------------------------------------------------------------
# Table: devices
# DTU-EXT-003: CLOSED by S-DEMO-ARMIS-AQL-001. Primary path is GET /api/v1/search
#   with ?aql=${query.filter.aql} (real Armis Centrix AQL endpoint, ADR-031 §D8-a).
#   response_path: $.data.results (SearchResponse { data: SearchData { results: [...] } }).
#   GET /api/v1/devices remains registered in build_router() for back-compat only.
# Timestamp fallback: lastSeen (primary) → firstSeen (fallback) → now() (WARN).
# Per ADR-028 v1.10 §D8-B: canonical chain is last_seen → first_seen → now().
# Expressed via timestamp_fallback_chain on the primary timestamp column.
# ---------------------------------------------------------------------------
[[tables]]
table_name = "devices"
ocsf_class = "device"

  # DeviceRecord fields per prism-dtu-armis/src/types.rs:
  # device_id (String), name, ip_address, mac_address, device_type, manufacturer,
  # os_name, os_version, risk_score, risk_factors, last_seen, first_seen, network_id, site, tags
  [[tables.columns]]
  name = "device_id"
  column_type = "string"
  ocsf_field = "device.uid"
  options = ["REQUIRED"]

  [[tables.columns]]
  name = "name"
  column_type = "string"
  ocsf_field = "device.name"

  [[tables.columns]]
  name = "type"
  column_type = "string"
  ocsf_field = "device.type"

  # DTU DeviceRecord.manufacturer: the device OEM (Cisco, HP, etc.) — NOT the CPU silicon vendor.
  # F-LP3-HIGH-002: corrected from copy-paste defect (was device.hw_info.cpu_vendor, semantically wrong).
  # OCSF device.hw_info.vendor_name is the hardware OEM vendor, distinct from cpu_vendor (CPU chip maker).
  [[tables.columns]]
  name = "manufacturer"
  column_type = "string"
  ocsf_field = "device.hw_info.vendor_name"

  # Primary timestamp column: last_seen (may be null per DTU fixture d-001).
  # timestamp_fallback_chain per ADR-028 v1.10 §D8-B (Option A LOCKED):
  #   last_seen → first_seen → Utc::now() with tracing::warn!(event_type = "timestamp.fallback_to_now")
  # The whole chain (including the now() fallback + warn emission) is executed by the
  # prism-spec-engine pipeline normalization pass (normalize_timestamp_fields,
  # crates/prism-spec-engine/src/pipeline.rs) — NOT by any Armis-specific adapter; the
  # legacy ArmisAdapter was deleted by PLUGIN-MIGRATION-001-A. Engagement for this
  # column is pinned by test_f11_sns04_armis_devices_last_seen_fallback_engages.
  # DTU DeviceRecord: last_seen: Option<String> (primary), first_seen: Option<String> (secondary).
  # Fixture d-001 has last_seen: null + first_seen: "2024-01-15T10:00:00Z" to exercise fallback path.
  # F-LP2-HIGH-004 (arch-handoff#1): removed redundant "last_seen" entry from chain —
  #   the primary column is always checked first by normalize_timestamp_fields; a self-referential
  #   chain entry yields the same absent value already confirmed. Chain = ["first_seen"] only.
  #   The defensive skip guard in pipeline.rs still protects against accidental re-introduction.
  # options = ["INDEX"]: push-down-eligible datetime column. Required for extract_time_window_from_ast
  #   (ADR-033 T1) to identify last_seen as an Armis AQL augmentation candidate (AC-INDEX-001).
  [[tables.columns]]
  name = "last_seen"
  column_type = "datetime"
  ocsf_field = "device.last_seen_time"
  options = ["INDEX"]
  timestamp_fallback_chain = ["first_seen"]

  # Secondary timestamp (fallback source — also stored as its own column for querying).
  [[tables.columns]]
  name = "first_seen"
  column_type = "datetime"
  ocsf_field = "device.first_seen_time"

  [[tables.columns]]
  name = "ip_address"
  column_type = "string"
  ocsf_field = "device.ip"

  [[tables.columns]]
  name = "mac_address"
  column_type = "string"
  ocsf_field = "device.mac_addr"

  [[tables.columns]]
  name = "os_name"
  column_type = "string"
  ocsf_field = "device.os.name"

  # DTU DeviceRecord.risk_score: Option<u32> — JSON integer 0–100.
  # F-LP3-HIGH-003: corrected from string (type mismatch; Arrow materialization would coerce/reject).
  # column_type = "integer" matches DTU u32 emission and prism_core::column::ColumnType::Integer (ADR-024).
  [[tables.columns]]
  name = "risk_score"
  column_type = "integer"
  ocsf_field = "risk_score"

  # BC-2.11.007 §Mechanism B — Verbatim-AQL Passthrough (Armis only).
  # The user supplies the AQL string as a pseudo-column literal: WHERE aql = 'in:devices'.
  # The query planner seeds the verbatim string into FetchContext.query_filters["aql"] via
  # predicate_tree_to_filter_map → QueryParams.filters["aql"] (extract_push_down_filters_as_map).
  # PipelineExecutor interpolates ${query.filter.aql} into the path_template below.
  # options = ["INDEX"]: pushdown-eligible; triggers canonical seeding path in prism-query.
  # column_type = "string": the AQL string is passed verbatim as a query parameter.
  # No ocsf_field: aql is a push-down pseudo-column, not a data column in the OCSF output.
  # S-DEMO-002 AC-014 / D-934 scope.
  [[tables.columns]]
  name = "aql"
  column_type = "string"
  options = ["INDEX"]

  # S-DEMO-ENRICHMENT-PIVOT-003: device_cves_first column declaration (U17/Ruling 1b).
  # The generator projection (stamping the first element of catalog.device_cves as a scalar)
  # was wired in S-DEMO-ENRICHMENT-PIVOT-003 (F-PIVOT003-R2-002), not STORY-002.
  # column_type = "string": CVE IDs are strings (e.g. "CVE-2024-12345").
  # Used as the input field for `| enrich nvd(device_cves_first)` enrichment pipe stage.
  # NOTE: `device_cves[0]` bracket-index is NOT supported by FieldPath — scalar field only.
  [[tables.columns]]
  name = "device_cves_first"
  column_type = "string"
  ocsf_field = "vulnerabilities.first_cve_id"

  # DTU-EXT-003: CLOSED by S-DEMO-ARMIS-AQL-001.
  # Primary path is now GET /api/v1/search?aql=in:devices (real Armis Centrix AQL endpoint,
  # ADR-031 §D8-a). `in:devices` is the real Armis entity discriminator (research artifact
  # 2026-06-01; grounded from 1898 production poller + 3 independent external connectors).
  # GET /api/v1/devices remains registered in build_router() for back-compat but is not the
  # primary path.
  # response_path: routes/search.rs SearchResponse { data: SearchData { results: [...], total } }
  #   → must extract at $.data.results (not $.data.devices — search envelope uses "results").
  # AQL forwarding via ${query.filter.aql}: the ?aql= query param carries the AQL filter string.
  # pagination: DTU search handler applies same page/size offset logic as paginate_devices.
  #   (size.unwrap_or(25) default). No cursor/next field in response. OffsetLimit maintained.
  [[tables.steps]]
  name = "fetch_devices"
  method = "GET"
  path_template = "/api/v1/search?aql=${query.filter.aql}"
  response_path = "$.data.results"
  variables_produced = []
  [tables.steps.pagination]
  type = "offset_limit"
  page_size = 25

# ---------------------------------------------------------------------------
# Table: alerts
# DTU-EXT-004: CLOSED by S-DEMO-ARMIS-AQL-001. Primary path is GET /api/v1/search
#   with ?aql=${query.filter.aql} (real Armis Centrix AQL endpoint, ADR-031 §D8-a).
#   response_path: $.data.results (SearchResponse { data: SearchData { results: [...] } }).
#   GET /api/v1/alerts remains registered in build_router() for back-compat only.
# ---------------------------------------------------------------------------
[[tables]]
table_name = "alerts"
ocsf_class = "detection_finding"

  # AlertRecord fields per prism-dtu-armis/src/types.rs:
  # alert_id (String), name (String), severity, status, policy_name, device_id, created_at, updated_at
  [[tables.columns]]
  name = "alert_id"
  column_type = "string"
  ocsf_field = "finding.uid"
  options = ["REQUIRED"]

  [[tables.columns]]
  name = "name"
  column_type = "string"
  ocsf_field = "message"

  [[tables.columns]]
  name = "severity"
  column_type = "string"
  ocsf_field = "severity"

  [[tables.columns]]
  name = "status"
  column_type = "string"
  ocsf_field = "status"

  [[tables.columns]]
  name = "policy_name"
  column_type = "string"
  ocsf_field = "type_name"

  [[tables.columns]]
  name = "device_id"
  column_type = "string"
  ocsf_field = "device.uid"

  # options = ["INDEX"]: push-down-eligible datetime column. Required for extract_time_window_from_ast
  # (ADR-033 T1) to identify created_at as an Armis AQL augmentation candidate (AC-INDEX-001).
  [[tables.columns]]
  name = "created_at"
  column_type = "datetime"
  ocsf_field = "time"
  options = ["INDEX"]

  [[tables.columns]]
  name = "updated_at"
  column_type = "datetime"
  ocsf_field = "end_time"

  # BC-2.11.007 §Mechanism B — Verbatim-AQL Passthrough (Armis alerts table).
  # Same push-down convention as devices table: WHERE aql = 'in:alerts status:Open'.
  # The query planner seeds the verbatim AQL string into FetchContext.query_filters["aql"]
  # via predicate_tree_to_filter_map → QueryParams.filters["aql"].
  # options = ["INDEX"]: pushdown-eligible; canonical seeding path in prism-query.
  # No ocsf_field: aql is a push-down pseudo-column, not a data column in the OCSF output.
  [[tables.columns]]
  name = "aql"
  column_type = "string"
  options = ["INDEX"]

  # DTU-EXT-004: CLOSED by S-DEMO-ARMIS-AQL-001.
  # Primary path is now GET /api/v1/search?aql=in:alerts (real Armis Centrix AQL endpoint,
  # ADR-031 §D8-a). `in:alerts` is the real Armis entity discriminator (research artifact
  # 2026-06-01; grounded from 1898 production poller default `in:alerts status:Open`).
  # GET /api/v1/alerts remains registered in build_router() for back-compat but is not
  # the primary path.
  # response_path: routes/search.rs SearchResponse { data: SearchData { results: [...], total } }
  #   → must extract at $.data.results (not $.data.alerts — search envelope uses "results").
  # AQL forwarding via ${query.filter.aql}: the ?aql= query param carries the AQL filter string.
  # pagination: DTU search handler applies same page/size offset logic as alerts endpoint.
  #   No cursor/next field in response. OffsetLimit maintained per CRIT-003/004 fix.
  [[tables.steps]]
  name = "fetch_alerts"
  method = "GET"
  path_template = "/api/v1/search?aql=${query.filter.aql}"
  response_path = "$.data.results"
  variables_produced = []
  [tables.steps.pagination]
  type = "offset_limit"
  page_size = 25
