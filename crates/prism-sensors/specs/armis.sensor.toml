# armis.sensor.toml — Armis Centrix sensor spec skeleton
#
# STUB: This is a minimal skeleton authored by the test-writer as part of the
# PLUGIN-MIGRATION-001-D Red Gate scaffolding. The implementer (Task 6) is
# responsible for filling this out with production-grade field values.
#
# auth_type = "bearer_static" is grounded from DTU enforcement (ADR-028 §D2):
#   crates/prism-dtu-armis/src/lib.rs module-level //! doc enforces
#   Authorization: Bearer {non-empty} with HTTP 403 on missing/invalid token.
#   The legacy ArmisAuth::auth_type_name() returned "api_key" — latent label bug
#   deleted by PLUGIN-MIGRATION-001-A. Spec follows DTU per CLAUDE.md §Source-of-Truth #7.
#
# URLs grounded from crates/prism-dtu-armis/src/clone.rs build_router() (ADR-028 §D1).
#
# timestamp_fallback_chain (firstSeen → lastSeen → DateTime::now()) is NOT supported
# in TOML grammar (O-001 Task 1 findings). Implementer must choose Option A (grammar
# extension) or Option B (WASM plugin). See story Task 1 and Task 6.
#
# DTU-EXT-003 gap: DTU has GET /api/v1/devices (line 143), NOT /api/v1/search with AQL.
# DTU-EXT-004 gap: DTU has GET /api/v1/alerts (line 150), NOT /api/v1/search with AQL.
# Both tables are authored with DTU-registered endpoints per ADR-028 §D5.
# Parity tests are #[ignore]-tagged per EC-016-013-006 until DTU extension merges.
#
# Required by AC-004: sensor_id must match filename stem "armis" per BC-2.16.001 v1.5

sensor_id = "armis"
name = "Armis Centrix"
auth_type = "bearer_static"
base_url = "https://armis.example.com"
version = "1.0.0"

# ---------------------------------------------------------------------------
# Table: devices — DTU-EXT-003 gap
# DTU clone.rs line 143 registers GET /api/v1/devices, NOT /api/v1/search with AQL.
# Per ADR-028 §D5: spec uses DTU-registered endpoint; gap vs AQL-search documented.
# AQL forwarding via ${query.filter.aql} presupposes DTU-EXT-003 resolution.
# STUB: Column schema and AQL forwarding to be filled by implementer (Task 6)
# ---------------------------------------------------------------------------
[[tables]]
table_name = "devices"
ocsf_class = "device_inventory"

  [[tables.columns]]
  name = "id"
  column_type = "string"
  options = ["REQUIRED"]

  [[tables.columns]]
  name = "first_seen"
  column_type = "datetime"
  ocsf_field = "time"

  [[tables.steps]]
  name = "fetch_devices"
  method = "GET"
  path_template = "/api/v1/devices"
  response_path = "$.data"
  variables_produced = []

# ---------------------------------------------------------------------------
# Table: alerts — DTU-EXT-004 gap
# DTU clone.rs line 150 registers GET /api/v1/alerts, NOT /api/v1/search with AQL.
# Per ADR-028 §D5: spec uses DTU-registered endpoint; gap vs AQL-search documented.
# STUB: Column schema to be filled by implementer (Task 6)
# ---------------------------------------------------------------------------
[[tables]]
table_name = "alerts"
ocsf_class = "security_finding"

  [[tables.columns]]
  name = "id"
  column_type = "string"
  options = ["REQUIRED"]

  [[tables.columns]]
  name = "timestamp"
  column_type = "datetime"
  ocsf_field = "time"

  [[tables.steps]]
  name = "fetch_alerts"
  method = "GET"
  path_template = "/api/v1/alerts"
  response_path = "$.data"
  variables_produced = []
