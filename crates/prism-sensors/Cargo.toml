[package]
name = "prism-sensors"
version = "0.2.0"
edition = "2021"
description = "Prism sensor adapter framework: SensorAdapter trait, AdapterRegistry, fan-out orchestrator, retry, and HTTP semaphore (S-2.06)"
license = "MIT"
publish = false

[lib]
name = "prism_sensors"

[dependencies]
prism-core = { path = "../prism-core" }
# S-3.07 — write() method needs WriteEndpointSpec for HTTP step dispatch.
prism-spec-engine = { path = "../prism-spec-engine" }
prism-storage = { path = "../prism-storage" }

async-trait = "0.1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync"] }
tokio-util = { version = "0.7", features = ["rt"] }
futures = "0.3"
reqwest = { version = "0.12", features = ["json", "rustls-tls", "http2"], default-features = false }
rand = "0.8"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["serde", "v4"] }
arrow = { version = "58", features = ["ipc"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
tracing = "0.1"

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
wiremock = "0.6"
# S-CLAROTY-VULNS-001 RG-007: PipelineExecutor tests need NullAuthProvider
# (gated by test-helpers feature; NEVER enable in production deps per the feature doc-comment).
prism-spec-engine = { path = "../prism-spec-engine", features = ["test-helpers"] }
futures = "0.3"
prism-storage = { path = "../prism-storage", version = "0.1.0", features = ["test-utils"] }
proptest = "1"
tempfile = "3"
# F-PR3-HIGH-001: end-to-end FanOutTarget DTU routing isolation test.
# Permitted dep direction: prism-sensors [dev-dep] → prism-dtu-harness (NOT the reverse).
# prism-dtu-harness does NOT depend on prism-sensors — no dep cycle.
prism-dtu-harness = { path = "../prism-dtu-harness", features = ["dtu"] }
prism-dtu-armis = { path = "../prism-dtu-armis", features = ["dtu"] }
prism-dtu-common = { path = "../prism-dtu-common", features = ["dtu"] }
# RG-004: fan_out_target_failed WARN emission test requires tracing-test to capture log events.
# DEFECT-ADAPTER-TLS-XDOME-LIVE-001 RG-004 | BC-2.08.002
tracing-test = "0.2"
# MED-1a: WarnCaptureLayer for counting/field-level assertions on RG-004 WARN emissions.
# tracing_subscriber::Layer used to count fan_out_target_failed WARNs per target exactly.
tracing-subscriber = { version = "0.3", features = ["std"] }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(kani)'] }
non_snake_case = "allow"

[lints.clippy]
await_holding_lock = "deny"
unwrap_used = "deny"
expect_used = "deny"
