# crowdstrike-oauth2 plugin manifest
#
# BC-2.17.007 required fields: format_version, name, version, plugin_type, allowed_urls.
# plugin_id is derived from `name` by PluginRuntime::load_all_plugins manifest parser.
#
# Story: PLUGIN-MIGRATION-001-E
# Traces to: BC-2.17.007 §Postcondition, BC-2.01.016 §INV-AUTH-OPEN-003 Rule A

name = "crowdstrike-oauth2"
version = "0.1.0"
format_version = 1
plugin_type = "sensor_auth"

# allowed_urls: explicit Vec<String> per PREREQ-D AC-7 default-deny semantics.
# Production: api.crowdstrike.com (OAuth2 token endpoint).
# Test: localhost (DTU clone token endpoint).
# Empty list would block ALL outbound HTTP — this plugin requires the OAuth2 endpoint.
allowed_urls = ["api.crowdstrike.com", "localhost"]
