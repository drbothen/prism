[package]
name = "prism-spec-engine"
version = "0.9.0"
edition = "2024"
license = "MIT"
publish = false
description = "Prism config-driven sensor adapter engine: TOML spec loading, pipeline execution, OCSF mapping, infusion enrichment framework, WASM plugin runtime (S-1.15), and hot reload + runtime management (S-1.12)"

# ARCHITECTURE COMPLIANCE: prism-spec-engine MUST NOT depend on datafusion or arrow.
# Any addition of those deps MUST fail CI lint (cargo deny or equivalent).
# See architecture/module-decomposition.md SS-16; AD-015.

[dependencies]
prism-core = { path = "../prism-core", version = "0.2.0" }
# ADR-028 §D11 Option C: credential resolution at dispatch time (PLUGIN-MIGRATION-001-E).
# PluginAuthProvider calls resolve_credential(org, sensor_id, "client_id") + "client_secret"
# before injecting into PluginConfigMap. PRODUCTION dep (not test-only).
prism-credentials = { path = "../prism-credentials" }
# secrecy: expose_secret() at the PluginConfigMap boundary (AD-017).
# Credential bytes are NOT retained across the dispatch call frame.
secrecy = { version = "0.8" }
serde = { version = "1", features = ["derive"] }
toml = "0.8"
percent-encoding = "2"
thiserror = "1"
serde_json = "1"
regex = "1"
arc-swap = "1"
sha2 = "0.10"
# S-PLUGIN-PREREQ-D AC-15: AuthToken zeroize-on-drop (TD-S-PLUGIN-PREREQ-B-002 / AD-017).
# Wraps AuthToken inner field in Zeroizing<String> so credential bytes are overwritten on drop.
zeroize = "1"
# S-PLUGIN-PREREQ-D AC-7: host_http_request allowlist enforcement uses url::Url::parse
# for host-only extraction (prevents substring bypass via query params).
url = "2"
hex = "0.4"
# uuid v7 for time-ordered confirmation tokens (TD-S112-001)
uuid = { version = "1", features = ["v7"] }
lru = "0.17"
# S-1.14-REDO: MaxMind MMDB GeoIP reader for MmdbSource (BC-2.19.001 / AC-1).
# 0.28 API returns LookupResult<'_, T> from lookup() — NOT bare T (see story Task 4).
maxminddb = "0.28"
# S-1.14-REDO: CSV file-backed source for CsvSource (BC-2.19.001 / AC-7).
# Use csv::ReaderBuilder::new().has_headers(true).from_path(path) pattern.
csv = "1.4"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync"] }
tracing = "0.1"

# WASM Plugin Runtime (S-1.15 / SS-17 / AD-019)
# wasmtime 47 resolves 17 RUSTSEC advisories (RUSTSEC-2024-0438 through RUSTSEC-2026-0096)
# and additionally clears RUSTSEC-2026-0222 (epoch-ticker use-after-free via two Engine
# instances). No 44.x patch exists — bump to 47 is the only resolution.
# S-WASMTIME-RUSTSEC-2026-0222-001 / HUMAN AUTHORIZED 2026-07-31.
wasmtime = { version = "47", features = ["component-model", "cache"] }
semver = "1"
# notify: cross-platform filesystem event watcher (AD-018 / S-1.12 / S-1.15)
notify = "7"
reqwest = { version = "0.12", features = ["json", "rustls-tls", "gzip", "deflate", "brotli"], default-features = false }
bincode = { version = "2", features = ["serde"] }
anyhow = "1"
# ADR-028 §D8-B/C — multi-format timestamp parsing in PipelineExecutor normalization
# F-LP3-MEDIUM-002: default-features=false to control build surface.
#   "clock" provides DateTime::now() UTC (Option A fallback timestamp).
#   "serde" provides Serialize/Deserialize derive.
#   Excludes default-on "std" (redundant for our use), "iana-time-zone" (bloat).
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }

[dev-dependencies]
# async-trait: used in crowdstrike_oauth2_plugin_tests.rs for NullTestOrgIdStore stub
# implementing CredentialStoreOrgId (ADR-034 §D5 Red Gate sibling sweep).
async-trait = "0.1"
# Self-referential dep to enable test-helpers feature for integration test binaries.
# Integration tests (tests/*.rs) link against the library and use NullAuthProvider /
# MockAuthProvider — they are NOT under cfg(test) in the lib, so the feature must
# be enabled explicitly. NEVER add test-helpers to [dependencies].
prism-spec-engine = { path = ".", features = ["test-helpers"] }
proptest = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
wat = "1"
tempfile = "3"
# S-PLUGIN-PREREQ-B: wiremock for VP-PLUGIN-002 and VP-PLUGIN-005 integration tests.
# Version pinned to match prism-sensors usage (R-PB-006 known gap, now resolved).
wiremock = "0.6"
# flate2: gzip compression for F-LP5-MED-001 regression test (encode mock gzip response bodies).
flate2 = "1"
# tracing-subscriber: structured log capture for audit-log regression tests.
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# tracing-test: span/log capture for AC-009 WARN log assertion (S-DEMO-ENRICHMENT-PIVOT-002).
tracing-test = "0.2"
# PLUGIN-MIGRATION-001-D: DTU clones as dev-dependencies for parity tests (Task 10).
# Production dep FORBIDDEN — these are test-infrastructure crates only (§Forbidden Dependencies).
# Architecture compliance: prism-spec-engine MUST NOT have production deps on DTU crates.
prism-dtu-crowdstrike = { path = "../prism-dtu-crowdstrike", features = ["dtu"] }
prism-dtu-claroty = { path = "../prism-dtu-claroty", features = ["dtu"] }
prism-dtu-cyberint = { path = "../prism-dtu-cyberint", features = ["dtu"] }
prism-dtu-armis = { path = "../prism-dtu-armis", features = ["dtu"] }
prism-dtu-common = { path = "../prism-dtu-common", features = ["dtu"] }

[features]
default = []
# Exposes NullAuthProvider + MockAuthProvider for downstream test crates.
# NEVER enable in production deps — these types bypass real auth.
test-helpers = []

# ADR-024 — ColumnType shadow enum retirement.
# prism_spec_engine::types::ColumnType was a locally-defined shadow enum.
# It has been replaced by `pub use prism_core::column::ColumnType` which preserves
# the same public import path (prism_spec_engine::types::ColumnType and
# prism_spec_engine::ColumnType are still fully importable and type-identical).
# cargo-semver-checks v0.47 fires `enum_missing` because the rustdoc item of kind
# `enum` is gone from this crate's JSON even though the path is preserved via re-export.
# This is an intentional, ADR-024-directed breaking change with path-stability preserved.
#
# `enum_marked_non_exhaustive = "allow"`: PluginType was added with `#[non_exhaustive]`
# in PLUGIN-MIGRATION-001-E per CLAUDE.md §Conventions — all pub-API surface enums require
# `#[non_exhaustive]`. cargo-semver-checks v0.47 flags adding `#[non_exhaustive]` to an
# existing enum as a semver-breaking change. This is intentional project policy: downstream
# crates MUST use wildcard match arms when pattern-matching on PluginType (enforced via
# the non-exhaustive-violation compile-fail gate). The semver lint is suppressed here
# because the breaking change is required by convention and is tracked in the gate.
#
# `constructible_struct_adds_field = "allow"`: LoadedPlugin gained `kv_store` in
# PLUGIN-MIGRATION-001-E (F-LP1-CRIT-001). With `#[non_exhaustive]` now applied to
# LoadedPlugin (CLAUDE.md §Conventions), external struct-literal construction was already
# prevented. The semver lint is suppressed because the struct is now `#[non_exhaustive]`
# and external callers must use `PluginRuntime::load_plugin()` (not struct literals).
#
# `struct_marked_non_exhaustive = "allow"`: Adding `#[non_exhaustive]` to LoadedPlugin
# is flagged by cargo-semver-checks as a breaking change (previously, external struct-literal
# construction was possible for a public struct with no private fields). This is intentional
# project policy per CLAUDE.md §Conventions — all pub-API surface types require
# `#[non_exhaustive]`. The breaking change prevents external struct-literal construction,
# which was never intended as part of the public API (LoadedPlugin should only be obtained
# via PluginRuntime::load_plugin()). Suppressed alongside constructible_struct_adds_field.
[package.metadata.cargo-semver-checks.lints]
enum_missing = "allow"
enum_marked_non_exhaustive = "allow"
constructible_struct_adds_field = "allow"
struct_marked_non_exhaustive = "allow"

[lints.rust]
# Allow #[cfg(kani)] without a registered cfg — kani is not a Cargo feature
# kani is invoked via `cargo kani` which sets cfg(kani) automatically.
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(kani)'] }
# Test functions use BC-ID naming convention; cannot modify.
non_snake_case = "allow"

[lints.clippy]
# From workspace lints
await_holding_lock = "deny"
# Test files use .unwrap()/.unwrap_err() by design — test-writer generated them.
unwrap_used = "allow"

