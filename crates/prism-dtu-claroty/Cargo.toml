[package]
name = "prism-dtu-claroty"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false
description = "L4-adversarial behavioral clone of the Claroty xDome API"

[lib]
name = "prism_dtu_claroty"

[features]
dtu = []
# chrono under fixture-gen: time_anchor threading (review-2026-06-10 P1-01/P1-02).
fixture-gen = ["prism-dtu-common/fixture-gen", "dep:rand", "dep:chrono"]
tls = ["dep:axum-server", "prism-dtu-common/tls"]

[dependencies]
prism-dtu-common = { path = "../prism-dtu-common", version = "0.1.0", features = ["dtu"] }
rand = { version = "0.8", optional = true }
chrono = { version = "0.4", features = ["serde"], optional = true }
prism-core = { path = "../prism-core" }
axum-server = { version = "0.7", features = ["tls-rustls"], optional = true }
axum = "0.7"
tokio = { version = "1", features = ["full"] }
tower = "0.4"
# tower-http 0.5 — matches prism-dtu-common pin (crates/prism-dtu-common/Cargo.toml line 30).
# normalize-path feature provides NormalizePathLayer::trim_trailing_slash() for BC-2.16.013.
tower-http = { version = "0.5", features = ["normalize-path"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
async-trait = "0.1"
http = "1"
anyhow = "1"
tracing = "0.1"
uuid = { version = "1", features = ["v4"] }
subtle = "2"

[dev-dependencies]
jsonschema = "0.26"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
chrono = { version = "0.4", features = ["serde"] }
rand = "0.8"
rand_chacha = "0.3"
proptest = "1"
prism-core = { path = "../prism-core" }
prism-dtu-common = { path = "../prism-dtu-common", version = "0.1.0", features = ["fixture-gen"] }
prism-dtu-harness = { path = "../prism-dtu-harness", features = ["dtu"] }

[[test]]
name = "bc_3_4_claroty_generator"
path = "tests/bc_3_4_claroty_generator.rs"
required-features = ["fixture-gen"]

[[test]]
name = "review_2026_06_10_p1_02_timestamps"
path = "tests/review_2026_06_10_p1_02_timestamps.rs"
required-features = ["fixture-gen"]

# 2026-06-10 review cascade pass-2: P2-01 generator↔TOML↔static-fixture shape
