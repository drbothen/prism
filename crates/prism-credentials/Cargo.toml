[package]
name = "prism-credentials"
version = "0.1.0"
edition = "2021"
description = "Credential store trait, backends, CRUD, resolution, secret redaction, and audit logging for Prism"
license = "MIT"
publish = false

[lib]
name = "prism_credentials"

[features]
# test-helpers: exposes InMemoryCredentialStore for integration test trait-double injection.
# NEVER enable in production builds. Used by:
#   - prism-credentials/tests/bc_2_06_003_tier3_keyring_resolution.rs (RG-034-001, RG-034-002)
#   - prism-bin/tests/bc_2_03_007_credential_set_org_id_keyed.rs (RG-034-004)
# SID-1 compliance: provides in-process unit coverage for OS-keyring-dependent behaviors
# that cannot be tested via #[ignore]'d real-keyring integration tests in CI.
test-helpers = []

[dependencies]
prism-core = { path = "../prism-core" }

async-trait = "0.1"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"

# Secret/zeroize
secrecy = { version = "0.8", features = ["serde"] }
zeroize = { version = "1", features = ["derive"] }

# Keyring backend (keyring-rs 3.x)
keyring = "3"

# AES-256-GCM encryption (used by EncryptedFileBackend in file.rs)
aes-gcm = "0.10"

# Key derivation — Argon2id per BC-2.03.003 v1.4
argon2 = "0.5"

# Nonce / salt generation
rand = "0.8"

# chrono for timestamps
chrono = { version = "0.4", features = ["serde"] }

# uuid v7 for time-ordered confirmation tokens (TD-S-1.07-02)
uuid = { version = "1", features = ["v7"] }

[dev-dependencies]
proptest = "1"
tempfile = "3"
tokio = { version = "1", features = ["full"] }
secrecy = { version = "0.8", features = ["serde"] }
chrono = { version = "0.4", features = ["serde"] }
prism-core = { path = "../prism-core" }
uuid = { version = "1", features = ["v7"] }

[[test]]
name = "bc_2_03_005_credential_crud"
path = "tests/bc_2_03_005_credential_crud.rs"

[[test]]
name = "bc_2_03_006_credential_resolution"
path = "tests/bc_2_03_006_credential_resolution.rs"

[[test]]
name = "bc_2_03_007_secret_redaction"
path = "tests/bc_2_03_007_secret_redaction.rs"

[[test]]
name = "bc_2_03_009_resolve_secret"
path = "tests/bc_2_03_009_resolve_secret.rs"

[[test]]
name = "bc_2_03_010_audit_logging"
path = "tests/bc_2_03_010_audit_logging.rs"

[[test]]
name = "bc_3_2_002_org_id_namespace"
path = "tests/bc_3_2_002_org_id_namespace.rs"

[[test]]
name = "keyring_org_id"
path = "tests/keyring_org_id.rs"

# S-DEMO-003: RG-034-001/002 — Tier-3 OS-keyring resolution via in-memory trait double.
# Uses InMemoryCredentialStore (test-helpers feature) to exercise Tier-3 logic without
# requiring real OS keyring access (SID-1 compliance — macOS unsigned-test-binary ACL).
[[test]]
name = "bc_2_06_003_tier3_keyring_resolution"
path = "tests/bc_2_06_003_tier3_keyring_resolution.rs"
required-features = ["test-helpers"]

# Override workspace lints for this crate to allow test-writer naming conventions.
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(kani)'] }
non_snake_case = "allow"

[lints.clippy]
await_holding_lock = "deny"
unwrap_used = "allow"
useless_conversion = "allow"
