[package]
name = "prism-dtu-armis"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false
description = "L2-fidelity behavioral clone of the Armis Centrix API"

[lib]
name = "prism_dtu_armis"

# Per ADR-002: dtu feature declared per-crate, NOT at workspace level.
# Gate: #[cfg(any(test, feature = "dtu"))] ensures this crate never links into
# a production binary.
[features]
dtu = []
tls = ["dep:axum-server", "prism-dtu-common/tls"]
# fixture-gen: activates the Armis fixture generator (S-3.7.04).
# Enables the matching feature on prism-dtu-common to pull in generator types
# (Archetype, GenOpts, FixtureSet, OrgId, seeded_rng, default_page_size).
fixture-gen = ["prism-dtu-common/fixture-gen"]

[dependencies]
prism-dtu-common = { path = "../prism-dtu-common", version = "0.1.0", features = ["dtu"] }
prism-core = { path = "../prism-core" }
axum-server = { version = "0.7", features = ["tls-rustls"], optional = true }
axum = "0.7"
tokio = { version = "1", features = ["full"] }
tower = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
http = "1"
async-trait = "0.1"
tracing = "0.1"
anyhow = "1"
uuid = { version = "1", features = ["v4"] }
subtle = "2"
# Required by parse_aql_time_bounds (routes/search.rs) for AQL time-clause parsing (§8.3).
# S-DEMO-QUERY-PUSHDOWN-001 v2.1: DateTime<Utc> bounds returned from time-window extraction.
chrono = "0.4"

[dev-dependencies]
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio = { version = "1", features = ["full"] }
serde_json = "1"
jsonschema = "0.18"
prism-core = { path = "../prism-core" }
chrono = "0.4"
proptest = "1.11.0"
uuid = { version = "1", features = ["v4", "v7"] }
prism-dtu-harness = { path = "../prism-dtu-harness", features = ["dtu"] }
toml = "0.8"

