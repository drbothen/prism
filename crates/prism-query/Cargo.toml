[package]
name = "prism-query"
version = "0.1.0"
edition = "2021"
description = "Prism query orchestration — virtual field injection and sensor table materialization (S-2.08). PrismQL parser (S-3.01) and DataFusion TableProvider integration (S-3.02)."
license = "MIT"
publish = false

# ARCHITECTURE COMPLIANCE (S-2.08):
# This crate MUST NOT depend on datafusion, arrow, arrow-schema, or arrow2
# for S-2.08 purposes. Those dependencies are added in S-3.02.
#
# ARCHITECTURE COMPLIANCE (S-3.01):
# Parser modules (filter_parser, sql_parser, pipe_parser, security) MUST NOT
# import from prism-sensors, prism-mcp, or any I/O crate. Parsing is a pure
# function: &str -> Result<Ast, Vec<ParseError>>. See S-3.01 §Architecture
# Compliance Rules.

[lib]
name = "prism_query"

[dependencies]
prism-core = { path = "../prism-core" }
prism-storage = { path = "../prism-storage" }
prism-spec-engine = { path = "../prism-spec-engine" }
# ADR-042 — ArcSwap-backed resolved_spec_map for reload-aware multi-tenant overlay map.
# Matches version used by prism-mcp, prism-bin, and prism-spec-engine.
arc-swap = "1"
prism-sensors = { path = "../prism-sensors" }
prism-ocsf = { path = "../prism-ocsf" }
prism-credentials = { path = "../prism-credentials" }
# S-3.04 — alias system: ConfirmationToken (BC-2.11.014), FeatureFlagEvaluator (BC-2.11.008)
prism-security = { path = "../prism-security" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# S-2.08 — UUID v7 generation for org-scoped CrowdStrike pagination session IDs (D-048).
# S-3.05 — v4 added for CursorToken::new_random() (BC-2.07.001).
uuid = { version = "1", features = ["v7", "v4"] }
# S-3.01 — PrismQL parser combinators (filter/SQL/pipe modes) with error recovery.
chumsky = "0.12"
# S-3.01 — human-readable parse error formatting (JSON-serializable for MCP responses).
ariadne = "0.4"
# S-3.01 AST redesign — CIDR literal validation (CWE-20). ipnet::IpNet::from_str
# validates at parse time, preventing malformed CIDR strings from reaching the executor.
ipnet = { version = "2", features = ["serde"] }
# S-3.01 AST redesign — Eq/Hash on Literal::Float(f64) via ordered bit-level comparison.
# Two floats are "AST-equal" iff their bit representations are equal (NaN != NaN by design).
ordered-float = { version = "2", features = ["serde"] }
# S-3.01 AST redesign — regex validation at parse time (CWE-1333); same engine as prism-core.
regex = "1"
# S-3.04 — alias system: atomic TOML persistence for aliases.toml (BC-2.11.008 file-first).
toml = "0.8"
# S-3.01 fix-pass — parse-time validation for TimestampLiteral (ISO-8601 / RFC-3339).
# chrono is already used across the workspace (prism-core, prism-audit, prism-mcp, etc.);
# using the same crate avoids duplicate transitive deps.
chrono = { version = "0.4", default-features = false, features = ["std", "serde"] }
# S-3.02 — DataFusion in-process SQL engine, MemTable, SessionContext (BC-2.11.005).
datafusion = "53.1"
# F-LP1-HIGH-2: bincode 2.x for RocksDB KV deserialization (matching prism-storage AD-012).
# prism-storage uses bincode::serde::decode_from_slice; prism-query must match to correctly
# read AuditEntry values from the audit_buffer CF. (BC-2.15.011, AD-012)
bincode = { version = "2", features = ["serde"] }
# S-3.02 — Arrow RecordBatch, Schema, array builders for virtual fields (BC-2.11.012).
# datafusion 53.1 uses arrow 58 (transitive); pinned here for explicit awareness.
arrow = { version = "58", features = ["prettyprint"] }
# S-3.02 — Async runtime: spawn for fan-out tasks, timeout for 30s execution limit.
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync"] }
# S-3.02 — Structured spans: per-query, per-source, per-client (BC-2.11.005).
tracing = "0.1"
# S-3.02 — Async trait methods for DataFusion TableProvider (scan, etc.).
async-trait = "0.1"
# S-3.05 — TTL-based LRU response cache with async-safe eviction (BC-2.07.003/006).
moka = { version = "0.12", features = ["sync"] }
# S-3.05 — SHA-256 cache key derivation (BC-2.07.005 / VP-025).
sha2 = "0.10"
# S-3.05 fix-pass CR-002 — CancellationToken for cursor cleanup task shutdown signal.
# tokio-util is already a transitive dep via datafusion 53.1; this is a direct pin
# to make the dependency explicit. CancellationToken has no feature gate in 0.7.x.
tokio-util = { version = "0.7", default-features = false }
# S-3.07 — Write execution pipeline: intent/outcome audit trail (BC-2.05.001).
prism-audit = { path = "../prism-audit" }
# S-3.07 — ULID generation for operation_id and audit_intent_id.
ulid = { version = "1", features = ["serde"] }
# S-3.13 — Levenshtein distance for table-name did_you_mean suggestions (AC-3).
# Already in Cargo.lock transitively; adding as a direct dep for explicit awareness.
# Use strsim::levenshtein(candidate, requested); suggest only if distance ≤ 3. (D-1163)
strsim = "0.11"

[dev-dependencies]
# S-2.08 — isolation tests: LruCache mirrors prism-dtu-crowdstrike session_registry (dev-only)
lru = "0.18"
tempfile = "3"
# S-3.02 VP-031 — proptest property tests: REQUIRED columns always push-down (BC-2.11.007).
# S-3.06 — property-based tests for write-mode AST round-trips (VP-021 corpus extension)
proptest = "1.11"
# S-3.02-FOLLOWUP-RUNTIME: execute_integration_tests needs InMemoryBackend (RocksStorageBackend impl)
# and SecretString (for NullCredentialStore in test helpers).
prism-storage = { path = "../prism-storage", features = ["test-utils"] }
secrecy = { version = "0.8", features = ["serde"] }
# S-PLUGIN-PREREQ-E Task 7d — tracing event field schema capture for AC-9 third-test (BC-2.16.002 row 33).
# Minor-band pin per prism conservative-pinning convention.
# no-env-filter: required for integration tests (tests/ directory) — these are compiled into a
# separate crate from prism-query; without this feature the env-filter defaults to capturing only
# the test binary's own crate, filtering out logs emitted by prism_query::materialization and
# other production modules. See tracing-test 0.2 docs §"Per-crate Filtering".
# Scope isolation is preserved by traced_test's span-name injection (logs_with_scope_contain).
# S-ENGINE-LIMIT-EARLY-STOP-001 F-R16-P7-MED-001 (RG-SLUG-001/003 warn-emission assertions).
tracing-test = { version = "0.2", features = ["no-env-filter"] }
# S-PRISMQL-CASE-INSENSITIVE-001 RG-022: DynamicMessage field extraction in the
# GROUP BY normalization test — requires prost_reflect::Value to read severity
# back from the normalized DynamicMessage. Matches prism-ocsf production dep version.
prost-reflect = { version = "0.14.7", features = ["serde"] }

# S-3.01 VP-014/VP-015 — bounded model checking proofs (exact pin; out-of-band nightly
# toolchain; does not affect workspace MSRV of Rust 1.85).
# Gated to non-Windows because kani-verifier 0.67 uses std::os::unix::* (CommandExt::arg0,
# fs::symlink) which don't exist on Windows. Kani itself is Linux/macOS-only; the proof
# modules in src/proofs/ are #[cfg(kani)]-gated so they never compile in regular cargo
# test. Removing this from the Windows dep graph unblocks `cargo test --workspace` on
# x86_64-pc-windows-msvc without affecting Kani verification on supported platforms.
[target.'cfg(not(target_os = "windows"))'.dev-dependencies]
kani-verifier = "=0.67.0"

# S-3.04 / S-3.07 feature flags
[features]
# alias-write: enable the alias mutation tools (create_alias, delete_alias).
# Both a compile-time gate (this feature) and a runtime capability flag
# (alias.write = allow in the client's TOML) must be present for writes to succeed
# (BC-2.04.004 two-tier capability model, F-HIGH-002).
alias-write = []
# S-3.07 write-test feature gates. These features now serve solely as test-gating
# mechanisms after PLUGIN-MIGRATION-001-A removed the cross-crate forwarding chain.
# The write pipeline itself is registry-driven (BC-2.16.012); these gates preserve
# existing test coverage under `--all-features` until PLUGIN-MIGRATION-001-F de-gates them.
crowdstrike-write = []
cyberint-write = []
claroty-write = []
armis-write = []
all-write = ["crowdstrike-write", "cyberint-write", "claroty-write", "armis-write"]
# Exposes global reset helpers (reset_dynamic_registry_global, reset_query_phase_global)
# for cross-crate integration tests, and enables BoundingDmlOperation::__TestUnknown via
# prism-security/test-helpers (F-PR163-PASS3-MED-4). NEVER enable in production deps.
test-helpers = ["prism-security/test-helpers"]

# VP-156 proptest integration test binaries — require test-helpers feature to access
# reset_dynamic_registry_global / reset_query_phase_global (process-global state reset
# between proptest cases). S-PLUGIN-PREREQ-E | ADR-026 §D7 v1.23.
[[test]]
name = "vp156_write_tool_registration_uniqueness"
required-features = ["test-helpers"]

# Post-boot proptest is in a SEPARATE binary to prevent mark_query_phase_started()
# from contaminating QUERY_PHASE_STARTED global state for the uniqueness tests.
# See invalidation_post_boot_test.rs for the established binary-isolation pattern.
[[test]]
name = "vp156_write_tool_post_boot_proptest"
required-features = ["test-helpers"]

# S-DEMO-ENRICHMENT-PIVOT-001: Red Gate test 3 — DataFusion async UDF registration
# Traces to: BC-2.19.001 postcondition — each field registers as a DataFusion scalar UDF.
# Requires tokio multi-thread runtime (AD-013) for async UDF execution.
[[test]]
name = "bc_2_19_001_plugin_udf_registration_test"
path = "tests/bc_2_19_001_plugin_udf_registration_test.rs"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(kani)', 'cfg(feature, values("alias-write", "test-helpers", "crowdstrike-write", "cyberint-write", "claroty-write", "armis-write", "all-write"))'] }
non_snake_case = "allow"

[lints.clippy]
await_holding_lock = "deny"
unwrap_used = "deny"
expect_used = "deny"
