# B-P9-01: fixture-gen-gated scenario test requires dtu+fixture-gen (mirrors nvd sibling pattern)
[[test]]
name = "bc_2_06_020_enrichment_correlation"
path = "tests/bc_2_06_020_enrichment_correlation.rs"
required-features = ["dtu", "fixture-gen"]

[lints]
workspace = true
