[package]
name = "prism-dtu-threatintel"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false
description = "L2-fidelity behavioral clone of the Threat Intel Aggregator infusion plugin API"

[features]
dtu = []
tls = ["dep:axum-server", "prism-dtu-common/tls"]
# S-DEMO-DTU-LIVE-SCENARIO-001-A: enables ScenarioEntityCatalog access in Story B scope.
# No source in this crate uses ScenarioEntityCatalog in Story A (U-A-10: no premature import).
fixture-gen = ["prism-dtu-common/fixture-gen"]

[dependencies]
prism-dtu-common = { path = "../prism-dtu-common", version = "0.1.0", features = ["dtu"] }
axum-server = { version = "0.7", features = ["tls-rustls"], optional = true }
axum = "0.7"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
async-trait = "0.1"
tower = "0.4.13"
http = "1"
anyhow = "1"
tracing = "0.1"
uuid = { version = "1", features = ["v4"] }
subtle = "2"

[dev-dependencies]
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }

[[test]]
name = "ac_1_malicious_ip_lookup"
path = "tests/ac_1_malicious_ip_lookup.rs"
required-features = ["dtu"]

[[test]]
name = "ac_2_benign_ip_lookup"
path = "tests/ac_2_benign_ip_lookup.rs"
required-features = ["dtu"]

[[test]]
name = "ac_3_unknown_ip_benign_defaults"
path = "tests/ac_3_unknown_ip_benign_defaults.rs"
required-features = ["dtu"]

[[test]]
name = "ac_4_malicious_hash_lookup"
path = "tests/ac_4_malicious_hash_lookup.rs"
required-features = ["dtu"]

[[test]]
name = "ac_5_auth_reject_missing_key"
path = "tests/ac_5_auth_reject_missing_key.rs"
required-features = ["dtu"]

[[test]]
name = "ac_6_rate_limit_429"
path = "tests/ac_6_rate_limit_429.rs"
required-features = ["dtu"]

[[test]]
name = "ac_7_dynamic_registry_configure"
path = "tests/ac_7_dynamic_registry_configure.rs"
required-features = ["dtu"]

[[test]]
name = "fidelity_validator"
path = "tests/fidelity_validator.rs"
required-features = ["dtu"]

[[test]]
name = "dtu_health_mount"
path = "tests/dtu_health_mount.rs"
required-features = ["dtu"]

[[test]]
name = "dtu_reset_mount"
path = "tests/dtu_reset_mount.rs"
required-features = ["dtu"]

[[test]]
name = "td_wv0_04_configure_deny_unknown"
path = "tests/td_wv0_04_configure_deny_unknown.rs"
