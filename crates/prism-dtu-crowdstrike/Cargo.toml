[package]
name = "prism-dtu-crowdstrike"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false
description = "L4-adversarial behavioral clone of the CrowdStrike Falcon API for integration testing"

[lib]
name = "prism_dtu_crowdstrike"

[features]
dtu = []
tls = ["dep:axum-server", "prism-dtu-common/tls"]
fixture-gen = ["prism-dtu-common/fixture-gen"]

[dependencies]
prism-dtu-common = { path = "../prism-dtu-common", version = "0.1.0", features = ["dtu"] }
prism-core = { path = "../prism-core", version = "0.2.0" }
axum-server = { version = "0.7", features = ["tls-rustls"], optional = true }
axum = "0.7"
tokio = { version = "1", features = ["full"] }
tower = "0.4.13"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
http = "1"
tracing = "0.1"
uuid = { version = "1", features = ["v4"] }
lru = "0.17"
anyhow = "1"
async-trait = "0.1"
rand = "0.8"
rand_chacha = "0.3"
subtle = "2"
# chrono: required for FQL time-bound parsing in state.rs and detections.rs (F-P1-OBS-001).
# Moved from dev-dependencies to dependencies because state.rs (production code) uses
# DateTime<Utc> for filtering the fixture dataset by created_timestamp bounds.
chrono = { version = "0.4", features = ["serde"] }

[dev-dependencies]
prism-dtu-harness = { path = "../prism-dtu-harness", version = "0.1.0", features = ["dtu"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio = { version = "1", features = ["full"] }
jsonschema = "0.18"
proptest = "1"
toml = "0.8"

[[test]]
name = "integration_vp033"
path = "tests/integration_vp033.rs"
required-features = ["dtu"]

