[package]
name = "prism-bin"
version = "0.1.0"
edition = "2024"
description = "Prism binary — CLI entry point, boot sequence, signal handlers (SS-22)"
license = "MIT"
publish = false

# CRIT-1 (S-WAVE5-PREP-01 fix-pass-1): Feature flag that gates ALL PRISM_TEST_*
# env-var reads. This feature MUST NOT be enabled in default features — it only
# activates in integration test builds that need subprocess injection.
# The release binary has zero test-injection code paths with this gate.
# Enable via: cargo test --features test-injection (or in [dev-dependencies] test config).
[features]
default = []
# test-injection: gates PRISM_TEST_INJECT_PANIC, PRISM_TEST_INJECT_FAIL_STEP,
# and PRISM_TEST_STOP_AFTER_STEP env-var reads. Never enabled in production builds.
test-injection = ["libc"]

# ADR-022 §A: prism-bin is the ONLY [[bin]] target in the workspace.
[[bin]]
name = "prism"
path = "src/main.rs"

# Public lib API for integration test access (boot_tests.rs spawns the binary
# as a subprocess but can also import types for fixture construction).
[lib]
name = "prism_bin"

[dependencies]
prism-core = { path = "../prism-core", version = "0.2.0" }
prism-credentials = { path = "../prism-credentials", version = "0.1.0" }
prism-audit = { path = "../prism-audit", version = "0.1.0" }
prism-storage = { path = "../prism-storage", version = "0.1.0" }
prism-spec-engine = { path = "../prism-spec-engine", version = "0.9.0" }
prism-query = { path = "../prism-query", version = "0.1.0" }
prism-mcp = { path = "../prism-mcp", version = "0.1.0" }
# rmcp: direct dep required because boot.rs exposes JoinHandle<Result<(), rmcp::RmcpError>>
# in RunningServer and wait_for_shutdown() matches on RmcpError variants (BC-2.10.010 fix).
rmcp = { workspace = true }
clap = { version = "4", features = ["derive", "env"] }
keyring = "3"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
arc-swap = "1"
anyhow = "1"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
thiserror = "1"
uuid = { version = "1", features = ["v7"] }
chrono = { version = "0.4", features = ["serde"] }
dirs = "5"
# libc: used in the test-injection gate (boot.rs) for raw sigaction on unix.
# Only referenced from cfg(unix) + cfg(feature = "test-injection") code paths;
# kept as a direct dep to satisfy rustc's E0433 (transitive deps not in scope).
libc = { version = "0.2", optional = true }
# S-PLUGIN-PREREQ-D AC-9: boot.rs constructs the single shared reqwest::Client with 30s timeout
# and injects it into PluginRuntime::new(). reqwest is a transitive dep via prism-spec-engine
# but must be declared here for boot.rs to call reqwest::Client::builder() directly.
reqwest = { version = "0.12", features = ["rustls-tls"], default-features = false }
# S-5.01-FOLLOWUP-MCP-BOOT: step9 constructs BootNullCredentialStore + TracingAuditWriter
# inline. These require secrecy::SecretString (for CredentialStore), ulid::Ulid (for
# AuditWriter::write_intent), and async-trait (for async trait impls on boot-local structs).
secrecy = { version = "0.8" }
ulid = { version = "1", features = ["serde"] }
async-trait = "0.1"
# step9 also needs prism-ocsf for OcsfNormalizer, prism-sensors for AdapterRegistry +
# CredentialResolver, prism-security for InjectionScanner + FeatureFlagEvaluator +
# ConfirmationTokenStore.
prism-ocsf = { path = "../prism-ocsf", version = "0.1.0" }
prism-sensors = { path = "../prism-sensors", version = "0.2.0" }
prism-security = { path = "../prism-security", version = "0.1.0" }
# S-DEMO-001: SpecDrivenSensorAdapter::fetch returns Vec<RecordBatch> per SensorAdapter trait.
# arrow is a direct dep of prism-sensors (SensorAdapter trait owner) but must be declared here
# because spec_driven_adapter.rs names RecordBatch in the fetch() override return type.
arrow = { version = "58", features = ["ipc"] }

# ---------------------------------------------------------------------------
# Integration test targets — explicit declarations required for required-features
# F-PASS2-MED-1 (S-WAVE5-PREP-01): Tests that depend on PRISM_TEST_* env-var
# injection MUST declare required-features = ["test-injection"] so that
# `just iter prism-bin` (without --all-features) skips them cleanly rather
# than running them against a binary that lacks the injection code paths.
# The `just iter prism-bin --all-features` invocation enables the feature
# and builds both the binary AND the test binaries with injection code.
# POL-18: Cargo features named *_test_injection MUST be listed as
# required-features in all [[test]] sections that depend on them.
# ---------------------------------------------------------------------------

# --- Injection-dependent tests (require test-injection feature) ---

[[test]]
name = "bc_2_05_012_audit_init"
path = "tests/bc_2_05_012_audit_init.rs"
required-features = ["test-injection"]

[[test]]
name = "bc_2_03_013_credential_init"
path = "tests/bc_2_03_013_credential_init.rs"
required-features = ["test-injection"]

[[test]]
name = "bc_2_22_001_boot_orchestration"
path = "tests/bc_2_22_001_boot_orchestration.rs"
required-features = ["test-injection"]

[[test]]
name = "signal_handlers"
path = "tests/signal_handlers.rs"
required-features = ["test-injection"]

# --- Injection-free tests (no required-features) ---

[[test]]
name = "bc_2_06_011_config_load"
path = "tests/bc_2_06_011_config_load.rs"

[[test]]
name = "bc_2_21_001_org_registry_init"
path = "tests/bc_2_21_001_org_registry_init.rs"

[[test]]
name = "cli_subcommands"
path = "tests/cli_subcommands.rs"

[[test]]
name = "exit_code_contract"
path = "tests/exit_code_contract.rs"

# S-PLUGIN-PREREQ-D: Plugin boot wiring integration tests (BC-2.22.001, VP-PLUGIN-004/007)
[[test]]
name = "plugin_boot_tests"
path = "tests/plugin_boot_tests.rs"

# S-3.02-FOLLOWUP-RUNTIME: boot steps 7–8 wiring tests (BC-2.11.001, BC-2.11.005, BC-2.15.011).
# Tests are injection-free (no PRISM_TEST_* env-vars needed).
[[test]]
name = "boot_steps_7_8_tests"
path = "tests/boot_steps_7_8_tests.rs"

# VP-153: SensorAuth Runtime Cross-Composition Prevention — Rule C proptest via ShapedProbe.
# Rule C (E-SPEC-014): auth_type/credential structural shape mismatch rejected at
# credential-resolution time via step5_init_credential_store_with_probe.
# Per ADR-026 §D3 Rule C Backend Scope (D-706 amendment): Rule C fires only when the
# credential backend exposes shape metadata via CredentialRefProbe::probe() returning
# Some(shape). ShapedProbe is the architecturally-sanctioned test-fixture path.
# Lives in prism-bin (not prism-spec-engine) because prism-bin depends on prism-spec-engine
# — adding prism-bin as a dev-dep to prism-spec-engine would create a workspace cycle.
[[test]]
name = "vp153_rule_c_shaped_probe"
path = "tests/vp153_rule_c_shaped_probe.rs"

# MED-005 fix: AC-10 / POL-12 extension to prism-bin production source.
# Scans prism-bin/src/ for todo!()/unimplemented!() without a story-ID citation.
# Intentional deferrals (step10, step11) are allowed when they cite S-* story IDs.
[[test]]
name = "pol_12_no_todo"
path = "tests/pol_12_no_todo.rs"

[dev-dependencies]
rmcp = { workspace = true }
tempfile = "3"
libc = "0.2"
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
prism-spec-engine = { path = "../prism-spec-engine", version = "0.9.0", features = ["test-helpers"] }
prism-storage = { path = "../prism-storage", version = "0.1.0", features = ["test-utils"] }
prism-core = { path = "../prism-core", version = "0.2.0" }
# test-helpers: exposes reset_dynamic_registry_global / reset_query_phase_global for
# F-LP-IMPL-P1-002 cross-crate integration test isolation (F-LP-IMPL-P1-005).
prism-query = { path = "../prism-query", version = "0.1.0", features = ["test-helpers"] }
# S-3.02-FOLLOWUP-RUNTIME: boot_steps_7_8_tests.rs needs QueryEngine/WriteExecutor
# dependency constructors (OcsfNormalizer, AdapterRegistry, FeatureFlagEvaluator, etc.)
prism-ocsf = { path = "../prism-ocsf" }
prism-sensors = { path = "../prism-sensors" }
prism-security = { path = "../prism-security" }
async-trait = "0.1"
secrecy = { version = "0.8", features = ["serde"] }
ulid = { version = "1", features = ["serde"] }
datafusion = "53.1"
bincode = "2"
wat = "1"
# VP-153 Rule C proptest (ShapedProbe injection via step5_init_credential_store_with_probe)
proptest = "1"

[lints.clippy]
# Inherited from workspace: workspace lint inheritance is not yet available
# in this project's Cargo format, so we mirror the workspace rules here.
await_holding_lock = "deny"
# Test files use .unwrap()/.unwrap_err() by design — test-writer generated;
# cannot be modified per story constraints. Allow so -D warnings passes test binaries.
unwrap_used = "allow"

[lints.rust]
# Allow #[cfg(kani)] without a registered cfg — kani invoked via `cargo kani`.
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(kani)'] }
# Test functions use BC-ID naming convention; cannot modify.
non_snake_case = "allow"
# Test files import items used only in certain cfg combinations.
unused_imports = "allow"

[package.metadata.docs.rs]
all-features = true
