# cliff.toml — git-cliff 2.14.1 changelog configuration for Prism
#
# Authority: ADR-063 D3 (categorization convention), D1 (version pin), D5 (release-prep integration)
#
# Breaking Changes section ordering: numbered-group-name-prefix idiom (ADR-063 v1.4 D3).
# git-cliff 2.14.1 native mechanism:
#   - commit_groups(groups=commit_parsers_groups) preserves parser-declaration order
#   - striptags | trim strips the <!-- N --> HTML comment sort prefix from display names
#   - The [git] section does not use any ordering key — ordering comes from parser position.
#
# PR link injection: commit_preprocessors pattern converts (NNN) refs from commit
# messages to GitHub markdown links — works locally without GITHUB_TOKEN.
# [remote.github] is kept for author attribution enrichment when GITHUB_TOKEN is
# available in CI (author @-handles added to entries by git-cliff remote context).

[changelog]
header = ""
body = """
{% if version %}## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}## [Unreleased]
{% endif %}
{% for entry in commits | commit_groups(groups=commit_parsers_groups) %}
### {{ entry.group | striptags | trim }}
{% for commit in entry.commits %}
- {% if commit.breaking %}**BREAKING** {% endif %}{{ commit.message }}
{% endfor %}
{% endfor %}
"""
footer = ""
trim = true

[git]
conventional_commits = true
filter_unconventional = true
commit_preprocessors = [
  # Convert (NNN) PR references from conventional commit subjects into GitHub PR links.
  # Works locally without GITHUB_TOKEN; CI enriches entries further via [remote.github].
  { pattern = '\(#([0-9]+)\)', replace = "([#${1}](https://github.com/drbothen/prism/pull/${1}))" },
]
commit_parsers = [
  # `breaking = true` matches commits with `!` type suffix or `BREAKING CHANGE:` footer.
  # Listed first so breaking commits resolve to <!-- 0 --> before type-based parsers.
  { breaking = true, group = "<!-- 0 -->Breaking Changes" },
  { message = "^feat", group = "<!-- 1 -->Added" },
  { message = "^fix", group = "<!-- 2 -->Fixed" },
  { message = "^perf", group = "<!-- 3 -->Performance" },
  { message = "^refactor", group = "<!-- 4 -->Changed" },
  { message = "^security", group = "<!-- 5 -->Security" },
  { message = "^docs", skip = true },
  { message = "^ci", skip = true },
  { message = "^test", skip = true },
  { message = "^chore", skip = true },
  { message = "^style", skip = true },
  { message = "^build", skip = true },
  { message = "^revert", skip = true },
]
protect_breaking_commits = true
filter_commits = false
tag_pattern = "v[0-9].*"
skip_tags = ""
ignore_tags = ""
topo_order = false
sort_commits = "oldest"

[remote.github]
owner = "drbothen"
repo = "prism"
