# cliff.toml — git-cliff 2.14.1 changelog configuration for Prism
#
# Authority: ADR-063 §D3 (categorization, breaking section, PR links, header mechanism)
#            ADR-063 §D1 (version pin: 2.14.1)
#            ADR-063 §D5 (release-prep integration: --unreleased --tag --prepend)
#
# CHANGELOG.md masthead placement (ADR-063 §D3):
# The [changelog] header below carries the "# Changelog" masthead and the "## [Unreleased]"
# section. release-prep.yml Step 7 pre-strips the masthead and any prior [Unreleased] section
# from CHANGELOG.md before running `git cliff --prepend`, so git-cliff receives a file starting
# at the first versioned section (## [X.Y.Z]). git-cliff then writes:
#   header (masthead + ## [Unreleased]) + new ## [X.Y.Z] section + existing sections
# This produces a correct keepachangelog structure on every release cycle without masthead
# duplication across different-version cycles. Same-version re-dispatch is separately
# guarded by the Step 3 branch-existence check in release-prep.yml.
#
# Breaking Changes section ordering (ADR-063 §D3):
# Intended ADR mechanism: numbered-group-name-prefix idiom — { breaking = true } parser routes
# breaking commits to "<!-- 0 -->Breaking Changes"; single group_by loop renders all groups.
# Actual behavior (git-cliff 2.14.1): { breaking = true } in commit_parsers does NOT override
# message-based parsers for group assignment — a feat!: commit gets group "<!-- 1 -->Added"
# regardless of whether the breaking parser is listed first or last. Verified empirically.
# Canonical mechanism: the body template uses Tera filter(attribute="breaking", value=true)
# to separate breaking commits into a manual "### Breaking Changes" section rendered BEFORE
# the group_by loop. Non-breaking commits are processed by
# commits | filter(attribute="breaking", value=false) | group_by(attribute="group"),
# satisfying F-1 (the grouping loop for Added/Fixed/etc. uses group_by + striptags | trim).
#
# PR link injection (ADR-063 §D3):
# Token-free via commit_preprocessors. Prism uses squash-merge, so every merged PR subject
# already contains (#NNN). The commit_preprocessors regex rewrites (#NNN) into a markdown link
# in commit.message before Tera rendering — no GITHUB_TOKEN or remote API call is needed.
# The body template does NOT reference commit.remote.* fields (those require GITHUB_TOKEN and
# are EMPTY in a token-free run). The [remote.github] block is retained for possible future
# remote-API use but the body template ignores it.
# BREAKING CHANGE footer values are surfaced inline via commit.breaking_description (ADR-063 §D3).
# No per-entry author @-handle attribution — Prism is a single-author project (ADR-063 §D3).

[changelog]
header = """# Changelog

All notable changes to Prism are documented here.
Format: [Keep a Changelog](https://keepachangelog.com/en/1.1.0/).

## [Unreleased]

"""
body = """
{% if version %}## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% endif %}
{% set breaking_commits = commits | filter(attribute="breaking", value=true) %}
{% if breaking_commits | length > 0 %}
### Breaking Changes
{% for commit in breaking_commits %}
- **BREAKING** {{ commit.message }}{% if commit.breaking_description and commit.breaking_description != commit.message %} — {{ commit.breaking_description }}{% endif %}
{% endfor %}
{% endif %}
{% for group, group_commits in commits | filter(attribute="breaking", value=false) | group_by(attribute="group") %}
### {{ group | striptags | trim }}
{% for commit in group_commits %}
- {{ commit.message }}
{% endfor %}
{% endfor %}
"""
footer = ""
trim = true

[git]
conventional_commits = true
filter_unconventional = true
commit_preprocessors = [
  # Rewrite "(#NNN)" in squash-merge commit subjects to markdown PR links.
  # Prism uses squash-merge; every merged PR subject already contains (#NNN).
  # This is the token-free PR-link mechanism — no GITHUB_TOKEN required.
  { pattern = "\\(#([0-9]+)\\)", replace = "([#${1}](https://github.com/drbothen/prism/pull/${1}))" },
]
commit_parsers = [
  { message = "^feat", group = "<!-- 1 -->Added" },
  { message = "^fix", group = "<!-- 2 -->Fixed" },
  { message = "^perf", group = "<!-- 3 -->Performance" },
  { message = "^refactor", group = "<!-- 4 -->Changed" },
  { message = "^security", group = "<!-- 5 -->Security" },
  { message = "^docs", skip = true },
  { message = "^ci", skip = true },
  { message = "^test", skip = true },
  { message = "^chore", skip = true },
  { message = "^style", skip = true },
  { message = "^build", skip = true },
  { message = "^revert", skip = true },
  # Catch-all: skip any commit type not explicitly listed above (prevents unlisted types like 'evidence', 'maintenance', 'factory' from appearing as raw headings)
  { message = ".*", skip = true },
]
protect_breaking_commits = true
filter_commits = false
tag_pattern = "v[0-9].*"
skip_tags = ""
ignore_tags = ""
topo_order = false
sort_commits = "oldest"

[remote.github]
owner = "drbothen"
repo = "prism"
