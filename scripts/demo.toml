# scripts/demo.toml — DTU demo server multi-org configuration.
#
# Used ONLY by `start-multi` subcommand (S-DEMO-LAUNCHER-CONSOLIDATION-001).
# Each org gets its own DTU clone fleet; seeds differ to satisfy INV-DISTINCT-DATA-001.
#
# Usage:
#   prism-dtu-demo-server start-multi --config scripts/demo.toml   (multi-org)
#
# For single-org (`start` subcommand), use configs/demo.toml instead:
#   prism-dtu-demo-server start --config configs/demo.toml
#
# Stories: S-DEMO-LAUNCHER-CONSOLIDATION-001

[harness]
bind = "127.0.0.1"

# ---------------------------------------------------------------------------
# Multi-org fleet config for `start-multi` (S-DEMO-LAUNCHER-CONSOLIDATION-001)
#
# Seed assignments match S-DEMO-004 test harness (INV-DISTINCT-DATA-001):
#   org-a: seed=100 | org-b: seed=150 | org-c: seed=200
# org-a and org-c both have CrowdStrike; distinct seeds ensure distinct data.
#
# Cyberint initial_access_token values must match the api_key credentials
# set by demo-setup.sh (AD-017: values piped via stdin, not CLI argv).
# ---------------------------------------------------------------------------

[orgs.org-a]
org_id = "0196f4b2-3c8d-7e1a-b5f0-2d4c6e8a0000"
sensors = ["crowdstrike", "armis"]
seed = 100

[orgs.org-b]
org_id = "0196f4b2-3c8d-7e1a-b5f0-2d4c6e8a0001"
sensors = ["claroty", "cyberint"]
seed = 150
initial_access_token = "demo-cyberint-api-key-org-b"

[orgs.org-c]
org_id = "0196f4b2-3c8d-7e1a-b5f0-2d4c6e8a0002"
sensors = ["crowdstrike", "armis", "claroty", "cyberint"]
seed = 200
initial_access_token = "demo-cyberint-api-key-org-c"
