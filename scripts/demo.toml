# scripts/demo.toml — DTU demo server configuration for S-DEMO-003.
#
# Enables all 4 sensor DTU clones on ephemeral ports (port = 0) so there are
# no port conflicts between demo runs. The actual ports are written to
# .prism-dtu-demo-server.urls.json in $DEMO_RUN_DIR after the server starts.
# demo-run.sh reads that file after the DTU server starts and writes per-org
# overlay TOMLs (specs/customers/demo-org/<sensor>.sensor.toml) with the
# correct ephemeral base_url for each sensor clone.
#
# Usage:
#   prism-dtu-demo-server start --config scripts/demo.toml
#
# Story: S-DEMO-003 | AC-003

[harness]
bind = "127.0.0.1"

[clones.crowdstrike]
enabled = true
bind = "127.0.0.1"
port = 0
fixture_set = "default"
initial_failure_mode = "None"
seed = 42
tls = false
continue_on_error = false

[clones.armis]
enabled = true
bind = "127.0.0.1"
port = 0
fixture_set = "default"
initial_failure_mode = "None"
seed = 42
tls = false
continue_on_error = false

[clones.claroty]
enabled = true
bind = "127.0.0.1"
port = 0
fixture_set = "default"
initial_failure_mode = "None"
seed = 42
tls = false
continue_on_error = false

[clones.cyberint]
enabled = true
bind = "127.0.0.1"
port = 0
fixture_set = "default"
initial_failure_mode = "None"
seed = 42
tls = false
continue_on_error = false
# initial_access_token: seeded into the Cyberint DTU allowlist at startup.
# demo-setup.sh stores the matching value in the OS keyring under
# prism/cyberint/api_key for org slug "demo-org". StaticCookieAuthProvider
# reads it and injects Cookie: access_token=<value> on each fetch request.
# ADR-031 §D3-a: Cyberint uses static cookie auth (no HTTP login step).
initial_access_token = "demo-cyberint-api-key"
