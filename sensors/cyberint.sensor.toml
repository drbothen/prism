# Cyberint sensor spec — S-1.13 write endpoint extension
# Implements AD-022 risk classification for Cyberint write operations.
# Write endpoints: acknowledge (reversible), close_alert (irreversible)

sensor_id = "cyberint"
name = "Cyberint"
auth_type = "api_key"
base_url = "https://api.cyberint.com"
version = "1.0.0"

# ---------------------------------------------------------------------------
# Credential references (BC-2.06.003 v1.3 / ADR-032)
# ---------------------------------------------------------------------------
# StaticCookieAuthProvider resolves "api_key" at acquire_token() time.
# BC-2.06.003 resolution chain: PRISM_CLIENTS_{ID}_SENSORS_CYBERINT_API_KEY_FILE >
#   PRISM_CLIENTS_{ID}_SENSORS_CYBERINT_API_KEY > keyring.
[[credential_refs]]
name = "api_key"
description = "Cyberint API access token (injected as access_token cookie)"

# ---------------------------------------------------------------------------
# Write endpoints (S-1.13)
# ---------------------------------------------------------------------------

[write_endpoints.acknowledge]
pipe_verb = "acknowledge"
sql_table = "cyberint_acknowledged_alerts"
risk_tier = "reversible"
capability_path = "cyberint.alerts.write"
batch_limit = 50
batch_mode = "serial"
record_id_field = "alert_id"

[[write_endpoints.acknowledge.steps]]
method = "POST"
url = "/v1/alerts/acknowledge"
body_template = '{"alert_ids": ${record_ids}}'

[write_endpoints.close_alert]
pipe_verb = "close_alert"
sql_table = "cyberint_closed_alerts"
risk_tier = "irreversible"
capability_path = "cyberint.alerts.write"
batch_limit = 20
batch_mode = "serial"
record_id_field = "alert_id"

[[write_endpoints.close_alert.steps]]
method = "POST"
url = "/v1/alerts/close"
body_template = '{"alert_ids": ${record_ids}, "reason": "${params.reason|default:resolved}"}'

# ---------------------------------------------------------------------------
# Table: alerts (read — IOC columns added by S-DEMO-ENRICHMENT-PIVOT-003)
#
# AC-006 (S-DEMO-ENRICHMENT-PIVOT-003): IOC columns — real-schema fields added
# to support the canonical ThreatIntel pivot query (AC-007).
# BC-2.06.019 v1.8 Per-Sensor IOC-Surface Matrix: Cyberint alerts carry IOC fields.
# SAP-2 compliance: all columns have matching fields in prism-dtu-cyberint/src/types.rs
# Alert struct (ioc: Option<Ioc>, iocs: Vec<Ioc>, alert_data: Option<AlertData>).
#
# NOTE: "iocs[].type" uses the PRIMARY wire key per #[serde(rename = "type")] on Ioc.
# The serde alias "ioc_type" is resolved at the Rust level, NOT as a separate TOML column.
# ---------------------------------------------------------------------------
[[tables]]
table_name = "alerts"
ocsf_class = "detection_finding"

  [[tables.columns]]
  name = "alert_id"
  column_type = "string"
  ocsf_field = "finding.uid"
  options = ["REQUIRED"]

  [[tables.columns]]
  name = "title"
  column_type = "string"
  ocsf_field = "finding.title"

  [[tables.columns]]
  name = "type"
  column_type = "string"
  ocsf_field = "type_name"

  [[tables.columns]]
  name = "severity"
  column_type = "string"
  ocsf_field = "severity"

  [[tables.columns]]
  name = "status"
  column_type = "string"
  ocsf_field = "status"

  [[tables.columns]]
  name = "created_at"
  column_type = "datetime"
  ocsf_field = "time"
  timestamp_formats = ["iso8601", "unix_epoch_seconds"]

  [[tables.columns]]
  name = "source"
  column_type = "string"
  ocsf_field = "metadata.product.vendor_name"

  # Singleton top-level IOC — PENDING-LIVE-VALIDATION.
  # DTU: Alert.ioc.ioc_type (primary wire key: "type" via serde rename).
  [[tables.columns]]
  name = "ioc.type"
  column_type = "string"

  # DTU: Alert.ioc.value (primary wire key: "value").
  [[tables.columns]]
  name = "ioc.value"
  column_type = "string"

  # List-form IOC array — CONFIRMED via Check Point sk182975 + FortiSOAR connector.
  # DTU: Alert.iocs[].ioc_type (primary wire key: "type" via serde rename).
  [[tables.columns]]
  name = "iocs[].type"
  column_type = "string"

  # DTU: Alert.iocs[].value (primary wire key: "value").
  [[tables.columns]]
  name = "iocs[].value"
  column_type = "string"

  # Network IOC surface.
  [[tables.columns]]
  name = "alert_data.ip"
  column_type = "string"

  [[tables.columns]]
  name = "alert_data.domain"
  column_type = "string"

  [[tables.columns]]
  name = "alert_data.url"
  column_type = "string"

  [[tables.steps]]
  name = "fetch_alerts"
  method = "GET"
  path_template = "/api/v1/alerts"
  response_path = "$.data"
  variables_produced = []
  [tables.steps.pagination]
  type = "cursor_token"
  cursor_response_path = "$.next_cursor"
