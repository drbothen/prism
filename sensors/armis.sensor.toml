# Armis sensor spec — S-1.13 write endpoint extension + read column additions
# Implements AD-022 risk classification for Armis write operations.
# Write endpoints: label (reversible), remove_label (reversible)
#
# NOTE: Armis uses "label"/"remove_label" rather than "tag"/"remove_tag".
# "tag" and "remove_tag" are already registered by Claroty; the global
# pipe_verb uniqueness rule (BC-2.16.009 EC-002) requires each verb to be
# owned by exactly one sensor across the workspace. "label" is semantically
# correct — the Armis API refers to device categorization as "labels" in its
# device management endpoints.
#
# Read column additions (F-PIVOT003-OBS-002): keep this file in sync with the
# authoritative spec at crates/prism-sensors/specs/armis.sensor.toml for columns
# introduced by S-DEMO-ENRICHMENT-PIVOT-003.

sensor_id = "armis"
name = "Armis"
auth_type = "bearer_static"
base_url = "https://api.armis.com"
version = "1.0.0"

# ---------------------------------------------------------------------------
# Credential references (BC-2.06.003 v1.3 / ADR-032)
# ---------------------------------------------------------------------------
# BearerStaticCredentialAuthProvider resolves "bearer_token" at acquire_token() time.
# BC-2.06.003 resolution chain: PRISM_CLIENTS_{ID}_SENSORS_ARMIS_BEARER_TOKEN_FILE >
#   PRISM_CLIENTS_{ID}_SENSORS_ARMIS_BEARER_TOKEN > keyring.
[[credential_refs]]
name = "bearer_token"
description = "Armis API bearer token"

# ---------------------------------------------------------------------------
# Write endpoints (S-1.13)
# ---------------------------------------------------------------------------

[write_endpoints.label]
pipe_verb = "label"
sql_table = "armis_labeled_devices"
risk_tier = "reversible"
capability_path = "armis.devices.write"
batch_limit = 50
batch_mode = "serial"
record_id_field = "device_id"

[[write_endpoints.label.steps]]
method = "POST"
url = "/api/v1/devices/labels"
body_template = '{"device_ids": ${record_ids}, "label": "${params.label}"}'

[write_endpoints.remove_label]
pipe_verb = "remove_label"
sql_table = "armis_unlabeled_devices"
risk_tier = "reversible"
capability_path = "armis.devices.write"
batch_limit = 50
batch_mode = "serial"
record_id_field = "device_id"

[[write_endpoints.remove_label.steps]]
method = "DELETE"
url = "/api/v1/devices/labels"
body_template = '{"device_ids": ${record_ids}, "label": "${params.label}"}'

# ---------------------------------------------------------------------------
# Read table: devices (S-DEMO-ENRICHMENT-PIVOT-003 column additions)
# Full spec is in crates/prism-sensors/specs/armis.sensor.toml.
# This section declares only columns introduced by stories in the PIVOT wave
# so that demo/e2e paths loading sensors/ have these columns declared.
# ---------------------------------------------------------------------------
[[tables]]
table_name = "devices"

  # S-DEMO-ENRICHMENT-PIVOT-003: device_cves_first column declaration (U17/Ruling 1b).
  # The generator projection (stamping the first element of catalog.device_cves as a scalar)
  # was wired in S-DEMO-ENRICHMENT-PIVOT-003 (F-PIVOT003-R2-002), not STORY-002.
  # column_type = "string": CVE IDs are strings (e.g. "CVE-2024-12345").
  # Used as the input field for `| enrich nvd(device_cves_first)` enrichment pipe stage.
  [[tables.columns]]
  name = "device_cves_first"
  column_type = "string"
  ocsf_field = "vulnerabilities.first_cve_id"
