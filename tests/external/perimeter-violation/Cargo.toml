[package]
name = "perimeter-violation"
version = "0.1.0"
edition = "2021"
publish = false

# BC-2.11.006 v1.10 — Security Perimeter compile-fail test crate.
#
# PURPOSE: This crate deliberately attempts to use symbols that are pub(crate)
# inside prism-query but NOT part of the public API. It MUST NOT compile.
# The CI job `perimeter-compile-fail` runs `cargo check -p perimeter-violation`
# and asserts non-zero exit code.
#
# If this crate ever compiles successfully, a sub-parser or internal builder
# function has been accidentally made pub, which is a security regression
# per BC-2.11.006 (Security Perimeter postcondition).
#
# This crate is EXCLUDED from the workspace default members (see root Cargo.toml).
# It is NEVER built as part of `cargo build --workspace`.

[dependencies]
prism-query = { path = "../../../crates/prism-query" }
prism-core = { path = "../../../crates/prism-core" }

# Transitive dep version pins — two separate compatibility issues:
#
# 1. alloc-no-stdlib 3.0.0 compat (rustc stable 1.95.0): alloc-stdlib 0.2.3 pulls
#    alloc-no-stdlib 3.0.0, which breaks brotli 8.0.x and brotli-decompressor 5.0.x
#    with E0277 (StandardAlloc: alloc::Allocator<T> not satisfied). Pin to the
#    main-workspace known-good: alloc-stdlib 0.2.2 + alloc-no-stdlib 2.0.4 +
#    brotli-decompressor 5.0.0 + brotli 8.0.2.
#    Remove when alloc-no-stdlib 3.x / alloc-stdlib 0.2.3 compat is fixed upstream.
#
# 2. tinyvec 1.13.0 alloc-without-std compat (stable 1.98.1): tinyvec 1.13.0 uses
#    `use alloc::vec::{self, Vec}` which shadows the `vec!` macro, causing
#    "cannot find macro `vec` in this scope" in this crate's feature resolution.
#    Pin to 1.11.0 (known-good). This crate's Cargo.lock is tracked (see .gitignore
#    note); these = pins provide belt-and-suspenders locking in the manifest itself.
#    Remove when tinyvec fixes the alloc-without-std feature resolution upstream.
brotli = "=8.0.2"
brotli-decompressor = "=5.0.0"
alloc-stdlib = "=0.2.2"
tinyvec = "=1.11.0"

# Empty workspace table: opts this crate out of the parent workspace resolver
# so it can be compiled standalone (required for the CI compile-fail pattern).
[workspace]
