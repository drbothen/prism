[package]
name = "non-exhaustive-violation"
version = "0.1.0"
edition = "2024"
publish = false

# AC-5 (S-PLUGIN-PREREQ-C) — #[non_exhaustive] compile-fail test crate.
#
# PURPOSE: This crate deliberately attempts struct-literal construction of
# `prism_spec_engine` TOML-deserialized types from outside the crate.
# With `#[non_exhaustive]` in place on all 8 types (post AC-5 implementation),
# this MUST NOT compile — E0639 "cannot create non-exhaustive struct/enum variant
# with a struct expression".
#
# RED GATE MECHANISM: Before AC-5 is implemented, `#[non_exhaustive]` is NOT applied
# to these types. Therefore, struct-literal construction SUCCEEDS and this crate
# COMPILES. The CI assertion `cargo check -p non-exhaustive-violation MUST fail`
# does not hold — the check exits 0 = RED GATE.
#
# After AC-5 implementation, `#[non_exhaustive]` is applied to all 8 types.
# Struct-literal construction FAILS with E0639. The CI assertion holds = GREEN.
#
# Named types covered (per AC-5 table in story spec):
#   CredentialRef, SensorSpec, SensorTableDescriptor, FetchStep,
#   ColumnSpec, TableSpec, PaginationConfig, AuthType
#
# This crate is EXCLUDED from the workspace default members (see root Cargo.toml).
# Run standalone: cargo check -p non-exhaustive-violation
# CI pattern: assert non-zero exit code from `cargo check -p non-exhaustive-violation`

[dependencies]
prism-spec-engine = { path = "../../../crates/prism-spec-engine" }
prism-core = { path = "../../../crates/prism-core" }
prism-query = { path = "../../../crates/prism-query" }
# S-5.01-FOLLOWUP-MCP-BOOT: prism-mcp pub types carry #[non_exhaustive] (violations 37-45).
prism-mcp = { path = "../../../crates/prism-mcp" }
# S-5.01-FOLLOWUP-MCP-BOOT: prism-security BoundingDmlOperation + BoundingMetadata (violations 46-47).
prism-security = { path = "../../../crates/prism-security" }
# S-DEMO-001: prism-bin pub types carry #[non_exhaustive] (violations 48-50):
#   48. AdapterAuthStrategy — enum, spec_driven_adapter.rs (CR-001)
#   49. BearerStaticAuthProvider — struct, spec_driven_adapter.rs (CR-006)
#   50. SpecDrivenSensorAdapter — struct, spec_driven_adapter.rs (CR-006)
prism-bin = { path = "../../../crates/prism-bin" }
serde_json = "1"
# S-DEMO-DTU-LIVE-SCENARIO-001-A: ScenarioEntityCatalog is #[non_exhaustive] in prism-dtu-common
# (AC-014). The fixture-gen feature must be active to expose the scenario module.
# This dep addition is required before the ScenarioEntityCatalog import row can resolve
# (the crate currently declares no prism-dtu-* deps; this dep is new for Story A).
prism-dtu-common = { path = "../../../crates/prism-dtu-common", features = ["fixture-gen"] }
# S-DEMO-MULTI-TENANT-DTU-001 (U-006): prism-dtu-demo-server + prism-dtu-harness pub types carry
# #[non_exhaustive] (violations 54-61: 7 E0639 struct [v54–v59 + v61: MultiInstanceConfig,
# InstanceEntry, DemoBindError, MultiInstanceHarness, HarnessEntry, BindError, MultiInstanceServers]
# + 1 E0004 enum [v60: MultiInstanceBindError] → 8 new total; gate 52→60).
prism-dtu-demo-server = { path = "../../../crates/prism-dtu-demo-server" }
prism-dtu-harness = { path = "../../../crates/prism-dtu-harness", features = ["dtu"] }
# S-DEMO-CLAROTY-DAR-001 Task 4 / AC-005: ClarotyDeviceAlertRelation, GetDeviceAlertsBody,
# GetDeviceAlertsResponse carry #[non_exhaustive] (violations v93-v95); dtu feature required to
# expose the types module (gated #[cfg(any(test, feature = "dtu"))]).
prism-dtu-claroty = { path = "../../../crates/prism-dtu-claroty", features = ["dtu"] }
# S-ENGINE-LIMIT-EARLY-STOP-001 AC-009(a): prism-sensors::adapter::FetchOutput carries
# #[non_exhaustive] (violation v98). prism-sensors dep is required for the import to resolve.
prism-sensors = { path = "../../../crates/prism-sensors" }

# Empty workspace table: opts this crate out of the parent workspace resolver.
[workspace]
