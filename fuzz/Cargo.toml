[package]
name = "prism-fuzz"
version = "0.1.0"
edition = "2021"
publish = false

# cargo-fuzz workspace member — must not be included in normal workspace builds.
# Run with: cargo +nightly fuzz run <target>

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"

# prism-security fuzz dependencies (S-1.02 fuzz targets).
prism-security = { path = "../crates/prism-security" }
prism-spec-engine = { path = "../crates/prism-spec-engine" }

# prism-ocsf fuzz dependencies (S-1.04 fuzz targets).
prism-ocsf = { path = "../crates/prism-ocsf" }
serde_json = "1"

# prism-query fuzz dependencies (S-3.01 VP-021 fuzz target).
prism-query = { path = "../crates/prism-query" }

# Prevent this target from being built as part of the workspace
[workspace]

# Silence workspace lint rules for fuzz targets (unwrap is acceptable in harnesses).
[lints.rust]
unexpected_cfgs = "allow"

[lints.clippy]
unwrap_used = "allow"

[[bin]]
name = "fuzz_injection_scanner"
path = "fuzz_targets/fuzz_injection_scanner.rs"
test = false
doc = false

[[bin]]
name = "spec_parser"
path = "fuzz_targets/spec_parser.rs"
test = false
doc = false

[[bin]]
name = "normalize_fuzz"
path = "fuzz_targets/normalize_fuzz.rs"
test = false
doc = false

# S-3.01 VP-021 — PrismQlParser never panics on arbitrary byte input.
[[bin]]
name = "vp021_parse_fuzz"
path = "fuzz_targets/vp021_parse_fuzz.rs"
test = false
doc = false

# S-3.04 VP-037 — AliasResolver::expand() never panics on arbitrary alias graphs.
[[bin]]
name = "vp037_alias_fuzz"
path = "fuzz_targets/vp037_alias_fuzz.rs"
test = false
doc = false

# Transitive dep version pins: alloc-stdlib 0.2.3 pulls alloc-no-stdlib 3.0.0, which
# breaks brotli 8.0.x and brotli-decompressor 5.0.x compilation under both rustc
# stable 1.95.0 and nightly with E0277 (StandardAlloc: alloc::Allocator<T> not
# satisfied). The main workspace Cargo.lock pins alloc-stdlib 0.2.2 + alloc-no-stdlib
# 2.0.4 + brotli-decompressor 5.0.0 + brotli 8.0.2 (all known-good), but fuzz/Cargo.lock
# is gitignored so each CI run fresh-resolves to the latest versions.
# These pins replicate the known-good resolution from the main workspace lockfile.
# Remove when alloc-no-stdlib 3.x / alloc-stdlib 0.2.3 compatibility is fixed upstream.
[dependencies.brotli]
version = "=8.0.2"

[dependencies.brotli-decompressor]
version = "=5.0.0"

[dependencies.alloc-stdlib]
version = "=0.2.2"

# tinyvec 1.13.0 uses `use alloc::vec::{self, Vec}` which shadows the `vec!` macro
# name; a recent nightly compiler change (observed nightly 1.98.1, 2026-09-01) treats
# this shadow as an error under the sanitizer build, causing "cannot find macro `vec`
# in this scope". Pin to 1.11.0 (known-good with nightly ASAN) until tinyvec resolves
# the upstream incompatibility. The main workspace Cargo.lock already pins tinyvec
# 1.11.0; this entry replicates that pin here since fuzz/Cargo.lock is gitignored.
[dependencies.tinyvec]
version = "=1.11.0"
