[workspace]
resolver = "2"
exclude = [
    # BC-2.11.006 v1.10: compile-fail perimeter test — must NOT be in workspace members.
    # Building this crate is expected to fail (visibility violation); including it in
    # the workspace would break every `cargo build --workspace` run.
    "tests/external/perimeter-violation",
    # AC-5 S-PLUGIN-PREREQ-C: compile-fail non-exhaustive violation test — must NOT be in workspace members.
    # Building this crate is expected to fail (E0639 — non-exhaustive struct expression); including
    # it in the workspace would break every `cargo build --workspace` run.
    "tests/external/non-exhaustive-violation",
    # AC-008 PLUGIN-MIGRATION-001-C: WASM plugin scaffold — compiled for wasm32-wasip1 target,
    # not the native host target. Excluded from workspace to avoid cross-compilation issues
    # during `cargo build --workspace` on the default host target. Build explicitly with
    # --target wasm32-wasip1 when compiling to .prx artifact.
    "crates/plugins/ocsf-complex-transforms",
]
members = [
    "crates/ocsf-proto-gen",
    "crates/prism-bin",
    "crates/prism-core",
    "crates/prism-credentials",
    "crates/prism-dtu-common",
    "crates/prism-dtu-crowdstrike",
    "crates/prism-dtu-claroty",
    "crates/prism-dtu-cyberint",
    "crates/prism-dtu-armis",
    "crates/prism-dtu-threatintel",
    "crates/prism-dtu-nvd",
    "crates/prism-dtu-pagerduty",
    "crates/prism-dtu-jira",
    "crates/prism-dtu-slack",
    "crates/prism-dtu-demo-server",
    "crates/prism-mcp",
    "crates/prism-ocsf",
    "crates/prism-security",
    "crates/prism-spec-engine",
    # PLUGIN-MIGRATION-001-E: in-repo .prx WASM plugin for CrowdStrike OAuth2 auth.
    # Compiled as cdylib for wasm32 target; included in workspace for cargo check.
    "crates/prism-spec-engine/plugins/crowdstrike-oauth2",
    "crates/prism-sensors",
    "crates/prism-storage",
    "crates/prism-audit",
    "crates/prism-query",
    "crates/prism-customer-config",
    "crates/prism-dtu-harness",
]

# NOTE: dtu feature declared per-crate starting with S-6.06 (prism-dtu-common).
# NO [features] at workspace root — per v1.4 spec.

# Workspace-shared dependencies — WASM guest plugin crates inherit via { workspace = true }.
# Only deps shared by plugin crates live here to avoid forcing all crates to use workspace pins.
# (PLUGIN-MIGRATION-001-E F-LP1-MED-013: crowdstrike-oauth2 plugin uses serde via workspace)
[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# F-LP2-HIGH-002: WASM guest binding generator for crowdstrike-oauth2 plugin.
# Replaces manual #[link] extern blocks with type-safe macro-generated bindings.
# Version pinned to the entry already in Cargo.lock (wasmtime transitive dep).
wit-bindgen = "0.51.0"

[workspace.lints.clippy]
await_holding_lock = "deny"
unwrap_used = "deny"
expect_used = "deny"
