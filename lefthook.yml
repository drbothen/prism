pre-commit:
  parallel: true
  commands:
    fmt:
      glob: "*.rs"
      run: cargo fmt --all --check
    clippy:
      glob: "*.rs"
      run: cargo clippy --all-features -- -D warnings
    # layout: runs the full workspace scan once per commit when any crates/** file is staged.
    # Runtime must be under 1 second for the 24 crates/*/ subdirectories with Cargo.toml (ADR-012 §2.5, BC-3.7.001 precondition 4).
    layout:
      glob: "crates/**"
      run: scripts/check-crate-layout.sh

pre-push:
  commands:
    check:
      # Human-directed optimisation (2026-06-13): docs/asset-only pushes skip the full
      # `just check` workspace gate (~20 min, 4273 tests) because they cannot affect
      # build correctness.  This is a PROVABLY FAIL-CLOSED design:
      #
      #   - Skip is triggered ONLY when the push file set is non-empty AND every file
      #     matches the narrow extension-based allowlist below (positive allowlist, not
      #     denylist).
      #   - Empty file set → gate RUNS (fail-closed: can't determine content, don't skip).
      #   - Any file NOT matching the allowlist → gate RUNS (code/build file present).
      #   - Detection failure / git error → gate RUNS (fail-closed).
      #   - @{push} unresolvable (first push, no upstream tracking branch) → gate RUNS
      #     (fail-closed: cannot determine the COMPLETE set of commits being pushed, so
      #     we do NOT fall back to a tip-only range that would under-count; if we can't
      #     know everything being pushed, we must run the gate).
      #
      # Allowlist is EXTENSION-BASED ONLY (path prefix does NOT grant bypass):
      #   *.md, *.tape, *.webm, *.gif, *.png, *.jpg, *.jpeg, *.svg, *.ico
      #   Root-level exact names: LICENSE, LICENSE-MIT, LICENSE-APACHE, NOTICE, .mailmap
      #
      # Notable: docs/*.sh, docs/**/*.rs, docs/**/*.toml are NOT in the allowlist.
      # The docs/ directory contains real runner scripts (.sh) that affect correctness;
      # path location NEVER overrides the extension check.
      #
      # Everything else (*.rs, Cargo.toml, Cargo.lock, *.sh, Justfile, lefthook.yml,
      # .github/workflows/*, rust-toolchain.toml, *.toml, etc.) triggers the full gate.
      skip:
        - run: |
            set -euo pipefail
            # Collect push file set from the full upstream push range.
            # @{push} resolves when a remote tracking branch exists for this branch.
            # FAIL-CLOSED: if @{push} cannot be resolved (first push / no upstream),
            # we CANNOT determine the complete set of commits being pushed — do NOT
            # fall back to a tip-only range (HEAD~1..HEAD) that would under-count a
            # multi-commit first push.  Exit non-zero → gate RUNS.
            FILES=$(git diff --name-only "@{push}..HEAD" 2>/dev/null) || exit 1
            # Fail-closed: if file set is empty we cannot determine content — run gate.
            [ -n "$FILES" ] || exit 1
            # Extension-based allowlist (positive allowlist — NOT a denylist).
            # A file is skip-eligible ONLY if its EXTENSION is in this set.
            # Path prefix (e.g. docs/) does NOT grant a bypass — docs/*.sh still runs gate.
            #
            # Extension matches: *.md *.tape *.webm *.gif *.png *.jpg *.jpeg *.svg *.ico
            # Exact root-level filename matches (anchored start AND end):
            #   LICENSE, LICENSE-MIT, LICENSE-APACHE (^LICENSE(-[A-Z0-9]+)?$ — no trailing ext)
            #   NOTICE, .mailmap
            #
            # Anything else (*.rs, *.sh, *.toml, Cargo.lock, Justfile, lefthook.yml,
            # .github/**, rust-toolchain.toml, docs/**/*.sh, etc.) → gate runs.
            ASSET_EXT_PATTERN='\.(md|tape|webm|gif|png|jpg|jpeg|svg|ico)$'
            EXACT_NAME_PATTERN='^(LICENSE(-[A-Z0-9]+)?|NOTICE|\.mailmap)$'
            # grep -vE prints lines NOT matching the allowlist.
            # non-empty output means at least one file is not skip-eligible → gate runs.
            NON_DOCS=$(printf '%s\n' "$FILES" \
                       | grep -vE "$ASSET_EXT_PATTERN" \
                       | grep -vE "$EXACT_NAME_PATTERN" || true)
            # If there are any non-allowlist files, exit 1 → skip NOT triggered → gate runs.
            [ -z "$NON_DOCS" ] || exit 1
            # Every file in the push matched the asset allowlist → exit 0 → gate skipped.
      run: just check

# pre-tag hook: runs semver-checks, audit, and deny before every `git tag` invocation.
# Requires lefthook >= 1.6. Verify with: lefthook --version
# If your lefthook version is < 1.6 (pre-tag not supported), run manually before tagging:
#   just semver-checks && just audit && just deny
pre-tag:
  commands:
    semver-checks:
      run: just semver-checks
    audit:
      run: just audit
    deny:
      run: just deny
