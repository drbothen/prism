# S-DEMO-002: E2E subprocess smoke test profile.
# Un-ignores ALL #[ignore]'d prism-bin tests (currently 15):
#   - 13 subprocess smoke tests in e2e_smoke.rs
#   - 2 keyring subprocess tests in bc_2_03_007_credential_set_{no_echo,org_id_keyed}.rs
#
# Canonical CI command (source of truth: .github/workflows/e2e.yml — OBS-002):
#   cargo nextest run -p prism-bin --profile e2e --run-ignored ignored-only --no-tests=fail --test-threads 1
#
# Use `--run-ignored ignored-only` (not `all`) to run ONLY the #[ignore]'d E2E tests
# without also running the non-ignored prism-bin test suite (which requires no DTU).
# Use `--run-ignored all` only when you want both ignored and non-ignored tests together.
#
# Note: nextest does not support a `run-ignored` toml config key; the flag must be
# passed at the CLI. The `e2e` profile provides the timeout + failure output settings.
#
# --test-threads 1: serializes tests to prevent Secret Service "default" collection
# races when multiple keyring tests run in parallel (canonical secret-service-rs pattern).
#
# Timeout: 120s per test — subprocess launch + ready polling + 4 sensor queries
# can take up to 60s on cold CI runners; 120s provides 2x headroom.
# fail-fast: true for E2E — one subprocess deadlock aborts the suite immediately
# to prevent CI queue starvation.
[profile.e2e]
fail-fast = true
retries = 1
slow-timeout = { period = "120s", terminate-after = 1 }
final-status-level = "all"
failure-output = "immediate"

[profile.e2e.junit]
path = "junit.xml"
store-success-output = false
store-failure-output = true

[profile.ci]
fail-fast = false
retries = 1
# slow-timeout: flag tests that run over 60 s in CI output; terminate-after = 2
# gives 120 s total (2 × 60 s), which is safely above the ~75 s proptest max
# (proptest_BC_3_2_002_vp_01_cross_org_isolation at 1000 cases) while still
# hard-killing genuinely hung tests rather than stalling CI indefinitely.
#
# Updated 2026-05-06 (PR #127): The original ~8-min runtime was caused by two issues:
#   1. Per-iteration TempDir::new() + Runtime::new() overhead (eliminated by
#      LazyLock<TempDir> + LazyLock<Runtime> shared across iterations).
#   2. Argon2id running at opt-level = 0 in debug builds (~1.3 s/iteration even
#      with test params m=256, t=1, p=1). Fixed by adding opt-level = 3 for the
#      argon2/aes-gcm crypto stack in .cargo/config.toml [profile.dev.package.*].
#      This compiles only the listed dependency crates at full optimization while
#      leaving application code at opt-level = 0 for fast incremental recompilation.
#
# Measured results (PR #127):
#   Before: ~342 s at 256 cases | ~8 min at 1000 cases (estimated)
#   After:  ~19 s at 256 cases  | ~75 s at 1000 cases
#   Speedup: ~18x at 256 cases, ~6-7x at 1000 cases
#
# terminate-after = 2: 2 × 60 s = 120 s hard kill ceiling. The 75 s proptest
# worst-case has 45 s of headroom. `retries = 1` (active) is the safety net
# for CI runner variance / false kills; a deterministic failure still fails
# both attempts and is reported.
slow-timeout = { period = "60s", terminate-after = 2 }
final-status-level = "slow"
failure-output = "immediate-final"

[profile.ci.junit]
path = "junit.xml"
store-success-output = false
store-failure-output = true

# S-PERF-GATE-001: Local pre-push profile — used by `just check`.
# Mirrors the [profile.e2e] retries + terminate-after pattern already in this file.
# slow-timeout: flag tests over 90 s in output; terminate-after = 2 gives 180 s total,
# which is above the ~75 s proptest worst-case with 2x headroom.
# fail-fast = false: show all failing tests in a single run, not just the first.
# final-status-level = "slow": surface slow tests in output for local diagnosis.
# retries = 1: one automatic retry to absorb transient subprocess flakes (e.g.,
# prism-bin signal_handlers tests under parallel RocksDB mmap pressure).
[profile.prepush]
fail-fast = false
slow-timeout = { period = "90s", terminate-after = 2 }
retries = 1
final-status-level = "slow"
failure-output = "immediate"

# S-PERF-GATE-001: Serialize prism-bin signal_handlers subprocess tests.
# These tests spawn prism as a subprocess and open RocksDB. Under high parallelism
# they can hit SIGSEGV due to concurrent mmap pressure from multiple RocksDB instances.
# max-threads = 1 ensures they run single-threaded; retries = 1 (set at profile level)
# is the secondary safety net for any remaining transient flake.
#
# S-PERF-GATE-002: adv-p02-serial group for adv_p02_e2e_pushdown_pipeline_test.
# Each of the 8 tests in this binary constructs its own DTU clone (CrowdStrike or
# Armis), binds an Axum server on a random port, and opens an in-process RocksDB.
# Running these tests in parallel oversubscribes CPU/file-descriptors and causes
# non-deterministic filter_strings assertion failures (ADV-P02-CRIT-001 correctness,
# AC-005, AC-007). max-threads = 1 serializes the binary, eliminating the race.
#
# S-PERF-GATE-003: bc-2-01-013-serial group for bc_2_01_013_spec_driven_adapter.
# Each test starts its own wiremock::MockServer (Axum HTTP listener + Tokio runtime)
# and issues real HTTP requests to it. Under parallel execution, multiple concurrent
# MockServer startups contend for OS-level socket setup and can inflate wall-clock
# from ~2-8s per test to 60-300s per test on loaded machines (diagnosis §4.1).
# Root cause is per-test wiremock startup contention, not shared state — serialization
# alone is sufficient (no reset endpoint needed, unlike adv_p02 which required
# LazyLock fixtures). max-threads = 1 eliminates the concurrent-startup race.
[test-groups]
serial-subprocess = { max-threads = 1 }
adv-p02-serial = { max-threads = 1 }
bc-2-01-013-serial = { max-threads = 1 }
# S-PERF-GATE-004: DTU HTTP-server concurrency cap.
# Each prism-dtu-* test binary launches an Axum HTTP server + tokio multi-threaded
# runtime + RocksDB on every test case. Under the default nextest thread budget (one
# process per logical core), up to 16 binaries run concurrently on this machine; each
# binary's tokio runtime spawns ~num_cpus worker threads, yielding ~256 concurrent
# threads competing for 16 cores (~16x oversubscription). This inflates per-test
# wall-clock by 10-300x and causes stage-clock drift in scenario-progression tests
# (bc_2_06_019): elapsed time crosses the 60s stage-0 threshold before the assertion
# fires, causing the stage-0 "primary device ABSENT" check to see stage-1 data.
# Confirmed root cause: armis bc_2_06_019 measured at 55.846s under full workspace load
# vs 0.412s in isolation (commit 0a9fc5e7 band-aid comment).
#
# max-threads = 4: limits concurrent DTU binaries to 4.
#   - Dev machine (16 cores): 4 binaries × 16 tokio threads = 64 active threads / 16
#     cores = 4x oversubscription — manageable; CPU contention drops dramatically.
#   - CI runner (ubuntu-latest, 2 vCPU): 4 binaries × 2 tokio threads = 8 threads / 2
#     cores = 4x — acceptable; previously the default was already ~2-3x on 2 vCPU so
#     this is a marginal increase but eliminates the full-workspace fan-out spike.
#   - macOS CI runner (3 vCPU): 4 binaries × 3 tokio threads = 12 / 3 = 4x — same.
#
# This group applies to ALL 12 prism-dtu-* packages (194 test binaries total across
# armis/claroty/crowdstrike/cyberint/common/harness/demo-server/jira/nvd/pagerduty/
# slack/threatintel). It does NOT touch the existing adv-p02-serial / bc-2-01-013-serial
# / serial-subprocess groups — those three are all in prism-bin, not prism-dtu-*, so
# there is no overlap and no group-composition ambiguity.
#
# Observed outcome: all DTU bc_2_06_019 scenario tests — including armis — pass
# with now-10 (50s stage-0 budget). S-PERF-GATE-005 (#210) wired clone graceful
# shutdown so clone.stop() completes in <20ms; the now+30 armis band-aid is removed.
dtu-cap = { max-threads = 4 }
# S-PERF-GATE-007: WASMtime-heavy spec-engine + ocsf + prism-bin binaries.
# wasmtime v44 + wasm_component_model + epoch_interruption triggers Cranelift JIT
# on every PluginRuntime::new() call. Under default concurrency (~10-16 concurrent
# binaries), Cranelift serializes on global compiler state → per-init cost inflates
# from ~1-2s (isolated) to ~8-9s (under load), ~5-9x oversubscription.
# max-threads = 4 limits concurrent WASMtime binaries to 4, reducing Cranelift
# contention back toward isolation cost.
spec-engine-wasm-cap = { max-threads = 4 }
# S-PERF-GATE-007: HTTP/wiremock-heavy spec-engine binaries + bc_2_11_007 gap.
# pipeline_http_integration, pipeline_oauth_retry, bc_2_16_002_crowdstrike_two_step
# spin up wiremock::MockServer per test (OS socket contention at high concurrency).
# The bc_2_11_007 pushdown test starts in-process CrowdStrike + Armis DTU clones but
# lives in prism-spec-engine — NOT matched by dtu-cap package(/^prism-dtu-/) filter.
# This group closes that gap and caps the wiremock binaries simultaneously.
spec-engine-http-cap = { max-threads = 4 }
# S-PERF-GATE-008: Serialize wasmtime-heavy spec-engine + prism-ocsf binaries.
# With the on-disk compilation cache enabled in PluginRuntime::new_with_audit_sink
# (ADR-049 D1), warm cache hits skip Cranelift JIT entirely; see ADR-049 / S-PERF-GATE-008
# for measured figures. max-threads=1 serializes the cold-start warm-up run so each .prx
# file is compiled once, then all subsequent binaries load from cache.
# For the degradable path (ADR-049 D3, cache unavailable), max-threads=1 also
# bounds total WASMtime CPU overhead — correctness is unaffected.
# Binaries (all call PluginRuntime::new_with_audit_sink with a real .prx file):
#   plugin_tests, crowdstrike_oauth2_plugin_tests, enrichment_pivot_002_tests,
#   plugin_integration_tests, infusion_tests (prism-spec-engine)
#   spec_driven_mapper_fixtures (prism-ocsf)
# nextest first-match-wins: the [[overrides]] stanza for spec-engine-wasmtime must
# appear BEFORE the spec-engine-wasm-cap stanza so the 6 wasmtime binaries resolve
# to max-threads=1 on first match; plugin_boot_tests/infusion_boot_integration are
# not in the wasmtime filter and fall through to spec-engine-wasm-cap (max-threads=4).
spec-engine-wasmtime = { max-threads = 1 }

[[profile.prepush.overrides]]
# S-PERF-GATE-004: cap all prism-dtu-* test binaries to 4 concurrent processes.
# Placed first; the per-binary overrides below target prism-bin exclusively (no
# package overlap with prism-dtu-*), so there is no group conflict.
# (nextest test-group is a scalar field: when multiple overrides match the same
# test, the first matching override wins — only one group assignment takes effect.)
filter = 'package(/^prism-dtu-/)'
test-group = 'dtu-cap'

[[profile.prepush.overrides]]
filter = 'binary(signal_handlers)'
test-group = 'serial-subprocess'

[[profile.prepush.overrides]]
filter = 'binary(adv_p02_e2e_pushdown_pipeline_test)'
test-group = 'adv-p02-serial'

[[profile.prepush.overrides]]
filter = 'binary(bc_2_01_013_spec_driven_adapter)'
test-group = 'bc-2-01-013-serial'

[[profile.prepush.overrides]]
# S-PERF-GATE-008: Serialize wasmtime-heavy test binaries via compilation cache group.
# nextest first-match-wins: this stanza appears BEFORE spec-engine-wasm-cap so the 6
# wasmtime binaries resolve to spec-engine-wasmtime (max-threads=1) on first match.
# plugin_boot_tests + infusion_boot_integration are NOT in this filter and fall
# through to spec-engine-wasm-cap (max-threads=4) in the stanza below.
filter = 'binary(plugin_tests) | binary(crowdstrike_oauth2_plugin_tests) | binary(enrichment_pivot_002_tests) | binary(plugin_integration_tests) | binary(infusion_tests) | binary(spec_driven_mapper_fixtures)'
test-group = 'spec-engine-wasmtime'

[[profile.prepush.overrides]]
# S-PERF-GATE-007: cap WASMtime-heavy binaries at 4 concurrent threads.
# First-match-wins: the 6 spec-engine-wasmtime binaries already matched the stanza
# above; plugin_boot_tests + infusion_boot_integration (not in wasmtime filter) land
# here and get max-threads=4.
filter = 'binary(plugin_integration_tests) | binary(plugin_tests) | binary(crowdstrike_oauth2_plugin_tests) | binary(enrichment_pivot_002_tests) | binary(spec_driven_mapper_fixtures) | binary(plugin_boot_tests) | binary(infusion_boot_integration)'
test-group = 'spec-engine-wasm-cap'

[[profile.prepush.overrides]]
# S-PERF-GATE-007: cap HTTP/wiremock-heavy binaries + close bc_2_11_007 DTU-cap gap.
filter = 'binary(pipeline_http_integration) | binary(pipeline_oauth_retry) | binary(bc_2_11_007_pushdown_test) | binary(bc_2_16_002_crowdstrike_two_step)'
test-group = 'spec-engine-http-cap'

[[profile.ci.overrides]]
# S-PERF-GATE-004: cap all prism-dtu-* test binaries to 4 concurrent processes.
filter = 'package(/^prism-dtu-/)'
test-group = 'dtu-cap'

[[profile.ci.overrides]]
filter = 'binary(signal_handlers)'
test-group = 'serial-subprocess'

[[profile.ci.overrides]]
filter = 'binary(adv_p02_e2e_pushdown_pipeline_test)'
test-group = 'adv-p02-serial'

[[profile.ci.overrides]]
filter = 'binary(bc_2_01_013_spec_driven_adapter)'
test-group = 'bc-2-01-013-serial'

[[profile.ci.overrides]]
# S-PERF-GATE-008: Serialize wasmtime-heavy test binaries via compilation cache group.
# nextest first-match-wins: this stanza appears BEFORE spec-engine-wasm-cap so the 6
# wasmtime binaries resolve to spec-engine-wasmtime (max-threads=1) on first match.
# plugin_boot_tests + infusion_boot_integration are NOT in this filter and fall
# through to spec-engine-wasm-cap (max-threads=4) in the stanza below.
filter = 'binary(plugin_tests) | binary(crowdstrike_oauth2_plugin_tests) | binary(enrichment_pivot_002_tests) | binary(plugin_integration_tests) | binary(infusion_tests) | binary(spec_driven_mapper_fixtures)'
test-group = 'spec-engine-wasmtime'

[[profile.ci.overrides]]
# S-PERF-GATE-007: cap WASMtime-heavy binaries at 4 concurrent threads.
# First-match-wins: the 6 spec-engine-wasmtime binaries already matched the stanza
# above; plugin_boot_tests + infusion_boot_integration (not in wasmtime filter) land
# here and get max-threads=4.
filter = 'binary(plugin_integration_tests) | binary(plugin_tests) | binary(crowdstrike_oauth2_plugin_tests) | binary(enrichment_pivot_002_tests) | binary(spec_driven_mapper_fixtures) | binary(plugin_boot_tests) | binary(infusion_boot_integration)'
test-group = 'spec-engine-wasm-cap'

[[profile.ci.overrides]]
# S-PERF-GATE-007: cap HTTP/wiremock-heavy binaries + close bc_2_11_007 DTU-cap gap.
filter = 'binary(pipeline_http_integration) | binary(pipeline_oauth_retry) | binary(bc_2_11_007_pushdown_test) | binary(bc_2_16_002_crowdstrike_two_step)'
test-group = 'spec-engine-http-cap'

# S-DEMO-004: Multi-org × multi-sensor isolation smoke test profile.
# Un-ignores E2E-MULTI-001-tagged tests in e2e_multi_org.rs (currently 10 tests):
#   - AC-001..AC-010 multi-org isolation assertions.
#
# Canonical CI command:
#   cargo nextest run -p prism-bin --profile e2e-multi-org --run-ignored ignored-only \
#     --no-tests=fail --test-threads 1
#
# Use `--run-ignored ignored-only` to run ONLY the #[ignore]'d multi-org E2E tests
# without re-running the standard prism-bin test suite.
#
# --test-threads 1: serializes tests to prevent Secret Service races when multiple
# credential-touching tests run in parallel (same pattern as [profile.e2e]).
#
# Timeout: 180s per test — multi-org setup (8 DTU clone instances + overlay wiring +
# 3-org prism-bin boot + 10 multi-org MCP queries) is heavier than single-org smoke.
# 180s provides 2x headroom over the expected ~90s worst-case on cold CI runners.
# fail-fast: true — one subprocess deadlock aborts the suite to prevent CI queue starvation.
[profile.e2e-multi-org]
fail-fast = true
retries = 1
slow-timeout = { period = "180s", terminate-after = 1 }
final-status-level = "all"
failure-output = "immediate"
# Restrict to the e2e_multi_org test binary only — prevents E2E-001-tagged tests in
# e2e_smoke.rs from being un-ignored by --run-ignored ignored-only (those tests require
# `prism-dtu-demo-server` which is not built in this profile's context).
# binary(e2e_multi_org) matches the test binary compiled from tests/e2e_multi_org.rs.
default-filter = "binary(e2e_multi_org)"

[profile.e2e-multi-org.junit]
path = "junit-multi-org.xml"
store-success-output = false
store-failure-output = true
