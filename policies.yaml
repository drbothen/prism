      `updated:` frontmatter fields. ACTIVE-DURING-TRANSITION: A version-pin pattern
      grep against artifacts touched in the current burst is REQUIRED until BOTH
      S-MAINT-ANTIPIN-SWEEP-001 AND S-MAINT-ANTIPIN-SWEEP-002 have merged AND
      records-lint L11 is deployed. The premise that "there are no prose pins to grep for"
      was false at the time of the prior retirement — POL-39's own rationale acknowledges
      approximately 5,679 grandfathered pins across 219 files that are explicitly
      grandfathered pending the sweep stories. The replacement mechanisms (phantom-anchor
      check, input-hash refresh) do not detect in-body prose pin staleness in burst-touched
      artifacts, as verified against BC-2.02.014 in pass-71. The step was briefly marked
      RETIRED on 2026-07-30 in burst human-direction-pol39-register-pol23-amend (TOMBSTONE
      of that transition preserved in the first verification step); that retirement is
      reversed by F-WASE-P71-HIGH-003.
