  - id: 29
    name: within_fb_sibling_sweep_discipline
    description: |
      When a fix-burst (FB) modifies a value, structure, or claim in one document,
      the same burst MUST sweep ALL sibling sites in the workspace that reference
      that value/structure/claim and update them to the post-fix canonical form.

      For multi-value-class FBs (bursts that bump multiple artifact versions or
      change multiple distinct canonical values), the sibling-sweep procedure
      MUST be applied INDEPENDENTLY for EACH value class. Grep evidence MUST be
      provided per class, not aggregated.

      Sibling sites include: (a) live-narrative citations in other artifacts
      that pin the changed value or version; (b) sibling-class artifacts of
      the same kind that share the same change-pattern; (c) frontmatter fields
      that mirror body changes.

      The fix-burst is NOT considered complete until sibling-sweep is performed
      and documented in the §Changelog narrative or PO/architect handoff note
      for EACH value class changed.

      Codification basis: 19+ recurrences across S-PLUGIN-PREREQ-E cascade
      (passes 37-62) of single-value-class sweep gaps; F-LP64-HIGH-001 at
      pass-64 demonstrated multi-value-class enforcement gap (FB51 swept
      D7 pins but did not sweep error-taxonomy pins from same burst).

      Three structural dimensions require explicit per-dimension discharge in every
      fix-burst. A content-text grep alone is NOT sufficient discharge for any of
      these — each dimension covers failure modes that string-grep structurally
      cannot reach:

      (1) Named-twin dimension: When the edited artifact has a named twin (same split
      event, shared subsystem+capability, or explicitly documented as a pair), the
      fixer MUST name the twin and sweep it even when the changed string is absent
      from it. Absence of the changed string in the twin is the failure mode, not
      evidence of cleanliness. Precedent: LOCAL pass-66 CRIT-001 — BC-2.01.018
      Alerts had cursor language removed; twin BC-2.01.006 Assets kept it; the same
      burst added a false cross-reference asserting Assets "retains" cursor pagination.

      (2) Downstream-copy dimension: When any section of the edited artifact is
      verbatim-copied into a downstream artifact by a later agent leg, the fixer
      MUST sweep both the section and its downstream copy in the SAME burst.
      Precedent: LOCAL pass-66 HIGH-002 — ADR-056 v0.2 corrected §D3/D4/D5/D9 but
      not §D8, which product-owner copies verbatim into BC-2.16.002; the corrected
      ADR propagated its own pre-correction phrasing into the downstream BC.

      (3) Mandate-anchor dimension: Any MUST written into a BC or spec must name the
      story + AC + Red Gate test that executes it, or record an explicit deferral
      against a real existing story ID per Canonical Principle Rule 3. An unanchored
      MUST cannot be tracked and will be re-minted as a finding on every subsequent
      pass. Precedent: LOCAL pass-66 HIGH-003 + MED-001 — two §TOML Contract MUST
      blocks with zero story anchors authored in the same amendment that correctly
      anchored EC-02-014 to a real story.

      Discharge reporting: the fixer MUST include a per-dimension verdict (SWEPT /
      N/A with rationale) for all three dimensions in the §Changelog narrative or
      commit note. The orchestrator MUST include all three dimension clauses in every
      fix-burst dispatch brief. The adversary independently verifies each discharge.
      See CLAUDE.md Operational Discipline TDs §TD-VSDD-097 for companion codification.
    adopted: FB50-D-672-2026-05-17
    severity: HIGH
    enforced_by: [adversary-prompt, product-owner-self-check, architect-self-check, state-manager]
    scope: [bc, vp, story, hs, adr, architecture, prd, error-taxonomy, capabilities, invariants, story-index, bc-index, vp-index, arch-index]
    codified_at: null
    lint_hook: null
    changelog:
      - version: "1.38 → 1.39"
        date: 2026-07-27
        burst: LOCAL-pass-66-three-dimension-amendment
        change: "v1.38 → v1.39 2026-07-27 — three-dimension structural amendment: named-twin (step 9a), downstream-copy (step 9b), mandate-anchor (step 9c) dimensions added to description and verification_steps. Per-dimension discharge reporting required. Precedent: LOCAL pass-66 CRIT-001 (twin artifact), HIGH-002 (downstream copy), HIGH-003+MED-001 (mandate anchor). Human-approved structural intervention 2026-07-27. Reference: CLAUDE.md §TD-VSDD-097."
      - version: "1.28 → 1.29"
        date: 2026-05-22
        burst: D-778-codification-burst-1
        change: "v1.28 → v1.29 2026-05-22 — added step 8f crates/ scope mandate (A1 from session-review-2026-05-22.md per D-777)."
    verification_steps:
      - "Enumerate EVERY value/structure/claim being changed in this FB (e.g., every frontmatter version bump corresponds to a value class requiring sweep)."
      - "For EACH value class identified in step 1, record the OLD canonical form."
      - "For EACH value class, run workspace grep across .factory/stories/, .factory/specs/behavioral-contracts/, .factory/specs/verification-properties/, .factory/specs/prd-supplements/, .factory/specs/architecture/, .factory/holdout-scenarios/, .factory/specs/domain-spec/. Record pre-edit hit count."
      - "Step 3a (per-value-class variant-form enumeration): For each value class with 3+ prior cascade recurrences, enumerate ALL known variant forms and apply per-variant grep. Known recidivist classes and their variant-form registries: (a) `error-taxonomy` version pin — variant forms: bare `error-taxonomy v[0-9]+\\.[0-9]+`, with-md `error-taxonomy\\.md v[0-9]+\\.[0-9]+`, backtick-quoted `\\`error-taxonomy(\\.md)?\\` v[0-9]+\\.[0-9]+`; recommended canonical grep: `rg \"error-taxonomy(\\.md)? v[0-9]+\\.[0-9]+\"` AND `rg \"\\`error-taxonomy(\\.md)?\\` v[0-9]+\\.[0-9]+\"`. (b) ADR-026 D7 pin — variant forms: bare `ADR-026 D7 v[0-9]+\\.[0-9]+`, embedded-section `ADR-026 §D7 v[0-9]+\\.[0-9]+`, parenthesized `(ADR-026 D7 v[0-9]+\\.[0-9]+)`, prose-prefixed `per ADR-026 D7 v[0-9]+\\.[0-9]+`; recommended canonical grep: `rg \"ADR-026 (§)?D7 v[0-9]+\\.[0-9]+\"`; 17+ cascade recurrences (FB44/FB45/FB50; F-LP14/F-LP56; OBS-LP62-002 17-site sweep). (c) BC-2.16.002 catalog cite — variant forms: canonical `BC-2.16.002 §Postconditions (Canonical Structured Event Catalog bullet, v[0-9]+\\.[0-9]+) row [0-9]+`, no-parens `BC-2.16.002 §Postconditions Canonical Structured Event Catalog v[0-9]+\\.[0-9]+ row [0-9]+`, bare `BC-2.16.002 v[0-9]+\\.[0-9]+ row [0-9]+`, close-paren-mid-row `bullet, v[0-9]+\\.[0-9]+ row [0-9]+)`; recommended canonical grep: `rg \"BC-2\\.16\\.002.*v[0-9]+\\.[0-9]+.*row [0-9]+\"`; 9+ cascade recurrences (FB12/FB14/FB15/FB16/FB17; F-LP13/F-LP15/F-LP16/F-LP17/F-LP18). New recidivist classes added on 3rd recurrence per the policy's own threshold criterion (NOT deferred to 'next recurrence'). Variant-form registry maintained in policies.yaml POL-29 step 3a."
      - "For each live-narrative hit (excluding §Changelog rows per POL-26), apply the canonical update to the post-fix form."
      - "Re-run the workspace grep post-edit. Live-narrative hit count must be 0 for each value class."
      - "Sibling-CLASS sweep: when fixing an ordering violation (POL-26) or phrasing violation in one artifact, also sweep all sibling-class artifacts of the same kind."
      - "Embed sweep report in the FB commit message body or §Changelog row narrative for EACH value class, enumerating: value class, pre-grep count, sites updated with line numbers, post-grep count = 0."
      - "Step 8 (STRENGTHENED): State-manager pre-commit verification — confirm sweep reports are present AND empirically validate post-grep counts against actual workspace state for each value class changed in the FB. Re-execute the per-variant greps from step 3/3a and verify reported `post-grep N` counts match actual workspace state. If reported counts diverge from actual, REJECT the burst and request PO/architect re-sweep before committing. (Addresses OBS-LP65-002 TD-VSDD-059 paper-fix detection signal: FB52 reported post-grep 0 but actual was 1 — variant-form gap.)"
      - "Step 8a (v1.17 amendment — diff-derived enumeration): Before applying step 8's empirical post-grep validation, run `git diff --staged --name-only` to enumerate ALL touched files in this burst. For each touched file with a `version:` or `lifecycle_status:` frontmatter field, extract pre-edit AND post-edit frontmatter versions via `git show :0:<path>` vs `git show HEAD:<path>`. For any version that CHANGED (including changes introduced as side-effect of body edits, not just declared frontmatter bumps), enumerate the corresponding value class per POL-29 step 3a registry and run the canonical grep. If the canonical grep returns ANY live-narrative hit (excluding §Changelog rows TD-VSDD-091-exempt), REJECT the commit and request sibling-sweep before re-attempting. This eliminates reliance on FB author declaration and detects side-effect bumps automatically. Closes F-LP68-HIGH-001 META-pattern: state-manager can no longer miss side-effect value-class bumps that the FB author did not declare."
      - "Step 8b (v1.18 amendment — TRANSITIVE CLOSURE on step 8a): After step 8a's empirical post-grep validation completes (and after any state-manager pin advancement work), re-extract `git diff --staged --name-only` to detect ALL touched files in the current staged state (this set may have grown if state-manager performed pin advancement during sweep). For each touched file with a `version:` or `lifecycle_status:` frontmatter field, compare base-commit frontmatter version vs current staged version. If ANY version changed AND the file is a source-of-truth for a POL-29 step 3a registry value class, run canonical grep for ALL intervening predecessor versions (not just the most recent — e.g., if ADR-026 advanced base→v1.19→v1.20→v1.21, check pin staleness at v1.19 AND v1.20). If ANY live-narrative hit found (excluding §Changelog rows TD-VSDD-091 exempt), apply pin advancement to the current source-of-truth version, bump artifact frontmatter versions cascadingly, then re-loop step 8b (transitive closure iteration). Fixed-point reached when an iteration produces ZERO new pin advancements. MAX iterations: 5 — if not converged, REJECT commit and request human intervention. Closes F-LP74-MED-001 META-gap: state-manager step 8a single-pass enforcement misses transitively-introduced staleness within own application cycle (FB56b→FB57→pass-74 demonstration: ADR-026 bumped v1.18→v1.19→v1.20→v1.21 across same-or-adjacent commits without pin cascade)."
      - "Step 8c (v1.19 amendment — EXPLICIT PER-VARIANT GREP ENUMERATION in step 8b iteration loop): When step 8b transitive closure iterates and a recidivist-class source-of-truth version change is detected, the state-manager MUST run each variant-form grep INDIVIDUALLY per step 3a registry (NOT a single canonical/combined regex that aggregates variants). For class (a) error-taxonomy, run 3 separate greps: (1) `rg \"error-taxonomy v[predecessor]\"` bare; (2) `rg \"error-taxonomy\\.md v[predecessor]\"` with-md; (3) `rg \"\\`error-taxonomy(\\.md)?\\` v[predecessor]\"` backtick-quoted. For class (b) ADR-026 D7, run 4 separate greps per the registry's enumerated variant forms. For class (c) BC-2.16.002, run 4 separate greps per registry. Report per-variant pre/post hit counts in the closure narrative. Combined/canonical regex is FORBIDDEN as the sole verification — it has been empirically shown (F-LP75-HIGH-001) that combined regex misses variants when the regex syntax doesn't capture the variant-form's escape/quoting characters. Closes F-LP75-HIGH-001 META-META-PATTERN where step 8b text was correct but execution discipline used combined regex."
      - "Step 3d (v1.20 amendment — STRUCTURAL-TABLE-COMPLETENESS sibling-sweep): When a story's `crates_touched:` frontmatter is amended (added or removed crate), state-manager MUST verify per-crate-sweep that BOTH §File Structure Requirements table AND §Token Budget Estimate table contain at least one row per touched crate. If `crates_touched` contains [crate-N] but §FSR has zero rows matching `crates/[crate-N]/`, REJECT commit and request PO to add §FSR row(s). Same for §Token Budget. Closes F-LP78-MED-001 META-class: structural-table-completeness gap surviving 33+ passes since FB44 D-666 when prism-bin was added to crates_touched without §FSR/§Token Budget row additions."
      - "Step 3e (v1.22 amendment — AC↔TASK IMPLEMENTATION-INSTRUCTION COVERAGE with CONSTRUCTION/DEFINITION site discrimination): For each AC in story body that includes a Red Gate test with 'Post-implementation: assertion passes' semantics referencing a NEW error code, function, or behavioral type, state-manager pre-commit MUST verify that §Tasks contains explicit task instruction at BOTH (1) the type/variant DEFINITION site (where the type is DECLARED in source — typically error.rs, lib.rs, or a dedicated types module) AND (2) the CONSTRUCTION/USAGE site (where the type is RETURNED, INSTANTIATED, or MATCHED — typically spec_parser.rs, pipeline.rs, or implementation modules). Verification method: (a) extract all Red Gate Test descriptions with 'Post-implementation: passes (... returns ...)' format from story body; (b) extract all NEW error codes, function names, or type/variant names referenced; (c) for EACH such name, classify whether it is a TYPE/VARIANT/ENUM (requires definition site task) or a FUNCTION/METHOD (requires implementation site task); (d) grep codebase (`crates/`) for presence; (e) for any absent reference, grep §Tasks for separate tasks at BOTH definition site AND construction site; (f) if either site lacks a §Tasks instruction, REJECT commit. Closes F-LP80-MED-001 META-META-class: POL-29 v1.21 first-application caught construction site (validator LOGIC) but missed definition site (variant DECLARATIONS); sibling-class pattern resolved by explicit site-discrimination in extraction step (b)."
      - "Step 8d (v1.23 amendment — META-META transitive closure SELF-INDUCED BUMP DETECTION): After each step 8b iteration completes fixed-point checking on touched files, state-manager MUST additionally check whether the iteration ITSELF caused a frontmatter `version:` field change on the source-of-truth artifact whose pin is being advanced. Verification method: (1) capture pre-iteration source-of-truth frontmatter version (e.g., ADR-026 `version:` field) before step 8b runs; (2) after step 8b iteration completes, re-read source-of-truth frontmatter; (3) if `version:` changed during step 8b's own work (because step 8b applied a pin advancement INSIDE the source-of-truth artifact's body, triggering its own frontmatter bump), treat the NEW frontmatter version as the canonical target and re-run a workspace-wide canonical grep for the OLD frontmatter version as a pin staleness check; (4) if any live-narrative hits at the OLD version surface, apply additional pin advancement to the NEW version and re-loop. MAX 3 self-induced-bump iterations (prevents infinite loops). Closes F-LP81-HIGH-002 META-META gap: step 8b at FB62 bumped ADR-026 v1.21→v1.22 via its own iteration (error-taxonomy v1.34→v1.35 cite inside §D7 line 312) but did NOT re-run workspace sweep for the new v1.22 pin — 21 sites survived stale at v1.21 for 19 passes (FB62→pass-81)."
      - "Step 8e (v1.24 amendment — FIXED-POINT ITERATION mandate): After step 8b transitive closure completes one iteration AND step 8d META-META self-induced bump detection finds an additional source-of-truth frontmatter bump within that iteration, state-manager MUST RE-LOOP step 8b + 8d again — repeating until an iteration produces ZERO new source-of-truth bumps AND ZERO new cross-workspace propagation requirements. This is true fixed-point iteration. MAX 5 outer iterations (prevents infinite loops); if MAX hit without fixed-point, REJECT commit + human intervention. Closes F-LP83-HIGH-001 META-META-META-META recursion failure: FB69's step 8d caught first-order ADR-026 v1.21→v1.22 self-induced bump but did NOT iterate again to detect that the closure of THAT bump (error-taxonomy lines 459/467 advancement) caused a second-order error-taxonomy v1.36→v1.37 bump requiring its own cross-workspace propagation sweep. Step 8e ensures the iteration recurses until convergence. D-693."
      - "Step 8f (v1.27 amendment — EXTENDED to enumerate ALL INDEX files touched in burst): When state-manager's burst touches MULTIPLE INDEX files (e.g., FB73 cascaded STORY-INDEX + BC-INDEX + VP-INDEX + ARCH-INDEX in one burst), state-manager MUST apply the in-line table row summary-cell sync verification to EACH INDEX file independently. Per-INDEX checklist: for each INDEX file with a NEW §Changelog row in this burst, (a) parse the §Changelog row narrative for version bumps it declares, (b) locate the corresponding in-line table rows for EACH bumped artifact in THAT INDEX file, (c) verify each row's summary cell version-pin field reflects the new version, (d) if stale, update IN SAME COMMIT. Closes F-LP86-HIGH-001/002 META class: step 8f v1.25 was first-applied to STORY-INDEX only in FB72 + FB73, missing BC-INDEX + ARCH-INDEX sibling INDEX files which also had §Changelog rows declaring artifact version bumps. [v1.25 original mandate preserved: When state-manager appends an INDEX §Changelog row referencing a story/BC/ADR/VP version bump, state-manager MUST ALSO (a) locate the corresponding in-line table row for the bumped artifact in the same INDEX file, (b) verify the row's summary cell version-pin field reflects the new version, (c) if stale, update the cell IN THE SAME COMMIT. Verification method: after appending any §Changelog row that declares artifact-X vN→vM, grep the INDEX in-line table for the artifact-X row and confirm the embedded version string matches vM. If any in-line row still reads vN, it is a propagation gap of this class. Closes F-LP84-HIGH-001 META-class: FB71 added STORY-INDEX §Changelog row v2.148 for story v1.44→v1.45 but did NOT update in-line row 395 summary cell (still read v1.44 FB69 narrative); 5th consecutive cascade-restart-#4 attempt blocked at exactly 1 finding. D-694.] D-696. EXTENSION (v1.29 — crates/ scope): when any burst bumps a BC or ADR frontmatter version (including no-semantic-change bumps), the sibling-sweep MUST include `rg \"<artifact-ID> v<old>\" crates/ --type rust` in addition to the `.factory/` sweep. If the running agent is PO (scope: .factory/ only), PO MUST surface the crates/ grep results to orchestrator with an explicit implementer handoff message in the SAME burst commit narrative. The implementer closes the crates/ cite-pins in the NEXT atomic commit. The burst is NOT considered complete until the handoff is documented, even if crates/ grep returns zero hits — the zero must be confirmed. Evidence: PLUGIN-MIGRATION-001-D cascade F-LP7-OBS-001, lesson 27."
      - "Step 8g (v1.26 amendment — CROSS-VALUE-CLASS SIDE-EFFECT BUMP DETECTION): When step 8d detects a self-induced source-of-truth frontmatter bump (e.g., ADR-026 frontmatter v1.22→v1.23 because step 8b advanced a pin INSIDE ADR-026 §D7 line 312), state-manager MUST enumerate ALL parallel value classes anchored to that source-of-truth artifact (e.g., ADR-026 anchors D3, D5, D7 — multiple distinct pin value classes) and re-grep workspace for EACH parallel value class's predecessor version. For each class with stale live-narrative hits, apply cross-workspace propagation sweep advancing to new source-of-truth version. Iterate via step 8e fixed-point until all parallel value classes converge. Closes F-LP85-HIGH-001 META class: FB71 fixed error-taxonomy class but left ADR-026 D7 pin class stale at v1.22 across 22 sites because step 8e only iterated within originating value class. D-695."
      - "Step 8h (v1.28 amendment — SAME-BURST DEPENDENT-ARTIFACT SELF-BUMP DETECTION): When step 8b/8c/8e/8g iteration applies pin advancement at a site INSIDE a non-source-of-truth artifact (e.g., FB73 PO sweep updated error-taxonomy lines 459+467 with ADR-026 D7 v1.22→v1.23 advancement), state-manager MUST detect whether THAT artifact's own frontmatter version field will bump as a §Changelog event (because PO is editing its body — triggering version increment per POL-26). If yes, enumerate the dependent artifact's version-pin as an ADDITIONAL parallel value class for cross-workspace sweep within the same iteration loop. Closes F-LP87-HIGH-001 META-class: FB73 closed F-LP85 by sweeping ADR-026 D7 v1.22→v1.23 but the sweep itself bumped error-taxonomy v1.37→v1.38 as §Changelog event, and step 8g's cross-value-class enumeration did NOT recognize this DEPENDENT-ARTIFACT-SELF-BUMP class. Sibling to step 8d but at WITHIN-BURST layer. D-697."
      - "Step 8i (v1.28 amendment — WITHIN-FILE SELF-CITE ENUMERATION): When step 8b/8c/8d/8e/8g/8h sweeps cite-pins for value class X (e.g., ADR-026 D7 pin) across external workspace, state-manager MUST ALSO grep the source-of-truth file Z (where X is declared/anchored) for SELF-CITES to X's predecessor pin values. Procedure: for source-of-truth artifact Z anchoring value class X with new version vN, grep `rg \"X v[predecessor]\" <path-to-Z>` and enumerate hits; for each hit, advance to vN within Z's body (NOT inside Z's §Changelog rows which are TD-VSDD-091 exempt). Closes F-LP87-HIGH-002 META-class: ADR-026 line 24 runtime_deliverables self-cite `(per D7 v1.16)` survived 7 architect-domain bursts because POL-29 step 8 enumerated EXTERNAL workspace siblings only — never the source-of-truth file's own frontmatter/body. D-697."
      - "Step 9a (v1.39 amendment — NAMED-TWIN SWEEP): For any artifact amended in this burst, determine whether that artifact is one of a documented twin pair (created by the same split event, sharing subsystem+capability, or explicitly cross-referenced as a pair in specs or indexes). If a twin exists: (a) NAME the twin explicitly in the discharge report; (b) read the twin artifact regardless of whether the changed string appears in it — absence of the changed string is the failure mode, not a pass; (c) if the twin contains semantically-equivalent or complementary language to what was changed, update it to maintain parity; (d) if the twin contains language that now contradicts the amendment (e.g., a cross-reference asserting the twin 'retains' a property that was removed from its pair), correct the contradiction in the SAME burst. Fixer MUST report verdict: SWEPT (twin found and verified) or N/A (no twin exists, with explicit rationale). Precedent: LOCAL pass-66 CRIT-001."
      - "Step 9b (v1.39 amendment — DOWNSTREAM-COPY SWEEP): For any section amended in this burst, determine whether that section is verbatim-copied into a downstream artifact by a later agent leg (e.g., an ADR §D-block that product-owner transcribes directly into a BC postcondition section). If a downstream copy target exists: (a) identify the target artifact and section in the dispatch brief; (b) sweep the target section for pre-amendment phrasing; (c) apply the corresponding correction in the SAME burst. The orchestrator dispatch brief MUST name known verbatim-copy relationships for the amended section when dispatching the fix. Fixer MUST report verdict: SWEPT (copy target found and updated) or N/A (no downstream copy target, with explicit rationale). Precedent: LOCAL pass-66 HIGH-002."
      - "Step 9c (v1.39 amendment — MANDATE-ANCHOR CHECK): For any BC or spec amendment that introduces or retains a MUST statement: (a) identify the story + AC + Red Gate test that executes the MUST; (b) if a story+AC+RGT exists, verify the MUST cites it explicitly; (c) if no story+AC+RGT yet exists, record an explicit deferral in the BC §Traceability or §Open Questions with a concrete blocker and a real existing story ID per Canonical Principle Rule 3. An unanchored MUST is a violation at the end of the burst regardless of whether it is new or pre-existing in the amended section. Fixer MUST report verdict: ANCHORED (story+AC+RGT cited), DEFERRED-with-story-ID (deferral record present with real story ID), or VIOLATION (no anchor, no deferral). Precedent: LOCAL pass-66 HIGH-003 + MED-001."

  - id: 32
    name: changelog_monotonic_descending
    description: "All .factory/ artifact §Changelog tables MUST be ordered monotonic descending by version (newest first, oldest last). Duplicate rows are prohibited. Missing rows must be added as tombstones rather than silently skipped."
    adopted: D-870-F-LP10-MED-001-comprehensive-sweep-2026-05-30
    severity: MEDIUM
    enforced_by: [adversary-prompt, consistency-validator, state-manager]
    scope: [bc, vp, story, ic, story-index, bc-index, vp-index, error-taxonomy, prd-supplements, policies]
    codified_at: null
    lint_hook: null
    references: [F-LP8-MED-001, F-LP9-MED-001, F-LP10-MED-001]
    rationale: |
      Three consecutive adversarial pass findings across the S-DTU-CYBERINT-AUTH-FIDELITY-001
      cascade surfaced the same class of changelog ordering defect:
        - F-LP8-MED-001 (Pass 8): BC-2.01.017 had duplicate v1.2 row + non-monotonic order.
        - F-LP9-MED-001 (Pass 9): Story changelog non-monotonic (1.0, 1.1, 1.3, 1.2).
        - F-LP10-MED-001 (Pass 10): error-taxonomy.md had v1.54 row inserted between v1.25
          and v1.24, plus v1.53 and v1.23 rows entirely absent.
      Three consecutive pass findings of the same class = pattern requiring codification per
      the project's 3-recurrence threshold (consistent with POL-29 criterion).
    verification_steps:
      - "For each .factory/ artifact with a §Changelog section, parse the version column of the changelog table."
      - "Verify rows are in monotonic descending order (e.g., 1.4 → 1.3 → 1.2 → 1.1 → 1.0). Any row where version > preceding row = violation."
      - "Verify no duplicate rows: scan for two rows with byte-identical version fields. Duplicates are violations regardless of whether the row content differs."
      - "Verify no missing rows: if an artifact's frontmatter version is N and the changelog table's highest version row is M where M < N, check whether intermediary versions (M+1..N-1) are documented or were intentionally skipped (e.g., a version that was bumped then immediately superseded in the same burst). Undocumented gaps = violation."
      - "When adding a new changelog row, the row MUST be prepended to the top of the table (before all existing rows), making it the new highest version."
      - "When fixing a non-monotonic table, reorder ALL rows to descending order and add a new top-row citing the hygiene-cleanup finding ID. The cleanup row's version = previous_highest_version + 1."
      - "Missing rows should be added as tombstone rows with content prefixed '[TOMBSTONE — row was absent from changelog]' and content reconstructed from external cites (BC-INDEX, STORY-INDEX, adjacent changelog rows) if available."
      - "Shell verification one-liner for a single file: grep '^|' <file> | grep -E '\\| [0-9]+\\.[0-9]+ \\|' | awk -F'|' '{print $2}' | sed 's/ //g' | awk 'NR>1{if($1>prev) print \"OUT-OF-ORDER: \"prev\" then \"$1; prev=$1} NR==1{prev=$1}' — empty output = PASS."

  - id: 33
    name: route_coverage_table_required_for_stagemask_changes
    description: |
      Any BC, story, or source-code commit that introduces or modifies a StageMask-relevant
      DTU route handler MUST update the Route Coverage Table in the same artifact/commit.
      The Route Coverage Table enumerates, for each affected route: StageMask field name,
      clone crate, route file path, HTTP route pattern, guard mechanism (e.g., stage_idx >= N),
      and current status (GUARDED / UNGUARDED / EXEMPT with rationale).
      Failure = HIGH process-gap (BPRL-P4-PG-01 precedent: no coverage table for
      crowdstrike detections + armis alerts + cyberint alerts + claroty alerts stage guards
      across 4 route handlers meant a guard gap at detections rode to PR-LEVEL pass 4
      undetected — caught only by full-route adversarial sweep).
    adopted: D-1109-2026-06-12
    severity: HIGH
    enforced_by: [adversary-prompt, product-owner-self-check, state-manager]
    scope: [bc, story, source-code]
    codified_at: null
    lint_hook: null
    references_finding: BPRL-P4-PG-01
    references_decision: D-1109
    references_bc: BC-2.06.019-v1.4
    verification_steps:
      - "For any PR diff or fix-burst that touches a file matching `crates/prism-dtu-*/src/routes/*.rs` AND introduces or modifies StageMask-related logic (stage_idx, StageMask enum, stage guard): verify the governing BC's §Postconditions (or dedicated Route Coverage Table section) contains a Route Coverage Table."
      - "Read the Route Coverage Table: for each row verify columns (StageMask field, clone, route file, HTTP route, guard mechanism, status) are populated with specific values — not placeholders."
      - "For each UNGUARDED row: verify there is an explicit rationale for why the route is exempt (e.g., 'no device_id emitted at stage 0 — claroty alerts schema')."
      - "If any route handler in the diff is absent from the table → HIGH process-gap. The fix: add the row to the table in the same commit as the route change."
      - "When a new clone's routes are added (new `prism-dtu-<sensor>/src/routes/` file with StageMask logic): all routes in that file must appear in the coverage table before the PR can merge."
      - "Adversary must run `rg 'stage_idx|StageMask' crates/prism-dtu-*/src/routes/ --type rust --files-with-matches` to enumerate ALL route files with StageMask references, then cross-check each against the Route Coverage Table."

  - id: 31
    name: vp_proof_harness_skeleton_symbol_validation
    description: |
      VP files' §Proof Harness Skeleton sections cite Rust symbols (function names,
      type names, test helper names) that must exist in the codebase. These citations
      drift when code refactors rename or remove symbols without sweeping VP files.
      Status: proposed — enforcement hook not yet implemented.
    adopted: D-728-post-PREREQ-E-cycle-close-2026-05-19
    severity: MEDIUM
    enforced_by: [adversary-prompt, state-manager-pre-commit-hook-proposed]
    scope: [vp]
    codified_at: null
    lint_hook: null
    references_source: "F-P10-IMP-001 + F-P10-OBS-002 (impl-pass-10 cascade)"
    implementation_target: ".factory/hooks/validate-vp-proof-harness-skeleton-symbols.sh (TBD)"
    rationale: |
      Codified after F-P10-IMP-001 + F-P10-OBS-002 cascade impl-pass-10 closed two
      drift sites during S-PLUGIN-PREREQ-E development:
        - VP-153: §Proof Harness Skeleton cited validate_auth_coherence (function did
          not exist in codebase; never implemented; closes F-P10-IMP-001).
        - VP-156: §Proof Harness Skeleton cited reset_for_test (test helper renamed to
          reset_dynamic_registry_global during PREREQ-D implementation; closes F-P10-OBS-002).
      pr-pass-4 adversary recommended this as a process-gap codification target.
      NOTE: POL-30 is referenced in BC artifacts (e.g., BC-2.16.012 §Changelog) but was
      never formally registered in policies.yaml; POL-31 is the next sequential registered
      entry. When POL-30 is formally registered, the sequential gap will be documented here.
    verification_steps:
      - "For each VP file in .factory/specs/verification-properties/ that contains a §Proof Harness Skeleton section, extract all Rust symbol references: function names (pattern: `fn ([a-z_][a-z0-9_]*)` and bare symbol names in prose), type names (pattern: `[A-Z][A-Za-z0-9]*` in code blocks), and test helper names."
      - "For each extracted symbol, run `rg '<symbol>' crates/` to verify it exists in the codebase. Use word-boundary anchors to avoid false positives."
      - "Flag any symbol that returns zero grep hits as a drift site. Record: VP file, line number, symbol name, context sentence."
      - "Exemptions: symbols inside §Changelog rows (historical citations exempt per TD-VSDD-091); symbols prefixed with TODO markers (tracked drift, not undetected drift)."
      - "Until the enforcement hook is implemented (lint_hook: null), adversary must manually apply this check during each adversarial pass that reviews VP files."

  - id: 34
    name: fail_loud_invariant_enforcement_standard
    description: |
      Runtime invariants in production code paths must be enforced by mechanisms
      active in release builds (typed branch handling, Result propagation, or
      structurally-unreachable design ratified in the anchoring BC/ADR).
      debug_assert!/debug_assert_eq! may supplement but never be the SOLE enforcement
      of an invariant whose violation produces incorrect user-facing output in release.
      Per-site debug-only enforcement requires explicit ratification in the anchoring
      BC/ADR including the release-mode fall-through behavior.
    adopted: "DEFECT-PQL-FNCALL-LHS-001 PR-LEVEL pass-5 F-PQLFN-PR5-OBS-003 (D-1780, 2026-07-15)"
    severity: MEDIUM
    enforced_by: [adversary-prompt, code-review]
    scope: [source-code, bc]
    codified_at: null
    lint_hook: null
    rationale: |
      Codified after three recurrences in DEFECT-PQL-FNCALL-LHS-001 cascade where
      debug_assert!/debug_assert_eq! was used as the sole enforcement mechanism for
      a production invariant:
        - Fix-burst-37 (pass-4): debug_assert_eq! added to HAVING-interception loop
          in engine.rs to assert percentile-template set invariant; compiles out in
          release builds (standard --release profile).
        - BC-2.11.019 v1.22 §OBS-004: "fail-loud assertion requirement" codified per
          the debug_assert_eq without acknowledging release-mode compile-out semantics.
        - Pass-5 F-PQLFN-PR5-LOW-001: adversary identified that debug_assert_eq! compiles
          out → misleading template persists in release for future AGGREGATE-only names.
      The structural fix (two-branch detail-builder in fix-burst-38) is the exemplar
      compliant implementation: typed branch dispatch provides correct guidance for any
      current or future set member, in all build profiles, without requiring a runtime
      assertion.
    verification_steps:
      - "For each adversarial pass on PRs touching crates/*/src/ (excluding test modules): run `rg 'debug_assert' crates/*/src/ --glob '!**/tests/**' --glob '!**/#[cfg(test)]**'` to enumerate all debug_assert!/debug_assert_eq!/debug_assert_ne! calls in production code paths."
      - "For each debug_assert site found: (a) determine the invariant being asserted; (b) determine whether the invariant's violation produces incorrect user-facing output (error message content, query result, or behavioral deviation); (c) if YES, verify the anchoring BC or ADR explicitly ratifies debug-only enforcement AND documents the release-mode fall-through behavior (what happens when the assert does NOT fire in release)."
      - "A debug_assert site where violation produces incorrect user-facing output AND the anchoring spec does NOT document release-mode fall-through → MEDIUM finding under POL-34. The fix path is: (a) structural enforcement (typed branch, match arm, Result propagation) — preferred; or (b) explicit ratification in anchoring BC/ADR including documented release-mode fall-through behavior — acceptable only when structural fix would require significant architectural change."
      - "debug_assert! that supplements (not sole-enforces) a release-active mechanism is PERMITTED. Example: a debug_assert after a match arm that already handles all cases structurally is a documentation aid, not sole enforcement."
      - "Exemptions: debug_assert sites inside #[cfg(test)] blocks; debug_assert sites enforcing invariants whose violation produces only an internal panic (no user-facing output, no incorrect behavior observable by callers) — document the exemption rationale inline in the code comment."

  - id: 35
    name: holdout_gate_infra_only_exemption
    description: |
      Stories whose `behavioral_contracts:` frontmatter array is empty (pure infra/release/CI
      scope, no product-behavior surface) are exempt from the story-level holdout gate
      (D-1715/D-1716 human-approved gate); `holdout_scenarios: []` is compliant for such
      stories. Stories with ≥1 BC still require holdout authoring at story-materialization
      time. Exemption does NOT extend to wave-level or Phase-4 holdout pools.
    adopted: "D-1884-human-adjudication-of-D-1880-2026-07-20"
    severity: MEDIUM
    enforced_by: [orchestrator-rule, adversary-prompt]
    scope: [story, hs]
    codified_at: "D-1884"
    lint_hook: null
    verification_steps:
      - "For each story with holdout_scenarios: [] in frontmatter, read behavioral_contracts: — an empty array means the story is exempt: PASS."
      - "A story with non-empty behavioral_contracts: AND empty holdout_scenarios: is a HIGH violation — holdout authoring is owed before that story's TDD delivery."
      - "Verify the exemption is not applied to wave-level or Phase-4 holdout pools — those remain mandatory and unchanged."

  - id: 36
    name: generalization_directive_no_sensor_conditional_engine_code
    description: |
      All fixes and features must be implemented as GENERAL mechanisms consumed via the
      spec/config surface. Sensor-specific behavior lives exclusively in TOML sensor specs
      (.prism/specs/sensors/) and DTU clones (crates/prism-dtu-*). Sensor-name-conditional
      control flow in engine code (prism-core, prism-spec-engine, prism-query, prism-sensors,
      prism-mcp) is forbidden. Origin: user standing directive 2026-07-21 (D-1944 §STANDING
      USER DIRECTIVES), enforced as standing adversary probe throughout the Wave-A ADR
      cascade (50 passes, PASS throughout); human approved codification 2026-07-22 (D-1945).
    adopted: "D-1945-human-approved-codification-2026-07-22"
    severity: HIGH
    enforced_by: [adversary-prompt, orchestrator-rule]
    scope: [source-code, architecture, bc, story]
    codified_at: "D-1945"
    lint_hook: null
    verification_steps:
      - "Run rg -i 'crowdstrike|cyberint|claroty|armis|xdome' over production .rs sources in crates/prism-core, crates/prism-spec-engine, crates/prism-query, crates/prism-sensors, crates/prism-mcp (exclude #[cfg(test)] modules, tests/, fixtures, doc comments, and DTU clone crates). Any hit inside production control flow (match arm, if/else condition, map key dispatch keyed on sensor identity) is a HIGH violation."
      - "For any diff/spec introducing sensor-specific behavior, verify the mechanism is a general engine capability parameterized via the TOML sensor-spec surface or DTU clone — not engine-side branching on sensor name/identity."
      - "For ADR/BC/story artifacts: verify prescribed fixes are stated as general mechanisms; sensor specifics may appear only as spec/config examples consuming the general mechanism, never as engine special-cases."
      - "Test-only or fixture usage of sensor names is PASS. DTU clone crates (crates/prism-dtu-*) are by definition sensor-specific and exempt."

  - id: 37
    name: ledger_from_frontmatter
    description: |
      State-manager must generate every burst ledger row (BC-INDEX NOTEs, ARCH-INDEX changelog
      rows, STORY-INDEX changelog rows, STATE.md NOTE fields) by reading each touched file's
      frontmatter `version:` and top changelog row on disk AFTER specialist edits land — never
      from dispatch brief values or from the author's stated description of what they changed.
      Origin: F-WASE-P63-CRIT-001 (D-2017/FB47a) — BC-INDEX v8.72 NOTE falsely attributed
      BC-2.01.016 v1.15 and BC-2.16.014 v1.19 to FB46; on-disk frontmatter showed FB45 authorship.
    adopted: "D-2017-FB47a-pol37-ledger-from-frontmatter-2026-07-25"
    severity: HIGH
    enforced_by: [state-manager, adversary-prompt]
    scope: [state-manager, bc-index, arch-index, story-index]
    codified_at: "D-2017"
    lint_hook: null
    verification_steps:
      - "For each file whose version pin appears in an INDEX NOTE or changelog row, run: Read the file's frontmatter `version:` field and compare to the version cited in the ledger row — they must match exactly."
      - "For each new INDEX NOTE authored in this burst: verify the note cites the actual version from the artifact's frontmatter, not a version number from the dispatch brief or from the specialist's description of their changes."
      - "Read the top changelog row of each amended artifact: the version in that row must match the `version:` frontmatter field and must match what the INDEX records as the current version."
      - "If ANY discrepancy exists between frontmatter `version:` and INDEX-recorded version: the INDEX row is wrong, not the artifact. Correct the INDEX before committing."
      - "This policy applies to STATE.md frontmatter NOTE lines (bc_index_version/arch_index_version/story_index_version) as well as BC-INDEX table cell version chains, ARCH-INDEX table cells, STORY-INDEX table rows, and ARCH-INDEX/BC-INDEX §Changelog rows."

  - id: 38
    name: bc_new_ec_story_ac_rgt_obligation
    description: |
      When a BC amendment adds a new EC whose `anchor_story:` is a draft story with
      `tdd_mode: strict`, the same burst must either: (a) add a corresponding AC and Red Gate
      test to that anchor story; OR (b) record an explicit deferral with a concrete blocker
      (e.g., "blocked on ADR-055 acceptance") and a specific future story anchor. Implicit
      deferrals (story simply not updated) are a violation. Origin: F-WASE-P63-OBS-002 +
      PROCESS-GAP-002 (D-2017/FB47a) — S-MAINT-VOLATILE-CITE-001/002 registered with wrong
      AC counts because BC amendments adding ECs did not trigger a story AC/RGT update.
    adopted: "D-2017-FB47a-pol38-bc-new-ec-obligation-2026-07-25"
    severity: HIGH
    enforced_by: [adversary-prompt, product-owner, story-writer]
    scope: [bc, story, product-owner, story-writer]
    codified_at: "D-2017"
    lint_hook: null
    verification_steps:
      - "For each BC amended in this burst: read its new/modified EC table. For each EC with an `anchor_story:` field pointing to a draft story with `tdd_mode: strict`, verify that story file has a corresponding AC (and Red Gate test if the EC is behavioral/postcondition)."
      - "If a story has no corresponding AC for a new anchored EC: check whether the burst includes a deferral record (in the BC's §Traceability or in the story's §Open Questions) with: (a) a concrete blocker description, (b) a specific future story anchor. If neither present → violation."
      - "Verify STORY-INDEX description text for the anchor story matches the actual story frontmatter fields (ACs, pts, tdd_mode, priority) — these must agree."
      - "This policy applies per-burst: if BC and story are amended in different bursts, the gap must not persist across a full adversary pass cycle without the deferral record."

  - id: 39
    name: anti_volatile_pin_versions
    description: |
      Narrative prose in .factory/ artifacts MUST NOT pin the version of a referenced
      artifact. Cite the artifact ID plus section/symbol anchor only (e.g., `ADR-028 §D1`,
      not `ADR-028 vX.Y §D1`). This extends TD-VSDD-091 from volatile line numbers to
      volatile version numbers — both are high-turnover values that decay the moment the
      target is next edited. Provenance formerly carried by prose version pins is carried
      instead by each artifact's frontmatter `input-hash:` field, verified by
      `vsdd-factory:check-input-drift`. This supersedes the asymmetric FB93 blockquote
      convention (story→BC pins kept version while BC→story anchors went version-free) with
      a symmetric rule; FB93's inline blockquote convention in BC-2.02.006 and BC-2.02.014
      is SUPERSEDED by this policy and is to be removed by the sweep story, not preserved.
      Status: proposed — enforcement hook not yet implemented.
    adopted: "F-WASE-P70-MED-006-generalized-by-human-direction-2026-07-30"
    severity: HIGH
    enforced_by: [records-lint-L11-proposed, adversary-prompt, product-owner-self-check, story-writer-self-check, consistency-validator]
    scope: [bc, vp, story, adr, architecture, prd, prd-supplements, error-taxonomy, capabilities, invariants, hs, td]
    codified_at: null
    lint_hook: null
    implementation_target: "scripts/records-lint.sh check L11 (proposed — blocks staged narrative-tier artifact-ID version pins)"
    rationale: |
      Origin: pass-70 finding F-WASE-P70-MED-006 [process-gap], generalized by direct human
      direction 2026-07-30. The proximate trigger was FB93, which introduced an asymmetric
      convention to break a mutual pin-oscillation cycle between story and BC prose; pass-70
      finding F-WASE-P70-MED-007 then found the cycle was cut on one axis only. POL-39
      supersedes that asymmetric convention with a symmetric rule. Measured corpus exposure at
      registration: approximately 2,434 story→BC pins across 83 story files, 364 story→ADR
      pins, 15 story→VP pins, and approximately 2,866 pins across 136 files under specs/. The
      symmetric rule (all narrative prose pin-free) is the only stable end-state; the sweep
      story removes pre-existing grandfathered pins.
    verification_steps:
      - "scripts/records-lint.sh check L11 (proposed): blocks staged narrative-tier additions in .factory/ artifacts matching the pattern `(BC|VP|ADR|DI|CAP|HS|TD)-\\S+ v\\d+\\.\\d+` (artifact identifier followed immediately by a version number). Ratchet-scoped to staged additions only; pre-existing pins in unmodified lines are grandfathered pending the sweep stories."
      - "EXEMPT — index tier: BC-INDEX.md, VP-INDEX.md, ARCH-INDEX.md, STORY-INDEX.md. Version pins in index files are the registry of record and are independently gated by records-lint.sh L10. Note L10's understated capability boundary: it detects the version-number half only, cannot detect content falsification, and rows carrying no structural version pin are counted as unverifiable, not clean — a zero-mismatches L10 result is NOT equivalent to every row verified."
      - "EXEMPT — changelog sections and YAML changelog keys: `## Changelog` rows and `## Version History` rows (both section headings appear across the corpus) are immutable history; the version number is the row's identity (TD-VSDD-091 historical record protection). YAML `changelog:` keys (e.g., as used in policies.yaml) are identically exempt — the exemption covers the content type, not the markdown-heading form alone."
      - "EXEMPT — any line in the frontmatter block between the opening and closing `---` delimiters: this includes the `version:` field, `input-hash:`, `introduced:`, `modified:`, YAML comments (`#`) carrying version numbers, `anchor_stories:` list items, and all other YAML scalars and comments in that block. Frontmatter is machine-managed metadata; version numbers there are independently gated by L10 and are not narrative prose pins."
      - "EXEMPT — correctly-scoped historical prose: a past-tense statement about what a specific prior version did (e.g., 'corrected in BC-2.02.006 v1.8') is a true historical record, not a normative pin. Editing it corrupts the audit trail. Adjudicate by grammatical form — normative present-tense 'per ADR-028 v1.5' is a violation; historical past-tense describing what that version did is exempt. When in doubt, rewrite as section-anchor form."
      - "Provenance check: when reviewing whether a story or BC adequately traces its dependencies, use `vsdd-factory:check-input-drift` against each artifact's `input-hash:` rather than relying on a prose version pin to indicate currency."
      - "Until records-lint L11 is implemented (lint_hook: null), adversary must manually apply this check during each adversarial pass: grep staged additions in narrative-tier .factory/ artifacts for the pattern `(BC|VP|ADR|DI|CAP|HS|TD)-[A-Za-z0-9._-]+ v[0-9]+\\.[0-9]+` and flag any match in a non-exempt position (not in changelog rows, not in frontmatter blocks, not in index files) as a violation."

  - id: 40
    name: index_rows_current_state_pins_only
    description: |
      Index table rows in STORY-INDEX.md (Full Story List table) and BC-INDEX.md (BC table)
      must be ONE-LINE CURRENT-STATE PINs only. Per-artifact version history lives in the
      artifact's own ## Changelog section and git history. Inline [**status vX.Y**
      (D-NNN: ...)] changelog-history chains in table rows are forbidden. A compliant
      STORY-INDEX row has no [**...**] blocks (bold-annotated brackets with parenthetical
      D-NNN chains). A compliant BC-INDEX Status cell contains at most: the base status
      keyword (active/draft/removed/retired) plus optionally one version pin in
      (vX.Y current) or bare vX.Y format.
      Mechanical enforcement pending via a future records-lint L11 check.
    adopted: "spec-steward lever-2 governance compaction human-directed 2026-08-21"
    severity: MEDIUM
    enforced_by: [adversary-prompt, state-manager, records-lint-L11-proposed]
    scope: [story-index, bc-index]
    codified_at: null
    lint_hook: null
    verification_steps:
      - "For STORY-INDEX.md: grep for [** patterns in table rows within the Full Story List section (grep '\\[\\*\\*' .factory/stories/STORY-INDEX.md). Any hit within the Full Story List table (between ## Full Story List and ## Changelog headers) is a violation. The section boundary is detected by the ## Changelog heading that immediately follows the story table."
      - "For BC-INDEX.md: grep for [** patterns in BC table rows (grep '\\[\\*\\*' .factory/specs/behavioral-contracts/BC-INDEX.md). Any hit in a line starting with '| BC-' is a violation."
      - "For BC-INDEX.md Status cells: each Status cell must contain only: base keyword (active/draft/removed/retired/~~...~~) plus at most one version qualifier in (vX.Y current) or bare vX.Y form. Multiple parenthetical entries like (vX.Y D-NNN: ...) (vX.(Y-1) D-MMM: ...) in a single cell are a violation."
      - "Until records-lint L11 is implemented (lint_hook: null), adversary manually scans both index files for [** patterns in table rows during each adversarial pass touching STORY-INDEX.md or BC-INDEX.md."
