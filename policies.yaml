policies:
  - id: 1
    name: append_only_numbering
    description: "All VSDD identifiers are never renumbered or reused. Retired IDs stay in indexes. Filename slugs are immutable."
    adopted: baseline
    severity: HIGH
    enforced_by: [adversary-prompt, consistency-validator]
    scope: [bc, vp, di, cap, story, hs, td, pol]
    lint_hook: null
    verification_steps:
      - "Scan all index files for retired/removed IDs — verify no active artifact reuses a retired ID"
      - "Verify retired entries have replaced_by or removal justification"
      - "Check that filename slugs match original creation (compare git log if available)"

  - id: 2
    name: lift_invariants_to_bcs
    description: "Every domain invariant (DI-NNN) must be cited by at least one BC's Traceability L2 Invariants field. Orphan invariants are drift."
    adopted: baseline
    severity: MEDIUM
    enforced_by: [adversary-prompt, consistency-validator]
    scope: [di, bc]
    lint_hook: null
    verification_steps:
      - "Read domain-spec/invariants.md — extract all DI-NNN IDs"
      - "For each DI-NNN, search BC files for citations in Traceability/L2 Invariants fields"
      - "Report orphan invariants (DI declared but no BC enforces it)"
      - "Verify invariant Scope/enforcer column names BCs that cite it back (bidirectional)"

  - id: 3
    name: state_manager_runs_last
    description: "State-manager agent must be the last to commit in every burst, preventing version-race regressions."
    adopted: baseline
    severity: HIGH
    enforced_by: [orchestrator-rule]
    scope: [story, bc, vp, architecture]
    lint_hook: null
    verification_steps:
      - "Review burst commit history — state-manager commits must come after all other agents"
      - "Check for citation staleness — STORY-INDEX/BC-INDEX versions must match latest story-writer/PO output"

  - id: 4
    name: semantic_anchoring_integrity
    description: "Every anchor claim must be semantically correct, not just syntactically valid. Mis-anchoring always blocks convergence."
    adopted: baseline
    severity: MEDIUM
    enforced_by: [adversary-prompt, consistency-validator]
    scope: [bc, vp, story, architecture]
    lint_hook: null
    verification_steps:
      - "For each BC, verify declared capability actually describes the BC's purpose per capabilities.md"
      - "For each story, verify subsystems: field references subsystems that own the story's scope per ARCH-INDEX"
      - "For each VP, verify anchor_story builds the test vehicle (not an architectural ancestor)"
      - "For traceability table rows, verify descriptions match target artifact's actual title"

  - id: 5
    name: creators_justify_anchors
    description: "Agents creating anchors must justify each choice against the source-of-truth artifact. Stop and ask rather than guess."
    adopted: baseline
    severity: MEDIUM
    enforced_by: [adversary-prompt]
    scope: [bc, vp, story, cap, architecture]
    lint_hook: null
    verification_steps:
      - "Check that BC→CAP anchors include justification citing capabilities.md"
      - "Check that story→subsystem anchors include justification citing ARCH-INDEX"
      - "Check that VP→anchor_story assignments justify why that story builds the test vehicle"
      - "Flag mechanical citations without body substantiation"

  - id: 6
    name: architecture_is_subsystem_name_source_of_truth
    description: "ARCH-INDEX Subsystem Registry is the canonical source for subsystem names. All references must match verbatim."
    adopted: baseline
    severity: HIGH
    enforced_by: [adversary-prompt, consistency-validator]
    scope: [bc, story, prd, architecture]
    lint_hook: null
    verification_steps:
      - "Read ARCH-INDEX Subsystem Registry for canonical subsystem names"
      - "For sampled BCs, verify subsystem: frontmatter matches registry exactly"
      - "For sampled stories, verify subsystems: field uses registry names"
      - "Check BC-INDEX subsystem column matches ARCH-INDEX"

  - id: 7
    name: bc_h1_is_title_source_of_truth
    description: "BC file H1 heading is the authoritative BC title. All downstream references must match. Enrichment goes INTO the H1."
    adopted: baseline
    severity: HIGH
    enforced_by: [adversary-prompt, consistency-validator]
    scope: [bc, story, prd]
    lint_hook: null
    verification_steps:
      - "Sample 10+ BCs — read H1 heading and compare to BC-INDEX title column"
      - "Check for downstream-only enrichment not present in H1"
      - "Verify H1 accurately describes what the BC's postconditions specify"
      - "(D-571 amendment) For each row in the story's behavioral contracts body table, compare the Title cell to the BC file's H1 heading verbatim. Paraphrased or shortened titles are violations even when the intent is clear."
      - "(D-571 amendment) Apply verbatim H1 check to all four citation surfaces: (1) body BC table Title column, (2) §References section entries, (3) Architecture Compliance Rules table rows, (4) prose exclusion-note paragraphs. All four must match BC H1 verbatim."
      - "(D-571 amendment) Exclusion-note prose paragraphs constitute a fifth citation surface. BCs cited in exclusion-note paragraphs must also match their BC H1 verbatim, regardless of whether those BCs appear in `behavioral_contracts:` frontmatter."
      - "(D-571 amendment) For each BC ID in story frontmatter `behavioral_contracts:` array, verify a corresponding entry exists in the story §References section. Missing entry = incompleteness violation. Format is necessary but not sufficient."

  - id: 8
    name: bc_array_changes_propagate_to_body_and_acs
    description: "When a story behavioral_contracts: frontmatter changes, the same commit must update body BC table, ACs, and Token Budget count."
    adopted: baseline
    severity: HIGH
    enforced_by: [adversary-prompt, consistency-validator]
    scope: [story, bc]
    lint_hook: null
    verification_steps:
      - "Sample 5+ stories — for each BC in behavioral_contracts: frontmatter, verify it appears in body BC table"
      - "For each BC in behavioral_contracts: frontmatter, verify at least one AC traces to it"
      - "For each BC in body BC table or AC traces, verify it appears in behavioral_contracts: frontmatter"
      - "Verify Token Budget BC count matches len(behavioral_contracts)"

  - id: 9
    name: vp_index_is_vp_catalog_source_of_truth
    description: "VP-INDEX.md is authoritative. Changes must propagate same-burst to verification-architecture.md and verification-coverage-matrix.md."
    adopted: baseline
    severity: HIGH
    enforced_by: [adversary-prompt, lint-hook, consistency-validator]
    scope: [vp, architecture]
    lint_hook: hooks/validate-vp-consistency.sh
    verification_steps:
      - "Verify VP-INDEX arithmetic: total = sum of per-tool counts = row count"
      - "For each VP in VP-INDEX, verify it appears in verification-architecture.md Provable Properties Catalog"
      - "For each VP in VP-INDEX, verify it appears in verification-coverage-matrix.md VP-to-Module table"
      - "Sum coverage matrix per-tool columns — must equal VP-INDEX per-tool totals"
      - "Reverse check: every VP in arch docs must exist in VP-INDEX"
      - "Named-alias semantic sync: for each VP-PLUGIN-NNN (or other named-alias) row in the Named Series table, verify its description semantically matches the description of the sequential VP-NNN row it aliases. The named row and its sequential counterpart must describe the SAME property. Mismatch means the named-alias table has drifted from ADR-023 §E (the canonical VP definition source) and must be corrected before convergence."

  - id: 10
    name: demo_evidence_story_scoped
    description: "All demo-recorder output MUST live under docs/demo-evidence/<STORY-ID>/. Flat docs/demo-evidence/*.md files collide across stories (evidence-report.md in particular)."
    adopted: phase-3-wave-0a-2026-04-21
    severity: HIGH
    enforced_by: [adversary-prompt, consistency-validator, pr-reviewer]
    scope: [story, demo-evidence, pr]
    lint_hook: null
    verification_steps:
      - "For each story's feature branch, verify docs/demo-evidence/<STORY-ID>/ exists as a subfolder"
      - "Verify NO files exist directly at docs/demo-evidence/*.md — only subfolders"
      - "Verify evidence-report.md lives at docs/demo-evidence/<STORY-ID>/evidence-report.md"
      - "Cross-check: story ID in frontmatter matches subfolder name"
      - "During wave integration gate, list docs/demo-evidence/ and confirm every subdir matches a known story ID"

  - id: 11
    name: index_bump_required_for_index_mutations
    description: |
      Any burst that mutates an index file (frontmatter version, prose changelog,
      tabular changelog, or row-tag content) MUST bump the index version, regardless
      of whether the change is content-creating or audit-trail-restoring. Backfill
      bursts that "fill missing prose entries" are still mutations and DO bump.
    adopted: fix-pass-20-pass10-process-gap-closures-2026-05-07
    severity: HIGH
    enforced_by: [adversary-prompt, consistency-validator, state-manager]
    scope:
      - story-index
      - bc-index
      - vp-index
      - arch-index
    lint_hook: null
    verification_steps:
      - "Read the M-34-001 precedent (find the STORY-INDEX changelog entry titled 'M-34-001 fix burst' covering the v1.64→v1.65 prose backfill bump): prose-only backfill bumped the index version even though no spec content changed. The same precedent applies to BC-INDEX, VP-INDEX, and ARCH-INDEX."
      - "Verify any commit touching an INDEX file body bumps the frontmatter version field by >= 1 minor revision."
      - "Verify the new version has a corresponding prose entry AND tabular row."
      - "Verify all live pins (frontmatter, narrative, SESSION-HANDOFF) propagate the new version atomically."
    citations:
      - "TD-VSDD-070 (backfill-bump policy gap) — closed by this policy"
      - "M-34-001 (2026-04-28) original precedent"
      - "F-PASS9-CRIT-001 / fix-pass-19 (2026-05-07) precedent restoration"

  - id: 12
    name: production_stub_residue_blocks_merge
    description: "Stories with `status: merged` MUST NOT have any `todo!()`, `unimplemented!()`, or panic-with-stub-literal in production paths reachable from any pub fn. Stub residue requires `status: partial-merge` plus per-site TD annotation."
    adopted: bundle-A-cleanup-2026-05-08
    severity: HIGH
    enforced_by: [adversary-prompt, pre-merge-hook, code-reviewer]
    scope: [story, source-code]
    lint_hook: hooks/check-stub-residue.sh
    references_adr: ADR-020
    verification_steps:
      - "Run `rg --type rust 'todo!\\(|unimplemented!\\(' crates/*/src/ --glob '!**/tests/**' --glob '!**/proofs/**'` — any match in a story's delivery files while that story has `status: merged` is a violation."
      - "Run `rg --type rust 'panic!\\([^)]*\"[^\"]*(?:TODO|todo|not yet|stub|unimplemented)' crates/*/src/ --glob '!**/tests/**'` to catch panic!-with-stub-literal variants."
      - "For each hit, verify it does NOT live inside a `#[cfg(test)]` block or `mod tests {` scope — those are permitted. Only hits in non-test production code are violations."
      - "Cross-check hit against the owning story's frontmatter `status:` field. If `status: merged` → block. If `status: partial-merge` → verify each stub site has a TD annotation comment (e.g., `// TODO(TD-XXX):`); missing annotation is also a violation."
      - "Check for `// Stub module:` or `// STUB` doc-comment lines in the same files — these may indicate the function is a stub even if the body does not contain the exact pattern (record as advisory finding)."
      - "Confirm the escape valve: if a site exists in an allowlist at `.factory/stub-residue-allowlist.yaml` with a TD reference and human approval note, the finding is suppressed for that specific site only."

  - id: 13
    name: story_frontmatter_index_consistency
    description: "STORY-INDEX status column MUST agree with each story file's frontmatter `status:` field. STORY-INDEX is derivative — story files are source of truth."
    adopted: bundle-A-cleanup-2026-05-08
    severity: HIGH
    enforced_by: [adversary-prompt, pre-burst-hook, state-manager]
    scope: [story, story-index]
    lint_hook: hooks/check-story-index-consistency.sh
    references_adr: ADR-020
    verification_steps:
      - "For each `.factory/stories/*.md` (excluding STORY-INDEX.md itself), extract the `status:` value from the YAML frontmatter block (between the `---` delimiters)."
      - "Parse STORY-INDEX.md to locate the row for each story by story ID. The status annotation appears as the second column of the Full Story List table or as `[MERGED ...]` / `[PARTIAL-MERGE ...]` / `[READY ...]` inline text, OR as a bare status token."
      - "Compare each story's frontmatter `status:` against its STORY-INDEX representation. Exact-string match is required (e.g., `partial-merge` in frontmatter must correspond to a PARTIAL-MERGE annotation in STORY-INDEX, not MERGED)."
      - "Report every mismatch as a violation with the story ID, frontmatter value, and STORY-INDEX value. If STORY-INDEX has no row for a story file → also a violation (unregistered story)."
      - "Verify that no story carries an unrecognized `status:` value. Valid set: {draft, ready, in-progress, partial-merge, merged, retired}. Any other value (including `delivered`) is a violation per ADR-020."

  - id: 14
    name: bc_vp_promotion_on_anchor_merge
    description: "When a story flips to `status: merged` (not `partial-merge`), the BCs in its `behavioral_contracts:` array MUST auto-promote `draft → active`. State-manager performs this bump atomically with the status flip."
    adopted: bundle-A-cleanup-2026-05-08
    severity: HIGH
    enforced_by: [state-manager, post-merge-audit]
    scope: [bc, vp, story]
    lint_hook: hooks/check-bc-promotion.sh
    references_adr: ADR-021
    verification_steps:
      - "Enumerate all stories with `status: merged` in their frontmatter. For each, extract the `behavioral_contracts:` frontmatter array."
      - "For each BC ID in those arrays, read the corresponding BC file's frontmatter `status:` field. If it is `draft`, this is a missed-promotion violation (the story merged but the BC was never bumped to `active`)."
      - "Verify that stories with `status: partial-merge` do NOT have their BCs promoted to `active`. If any BC in a `partial-merge` story's `behavioral_contracts:` array is `active`, verify that ANOTHER fully-merged story also owns that BC (dual-ownership is legitimate)."
      - "Check BC-INDEX for every BC listed as `active` — confirm at least one anchor story with `status: merged` (not `partial-merge`) cites it in `behavioral_contracts:`."
      - "Spot-check the promotion timestamps: if a BC flipped to `active` on date X, there should be a story with `status: merged` (flip date <= X) citing that BC in `behavioral_contracts:`."

  - id: 15
    name: runtime_wiring_required_for_accepted_adrs
    description: "Every ADR with `status: accepted` and crate-level deliverables MUST be reachable from at least one production binary (`bin/` target). Architectural decisions cannot be considered implemented if no binary instantiates the code."
    adopted: bundle-A-cleanup-2026-05-08
    severity: MEDIUM
    enforced_by: [scheduled-audit, wave-gate-hook]
    scope: [adr, architecture, runtime]
    lint_hook: skills/audit-runtime-wiring/
    references_adr: ADR-021
    verification_steps:
      - "Read ARCH-INDEX.md ADR Registry. Extract all ADRs with `status: ACCEPTED`. For each, determine whether it declares a crate-level deliverable (i.e., introduces or materially changes a crate's public API or binary entry point)."
      - "Run `cargo metadata --format-version 1 --no-deps | jq '.packages[].targets[] | select(.kind[] == \"bin\") | .src_path'` to enumerate all `[[bin]]` entry points in the workspace."
      - "For each accepted ADR with a deliverable (e.g., ADR-005 → rmcp/MCP server, ADR-016 → ActionDeliveryEngine, ADR-019 → WASM plugin runtime): search each binary entry point's reachability for at least one call to the ADR's primary type/function. Use `rg '<EntryType>::new\\|<EntryFn>\\b' src/main.rs` (or the equivalent path)."
      - "Flag any accepted ADR whose primary deliverable type cannot be found in any binary's call graph. Record as ADR-ID / deliverable-type / reason (e.g., `AD-005 / MCP Server / prism-mcp crate is a 10-line stub`)."
      - "False-positive escape: if the ADR has an explicit `wiring_deferred_to:` field in its frontmatter referencing a future story, suppress the finding but log it as a tracked deferral."

  - id: 16
    name: no_inverted_polarity_tests_outside_red_gate
    description: "Tests that assert production code panics with stub-indicating messages (e.g., `#[should_panic(expected = \"not yet implemented\")]`) are forbidden in stories with `status: merged` or `status: partial-merge`. Such tests are only permitted transiently during the Red Gate stub-architect phase, and must be retired by the implementer before status flip."
    adopted: bundle-A-cleanup-2026-05-08
    severity: HIGH
    enforced_by: [adversary-prompt, pre-merge-hook, test-writer-rule]
    scope: [story, source-code, test]
    lint_hook: hooks/check-inverted-polarity.sh
    references_adr: ADR-020
    verification_steps:
      - "Run `rg --type rust '#\\[should_panic\\([^)]*expected\\s*=\\s*\"[^\"]*(?:not yet implemented|not implemented|TODO|stub|unimplemented)' tests/ crates/*/src/ crates/*/tests/'` to find all inverted-polarity test decorators in the workspace."
      - "For each hit, identify the owning story by matching the crate to story `crate:` fields or the `behavioral_contracts:` that include the BC under test. Check that story's frontmatter `status:` field."
      - "If the owning story has `status: merged` or `status: partial-merge` → violation. The test codifies a stub as the production contract; it would break the day the stub is implemented."
      - "If the owning story has `status: in-progress` or `status: ready` → permitted as a transient Red Gate test (stub-architect phase). Record but do not block."
      - "Verify there is no story with `status: merged` where a `#[should_panic(expected = ...)]` test has a stub-indicating message AND the production function signature matches the BC's SUT. This is the specific failure case from F-AUD-D3-01."
      - "False-positive escape: tests that `#[should_panic]` on an INTENTIONAL panic (e.g., type-system invariant violation, not stub residue) may carry a suppress annotation `// POL-16-OK: intentional-panic` on the line above the attribute. Verify the justification is plausible."

  - id: 18
    name: test_injection_feature_pairing
    description: |
      Cargo features named `*_test_injection` (e.g., `test-injection`, `prism_test_injection`)
      MUST: (1) be listed as `required-features` in all `[[test]]` sections in `Cargo.toml` that
      depend on the feature's env-var injection behavior; (2) NEVER appear in `default = [...]`
      features; (3) be guarded by `#[cfg(feature = "test-injection")]` (not cfg(test)) in all
      production code paths that read PRISM_TEST_* env vars. This ensures that release binaries
      have zero test-injection code paths and that `just iter <crate>` (without --all-features)
      skips injection-dependent tests cleanly rather than running them against a non-injection binary.
    adopted: S-WAVE5-PREP-01-fix-pass-2-2026-05-09
    severity: HIGH
    enforced_by: [adversary-prompt, pre-merge-hook, code-reviewer]
    scope: [source-code, test, cargo-toml]
    lint_hook: null
    citations:
      - "F-PASS2-MED-1 (S-WAVE5-PREP-01 pass-2 adversarial review)"
      - "PG-2 (S-WAVE5-PREP-01 pass-2 process gap)"
    verification_steps:
      - "For each crate with a `*_test_injection` Cargo feature, run `grep -n 'test.injection\\|test_injection' Cargo.toml` — verify it does NOT appear in the `default` feature list."
      - "For each `[[test]]` section in `Cargo.toml` that invokes a binary with PRISM_TEST_* env vars (subprocess injection tests): verify `required-features = [\"test-injection\"]` (or equivalent) is present on that `[[test]]` block."
      - "Run `rg --type rust 'PRISM_TEST_' crates/*/src/ --glob '!**/tests/**'` to find env-var reads in production source. Each hit must be inside a `#[cfg(feature = \"test-injection\")]` block, NOT inside `#[cfg(test)]` alone."
      - "Run `just iter <crate>` (without `--all-features`) and verify injection-dependent tests are SKIPPED (not FAILED). If any injection test runs without the feature and fails → policy violation."
      - "Run `just iter <crate> --all-features` and verify injection-dependent tests are INCLUDED and PASS. If they are incorrectly excluded → policy violation."

  - id: 20
    name: bc_introduced_field_canonical_format
    description: |
      The `introduced:` frontmatter field on BC files has two canonical formats depending on origin:
      (1) BCs created during a greenfield cycle use `introduced: cycle-N` (e.g., `cycle-1`).
      (2) BCs created during a fix burst (adversarial remediation, process-gap closure, etc.)
          use `introduced: YYYY-MM-DD` (ISO 8601 date of introduction, e.g., `2026-05-13`).
      Opaque burst-ID notation (e.g., `introduced: wave-4-fix-burst-F-LP1-HIGH-004`) is
      prohibited — it embeds internal finding IDs that are meaningless without lookup context
      and silently collide if burst IDs are ever renumbered or renamed.
    adopted: state(D-464)-2026-05-13
    severity: MEDIUM
    enforced_by: [adversary-prompt, consistency-validator]
    scope: [bc]
    lint_hook: null
    citations:
      - "F-LP2-OBS-007 (S-PLUGIN-PREREQ-D pass-2 adversarial review)"
    verification_steps:
      - "For each BC file, read the `introduced:` frontmatter field."
      - "Extract the raw value: strip the `introduced:` YAML key and any surrounding whitespace. Then strip any surrounding double-quotes (the field may be quoted or unquoted in YAML). The resulting string is the value to validate."
      - "Pattern verification: validate the extracted value against the ANCHORED regex `^(cycle-[0-9]+|[0-9]{4}-[0-9]{2}-[0-9]{2})$`. PASS if it matches entirely. VIOLATION if any part of the string fails to match. UNANCHORED substring grep is FORBIDDEN as a verification mechanism — `cycle-1-pass-80` substring-matches `cycle-[0-9]+` but violates POL-20 (compound suffix). This gap was demonstrated by F-LP4-OBS-004 which caught 8 BC violations missed by prior unanchored grep."
      - "If the value does NOT match the anchored regex → VIOLATION. Report the BC ID, the full offending value, and the correct format based on whether the BC was authored in a greenfield cycle (use `cycle-N`) or a fix burst (use `YYYY-MM-DD` ISO date)."
      - "Cross-check: if a BC's `closes_finding:` frontmatter field is populated, it was introduced in a fix burst → must use date format, not `cycle-N`."
      - "Recommended shell one-liner for bulk verification: `grep '^introduced:' .factory/specs/behavioral-contracts/*.md | awk -F': ' '{print $2}' | sed 's/^\"//' | sed 's/\"$//' | grep -Ev '^(cycle-[0-9]+|[0-9]{4}-[0-9]{2}-[0-9]{2})$'` — empty output = PASS; any output = VIOLATION."

  - id: 21
    name: phantom_section_anchor_prohibited
    description: |
      Every §X section anchor cited in a story or BC must resolve to an actual `##` heading
      in the referenced document. Bold-labeled bullets are NOT section headings and MUST NOT
      be cited with the §-sigil. If the target is a bold-labeled bullet, cite it as
      "§ParentHeading (BoldLabel bullet)" to make the ancestry explicit.
    adopted: S-PLUGIN-PREREQ-D-pass-28-D-519-2026-05-13
    severity: HIGH
    enforced_by: [adversary-prompt, consistency-validator]
    scope: [story, bc, architecture]
    lint_hook: null
    verification_steps:
      - "For each §X citation in the story body, §References, and §Changelog: extract the document and section name."
      - "Grep the cited document for '## <section_name>' (exact ## heading level). PASS if found. VIOLATION if not found."
      - "If the cited target is a bold-labeled bullet (e.g., '**Canonical Structured Event Catalog**' inside a Postconditions section), the §-sigil form is FORBIDDEN. Correct form: '§Postconditions (Canonical Structured Event Catalog bullet)'. Bold-labeled bullets ARE citable with parent-section ancestry notation; they are NOT citable with bare §-sigil."
      - "Exception: citations in §Changelog historical rows are immutable and exempt from this check (TD-VSDD-091)."

  - id: 22
    name: adversarial_citation_and_entity_verification
    description: |
      Two-phase adversarial verification discipline — Phase A: lexical-vs-semantic anchor
      verification; Phase C: named-entity existence verification. Both phases must complete
      before declaring CLEAN on any pass where spec content references external anchors or
      introduces/cites named code entities.
    adopted: S-PLUGIN-PREREQ-D-pass-25-D-513-2026-05-13
    severity: HIGH
    enforced_by: [adversary-prompt]
    scope: [story, bc, architecture]
    lint_hook: null
    verification_steps:
      - "Phase A — Lexical-vs-semantic anchor-content verification: For every cited document anchor (ARTIFACT §SectionName or ARTIFACT §Rule) in the story body, grep the cited document's text for the cited rule. Substring match in the story body = INSUFFICIENT. Target-document grep = REQUIRED. If the target document does not contain the cited rule at the cited anchor, it is a phantom-anchor violation."
      - "Phase A extension (D-571): For claimed boot-step wiring closures, traverse the production call chain from the binary entry point (main.rs -> PrismCommand::Start) to the claimed wiring site. If any `todo!()` or `unimplemented!()` macro fires before the wired step, the closure is a paper-fix (TD-VSDD-059)."
      - "Phase B — Verify the adversary does not confuse story-body confirmation (citation text exists in story) with target-document confirmation (rule exists at the cited location in the referenced doc). These are distinct checks."
      - "Phase C — Named entity existence verification (D-571): Before declaring CLEAN on any pass where a fix-burst amended a BC body introducing or citing a named entity (enum variant, error code, type name): grep (1) the corresponding error.rs / Cargo.toml / canonical type definition location and (2) error-taxonomy.md. If the named entity does not exist in the canonical definition location, it is a phantom-entity violation (CRIT severity)."
      - "Phase C extension: For each registered Component Model callback in a test claiming production-callback coverage: verify the callback body calls a named production function. Presence of `trace!()` + comment 'deferred' without a production function call = paper-fix. Adversary checks: grep callback body for actual host_* function call; absence = CRIT finding."

  - id: 23
    name: bc_version_bump_sibling_grep_gate
    description: |
      When a BC version is bumped in a fix-burst, the SAME atomic commit must update ALL
      story body prose sites that pin the old version string. This includes: (1) inline
      trace-header lines, (2) §References section version annotations, (3) Architecture
      Compliance Rules table version cells. Additionally, BC frontmatter `modified:` and
      `timestamp:` fields must be synced to the amendment date. Story version bumps must
      also sync both `version:` and `updated:` frontmatter fields.
    adopted: S-PLUGIN-PREREQ-D-pass-33-D-530-2026-05-14
    severity: HIGH
    enforced_by: [adversary-prompt, story-writer-self-check, product-owner-self-check]
    scope: [story, bc]
    lint_hook: null
    verification_steps:
      - "When a BC version bumps from vX.Y to vX.(Y+1): run grep -n 'BC-N.NN.NNN v<old_version>' across all story body files that reference this BC."
      - "Every hit must be updated to the new version string in the same atomic commit."
      - "Also verify BC frontmatter `modified:` field reflects the amendment date (ISO YYYY-MM-DD format)."
      - "Also verify BC frontmatter `timestamp:` field reflects the amendment date (ISO YYYY-MM-DDTHH:MM:SSZ format)."
      - "Sibling-sweep must include VP-INDEX named-alias row descriptions that reference AC anchors from the amended BC (see POL-25 for cross-document propagation rule)."
      - "(D-571 PG-IMPL-LP6-003 extension) For every story version bump in a fix-burst: verify story frontmatter `version:` field matches the new version string in §Changelog top row. Verify story frontmatter `updated:` field is set to the fix-burst date (ISO YYYY-MM-DD). Both fields in the same atomic commit."

  - id: 24
    name: error_message_template_verbatim
    description: |
      Story §Error Taxonomy Additions rows and all prose references to error-taxonomy.md
      entries must match the canonical error-taxonomy.md message template byte-for-byte —
      including delimiter style (backtick vs single-quote), capitalization, and punctuation.
      The canonical source is the `message_template:` field in error-taxonomy.md.
    adopted: S-PLUGIN-PREREQ-D-pass-31-D-530-2026-05-14
    severity: MEDIUM
    enforced_by: [adversary-prompt, story-writer-self-check]
    scope: [story, error-taxonomy]
    lint_hook: null
    verification_steps:
      - "For each error code cited in story §Error Taxonomy Additions, grep error-taxonomy.md for the canonical message_template: field."
      - "Compare the story table cell text to the canonical template character-by-character. Delimiter mismatch (backtick vs single-quote), capitalization differences, or punctuation changes are violations."
      - "For prose references to error messages outside §Error Taxonomy Additions, apply the same comparison."
      - "If the story introduces a NEW error code (not yet in error-taxonomy.md), both the story §Error Taxonomy Additions entry AND the new taxonomy entry must use identical formatting before the PR merges."

  - id: 25
    name: multi_cite_propagation_sweep_mandatory
    description: |
      When a fix-burst corrects a phrasing or anchor-string pattern across multiple artifact
      sites, the grep must enumerate ALL documents that can carry the pattern — not just the
      documents already known to be affected. Mandatory sweep expansion targets:
      VP-INDEX named-alias row descriptions, error-taxonomy.md prose, §References in all
      stories that trace to the same BC, and architecture documents (verification-architecture.md,
      ADR-NNN.md). Closing 4 of 5 sites and missing the 5th constitutes an incomplete fix.
    adopted: S-PLUGIN-PREREQ-D-pass-35-D-534-2026-05-14
    severity: HIGH
    enforced_by: [adversary-prompt, product-owner-self-check, story-writer-self-check]
    scope: [story, bc, architecture, vp]
    lint_hook: null
    verification_steps:
      - "After any fix-burst that updates a phrasing or anchor-string: run a workspace-wide grep for the OLD phrasing (before correction)."
      - "The grep scope must include: .factory/stories/, .factory/specs/behavioral-contracts/, .factory/specs/verification-properties/, .factory/specs/prd-supplements/, .factory/specs/architecture/."
      - "Any grep hit that was NOT corrected in the fix-burst = sibling-sweep gap violation."
      - "Exception: §Changelog historical rows are immutable (TD-VSDD-091). Exclude those from the violation count."
      - "If a hit is in an out-of-perimeter document (architecture layer, VP-INDEX when story-writer scope), route to the appropriate specialist; do NOT declare the fix complete while the out-of-perimeter hit remains open."

  - id: 26
    name: changelog_schema_integrity
    description: |
      Before committing any §Changelog row additions to index files (VP-INDEX, STORY-INDEX,
      BC-INDEX, ARCH-INDEX), state-manager must count the cells in each new row and verify
      they match the header row count. Each index file has a fixed schema:
      VP-INDEX: 5 columns (Version | Burst | Date | Author | Change).
      STORY-INDEX: 3 columns (Version | Date | Summary).
      BC-INDEX: schema per BC-INDEX header.
      D-NNN references are NEVER standalone trailing cells — always folded into the rightmost
      content cell as a parenthetical prefix (e.g., "(D-539) Fixed VP-INDEX schema").
      Lines >500 chars in a markdown table are suspicious-merge signals; >1000 chars with
      multiple '| vN.M |' patterns = confirmed merged-row corruption.
    adopted: S-PLUGIN-PREREQ-D-pass-38-D-539-2026-05-14
    severity: MEDIUM
    enforced_by: [state-manager, adversary-prompt]
    scope: [story-index, bc-index, vp-index, arch-index]
    lint_hook: null
    verification_steps:
      - "For every new §Changelog row being committed: count the pipe-delimited cells (excluding leading/trailing empty cells)."
      - "Compare cell count to the header row for that index file. PASS only if counts match exactly."
      - "Verify inter-row newlines: each '| Version |' row must start on its own physical line. A single physical line containing multiple '| v1.N |' patterns is a merged-row violation."
      - "Verify D-NNN positioning: grep the row for a standalone '| D-[0-9]+ |' pattern. Any match = orphaned trailing cell violation; fold the D-NNN into the rightmost content cell."
      - "Orchestrator dispatch prompt templates MUST specify the correct column schema for each index file they prescribe §Changelog row additions for."

  - id: 27
    name: bc_modified_field_iso_date_format
    description: |
      The `modified:` frontmatter field on BC files must use ISO 8601 date scalar format
      (YYYY-MM-DD) matching the most recent §Changelog entry date. Burst-ID-list format
      (e.g., `modified: [fix-burst-22, fix-burst-7]`) is prohibited for new BCs and for
      BCs modified after this policy takes effect. Opaque burst-ID lists lose meaning
      outside session context and cannot be parsed by date-aware tooling.
    adopted: S-PLUGIN-PREREQ-D-cycle-close-2026-05-15
    severity: MEDIUM
    enforced_by: [adversary-prompt, consistency-validator]
    scope: [bc]
    lint_hook: null
    verification_steps:
      - "For each BC file, read the `modified:` frontmatter field."
      - "The value must match the anchored regex `^[0-9]{4}-[0-9]{2}-[0-9]{2}$` (ISO YYYY-MM-DD). VIOLATION if it contains brackets, burst-ID tokens, or any non-date format."
      - "Cross-check: the ISO date must match the date of the most recent §Changelog entry for that BC. Stale dates = violation of TD-VSDD-060 sibling-site discipline."
      - "For the ~30 pre-existing BCs with burst-ID-list format: the sweep maintenance story will normalize all to ISO dates. Until that story merges, pre-existing burst-ID-list violations are tracked but non-blocking (grace period)."

  - id: 29
    name: within_fb_sibling_sweep_discipline
    description: |
      When a fix-burst (FB) modifies a value, structure, or claim in one document,
      the same burst MUST sweep ALL sibling sites in the workspace that reference
      that value/structure/claim and update them to the post-fix canonical form.

      Sibling sites include: (a) live-narrative citations in other artifacts that
      pin the changed value or version; (b) sibling-class artifacts of the same
      kind that share the same change-pattern (e.g., when fixing one BC's
      §Changelog ordering, sweep all sibling BCs' §Changelogs in the same
      subsystem); (c) frontmatter fields that mirror body changes (e.g.,
      `subsystems_affected` mirroring boot.rs touch-surface; `runtime_deliverables`
      mirroring §Decision implementation surface).

      The fix-burst is NOT considered complete until sibling-sweep is performed
      and documented in the §Changelog narrative or PO/architect handoff note.

      Enforcement: architect and product-owner agents MUST grep the workspace for
      the changed value at every fix-burst, count the live-narrative hits, sweep
      them, and report the sweep count. State-manager verifies before commit.

      Codification basis: 19+ recurrences across S-PLUGIN-PREREQ-E cascade
      (passes 37-62) where a fix-burst closed one site but the next adversarial
      pass surfaced the same defect-class at a sibling site. Each recurrence
      consumed a full pass + fix-burst cycle to close plus reset the 3-CLEAN
      streak. POL-29 codification is the structural intervention.
    adopted: FB50-D-672-2026-05-17
    severity: HIGH
    enforced_by: [adversary-prompt, product-owner-self-check, architect-self-check, state-manager]
    scope: [bc, vp, story, hs, adr, architecture, prd, error-taxonomy, capabilities, invariants, story-index, bc-index, vp-index, arch-index]
    lint_hook: null
    verification_steps:
      - "After any fix-burst that updates a value, version-pin, structure, or claim in a document: enumerate ALL document types in scope (bc, vp, story, hs, adr, architecture, prd, error-taxonomy, capabilities, invariants, story-index, bc-index, vp-index, arch-index)."
      - "For each in-scope document type, run a workspace-wide grep for the OLD value/claim (before correction). Sweep scope: .factory/stories/, .factory/specs/behavioral-contracts/, .factory/specs/verification-properties/, .factory/specs/prd-supplements/, .factory/specs/architecture/, .factory/holdout-scenarios/."
      - "Any grep hit NOT corrected in the same fix-burst = sibling-sweep gap violation. §Changelog historical rows are immutable (TD-VSDD-091); exclude those from violation count."
      - "Report the grep hit count and sweep count in the §Changelog narrative or handoff note: 'Sibling sweep: N sites found, N updated, N exempt (§Changelog historical).' Zero-hit sweeps must also be reported ('Sibling sweep: 0 sites found — no propagation needed')."
      - "Sibling-CLASS sweep: when fixing an ordering violation (POL-26) or phrasing violation in one artifact, sweep ALL sibling-class artifacts of the same kind (e.g., all BCs in the same subsystem, all story §Changelogs for the same story, all HS files for the same story). Do not limit sweep to the directly-named artifact."
      - "State-manager verifies the sweep report is present in the §Changelog narrative before staging the commit. If no sweep report is present → block the commit."
