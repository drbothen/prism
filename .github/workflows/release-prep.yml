# release-prep.yml — mechanize the version bump + CHANGELOG generation for a release
#
# PURPOSE
# -------
# Automates the mechanical preparation steps for cutting a release:
#   1. Creates a release/vX.Y.Z branch off develop
#   2. Bumps crates/prism-bin/Cargo.toml [package].version to the requested version
#   3. Updates both Cargo.lock files (root + non-exhaustive-violation)
#   4. Generates a ## [X.Y.Z] CHANGELOG section via git-cliff (ADR-063 §D3/D5),
#      categorizing Conventional Commits into Added / Fixed / Performance / Changed / Security
#   5. Commits, pushes the branch, and opens a PR targeting develop
#
# The human still owns:
#   - Reviewing and curating the generated CHANGELOG section
#   - Approving and merging the PR to develop
#   - Dispatching release-promote.yml after the PR merges
#
# AUTHENTICATION
# --------------
# Uses the built-in GITHUB_TOKEN (contents: write + pull-requests: write).
# This workflow only pushes a release/* branch and opens a PR to develop —
# it does NOT write to main and requires no PAT.
#
# VERSIONING NOTE
# ---------------
# Only crates/prism-bin/Cargo.toml is bumped.  All other workspace crates
# carry independent semver versions and are NOT touched.  See RELEASING.md
# §1 Versioning Philosophy.

name: Release Prep

on:
  workflow_dispatch:
    inputs:
      version:
        description: >
          Version to prepare (e.g. 1.0.0-rc.2 or 1.1.0) — WITHOUT leading v,
          matching the Cargo.toml form.  The tag that release-promote.yml will
          push will be v${version}.
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  release-prep:
    name: Release prep v${{ github.event.inputs.version }}
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      VERSION: ${{ github.event.inputs.version }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      # ------------------------------------------------------------------ #
      # 1. Checkout develop — full history needed for git-cliff range          #
      # ------------------------------------------------------------------ #
      - name: Checkout develop (full history)
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: develop
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      # ------------------------------------------------------------------ #
      # 2. Configure git bot identity for the release-prep commit            #
      # ------------------------------------------------------------------ #
      - name: Configure git bot identity
        run: |
          set -euo pipefail
          git config user.name "prism-release-bot"
          git config user.email "prism-release-bot@users.noreply.github.com"

      # ------------------------------------------------------------------ #
      # 3. Create release branch off develop                                 #
      # ------------------------------------------------------------------ #
      - name: Create release branch
        run: |
          set -euo pipefail
          BRANCH="release/v${VERSION}"
          if git ls-remote --heads origin "${BRANCH}" | grep -q "${BRANCH}"; then
            echo "::error::branch ${BRANCH} already exists on origin — delete it or choose a different version"
            exit 1
          fi
          git checkout -b "${BRANCH}"
          echo "BRANCH=${BRANCH}" >> "${GITHUB_ENV}"
          echo "Created branch ${BRANCH} off develop"

      # ------------------------------------------------------------------ #
      # 4. Bump crates/prism-bin/Cargo.toml [package].version               #
      #    Only prism-bin carries the product version (RELEASING.md §1).    #
      #    All other workspace crates are untouched.                         #
      # ------------------------------------------------------------------ #
      - name: Bump prism-bin version in Cargo.toml
        run: |
          set -euo pipefail
          python3 - <<'PYEOF'
          import re, os
          version = os.environ['VERSION']
          path = 'crates/prism-bin/Cargo.toml'
          content = open(path).read()
          # Replace the first occurrence of version = "..." (the [package] version).
          new_content = re.sub(
              r'^version = "[^"]*"',
              f'version = "{version}"',
              content,
              count=1,
              flags=re.MULTILINE,
          )
          if new_content == content:
              raise SystemExit(f'ERROR: no version line found in {path} — check Cargo.toml format')
          open(path, 'w').write(new_content)
          print(f'Bumped prism-bin version to {version}')
          PYEOF

      # ------------------------------------------------------------------ #
      # 5. Install Rust toolchain (required for cargo update)                #
      #    cargo update is a pure metadata operation — no compilation,       #
      #    no protoc or other build tools needed.                            #
      # ------------------------------------------------------------------ #
      - name: Install Rust toolchain (stable, for cargo update)
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable

      # ------------------------------------------------------------------ #
      # 6. Update Cargo.lock files for the prism-bin version bump            #
      #    Two lockfiles: root workspace + non-exhaustive-violation.         #
      #    Both are committed — release.yml runs `cargo build --locked`.    #
      # ------------------------------------------------------------------ #
      - name: Update Cargo.lock files (prism-bin version only)
        run: |
          set -euo pipefail
          # Root workspace lockfile
          cargo update -p prism-bin --precise "${VERSION}"
          echo "Root Cargo.lock updated"
          # Non-exhaustive-violation external test crate lockfile
          cargo update \
            --manifest-path tests/external/non-exhaustive-violation/Cargo.toml \
            -p prism-bin --precise "${VERSION}"
          echo "tests/external/non-exhaustive-violation/Cargo.lock updated"

      # ------------------------------------------------------------------ #
      # 7. Generate CHANGELOG section (git-cliff)                            #
      #    Uses git-cliff 2.14.1 to prepend a categorized ## [X.Y.Z]        #
      #    section to CHANGELOG.md from Conventional Commits history.        #
      #    Authority: ADR-063 §D3/D5 — canonical invocation flag set.       #
      #    --unreleased selects commits not yet in any tag (robust for       #
      #    first release and recurring releases alike).                      #
      #    --tag sets the new section header.                                #
      #    --prepend writes to the top of CHANGELOG.md only.                #
      #    Do NOT add --output alongside --prepend (causes duplicate         #
      #    sections per ADR-063 §D5 v1.1 fix).                              #
      #                                                                      #
      #    Pre-strip (ADR-063 §D3): git-cliff --prepend inserts              #
      #    header + new-section before the existing file content.            #
      #    The cliff.toml [changelog] header carries the "# Changelog"       #
      #    masthead + "## [Unreleased]" section. To avoid masthead           #
      #    duplication on repeated release cycles, we strip the masthead     #
      #    and any prior [Unreleased] section from CHANGELOG.md before       #
      #    running git-cliff. The committed result always has the masthead   #
      #    (emitted by the cliff.toml header on each run).                   #
      #                                                                      #
      #    Link-ref update (ADR-063 §D3): after prepending the new section,  #
      #    the compare-link reference definitions at the bottom of            #
      #    CHANGELOG.md are updated: [Unreleased]: is pointed at the new     #
      #    version, and a new [X.Y.Z]: compare link is inserted.             #
      # ------------------------------------------------------------------ #
      - name: Generate CHANGELOG section (git-cliff)
        run: |
          set -euo pipefail
          cargo install git-cliff --version 2.14.1 --locked --quiet

          # Pre-strip: remove masthead/preamble and any prior [Unreleased] section
          # so git-cliff receives a file starting at the first versioned ## [X.Y.Z] section.
          # This prevents masthead duplication across repeated release-prep cycles.
          #
          # Zero-versioned-section edge case: if CHANGELOG.md contains only a masthead
          # and ## [Unreleased] block with no versioned ## [X.Y.Z] sections (e.g. on the
          # very first git-cliff-driven release), the entire file is stripped to empty so
          # that git-cliff --prepend does not produce a duplicated masthead + Unreleased.
          python3 - <<'PYEOF'
          path = 'CHANGELOG.md'
          content = open(path).read()
          lines = content.split('\n')
          n = len(lines)
          # Explicitly strip the leading masthead/preamble and any [Unreleased] section,
          # regardless of whether a versioned section follows.
          i = 0
          # Step 1: skip non-section prefix (masthead, preamble, blank lines)
          while i < n and not lines[i].startswith('## ['):
              i += 1
          # Step 2: if we landed on ## [Unreleased], skip it and its body
          if i < n and lines[i].startswith('## [Unreleased]'):
              i += 1
              while i < n and not lines[i].startswith('## ['):
                  i += 1
          # i now points to the first versioned ## [X.Y.Z] line (or n if none exist)
          start = i
          open(path, 'w').write('\n'.join(lines[start:]))
          print(f'Pre-strip complete: CHANGELOG.md starts at versioned section (line {start})')
          PYEOF

          # Generate and prepend the new section. The cliff.toml header emits the
          # "# Changelog" masthead + "## [Unreleased]" before the new section.
          git cliff --tag "v${VERSION}" --unreleased --prepend CHANGELOG.md

          # Link-ref update: update [Unreleased]: to point at the new version and
          # insert a new [X.Y.Z]: compare link (token-free, ADR-063 §D3).
          python3 - <<'PYEOF'
          import re, os
          version = os.environ['VERSION']
          path = 'CHANGELOG.md'
          content = open(path).read()
          m = re.search(
              r'\[Unreleased\]: https://github\.com/drbothen/prism/compare/v(.+?)\.\.\.HEAD',
              content,
          )
          if m:
              prev_version = m.group(1)
              new_unreleased = (
                  f'[Unreleased]: https://github.com/drbothen/prism/compare/v{version}...HEAD'
              )
              new_version_ref = (
                  f'[{version}]: https://github.com/drbothen/prism/compare/'
                  f'v{prev_version}...v{version}'
              )
              content = re.sub(
                  r'\[Unreleased\]: https://github\.com/drbothen/prism/compare/v.+?\.\.\.HEAD',
                  new_unreleased + '\n' + new_version_ref,
                  content,
              )
              open(path, 'w').write(content)
              print(f'Link refs updated: [Unreleased] → v{version}...HEAD, added [{version}] ref (prev: {prev_version})')
          else:
              import sys
              print('::error::CHANGELOG.md [Unreleased]: compare link not found — '
                    'the footer block is missing or malformed. The new ## [VERSION] '
                    'section has been prepended but the [Unreleased]: and [VERSION]: '
                    'compare-link references were NOT updated, which will corrupt '
                    'PREV-derivation on the next release cycle. '
                    'Add a valid [Unreleased]: compare link to the CHANGELOG.md footer '
                    'and re-run release-prep.')
              sys.exit(1)
          PYEOF

      # ------------------------------------------------------------------ #
      # 7a. Draft Layer-1 release notes (technical-writer)                   #
      #     Dispatch notice: vsdd-factory:technical-writer should insert     #
      #     ### Highlights / ### Breaking Changes (narrative) /             #
      #     ### Upgrade Notes inside the ## [VERSION] block, BEFORE the     #
      #     first git-cliff ### section.                                     #
      #     Authority: ADR-063 D4 — two-layer CHANGELOG model.              #
      #     See RELEASING.md §5 for the Layer-1 contract.                   #
      # ------------------------------------------------------------------ #
      - name: Draft Layer-1 release notes (technical-writer)
        run: |
          set -euo pipefail
          echo "::notice::MANUAL STEP REQUIRED: dispatch vsdd-factory:technical-writer to draft Layer-1 release notes (not auto-run by this workflow)"
          echo "Technical-writer should:"
          echo "  1. Read CHANGELOG.md to find the newly-prepended ## [${VERSION}] block"
          echo "  2. Insert ### Highlights, ### Breaking Changes (narrative), ### Upgrade Notes"
          echo "     inside the ## [${VERSION}] block, BEFORE the first git-cliff ### section"
          echo "  3. Content: current behavior only; 5-8 bullets for Highlights; omit empty sections"
          echo "  4. Human curates the draft in this PR before merge"
          echo "See RELEASING.md §5 for the Layer-1 contract."

      # ------------------------------------------------------------------ #
      # 8. Commit the release-prep changes                                   #
      # ------------------------------------------------------------------ #
      - name: Commit release prep
        run: |
          set -euo pipefail
          git add \
            crates/prism-bin/Cargo.toml \
            Cargo.lock \
            tests/external/non-exhaustive-violation/Cargo.lock \
            CHANGELOG.md
          git commit -m "chore(release): prep v${VERSION} — bump prism-bin + CHANGELOG generation"
          echo "Committed release prep for v${VERSION}"

      # ------------------------------------------------------------------ #
      # 9. Push the release branch to origin                                 #
      # ------------------------------------------------------------------ #
      - name: Push release branch
        run: |
          set -euo pipefail
          git push -u origin "${BRANCH}"
          echo "Pushed ${BRANCH} to origin"

      # ------------------------------------------------------------------ #
      # 10. Open a pull request to develop                                   #
      # ------------------------------------------------------------------ #
      - name: Open pull request to develop
        run: |
          set -euo pipefail
          # Build PR body using a Python list of lines — every line stays
          # indented within the YAML block scalar (no column-0 content).
          python3 - <<'PYEOF'
          import os
          version  = os.environ['VERSION']
          lines = [
              f'## Release prep: v{version}',
              '',
              f'This PR was created by the `release-prep` workflow. It bumps `prism-bin`',
              f'to `{version}` and generates a categorized Layer-2 CHANGELOG section via',
              f'git-cliff (ADR-063 D5). The Layer-1 `### Highlights` / `### Breaking Changes`',
              f'/ `### Upgrade Notes` top-block is **not auto-generated** — it must be drafted',
              f'by dispatching `vsdd-factory:technical-writer` and curated before merge (ADR-063 D4).',
              '',
              '**Before merging:**',
              '1. Review the git-cliff generated CHANGELOG entry (Layer 2) — entries are',
              '   auto-categorized under Added / Fixed / Performance / Changed / Security.',
              '2. Dispatch `vsdd-factory:technical-writer` to draft the Layer-1 top-block',
              '   (`### Highlights` + `### Breaking Changes` / `### Upgrade Notes` if',
              '   applicable) inside `## [VERSION]` — this block is NOT present at PR',
              '   open time and must be created before merge (ADR-063 D4).',
              '3. Review and curate the drafted Layer-1 block — current behavior only;',
              '   remove aspirational bullets; omit `### Breaking Changes` if none.',
              f'4. Confirm `prism-bin` version in `Cargo.toml` matches the intended tag (`v{version}`).',
              '5. Wait for all required CI checks to pass.',
              '6. Merge this PR to `develop` (squash or merge commit per project convention).',
              '',
              '**After merge — to promote (see RELEASING.md §4):**',
              '```bash',
              '# Dry run first (validates without writing):',
              f'gh workflow run release-promote.yml --repo drbothen/prism --ref develop --field tag=v{version} --field dry_run=true',
              '',
              '# Real promotion (requires release-main environment approval):',
              f'gh workflow run release-promote.yml --repo drbothen/prism --ref develop --field tag=v{version} --field dry_run=false',
              '```',
              '',
              '## Checklist',
              '- [ ] CHANGELOG Layer-2 (git-cliff) entries reviewed',
              '- [ ] Dispatch `vsdd-factory:technical-writer` to DRAFT the Layer-1 `### Highlights` (+ Breaking Changes / Upgrade Notes if applicable) top-block inside `## [VERSION]` (ADR-063 D4)',
              '- [ ] Review and curate the drafted Layer-1 block; confirm it is present and accurate',
              '- [ ] Layer-1 Breaking Changes (narrative) section reviewed (or confirmed empty)',
              f'- [ ] `prism-bin` version in `Cargo.toml` matches intended tag `v{version}`',
              '- [ ] All required CI checks pass',
              '- [ ] PR merged to `develop` before dispatching `release-promote`',
          ]
          with open('/tmp/pr-body.md', 'w') as f:
              f.write('\n'.join(lines) + '\n')
          print('PR body written to /tmp/pr-body.md')
          PYEOF

          PR_URL="$(gh pr create \
            --base develop \
            --head "${BRANCH}" \
            --title "chore(release): prep v${VERSION}" \
            --body-file /tmp/pr-body.md)"
          echo "PR_URL=${PR_URL}" >> "${GITHUB_ENV}"
          echo "Opened PR: ${PR_URL}"

      # ------------------------------------------------------------------ #
      # 11. Job summary                                                       #
      # ------------------------------------------------------------------ #
      - name: Job summary
        if: always()
        run: |
          set -euo pipefail
          {
            echo "## Release Prep — v${VERSION}"
            echo ""
            echo "| Field | Value |"
            echo "|---|---|"
            echo "| Version | \`${VERSION}\` |"
            echo "| Branch | \`${BRANCH:-not reached}\` |"
            if [[ -n "${PR_URL:-}" ]]; then
              echo "| Pull request | ${PR_URL} |"
              echo ""
              echo "> Release-prep PR opened."
              echo "> Review and curate the CHANGELOG before merging."
              echo "> After merge to develop, dispatch \`release-promote\` with"
              echo "> \`tag=v${VERSION}\`."
            else
              echo "| Pull request | not reached |"
            fi
          } >> "${GITHUB_STEP_SUMMARY}"
