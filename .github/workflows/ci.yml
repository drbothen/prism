# CI Pipeline — PR gate: fmt -> clippy -> test -> deny -> audit -> semver-checks (AD-008 order)
name: CI

on:
  push:
  pull_request:

# Optimization 4: concurrency control — cancel superseded runs on PR pushes,
# but NOT on push-to-develop (which gates the post-merge workflow).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  fmt:
    name: Format check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          components: rustfmt
      - name: Check formatting
        run: cargo fmt --check

  clippy:
    name: Clippy (AD-008)
    needs: fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          components: clippy
      - name: Install protoc (required by prost-build for prism-ocsf)
        uses: arduino/setup-protoc@c65c819552d16ad3c9b72d9dfd5ba5237b9c906b # v3.0.0
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      # prism-credentials uses keyring 3.x with linux-native-sync-persistent (Secret Service
      # backend) on Linux gnu, which requires libdbus-1-dev + pkg-config at build time.
      # ADR-034 / BC-2.06.003: dbus Secret Service is the production Linux persistent backend.
      - name: Install libdbus-1-dev (required by keyring Secret Service backend on Linux)
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config
      # Optimization 1: Swatinem/rust-cache for incremental build caching
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          cache-on-failure: true
          shared-key: clippy-stable
      - name: Run clippy
        run: cargo clippy --workspace --all-features -- -D warnings

  test:
    name: Test (${{ matrix.target }})
    needs: clippy
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-latest
            target: aarch64-apple-darwin
            proptest_cases: 256
          - runner: macos-15-intel
            target: x86_64-apple-darwin
            proptest_cases: 256
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            proptest_cases: 1000
            run_doctests: true
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-musl
            install_musl: true
            proptest_cases: 256
          - runner: windows-latest
            target: x86_64-pc-windows-msvc
            proptest_cases: 256
    steps:
      # S-MAINT-CI-DISK-EXHAUSTION-001 AC-001: disk-free preflight — captures pristine baseline
      # before checkout and rust-cache restore. Runs before actions/checkout per story ordering
      # rule (EC-007). Linux-only: failures are exclusive to Linux legs (mold linker footprint).
      - name: Report initial disk space
        if: runner.os == 'Linux'
        run: df -h
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      # S-MAINT-CI-DISK-EXHAUSTION-001 AC-002: reclaim preinstalled toolsets not needed by
      # Rust build, BEFORE rust-cache restore (prevents cache restore from filling disk first).
      # Removes android/dotnet/haskell/docker-images/large-packages (21–31 GB freed on ubuntu-24.04;
      # swap preserved as OOM headroom per EC-008). tool-cache intentionally NOT removed.
      # Fallback pin: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be # v1.3.1
      - name: Reclaim disk space (Linux only)
        if: runner.os == 'Linux'
        uses: insightsengineering/disk-space-reclaimer@dae9fabcb8febe09f6585471948acf9dc9a57489 # v1.1.2
        with:
          android: true
          dotnet: true
          haskell: true
          docker-images: true
          large-packages: true
          swap-storage: false
      - name: Verify >=25 GB free after reclaim
        if: runner.os == 'Linux'
        run: |
          # df -P / output: Filesystem, 1K-blocks, Used, Available, Use%, Mounted
          # Available ($4) is in 1K-blocks; divide by (1024*1024) to convert to GiB
          AVAIL_GB=$(df -P / | awk 'NR==2 { print int($4 / 1024 / 1024) }')
          AVAIL_GB=${AVAIL_GB:-0}  # Guard: awk returns empty if df fails; default 0 prevents -ge test failure
          [ "$AVAIL_GB" -ge 25 ] || {
            df -h
            echo "::error::Disk reclaim insufficient: only ${AVAIL_GB} GB free (need ≥25 GB). See S-MAINT-CI-DISK-EXHAUSTION-001."
            exit 1
          }
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          targets: ${{ matrix.target }}
      - name: Install protoc (required by prost-build for prism-ocsf)
        uses: arduino/setup-protoc@c65c819552d16ad3c9b72d9dfd5ba5237b9c906b # v3.0.0
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      # Optimization 1: Swatinem/rust-cache — per-target shared key for cache isolation
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          cache-on-failure: true
          shared-key: test-${{ matrix.target }}
      - name: Install musl-tools
        if: matrix.install_musl
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      # prism-credentials uses keyring 3.x with linux-native-sync-persistent (Secret Service
      # backend). When --all-features is passed, libdbus-sys is compiled on all Linux legs
      # (build.rs runs on the glibc host even for musl cross-compile targets).
      # Both linux-gnu and linux-musl legs therefore need libdbus-1-dev + pkg-config on the
      # host. At runtime: gnu uses dbus Secret Service; musl uses linux-native (kernel keyutils)
      # only per the prism-credentials Cargo.toml comment — but the compile-time dep is shared.
      # ADR-034 / BC-2.06.003: dbus Secret Service is the production Linux persistent backend.
      - name: Install libdbus-1-dev (required by keyring build on Linux, all-features)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config
      # Optimization: mold linker — faster linking on Linux (saves ~5 min per Linux leg)
      # make-default: false — we set RUSTFLAGS explicitly for robustness (see rui314/setup-mold#3)
      - name: Install mold linker (Linux only)
        if: runner.os == 'Linux'
        uses: rui314/setup-mold@9c9c13bf4c3f1adef0cc596abc155580bcb04444 # v1
        with:
          make-default: false
      # Optimization: taiki-e/install-action for prebuilt cargo-nextest (saves ~3 min vs cargo install)
      - name: Install nextest
        uses: taiki-e/install-action@cf525cb33f51aca27cd6fa02034117ab963ff9f1 # v2.75.22
        with:
          tool: nextest
      # PROPTEST_CASES tier model: linux-gnu=1000 (full strength), others=256 (proptest default).
      # RUSTFLAGS: mold linker on Linux only; empty on macOS/Windows (no mold equivalent).
      # NOTE: If a future story adds RUSTFLAGS, merge with a space separator — do not replace.
      - name: Run tests (nextest)
        env:
          PROPTEST_CASES: ${{ matrix.proptest_cases }}
          RUSTFLAGS: ${{ runner.os == 'Linux' && '-C link-arg=-fuse-ld=mold' || '' }}
        run: cargo nextest run --workspace --all-features --profile ci
      - name: Run doctests (linux-gnu only — nextest skips doctests)
        if: matrix.run_doctests
        # RUSTFLAGS must match the nextest step to avoid Rust fingerprint-cache invalidation.
        # Without this, cargo detects different RUSTFLAGS (nextest uses -C link-arg=-fuse-ld=mold,
        # doctest step would default to none) and recompiles all 24 crates from scratch — adding
        # ~8-9 minutes and risking OOM-kill on the runner under memory pressure after the 1000-
        # PROPTEST_CASES nextest run. The mold linker is installed above (setup-mold step) and
        # is available at this point in the job; no additional setup needed.
        env:
          RUSTFLAGS: "-C link-arg=-fuse-ld=mold"
        run: cargo test --workspace --all-features --doc
      - name: Upload JUnit results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: junit-${{ matrix.target }}
          path: target/nextest/ci/junit.xml
          retention-days: 7
      # S-MAINT-CI-DISK-EXHAUSTION-001 AC-004: disk-exhaustion failure annotation.
      # Runs on job failure (Linux only) to check if disk is near-full (>=95% used).
      # Emits a ::warning:: annotation to distinguish disk-exhaustion failures from
      # genuine test failures without requiring log scraping.
      - name: Disk-exhaustion failure annotation
        if: failure() && runner.os == 'Linux'
        run: |
          USED_PCT=$(df -P / | awk 'NR==2 { gsub(/%/, "", $5); print $5 }')
          USED_PCT=${USED_PCT:-0}  # Guard: awk returns empty if df fails; default 0 prevents -ge test failure
          df -h
          if [ "${USED_PCT}" -ge 95 ]; then
            echo "::warning::Disk near-full (${USED_PCT}% used) on runner — likely S-MAINT-CI-DISK-EXHAUSTION-001 class failure. Evidence runs: 29394488318 / 29399778005 / 29404746333 (PR #223, 2026-07-15)."
          fi

  test-no-default-features:
    # P3WV1B-A-M-004: exercise compile-time feature-negative paths.
    # prism-dtu-demo-server is excluded because its public API is gated behind
    # the `dtu` feature by design (required-features in [[bin]] + [[test]]).
    name: Test (no-default-features)
    needs: clippy
    runs-on: ubuntu-latest
    steps:
      # S-MAINT-CI-DISK-EXHAUSTION-001 AC-001: disk-free preflight — captures pristine baseline
      # before checkout and rust-cache restore (F-CIDISK-P4-MED-002).
      - name: Report initial disk space
        run: df -h
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      # S-MAINT-CI-DISK-EXHAUSTION-001 AC-002: reclaim preinstalled toolsets not needed by Rust
      # build, BEFORE rust-cache restore (F-CIDISK-P4-MED-002). Same inputs as linux-test legs.
      # Fallback pin: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be # v1.3.1
      - name: Reclaim disk space
        uses: insightsengineering/disk-space-reclaimer@dae9fabcb8febe09f6585471948acf9dc9a57489 # v1.1.2
        with:
          android: true
          dotnet: true
          haskell: true
          docker-images: true
          large-packages: true
          swap-storage: false
      - name: Verify >=25 GB free after reclaim
        run: |
          # df -P / output: Filesystem, 1K-blocks, Used, Available, Use%, Mounted
          # Available ($4) is in 1K-blocks; divide by (1024*1024) to convert to GiB
          AVAIL_GB=$(df -P / | awk 'NR==2 { print int($4 / 1024 / 1024) }')
          AVAIL_GB=${AVAIL_GB:-0}  # Guard: awk returns empty if df fails; default 0 prevents -ge test failure
          [ "$AVAIL_GB" -ge 25 ] || {
            df -h
            echo "::error::Disk reclaim insufficient: only ${AVAIL_GB} GB free (need ≥25 GB). See S-MAINT-CI-DISK-EXHAUSTION-001."
            exit 1
          }
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      - name: Install protoc (required by prost-build for prism-ocsf)
        uses: arduino/setup-protoc@c65c819552d16ad3c9b72d9dfd5ba5237b9c906b # v3.0.0
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      # prism-credentials uses keyring 3.x with linux-native-sync-persistent (Secret Service
      # backend) on Linux, requiring libdbus-1-dev + pkg-config at build time.
      # ADR-034 / BC-2.06.003: dbus Secret Service is the production Linux persistent backend.
      - name: Install libdbus-1-dev (required by keyring Secret Service backend on Linux)
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config
      # Optimization 1: Swatinem/rust-cache
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          cache-on-failure: true
          shared-key: test-no-default-features
      # Optimization: mold linker — faster linking on Linux
      - name: Install mold linker
        uses: rui314/setup-mold@9c9c13bf4c3f1adef0cc596abc155580bcb04444 # v1
        with:
          make-default: false
      # Optimization: taiki-e/install-action for prebuilt cargo-nextest
      - name: Install nextest
        uses: taiki-e/install-action@cf525cb33f51aca27cd6fa02034117ab963ff9f1 # v2.75.22
        with:
          tool: nextest
      - name: Run tests (no default features)
        env:
          PROPTEST_CASES: 1000
          RUSTFLAGS: -C link-arg=-fuse-ld=mold
        run: cargo nextest run --workspace --no-default-features --exclude prism-dtu-demo-server --profile ci
      # S-MAINT-CI-DISK-EXHAUSTION-001 AC-004: disk-exhaustion failure annotation (F-CIDISK-P4-MED-002).
      # Runs on job failure to check if disk is near-full (>=95% used).
      - name: Disk-exhaustion failure annotation
        if: failure()
        run: |
          USED_PCT=$(df -P / | awk 'NR==2 { gsub(/%/, "", $5); print $5 }')
          USED_PCT=${USED_PCT:-0}  # Guard: awk returns empty if df fails; default 0 prevents -ge test failure
          df -h
          if [ "${USED_PCT}" -ge 95 ]; then
            echo "::warning::Disk near-full (${USED_PCT}% used) on runner — likely S-MAINT-CI-DISK-EXHAUSTION-001 class failure. Evidence runs: 29394488318 / 29399778005 / 29404746333 (PR #223, 2026-07-15)."
          fi

  wasm32-compile-check:
    name: WASM32 compile check + .prx build (S-PLUGIN-CI-001 AC-001)
    # F-LP5-HIGH-001 closure: the crowdstrike-oauth2 plugin contains a wasm32-gated
    # mod host_impl block with wit_bindgen::generate!, impl Guest for Component, and
    # export!(Component). This code is NEVER compiled by host-target builds (clippy,
    # test, check). Without this job, signature drift in the wit-bindgen Guest impl
    # or WIT syntax errors in sensor-auth.wit would be invisible to CI.
    #
    # S-PLUGIN-CI-001 AC-001 addition: after compile-check, also build the full .prx
    # artifact via `just build-plugin-crowdstrike-oauth2`. This requires wasm-tools
    # (for the --adapt wasi_snapshot_preview1 component wrapping step) and the
    # WASI adapter fixture at tests/fixtures/wasi_snapshot_preview1.wasm.
    # The built .prx is uploaded as a CI artifact for traceability.
    #
    # wasm-tools version: 1.248.0 (pinned — matches the version used to build the
    # committed tests/fixtures/wasi_snapshot_preview1.wasm adapter from Wasmtime 44.0.1).
    needs: clippy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          targets: wasm32-wasip1
      # Optimization 1: Swatinem/rust-cache for incremental build caching.
      # Separate shared-key from the host-target build to avoid cache namespace collision.
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          cache-on-failure: true
          shared-key: wasm32-compile-check
      - name: Check crowdstrike-oauth2-plugin compiles for wasm32-wasip1
        run: |
          cargo check --target wasm32-wasip1 -p crowdstrike-oauth2-plugin
          echo "F-LP5-HIGH-001: wasm32-wasip1 compile check PASSED — Guest impl + wit-bindgen macro + export!(Component) compiled successfully"
      # S-PLUGIN-CI-001 AC-001: Install wasm-tools to build the .prx component artifact.
      # Pinned to 1.248.0 — the version used to build the committed .prx and WASI adapter.
      # SEC-001 (CWE-494): SHA-256 integrity check before extracting.
      # Checksum source: downloaded from GitHub releases over HTTPS and computed 2026-07-13.
      - name: Install wasm-tools 1.248.0
        run: |
          WASM_TOOLS_VERSION="1.248.0"
          EXPECTED_SHA256="dcd7d587b0f4644aabc85cd4471cb795de84f36a68ee01201d5261f87c0d6349"
          curl -fsSL "https://github.com/bytecodealliance/wasm-tools/releases/download/v${WASM_TOOLS_VERSION}/wasm-tools-${WASM_TOOLS_VERSION}-x86_64-linux.tar.gz" \
            -o /tmp/wasm-tools.tar.gz
          echo "${EXPECTED_SHA256}  /tmp/wasm-tools.tar.gz" | sha256sum -c
          tar -xz --strip-components=1 -C /usr/local/bin \
            wasm-tools-${WASM_TOOLS_VERSION}-x86_64-linux/wasm-tools \
            < /tmp/wasm-tools.tar.gz
          rm /tmp/wasm-tools.tar.gz
          wasm-tools --version
      # Install just (task runner) for the build-plugin-crowdstrike-oauth2 recipe.
      # F-MCPRS-PRL2-LOW-003: pinned to 1.43.1 — unpinned `tool: just` resolves to
      # latest at download time, violating supply-chain reproducibility.
      - name: Install just
        uses: taiki-e/install-action@cf525cb33f51aca27cd6fa02034117ab963ff9f1 # v2.75.22
        with:
          tool: just@1.43.1
      # F-MCPRS-PRL14-LOW-001: validate the COMMITTED crowdstrike-oauth2.prx structurally
      # BEFORE the build overwrites it. Without this step, a byte-corrupt committed .prx
      # with a consistent hash/sidecar would pass CI and fail only at runtime load.
      # Placed here (after wasm-tools install, before just build-plugin-crowdstrike-oauth2)
      # so the committed binary is the one being validated.
      - name: Validate committed crowdstrike-oauth2.prx structural integrity (F-MCPRS-PRL14-LOW-001)
        run: |
          wasm-tools validate --features=component-model crates/prism-spec-engine/plugins/crowdstrike-oauth2/crowdstrike-oauth2.prx
          echo "F-MCPRS-PRL14-LOW-001 PASS: committed crowdstrike-oauth2.prx passes structural validation"
      # S-PLUGIN-CI-001 AC-001: Build the crowdstrike-oauth2 .prx component artifact.
      # This verifies the full toolchain pipeline: cargo build → wasm-tools component new.
      - name: Build crowdstrike-oauth2.prx
        run: |
          just build-plugin-crowdstrike-oauth2
          echo "S-PLUGIN-CI-001 AC-001: crowdstrike-oauth2.prx built successfully"
          ls -la crates/prism-spec-engine/plugins/crowdstrike-oauth2/crowdstrike-oauth2.prx
          wasm-tools validate --features=component-model crates/prism-spec-engine/plugins/crowdstrike-oauth2/crowdstrike-oauth2.prx
          echo "S-PLUGIN-CI-001 AC-001: .prx validates as a valid WASM component"
      - name: Upload crowdstrike-oauth2.prx artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: crowdstrike-oauth2-prx
          path: crates/prism-spec-engine/plugins/crowdstrike-oauth2/crowdstrike-oauth2.prx
          retention-days: 7

  wasm32-threatintel-staleness-check:
    name: ThreatIntel .prx staleness guard (F-MCPNULL-P2-OBS-002)
    # F-MCPNULL-P2-OBS-002 closure: the committed threatintel-lookup.prx must stay in sync
    # with its source crate (crates/plugins/prism-threatintel-infusion). This job enforces
    # staleness via a source-hash sidecar (threatintel-lookup.prx.src-tree-hash) rather than
    # binary byte-equality. Byte-equality is not valid cross-platform: macOS aarch64 and
    # Linux x86_64 produce different WASM bytes from the same source (LLVM codegen divergence).
    #
    # Staleness gate: hash-plugin-source.py computes SHA-256 over all git-tracked files in
    # the source crate. A mismatch between the committed sidecar and the current source means
    # source changed without a .prx rebuild. Developer fix: run 'just build-plugin-threatintel-infusion'
    # and commit .prx + manifest + .src-tree-hash sidecar together.
    #
    # Binary validity: wasm-tools validate --features=component-model on the committed .prx
    # confirms structural correctness independently of origin platform.
    #
    # Manifest staleness: separate SHA-256 comparison (F-MCPNULL-P3-LOW-004) remains valid
    # since the manifest is a text file with byte-identical content on all platforms.
    needs: clippy
    runs-on: ubuntu-latest
    # F-MCPRS-PRL1-OBS-004: bumped from 15 to 20 — wasm-tools install + cargo check
    # + full .prx build on a cold per-job cache can exceed 15 min; 20 provides headroom.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          # fetch-depth: 0 required for F-MCPRS-PRL1-MED-001 commit-atomicity gate.
          # git log -1 --format=%H -- <path> returns empty on a shallow (depth=1) clone
          # for any file not modified in HEAD, which would hard-fail the empty-commit guard
          # on every run. Full history is needed to find the last-touching commit per path.
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          targets: wasm32-wasip1
      # Separate shared-key from wasm32-compile-check to avoid cache namespace collision.
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          cache-on-failure: true
          shared-key: wasm32-threatintel-staleness-check
      - name: Check prism-threatintel-infusion compiles for wasm32-wasip1
        run: |
          cargo check --target wasm32-wasip1 -p prism-threatintel-infusion \
            --manifest-path crates/plugins/prism-threatintel-infusion/Cargo.toml
          echo "F-MCPNULL-P2-OBS-002: wasm32-wasip1 compile check PASSED — prism-threatintel-infusion compiled successfully"
      # Pin to 1.248.0 — matches the version used to build the committed .prx and WASI adapter.
      # SEC-001 (CWE-494): SHA-256 integrity check before extracting.
      # Checksum source: downloaded from GitHub releases over HTTPS and computed 2026-07-13.
      - name: Install wasm-tools 1.248.0
        run: |
          WASM_TOOLS_VERSION="1.248.0"
          EXPECTED_SHA256="dcd7d587b0f4644aabc85cd4471cb795de84f36a68ee01201d5261f87c0d6349"
          curl -fsSL "https://github.com/bytecodealliance/wasm-tools/releases/download/v${WASM_TOOLS_VERSION}/wasm-tools-${WASM_TOOLS_VERSION}-x86_64-linux.tar.gz" \
            -o /tmp/wasm-tools.tar.gz
          echo "${EXPECTED_SHA256}  /tmp/wasm-tools.tar.gz" | sha256sum -c
          tar -xz --strip-components=1 -C /usr/local/bin \
            wasm-tools-${WASM_TOOLS_VERSION}-x86_64-linux/wasm-tools \
            < /tmp/wasm-tools.tar.gz
          rm /tmp/wasm-tools.tar.gz
          wasm-tools --version
      # F-MCPRS-PRL2-LOW-003: pinned to 1.43.1 — unpinned `tool: just` resolves to
      # latest at download time, violating supply-chain reproducibility.
      - name: Install just
        uses: taiki-e/install-action@cf525cb33f51aca27cd6fa02034117ab963ff9f1 # v2.75.22
        with:
          tool: just@1.43.1
      # F-MCPNULL-P2-OBS-002: source-hash staleness gate.
      # Compares committed .src-tree-hash sidecar against freshly computed source hash.
      # Placed before the build so staleness is caught without paying full WASM build cost.
      - name: Verify threatintel-lookup.prx source freshness (F-MCPNULL-P2-OBS-002)
        run: |
          SIDECAR="crates/prism-spec-engine/plugins/threatintel-lookup/threatintel-lookup.prx.src-tree-hash"
          if [ ! -f "$SIDECAR" ]; then
            echo "::error::F-MCPNULL-P2-OBS-002: staleness sidecar missing — run 'just build-plugin-threatintel-infusion' and commit threatintel-lookup.prx.src-tree-hash alongside the .prx"
            exit 1
          fi
          COMMITTED_HASH=$(cat "$SIDECAR" | tr -d '[:space:]')
          CURRENT_HASH=$(python3 scripts/hash-plugin-source.py crates/plugins/prism-threatintel-infusion)
          echo "committed source hash: $COMMITTED_HASH"
          echo "current  source hash:  $CURRENT_HASH"
          if [ "$COMMITTED_HASH" != "$CURRENT_HASH" ]; then
            echo "::error::F-MCPNULL-P2-OBS-002 STALENESS: crates/plugins/prism-threatintel-infusion source changed since the committed .prx was built."
            echo "::error::Run 'just build-plugin-threatintel-infusion' and commit the updated .prx, manifest, and .src-tree-hash sidecar before merging."
            exit 1
          fi
          echo "F-MCPNULL-P2-OBS-002 PASS: committed .prx matches current source (hash: $CURRENT_HASH)"
      # F-MCPRS-PRL14-LOW-001: validate the COMMITTED threatintel-lookup.prx structurally
      # BEFORE the build overwrites it. Without this step, a byte-corrupt committed .prx
      # with a consistent hash/sidecar/manifest would pass CI and fail only at runtime load.
      # Placed between the source-hash gate (F-MCPNULL-P2-OBS-002) and the sidecar-ancestor
      # check (F-MCPRS-PRL1-MED-001), after wasm-tools is installed (Install wasm-tools step).
      - name: Validate committed threatintel-lookup.prx structural integrity (F-MCPRS-PRL14-LOW-001)
        run: |
          wasm-tools validate --features=component-model crates/prism-spec-engine/plugins/threatintel-lookup/threatintel-lookup.prx
          echo "F-MCPRS-PRL14-LOW-001 PASS: committed threatintel-lookup.prx passes structural validation"
      - name: Verify sidecar does not post-date .prx without a rebuild (F-MCPRS-PRL1-MED-001)
        run: |
          PRX_PATH="crates/prism-spec-engine/plugins/threatintel-lookup/threatintel-lookup.prx"
          SIDECAR_PATH="crates/prism-spec-engine/plugins/threatintel-lookup/threatintel-lookup.prx.src-tree-hash"
          PRX_COMMIT=$(git log -1 --format="%H" -- "$PRX_PATH")
          SIDECAR_COMMIT=$(git log -1 --format="%H" -- "$SIDECAR_PATH")
          echo ".prx last commit:     $PRX_COMMIT"
          echo "sidecar last commit:  $SIDECAR_COMMIT"
          if [ -z "$PRX_COMMIT" ] || [ -z "$SIDECAR_COMMIT" ]; then
            echo "::error::F-MCPRS-PRL1-MED-001: git log returned empty SHA for .prx or sidecar — verify paths are tracked"
            exit 1
          fi
          # INVARIANT: sidecar_commit must be an ancestor-of-or-equal-to prx_commit.
          # Meaning: every source-hash introduction or update is accounted for by a
          # subsequent (or same-commit) .prx rebuild.
          # FAIL if sidecar is NEWER than .prx — indicates sidecar was updated after
          # the last rebuild, i.e. source changed and sidecar was regenerated without
          # rebuilding the binary.
          if ! git merge-base --is-ancestor "$SIDECAR_COMMIT" "$PRX_COMMIT"; then
            echo "::error::F-MCPRS-PRL1-MED-001: sidecar post-dates the last .prx rebuild."
            echo "::error::  sidecar commit: $SIDECAR_COMMIT"
            echo "::error::  .prx commit:    $PRX_COMMIT"
            echo "::error::This check fires in two distinct scenarios — read carefully before taking action:"
            echo "::error::"
            echo "::error::  (a) Source changed and .prx was NOT rebuilt:"
            echo "::error::      The plugin binary is stale. Run 'just build-plugin-threatintel-infusion'"
            echo "::error::      and commit the updated .prx, manifest, and .src-tree-hash sidecar together."
            echo "::error::"
            echo "::error::  (b) Source changed, .prx WAS rebuilt, but the rebuild produced byte-identical output:"
            echo "::error::      The binary content is current but git sees no new .prx commit (nothing changed"
            echo "::error::      in the binary), so the sidecar commit appears newer than the .prx commit."
            echo "::error::      Running 'just build-plugin-threatintel-infusion' again will NOT resolve this —"
            echo "::error::      the output is already correct. Instead, amend the sidecar commit to also include"
            echo "::error::      a no-op touch of the .prx file, or commit the sidecar together with the next"
            echo "::error::      commit that modifies any file under the .prx path."
            exit 1
          fi
          echo "F-MCPRS-PRL1-MED-001 PASS: sidecar $SIDECAR_COMMIT is ancestor-or-equal of .prx $PRX_COMMIT"
      # F-MCPNULL-P3-LOW-004: save committed manifest SHA before build overwrites it,
      # then compare after rebuild. The manifest is a text file (byte-identical cross-platform).
      - name: Save committed manifest SHA-256
        run: |
          COMMITTED_MANIFEST_SHA=$(sha256sum crates/prism-spec-engine/plugins/threatintel-lookup/threatintel-lookup.manifest.toml | cut -d' ' -f1)
          echo "COMMITTED_MANIFEST_SHA=$COMMITTED_MANIFEST_SHA" >> "$GITHUB_ENV"
          echo "F-MCPNULL-P3-LOW-004: committed manifest SHA-256 = $COMMITTED_MANIFEST_SHA"
      - name: Build threatintel-lookup.prx
        run: |
          just build-plugin-threatintel-infusion
          echo "F-MCPNULL-P2-OBS-002: threatintel-lookup.prx built successfully"
          ls -la crates/prism-spec-engine/plugins/threatintel-lookup/threatintel-lookup.prx
          ls -la crates/prism-spec-engine/plugins/threatintel-lookup/threatintel-lookup.manifest.toml
      # F-MCPNULL-P3-LOW-004: manifest staleness gate — the manifest is also a build output.
      # `just build-plugin-threatintel-infusion` copies the manifest from the source crate;
      # a manifest edit in the source crate without recommitting the deploy copy will fail here.
      - name: Verify threatintel-lookup.manifest.toml is not stale
        run: |
          REBUILT_MANIFEST_SHA=$(sha256sum crates/prism-spec-engine/plugins/threatintel-lookup/threatintel-lookup.manifest.toml | cut -d' ' -f1)
          echo "committed manifest SHA-256: $COMMITTED_MANIFEST_SHA"
          echo "rebuilt   manifest SHA-256: $REBUILT_MANIFEST_SHA"
          if [ "$COMMITTED_MANIFEST_SHA" != "$REBUILT_MANIFEST_SHA" ]; then
            echo "::error::F-MCPNULL-P3-LOW-004 STALENESS: committed threatintel-lookup.manifest.toml does not match rebuilt artifact."
            echo "::error::The manifest in crates/prism-spec-engine/plugins/threatintel-lookup/ is out of sync with the source at crates/plugins/prism-threatintel-infusion/threatintel-lookup.manifest.toml."
            echo "::error::Run 'just build-plugin-threatintel-infusion' locally and commit the updated .prx, manifest, and .src-tree-hash sidecar before merging."
            exit 1
          fi
          echo "F-MCPNULL-P3-LOW-004 PASS: committed threatintel-lookup.manifest.toml matches rebuilt artifact (SHA-256 $REBUILT_MANIFEST_SHA)"
      - name: Upload threatintel-lookup.prx artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: threatintel-lookup-prx
          path: crates/prism-spec-engine/plugins/threatintel-lookup/threatintel-lookup.prx
          retention-days: 7

  deny:
    name: Cargo deny (license + advisory)
    # Optimization 2: parallel with test — was: needs: test (chained through slowest job).
    # deny only reads Cargo metadata; it does not compile workspace crates.
    needs: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      # Optimization 5: removed arduino/setup-protoc — deny reads Cargo metadata only,
      # it does not invoke prost-build.
      - uses: EmbarkStudios/cargo-deny-action@91bf2b620e09e18d6eb78b92e7861937469acedb # v2.0.17
        with:
          command: check
          arguments: --all-features

  audit:
    name: Cargo audit (RustSec)
    # Optimization 2: parallel with test — was: needs: deny (chained after deny).
    # audit reads Cargo.lock metadata only; it does not compile workspace crates.
    needs: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      # Optimization 5: removed arduino/setup-protoc — audit reads Cargo.lock only.
      # Optimization 3: taiki-e/install-action for prebuilt cargo-audit (saves ~3min vs cargo install)
      - uses: taiki-e/install-action@cf525cb33f51aca27cd6fa02034117ab963ff9f1 # v2.75.22
        with:
          tool: cargo-audit
      - name: Run cargo audit
        run: cargo audit

  semver-checks:
    name: Semver compatibility
    # Optimization 2: parallel with test — was: needs: audit (chained after audit).
    needs: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      - name: Install protoc (required by prost-build for prism-ocsf)
        uses: arduino/setup-protoc@c65c819552d16ad3c9b72d9dfd5ba5237b9c906b # v3.0.0
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      # prism-credentials uses keyring 3.x with linux-native-sync-persistent (Secret Service
      # backend) on Linux, requiring libdbus-1-dev + pkg-config at build time.
      # ADR-034 / BC-2.06.003: dbus Secret Service is the production Linux persistent backend.
      - name: Install libdbus-1-dev (required by keyring Secret Service backend on Linux)
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config
      # Optimization 1: Swatinem/rust-cache
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          cache-on-failure: true
          shared-key: semver
      # Optimization 3: taiki-e/install-action for prebuilt cargo-semver-checks (saves ~5min vs cargo install)
      - uses: taiki-e/install-action@cf525cb33f51aca27cd6fa02034117ab963ff9f1 # v2.75.22
        with:
          tool: cargo-semver-checks
      - name: Run semver checks
        # Use git baseline to avoid crates.io lookup (workspace crates are unpublished).
        # cargo-semver-checks errors on new crates not present in the baseline revision.
        # We check only crates that exist in origin/develop; new crates are excluded.
        run: |
          BASELINE_MEMBERS=$(git show origin/develop:Cargo.toml | grep -oP '(?<="crates/)[\w-]+(?=")' || true)
          EXCLUDE_ARGS=""
          for crate in $(cargo metadata --no-deps --format-version 1 | \
              jq -r '.packages[].name'); do
            if ! echo "$BASELINE_MEMBERS" | grep -qF "$crate"; then
              EXCLUDE_ARGS="$EXCLUDE_ARGS --exclude $crate"
            fi
          done
          if [ -z "$EXCLUDE_ARGS" ]; then
            cargo semver-checks check-release --baseline-rev origin/develop
          else
            echo "Excluding new crates from semver check: $EXCLUDE_ARGS"
            cargo semver-checks check-release --baseline-rev origin/develop $EXCLUDE_ARGS
          fi

  fuzz-smoke-vp021:
    name: Fuzz smoke (vp021_parse_fuzz)
    # VP-021: PrismQlParser never panics on arbitrary byte input.
    # 60s smoke run on every PR/push — catches regressions fast.
    # Full 30-min run lives in fuzz-nightly.yml (scheduled).
    #
    # Pass-13 fix #1 (6f38ac5f): timeout 5 → 12 min. cargo-fuzz with libfuzzer
    # + AddressSanitizer instrumentation rebuilds prism-query + 24 transitive
    # deps from scratch under the sanitizer profile (separate cache namespace
    # from the main build).
    # Pass-13 fix #2: timeout 12 → 20 min. After 30f6fc07 added opt-level=3
    # for sha2/aes-gcm/argon2/blake2 crypto stack in .cargo/config.toml,
    # sanitizer-instrumented build of those same transitive crates
    # substantially exceeds the 12-min ceiling. Observed run 25427035534
    # rerun was killed at 12m51s with `ar` (linker) still running — never
    # reached the 60s fuzz run itself. Budget breakdown:
    #   cargo-fuzz install:                       ~30-60s
    #   sanitizer-instrumented build (cold):      ~10-15 min (with opt-level=3)
    #   60s fuzz run:                             60s
    #   cleanup + cache save:                     ~30s
    # Total worst-case: ~17 min. 20-min ceiling provided margin while still
    # failing fast on hangs (e.g., a fuzz target that loops without
    # producing crashes).
    #
    # Pass-S-3.02 fix (PR #129): timeout 20 → 35 min. S-3.02 added 9 new
    # transitive dependencies (datafusion 53.1, arrow 58, tokio, tracing,
    # async-trait, proptest, prism-sensors, prism-ocsf, prism-credentials)
    # to prism-query. Under libfuzzer + AddressSanitizer instrumentation,
    # the build of these new deps + their transitive closure exceeds the
    # 20-min ceiling. Observed runs 25471243470/25471244604 both terminated
    # at ~20m by GitHub Actions cleanup with cargo-fuzz/cc1plus orphan
    # processes still in build phase — never reached the 60s fuzz run.
    # 35-min budget provides headroom for future dep growth (S-3.07 +
    # DTU integrations) while still failing fast on genuine hangs.
    # Total worst-case (updated): ~28-30 min. 35-min ceiling provides margin.
    needs: clippy
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: dtolnay/rust-toolchain@5b842231ba77f5c045dba54ac5560fed2db780e2 # nightly
        with:
          toolchain: nightly
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          cache-on-failure: true
          shared-key: fuzz-smoke-${{ runner.os }}
      - name: Install protoc (required by prost-build for prism-ocsf transitive dep)
        # Pass-14 follow-up: latent CI bug exposed when 20-min ceiling let the
        # cold sanitizer build proceed far enough to invoke prism-ocsf's build.rs.
        # CI run 25444145941 fuzz-smoke failed at 14m49s with:
        #   error: failed to run custom build command for `prism-ocsf v0.1.0`
        #   build.rs: prost-build failed to compile OCSF .proto files: NotFound
        # The perimeter-compile-fail job already installs protoc via this same
        # action; this step mirrors it to unblock fuzz-smoke's transitive build.
        uses: arduino/setup-protoc@c65c819552d16ad3c9b72d9dfd5ba5237b9c906b # v3.0.0
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      # prism-credentials (transitive dep of prism-query via fuzz target) uses keyring 3.x
      # with linux-native-sync-persistent (Secret Service backend) on Linux gnu, requiring
      # libdbus-1-dev + pkg-config at build time. ADR-034 / BC-2.06.003.
      - name: Install libdbus-1-dev (required by keyring Secret Service backend on Linux)
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config
      - name: Install cargo-fuzz
        uses: taiki-e/install-action@cf525cb33f51aca27cd6fa02034117ab963ff9f1 # v2.75.22
        with:
          tool: cargo-fuzz
      - name: Add gnu target (sanitizer requires glibc, not musl)
        run: rustup target add x86_64-unknown-linux-gnu
      - name: Fuzz smoke (VP-021, 60s)
        run: |
          set -euo pipefail
          cd fuzz && cargo +nightly fuzz run vp021_parse_fuzz --target x86_64-unknown-linux-gnu -- -max_total_time=60 -max_len=65536

  perimeter-compile-fail:
    name: Perimeter compile-fail check (BC-2.11.006 v1.10)
    # BC-2.11.006 v1.10 postcondition: sub-parsers (parse_filter, parse_sql,
    # parse_pipe, build_pipe_parser, and all builder factories + ParseLimits
    # methods) are pub(crate) and MUST NOT be reachable from external crates.
    # This job compiles a deliberate violator and asserts that `cargo check`
    # fails with a Rust visibility error (E0603/E0624) for EACH named symbol.
    #
    # Pass-7 F-HIGH-001: binary signal replaced with per-symbol assertion.
    # A single-symbol regression (one symbol promoted to pub while siblings
    # remain pub(crate)) is now detectable — siblings still produce E0603 but
    # the regressed symbol's absence from the error list triggers a failure.
    #
    # Adversary pass-5 OBS-003 [process-gap] remediation.
    # Adversary pass-7 F-HIGH-001/OBS-001 remediation.
    # Pass-13 fix #1 (a802b983): timeout 3 → 7 min. Cold cargo build of
    # prism-query + 24 transitive deps reliably ran ~3m23s on standard
    # ubuntu-latest runners, hitting the 3-min ceiling.
    # Pass-13 fix #2: timeout 7 → 12 min. After 30f6fc07 added
    # opt-level=3 for sha2/aes-gcm/argon2/blake2/etc in
    # .cargo/config.toml, cold build time roughly DOUBLED to ~6m49s
    # (run 25425477951) because sha2 is in the prism-query transitive
    # dep graph. 12-min ceiling provides margin (matches fuzz-smoke
    # ceiling — same root cause class) while still failing fast on
    # genuine hangs.
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
    steps:
      - name: Checkout feature branch (source code)
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Checkout factory-artifacts branch (spec frontmatter)
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: factory-artifacts
          path: .factory-spec
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      - name: Install protoc (required by prost-build for prism-ocsf transitive dep)
        uses: arduino/setup-protoc@c65c819552d16ad3c9b72d9dfd5ba5237b9c906b # v3.0.0
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      # perimeter-violation depends on prism-query which transitively depends on
      # prism-credentials → keyring 3.x linux-native-sync-persistent (Secret Service
      # backend), requiring libdbus-1-dev + pkg-config. ADR-034 / BC-2.06.003.
      - name: Install libdbus-1-dev (required by keyring Secret Service backend on Linux)
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          cache-on-failure: true
          shared-key: perimeter-compile-fail
      - name: Assert perimeter-violation fails to compile with per-symbol E0603 checks
        run: |
          set -uo pipefail
          # Capture stderr+stdout separately from the exit code.
          # We must NOT use `cmd | tee` because that evaluates tee's exit code,
          # not cargo's. Instead, redirect to a log file directly.
          # --color=never is REQUIRED: without it, modern cargo (1.85+) emits
          # ANSI color codes even when stdout is redirected, and the Python
          # parser's `re.match(r'error\[...')` fails to match lines that
          # actually look like `[1m[91merror[E0603][0m...` (run 25426278331
          # latent bug exposed by pass-13 — first run to actually complete
          # cargo within the new 12-min ceiling).
          cargo check \
            --color=never \
            --manifest-path tests/external/perimeter-violation/Cargo.toml \
            > /tmp/perimeter-check.log 2>&1 \
            && CARGO_RC=0 || CARGO_RC=$?
          cat /tmp/perimeter-check.log
          if [ "${CARGO_RC}" -eq 0 ]; then
            echo "::error::Perimeter compile-fail check FAILED — sub-parser is publicly accessible (security regression, BC-2.11.006 v1.10)"
            echo "::error::All restricted symbols became pub. Revert the visibility changes."
            exit 1
          fi
          # Per-symbol assertion: parse cargo output and verify each restricted_symbol
          # from BC-2.11.006 frontmatter appears in the E0603/E0624 error list.
          # A single-symbol regression (one symbol promoted to pub while siblings
          # remain private) will still produce a non-zero cargo exit but will be
          # MISSING from the error list — this script catches that case.
          python3 - << 'PYEOF'
          import re, sys

          SPEC_PATH = ".factory-spec/specs/behavioral-contracts/BC-2.11.006-query-security-limits.md"
          LOG_PATH  = "/tmp/perimeter-check.log"

          # --- Normalize spec symbols (same logic as perimeter-symbols-sync) ---
          def normalize_to_use_path(sym):
              parts = sym.split('::')
              trim_to = len(parts)
              for i in range(len(parts) - 1, 0, -1):
                  if parts[i][0].isupper():
                      break
                  if parts[i - 1][0].isupper():
                      trim_to = i
                  else:
                      break
              return '::'.join(parts[:trim_to])

          # --- Load restricted symbols from BC frontmatter ---
          with open(SPEC_PATH) as f:
              spec_content = f.read()

          fm_match = re.match(r'^---\n(.*?)\n---', spec_content, re.DOTALL)
          if not fm_match:
              print(f"ERROR: No YAML frontmatter found in {SPEC_PATH}", file=sys.stderr)
              sys.exit(1)
          fm_text = fm_match.group(1)

          symbols_match = re.search(
              r'restricted_symbols:\s*\n(?:.*\n)*?  symbols:\s*\n((?:    - .+\n?)*)',
              fm_text
          )
          if not symbols_match:
              print("ERROR: restricted_symbols.symbols block not found in BC-2.11.006 frontmatter.", file=sys.stderr)
              sys.exit(1)

          raw_spec_symbols = [
              line.strip().lstrip('- ')
              for line in symbols_match.group(1).splitlines()
              if line.strip().startswith('- ')
          ]

          # Build unique leaf names for each restricted symbol.
          # For free functions: last path segment (e.g., parse_filter).
          # For struct methods: last path segment of the full symbol (e.g., install_thread_local).
          # We check against the raw leaf (method name) only.
          # Note: we do NOT add the struct name (ParseLimits) because ParseLimits is `pub`
          # — `use prism_query::security::ParseLimits` succeeds and never produces E0603.
          # Only pub(crate) method calls produce E0624, using the leaf (method) name. (F-LOW-003)
          expected_leaf_names = set()
          for sym in raw_spec_symbols:
              parts = sym.split('::')
              # Add the leaf symbol name (method or function)
              expected_leaf_names.add(parts[-1])

          print(f"BC-2.11.006 restricted_symbols ({len(raw_spec_symbols)} entries):")
          for s in raw_spec_symbols:
              print(f"  {s}")
          print(f"\nExpected error leaf names ({len(expected_leaf_names)}):")
          for n in sorted(expected_leaf_names):
              print(f"  {n}")

          # --- Parse cargo output for E0603/E0624 errors ---
          with open(LOG_PATH) as f:
              log_content = f.read()

          # Match patterns like:
          #   error[E0603]: function `parse_filter` is private
          #   error[E0624]: method `install_thread_local` is private
          # Parse line-by-line to avoid multiline regex hazards from cargo's
          # multi-line note sections that contain backtick-quoted symbol names.
          found_names = set()
          for line in log_content.splitlines():
              m = re.match(r'error\[(?:E0603|E0624)\]:[^`]*`([^`]+)`.*(?:private|restricted)', line)
              if m:
                  found_names.add(m.group(1))

          print(f"\nE0603/E0624 error symbols found in cargo output ({len(found_names)}):")
          for n in sorted(found_names):
              print(f"  {n}")

          # --- Per-symbol assertion ---
          # For each raw restricted symbol, check that its leaf name (or struct name
          # for method entries) appears in the error output.
          failures = []
          for sym in raw_spec_symbols:
              parts = sym.split('::')
              leaf = parts[-1]

              if leaf in found_names:
                  print(f"  PASS  {sym}  (leaf: {leaf})")
              else:
                  # Note: the via-struct fallback (checking struct_name in E0603 errors) was
                  # removed (F-LOW-003): ParseLimits is `pub`, so `use prism_query::security::ParseLimits`
                  # succeeds — E0603 never fires on the struct.  Only pub(crate) method calls
                  # produce E0624 (leaf name), so the leaf check is sufficient.
                  failures.append(sym)
                  print(f"  FAIL  {sym}  (leaf '{leaf}' not in E0603/E0624 errors)")

          print()
          if failures:
              for sym in failures:
                  leaf = sym.split('::')[-1]
                  print(
                      f"::error::Symbol {sym} (leaf: {leaf}) did not produce an E0603/E0624 error "
                      f"— it may have regressed to pub. Promotion to pub or removal from "
                      f"BC restricted_symbols required.",
                      file=sys.stderr
                  )
              print(
                  f"\nPerimeter check FAILED: {len(failures)} of {len(raw_spec_symbols)} restricted symbols "
                  f"did not appear in cargo error output.",
                  file=sys.stderr
              )
              sys.exit(1)

          print(
              f"Perimeter check passed: all {len(raw_spec_symbols)} restricted symbols "
              f"produced E0603/E0624 errors (cargo check correctly failed)."
          )

          # --- VP-PLUGIN-001 / F-LP2-CRIT-001: SensorType deleted-type regression gate ---
          #
          # The closed `SensorType` enum was removed in S-PLUGIN-PREREQ-A (ADR-023 §C1).
          # perimeter-violation/src/main.rs imports `prism_core::SensorType` which MUST
          # produce E0432 (unresolved import). If `pub enum SensorType` is ever
          # re-introduced in prism-core, this import would compile successfully and the
          # cargo check exit code would still be non-zero (from E0603/E0624 above), so
          # the binary gate would not catch the regression. This literal-string check
          # ensures the E0432 for SensorType is present.
          sensor_type_e0432_found = False
          for line in log_content.splitlines():
              if re.search(r'error\[E0432\].*SensorType', line):
                  sensor_type_e0432_found = True
                  break

          if not sensor_type_e0432_found:
              print(
                  "::error::VP-PLUGIN-001 / F-LP2-CRIT-001: E0432 for 'SensorType' NOT found "
                  "in cargo check output. This means `pub enum SensorType` may have been "
                  "re-introduced in prism-core — check prism-core/src/types.rs and "
                  "prism-core/src/lib.rs. The perimeter-violation crate imports "
                  "`prism_core::SensorType` which must produce E0432 (unresolved import).",
                  file=sys.stderr
              )
              sys.exit(1)
          else:
              print(
                  "VP-PLUGIN-001 assertion passed: E0432 for 'SensorType' found in cargo "
                  "output (closed enum correctly absent from prism-core)."
              )

          sys.exit(0)
          PYEOF

  non-exhaustive-violation-compile-fail:
    name: Non-exhaustive violation compile-fail check (AC-5 S-PLUGIN-PREREQ-C)
    # AC-5 (S-PLUGIN-PREREQ-C) postcondition: all pub TOML-deserialized types in
    # prism-spec-engine carry #[non_exhaustive]. This job compiles a deliberate
    # violator crate and asserts that `cargo check` fails with E0639 errors for
    # each annotated type. If the check exits 0, a #[non_exhaustive] annotation
    # was silently removed — this job catches that regression.
    #
    # POL-11: This job emits a positive-coverage log line listing the count and
    # names of types validated. The exit-1 result alone is insufficient; the log
    # must positively assert N items validated per POL-11.
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      - name: Install protoc (required by prost-build for prism-ocsf transitive dep)
        uses: arduino/setup-protoc@c65c819552d16ad3c9b72d9dfd5ba5237b9c906b # v3.0.0
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      # non-exhaustive-violation depends on prism-spec-engine which transitively depends on
      # prism-credentials → keyring 3.x linux-native-sync-persistent (Secret Service
      # backend), requiring libdbus-1-dev + pkg-config. ADR-034 / BC-2.06.003.
      - name: Install libdbus-1-dev (required by keyring Secret Service backend on Linux)
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          cache-on-failure: true
          shared-key: non-exhaustive-compile-fail
      - name: Assert non-exhaustive-violation fails to compile (per-symbol gate)
        # Single source of truth: scripts/check-non-exhaustive.sh (with
        # scripts/check-non-exhaustive-per-symbol.py for Layer 2 per-symbol check).
        # Two-layer gate: Layer 1 = total count >= EXPECTED (owned by scripts/check-non-exhaustive.sh);
        # Layer 2 = per-symbol assertion (net-zero regression detection). F-CSD-P29-OBS-001 hardening.
        run: bash scripts/check-non-exhaustive.sh

  no-hardcoded-sensors-compile-fail:
    name: "ADR-023 No-Hardcoded-Sensors compile-fail gate (AC-006 PLUGIN-MIGRATION-001-F)"
    # AC-006 (PLUGIN-MIGRATION-001-F) postcondition: the 4 sensor-named auth module paths
    # deleted in PLUGIN-MIGRATION-001-A (prism_sensors::auth::{armis,claroty,crowdstrike,cyberint})
    # MUST NOT be reachable from outside prism-sensors.
    # This job compiles tests/external/no-hardcoded-sensors (a deliberate violator crate
    # that imports those deleted paths) and asserts that `cargo check` fails with E0432.
    # If cargo check exits 0, a deleted sensor-named symbol has been accidentally
    # re-exported — this is an ADR-023 Rule 3 violation.
    #
    # This crate depends ONLY on prism-sensors (no prism-dtu-* deps to avoid
    # false-positives from legitimate DTU clone exemptions per ADR-023 §DTU-EXEMPT).
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      - name: Install protoc (required by prost-build for prism-ocsf transitive dep)
        uses: arduino/setup-protoc@c65c819552d16ad3c9b72d9dfd5ba5237b9c906b # v3.0.0
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      # no-hardcoded-sensors depends on prism-sensors which transitively depends on
      # prism-credentials → keyring 3.x linux-native-sync-persistent (Secret Service
      # backend), requiring libdbus-1-dev + pkg-config. ADR-034 / BC-2.06.003.
      - name: Install libdbus-1-dev (required by keyring Secret Service backend on Linux)
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          cache-on-failure: true
          shared-key: no-hardcoded-sensors-compile-fail
      - name: Assert no-hardcoded-sensors does NOT compile (E0432 expected)
        run: |
          set -uo pipefail
          cargo check \
            --color=never \
            --manifest-path tests/external/no-hardcoded-sensors/Cargo.toml \
            > /tmp/no-hardcoded-sensors-check.log 2>&1 \
            && CARGO_RC=0 || CARGO_RC=$?
          cat /tmp/no-hardcoded-sensors-check.log
          if [ "${CARGO_RC}" -eq 0 ]; then
            echo "::error::REGRESSION: no-hardcoded-sensors compiled successfully — sensor-named auth module symbols are accessible from prism-sensors public API. ADR-023 Rule 3 violated. Deleted paths prism_sensors::auth::{armis,claroty,crowdstrike,cyberint} must not be re-exported."
            exit 1
          fi
          # Per-module positive-coverage check (primary gate, IMP-001):
          # Verify each of the 4 deleted auth module paths appears BY MODULE NAME in
          # the error output. Cargo E0432 reports the module path (e.g.,
          # prism_sensors::auth::armis), not the type name (e.g., ArmisAuth).
          # A count-only check would pass even if the wrong modules regressed.
          for MOD in armis claroty crowdstrike cyberint; do
            if ! grep -q "error\[E0432\].*auth::${MOD}\|unresolved import.*auth::${MOD}" /tmp/no-hardcoded-sensors-check.log; then
              echo "::error::FAIL: Expected E0432 for auth::${MOD} but not found in error output. Deleted path prism_sensors::auth::${MOD} may have been re-exported (ADR-023 Rule 3 violation, AC-006 PLUGIN-MIGRATION-001-F)."
              exit 1
            fi
            echo "PASS: auth::${MOD} correctly fails to resolve (E0432)"
          done
          # Redundant count assertion — must have at least 4 E0432 errors total.
          E0432_COUNT=$(grep -c 'error\[E0432\]' /tmp/no-hardcoded-sensors-check.log || true)
          EXPECTED=4
          if [ "${E0432_COUNT}" -lt "${EXPECTED}" ]; then
            echo "::error::Expected at least ${EXPECTED} E0432 errors (one per deleted auth module: armis, claroty, crowdstrike, cyberint), got ${E0432_COUNT}. Some deleted paths may have been partially re-exported."
            exit 1
          fi
          echo "PASS: no-hardcoded-sensors correctly fails to compile with ${E0432_COUNT} E0432 errors (expected: ${EXPECTED}). Deleted sensor-named auth modules are not accessible: prism_sensors::auth::{armis, claroty, crowdstrike, cyberint} (ADR-023 Rule 3, AC-006 PLUGIN-MIGRATION-001-F)."

  perimeter-symbols-sync:
    name: Perimeter symbols sync check (BC-2.11.006 OBS-001)
    # Adversary pass-6 OBS-001 [process-gap] remediation.
    # Adversary pass-8 OBS-001 extension: also validates lib.rs perimeter docstring.
    #
    # BC-2.11.006 v1.10 frontmatter lists `restricted_symbols.symbols:` — the
    # canonical set of crate-private symbols that external crates MUST NOT
    # reach. This job validates TWO surfaces against that canonical set:
    #
    # 1. tests/external/perimeter-violation/src/main.rs — must contain a
    #    matching `use prism_query::…` import for every importable unit in the spec.
    #
    # 2. crates/prism-query/src/lib.rs — its security-perimeter doc-comment block
    #    enumerates symbols by name. Those backtick-quoted symbols must match the
    #    BC frontmatter restricted_symbols (after normalization).  lib.rs claims
    #    "Authoritative source: BC-2.11.006 frontmatter"; this check enforces it.
    #
    # Normalization rule: Rust `use` can only address free functions, modules,
    # and types — not struct methods. Spec entries of the form
    # `prism_query::A::B::MethodName` (where B is a PascalCase type) are
    # normalized to the parent struct path `prism_query::A::B` for comparison,
    # because that is the `use` statement the test file must contain.  Multiple
    # method entries on the same struct collapse to a single required import.
    #
    # Any divergence (spec importable-unit missing from test, or test import not
    # covered by any spec entry) fails the PR with an explanatory diff.
    #
    # .factory/ is on the `factory-artifacts` orphan branch (not committed to
    # feature branches). We fetch it via a second actions/checkout into
    # .factory-spec/ so the CI runner can read the spec frontmatter without
    # polluting the workspace.
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      contents: read
    steps:
      - name: Checkout feature branch (source code)
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Checkout factory-artifacts branch (spec frontmatter)
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: factory-artifacts
          path: .factory-spec
      - name: Assert spec restricted_symbols match perimeter-violation imports and lib.rs docstring
        run: |
          set -euo pipefail
          python3 - << 'PYEOF'
          import re, sys

          SPEC_PATH   = ".factory-spec/specs/behavioral-contracts/BC-2.11.006-query-security-limits.md"
          TEST_PATH   = "tests/external/perimeter-violation/src/main.rs"
          LIB_RS_PATH = "crates/prism-query/src/lib.rs"

          # --- Extract spec symbols from YAML frontmatter ---
          with open(SPEC_PATH) as f:
              spec_content = f.read()

          fm_match = re.match(r'^---\n(.*?)\n---', spec_content, re.DOTALL)
          if not fm_match:
              print(f"ERROR: No YAML frontmatter found in {SPEC_PATH}", file=sys.stderr)
              sys.exit(1)
          fm_text = fm_match.group(1)

          # Parse restricted_symbols.symbols list.
          # Expected frontmatter shape:
          #   restricted_symbols:
          #     description: "..."
          #     symbols:
          #       - prism_query::...
          symbols_match = re.search(
              r'restricted_symbols:\s*\n(?:.*\n)*?  symbols:\s*\n((?:    - .+\n?)*)',
              fm_text
          )
          if not symbols_match:
              print(
                  f"ERROR: restricted_symbols.symbols block not found in {SPEC_PATH} frontmatter.\n"
                  "BC-2.11.006 must be at v1.10+ with a structured restricted_symbols: block.",
                  file=sys.stderr
              )
              sys.exit(1)

          raw_spec_symbols = [
              line.strip().lstrip('- ')
              for line in symbols_match.group(1).splitlines()
              if line.strip().startswith('- ')
          ]

          # Normalize spec symbols to importable Rust `use` paths.
          #
          # Rule: a path segment is a struct/enum name if it starts with an
          # uppercase letter (PascalCase).  Method names that follow a PascalCase
          # segment cannot be addressed by `use`; they are accessed by calling
          # the method on an imported struct instance.  Strip trailing method
          # segments so that each spec entry maps to a `use`-addressable path.
          #
          # Example:
          #   prism_query::security::ParseLimits::install_thread_local
          #   → prism_query::security::ParseLimits        (strip snake_case tail)
          #
          #   prism_query::filter_parser::parse_filter
          #   → prism_query::filter_parser::parse_filter  (no PascalCase parent; keep)
          def normalize_to_use_path(sym):
              parts = sym.split('::')
              # Walk from the end; trim trailing snake_case segments that follow
              # a PascalCase segment (those are method names, not importable items).
              trim_to = len(parts)
              for i in range(len(parts) - 1, 0, -1):
                  if parts[i][0].isupper():
                      # This segment is PascalCase — it IS importable; stop trimming.
                      break
                  if parts[i - 1][0].isupper():
                      # Previous segment is PascalCase; current is a method — trim.
                      trim_to = i
                  else:
                      # All-lowercase chain with no PascalCase parent above; keep.
                      break
              return '::'.join(parts[:trim_to])

          # Build the set of `use`-importable paths required by the spec.
          # Multiple method entries on the same struct collapse to one path.
          spec_use_paths = sorted(set(normalize_to_use_path(s) for s in raw_spec_symbols))

          # Build the normalized set of unique parent paths from raw spec symbols.
          # This is used for comparing against lib.rs docstring symbols.
          spec_normalized_set = set(normalize_to_use_path(s) for s in raw_spec_symbols)

          print(f"Spec restricted_symbols  ({len(raw_spec_symbols)} entries, {len(spec_use_paths)} importable paths):")
          for s in spec_use_paths:
              print(f"  {s}")

          # ── Surface 1: perimeter-violation/src/main.rs use statements ──────────
          with open(TEST_PATH) as f:
              test_content = f.read()

          test_symbols = sorted(
              re.sub(r'^use (.+);$', r'\1', line.strip())
              for line in test_content.splitlines()
              if re.match(r'^use prism_query::', line.strip())
          )

          print(f"\nTest use statements ({len(test_symbols)}):")
          for s in test_symbols:
              print(f"  {s}")
          print()

          spec_set = set(spec_use_paths)
          test_set = set(test_symbols)
          only_in_spec_test = sorted(spec_set - test_set)
          only_in_test = sorted(test_set - spec_set)

          surface1_ok = not only_in_spec_test and not only_in_test
          if surface1_ok:
              print(f"Surface 1 OK: all {len(spec_use_paths)} required imports are present in perimeter-violation/src/main.rs.")
          else:
              print("Surface 1 FAIL: BC-2.11.006 restricted_symbols diverges from perimeter-violation imports.", file=sys.stderr)
              if only_in_spec_test:
                  print("\nImportable paths required by spec but MISSING from perimeter-violation/src/main.rs:", file=sys.stderr)
                  for s in only_in_spec_test:
                      print(f"  {s}", file=sys.stderr)
                  print("  → Add a `use <path>;` import to perimeter-violation/src/main.rs for each.", file=sys.stderr)
              if only_in_test:
                  print("\nImports in perimeter-violation/src/main.rs NOT covered by any BC-2.11.006 restricted_symbols entry:", file=sys.stderr)
                  for s in only_in_test:
                      print(f"  {s}", file=sys.stderr)
                  print("  → Either add the symbol (or a method on it) to restricted_symbols.symbols", file=sys.stderr)
                  print("    in BC-2.11.006 frontmatter, or remove the `use` line if not restricted.", file=sys.stderr)

          # ── Surface 2: crates/prism-query/src/lib.rs perimeter docstring ───────
          #
          # lib.rs contains a security-perimeter doc-comment block (the S-3.01 re-exports
          # section). It enumerates symbol names in backticks within that block.
          # lib.rs claims "Authoritative source: BC-2.11.006 frontmatter restricted_symbols";
          # this check enforces that claim.
          #
          # Extraction strategy:
          # 1. Find the security-perimeter comment block: starts at the line containing
          #    "Security perimeter" (case-insensitive) or "restricted_symbols" and ends
          #    at the first non-comment line (i.e., a line not starting with "//").
          # 2. Within that block, extract all backtick-quoted tokens.
          # 3. Keep only tokens that look like Rust paths or symbol names (contain "::"
          #    or are snake_case/PascalCase identifiers that appear in BC symbols).
          # 4. Normalize each extracted token: if it contains "::", treat as a full path;
          #    if it does not contain "::", look it up by leaf name in the BC symbols set.
          # 5. Diff against spec_normalized_set.

          with open(LIB_RS_PATH) as f:
              lib_lines = f.readlines()

          # Locate the security-perimeter comment block.
          # The block starts at the line containing the "Security perimeter" marker
          # (we search for the pub use re-exports section with the perimeter comment).
          in_perimeter_block = False
          perimeter_lines = []
          for line in lib_lines:
              stripped = line.rstrip()
              # Block start: the `// ── S-3.01 re-exports` comment that precedes
              # the security perimeter documentation.
              if not in_perimeter_block:
                  # Detect the start of the security perimeter comment block.
                  # We look for the line "// # Security perimeter" or
                  # "// Authoritative source: BC-2.11.006" or similar markers.
                  # More robustly: start at the first comment line after `// ── S-3.01 re-exports`.
                  if re.search(r'Security perimeter|restricted_symbols|pub\(crate\) and MUST NOT', stripped, re.IGNORECASE):
                      in_perimeter_block = True
                      perimeter_lines.append(stripped)
              else:
                  # Continue collecting comment lines.
                  if stripped.startswith('//'):
                      perimeter_lines.append(stripped)
                  else:
                      # First non-comment line ends the block.
                      break

          if not perimeter_lines:
              print(
                  f"ERROR: Could not locate the security-perimeter comment block in {LIB_RS_PATH}.\n"
                  "Expected a comment block containing 'Security perimeter' or 'restricted_symbols'.",
                  file=sys.stderr
              )
              sys.exit(1)

          print(f"\nlib.rs perimeter docstring block ({len(perimeter_lines)} comment lines found).")

          # Extract all backtick-quoted tokens from the perimeter block.
          backtick_tokens = []
          for line in perimeter_lines:
              backtick_tokens.extend(re.findall(r'`([^`]+)`', line))

          # Build a lookup: leaf name -> normalized BC path, for resolving short names.
          # e.g. "parse_filter" -> "prism_query::filter_parser::parse_filter"
          bc_leaf_to_normalized = {}
          for sym in raw_spec_symbols:
              normalized = normalize_to_use_path(sym)
              # leaf of the raw symbol (may be a method name or function name)
              leaf = sym.split('::')[-1]
              bc_leaf_to_normalized[leaf] = normalized
              # also map the leaf of the normalized path (struct name for method entries)
              norm_leaf = normalized.split('::')[-1]
              bc_leaf_to_normalized[norm_leaf] = normalized

          # Filter backtick tokens to only those that reference known BC symbols.
          # A token is relevant if:
          # (a) it contains '::' and its normalized form is in spec_normalized_set, OR
          # (b) it contains '::' but doesn't normalize to a known path — try leaf-resolution:
          #     e.g. `ParseLimits::install_thread_local` → first segment "ParseLimits" is a
          #     known leaf → resolves to prism_query::security::ParseLimits. This handles
          #     method-name backtick tokens (e.g. in a "ParseLimits API:" comment section)
          #     that use struct::method notation rather than the bare struct name. Without this
          #     branch, all four ParseLimits method tokens on lib.rs lines 74-75 would be
          #     silently ignored, making the method coverage unenforced.
          # (c) it does not contain '::' and its name appears as a leaf in bc_leaf_to_normalized.
          lib_normalized = set()
          unrecognized_tokens = []
          for tok in backtick_tokens:
              tok = tok.strip()
              if not tok:
                  continue
              if '::' in tok:
                  # Full or partial path — normalize and check against spec set.
                  normalized = normalize_to_use_path(tok)
                  if normalized in spec_normalized_set:
                      lib_normalized.add(normalized)
                  else:
                      # Leaf-resolution: tok like "ParseLimits::method" → extract first
                      # segment and look it up as a leaf in bc_leaf_to_normalized.
                      # This resolves method-name backtick tokens that use struct::method
                      # notation instead of the bare struct name.
                      first_segment = tok.split('::')[0]
                      if first_segment in bc_leaf_to_normalized:
                          lib_normalized.add(bc_leaf_to_normalized[first_segment])
                      # else: not a restricted symbol reference, ignore
              else:
                  # Short name — look up by leaf
                  if tok in bc_leaf_to_normalized:
                      lib_normalized.add(bc_leaf_to_normalized[tok])
                  # else: not a restricted symbol reference (could be a type, keyword, etc.)

          print(f"lib.rs backtick tokens mapped to BC symbols ({len(lib_normalized)} unique paths):")
          for s in sorted(lib_normalized):
              print(f"  {s}")

          only_in_spec_lib = sorted(spec_normalized_set - lib_normalized)
          only_in_lib = sorted(lib_normalized - spec_normalized_set)

          surface2_ok = not only_in_spec_lib and not only_in_lib
          if surface2_ok:
              print(f"Surface 2 OK: lib.rs perimeter docstring matches all {len(spec_normalized_set)} BC-2.11.006 normalized symbol paths.")
          else:
              print("\nSurface 2 FAIL: lib.rs perimeter docstring diverges from BC-2.11.006 restricted_symbols.", file=sys.stderr)
              if only_in_spec_lib:
                  print("\nSymbols in BC restricted_symbols but MISSING from lib.rs perimeter docstring:", file=sys.stderr)
                  for s in only_in_spec_lib:
                      print(f"  {s}", file=sys.stderr)
                  print("  → lib.rs perimeter docstring missing: add the symbol name(s) in backticks.", file=sys.stderr)
              if only_in_lib:
                  print("\nSymbols in lib.rs perimeter docstring NOT in BC-2.11.006 restricted_symbols:", file=sys.stderr)
                  for s in only_in_lib:
                      print(f"  {s}", file=sys.stderr)
                  print("  → lib.rs lists symbols not in BC: remove from docstring or add to BC restricted_symbols.", file=sys.stderr)

          # ── Final verdict ────────────────────────────────────────────────────────
          if surface1_ok and surface2_ok:
              print(f"\nAll perimeter-symbols-sync checks passed ({len(spec_use_paths)} importable paths, 2 surfaces).")
              sys.exit(0)
          else:
              surfaces_failed = []
              if not surface1_ok:
                  surfaces_failed.append("Surface 1 (perimeter-violation/src/main.rs)")
              if not surface2_ok:
                  surfaces_failed.append("Surface 2 (crates/prism-query/src/lib.rs docstring)")
              print(f"\nFAIL: perimeter-symbols-sync failed on: {', '.join(surfaces_failed)}", file=sys.stderr)
              sys.exit(1)
          PYEOF

  deep-recursion-stack-guard:
    name: Deep-recursion test stack-guard lint (OBS-002)
    # OBS-002: Warns (non-blocking) when a test constructs a depth-N parse tree
    # (N >= 50) without using run_with_deep_stack.  Without the 8MB stack wrapper
    # those tests SIGBUS on macOS aarch64 CI — the 2MB default thread stack is
    # exhausted before the recursion bottoms out.
    #
    # Dual-signal heuristic (pass-10 F-LOW-001): a test is only flagged when it
    # exhibits BOTH of the following signals simultaneously:
    #
    #   Signal 1 — depth-structure construction:
    #     The test iterates >= 50 times AND that iteration pushes '(' or ')'
    #     (for-loop with push('(') / push(')') ), OR the test calls .repeat(N>=50)
    #     on a string literal that contains '(' or ')'.
    #     Rationale: tests that merely build long flat strings (e.g. "a".repeat(1025)
    #     for a regex-length guard, or "z".repeat(65537) for a query-size guard) do
    #     NOT exercise the chumsky recursive combinator and therefore pose no SIGBUS
    #     risk from stack depth.
    #
    #   Signal 2 — recursive parser invocation:
    #     The test body calls PrismQlParser::parse(, parse_filter(, or parse_sql(.
    #     Tests that only call iterative security guards (check_paren_depth,
    #     check_query_size, RegexLiteral::new, compute_aql_hash, etc.) never enter
    #     the chumsky recursive descent and are safe regardless of input size.
    #
    # Both signals must be present for a warning to be emitted.  This eliminates
    # the 13 false positives seen in pass-9 (input-size tests, regex-pattern-cap
    # tests, balanced-pair tests, paren-byte scanner tests, audit-hash tests, and
    # capability-string-length tests) while retaining detection for any future test
    # that iteratively builds a paren-nested structure and feeds it to the parser
    # without the 8MB-stack wrapper.
    #
    # This check is intentionally non-blocking (exit 0 always) — it emits a
    # warning to the CI log rather than failing the PR.  Promote to exit(1) once
    # all existing tests are confirmed wrapped.
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Scan for deep-recursion tests missing run_with_deep_stack
        run: |
          set -euo pipefail
          python3 - << 'PYEOF'
          import re, sys
          from pathlib import Path

          # ── Signal 1: depth-structure construction ────────────────────────────
          # A for-loop of >= 50 iterations that pushes a paren character.
          # The DOTALL flag lets the loop body span multiple lines.
          LOOP_PAREN = re.compile(
              r'for\s+\w+\s+in\s+0\.\.(?:[5-9]\d|\d{3,})'  # for _ in 0..<N>=50>
              r'(?:(?!run_with_deep_stack).)*?'              # no guard in between
              r'push\s*\(\s*[\'"][\(\)][\'"]\s*\)',          # .push('(') or .push(')')
              re.DOTALL
          )
          # A .repeat(N>=50) where the repeated string literal contains '(' or ')'.
          REPEAT_PAREN = re.compile(
              r'"[^"]*[\(\)][^"]*"\s*\.repeat\s*\(\s*(?:[5-9]\d|\d{3,})\s*\)'
              r'|'
              r"'[^']*[\(\)][^']*'\s*\.repeat\s*\(\s*(?:[5-9]\d|\d{3,})\s*\)"
          )

          # ── Signal 2: recursive parser invocation ─────────────────────────────
          # These three entry points drive chumsky recursive descent.  Iterative
          # security helpers (check_paren_depth, check_query_size, etc.) are
          # intentionally excluded — they never exhaust the stack.
          PARSER_CALL = re.compile(
              r'PrismQlParser::parse\s*\('
              r'|parse_filter\s*\('
              r'|parse_sql\s*\('
          )

          GUARD = 'run_with_deep_stack'

          # Test sources: src/tests/ directories and any *_test.rs files.
          test_paths = list(Path('crates').rglob('src/tests/*.rs'))
          test_paths += list(Path('crates').rglob('*_test.rs'))
          test_paths += list(Path('tests').rglob('*.rs'))

          # Simple function-body extractor: split file into #[test] fn blocks.
          def extract_test_bodies(text):
              """
              Yield (fn_name, body_text) for each #[test] function in text.
              Body is the text from the opening brace to the matching close brace.
              """
              fn_pat = re.compile(r'#\[(?:tokio::)?test\].*?fn\s+(\w+)\s*\([^)]*\)\s*\{', re.DOTALL)
              for m in fn_pat.finditer(text):
                  fn_name = m.group(1)
                  start = m.end() - 1  # position of opening brace
                  depth = 0
                  body_end = start
                  for i, ch in enumerate(text[start:], start):
                      if ch == '{':
                          depth += 1
                      elif ch == '}':
                          depth -= 1
                          if depth == 0:
                              body_end = i
                              break
                  yield fn_name, text[start:body_end + 1]

          warnings = []
          for path in sorted(set(test_paths)):
              try:
                  content = path.read_text()
              except Exception:
                  continue
              for fn_name, body in extract_test_bodies(content):
                  # Skip already-guarded tests — the wrapper is the fix.
                  if GUARD in body:
                      continue
                  # Both signals must be present: depth-structure AND parser call.
                  has_depth = LOOP_PAREN.search(body) or REPEAT_PAREN.search(body)
                  has_parser = PARSER_CALL.search(body)
                  if has_depth and has_parser:
                      warnings.append(f"  {path}::{fn_name}")

          if warnings:
              print(
                  f"\nWARNING (OBS-002): {len(warnings)} test(s) build deep paren structures "
                  f"AND invoke a recursive parser without `{GUARD}`.\n"
                  "These tests may SIGBUS on macOS aarch64 CI (2MB default stack).\n"
                  "Wrap the body with run_with_deep_stack from crates/prism-query/src/tests/util.rs.\n"
              )
              for w in warnings:
                  print(w)
              # Non-blocking: exit 0 so the PR is not blocked.
              # TODO: promote to exit(1) once all existing tests are confirmed wrapped.
              sys.exit(0)
          else:
              print("OBS-002 OK: no deep-recursion tests found missing run_with_deep_stack.")
              sys.exit(0)
          PYEOF

  shellcheck-demo-scripts:
    name: Shellcheck demo scripts (S-DEMO-003 HIGH-2 / AC-014)
    # Required PR gate per ADR-034 HIGH-2 remediation (AC-014 of S-DEMO-003).
    # Runs shellcheck on all scripts/demo-*.sh files to catch shell scripting errors,
    # undefined variable references, and unsafe patterns before they reach production.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: Run shellcheck on demo scripts
        run: |
          # AC-014 (S-DEMO-003): shellcheck must pass with zero errors on all demo scripts.
          # This is a required PR gate — failures block merge.
          shellcheck scripts/demo-*.sh
          echo "shellcheck: all demo scripts pass (S-DEMO-003 HIGH-2 / AC-014)"

  verify-workflow-structure:
    name: Verify workflow structure (AC-5..AC-8 reachability)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Validate workflow YAML + reachability assertions
        run: |
          # Structural validation
          for wf in .github/workflows/*.yml; do
            echo "Validating $wf..."
            # Basic YAML parse
            python3 -c "import yaml; yaml.safe_load(open('$wf'))"
          done
          # AC-5..AC-8 reachability assertions (replace YAML-grep-only evidence)
          # AC-5: multi-platform matrix in ci.yml (include-style matrix with 5 targets)
          # Match only 12-space-indented matrix object keys; excludes this assertion line.
          TARGET_COUNT=$(grep -cE '^            target:' .github/workflows/ci.yml || true)
          [ "$TARGET_COUNT" -ge 5 ] || { echo "AC-5 FAIL: expected >=5 target entries, got $TARGET_COUNT"; exit 1; }
          # AC-6: cargo-deny + cargo-audit jobs exist
          grep -qE '(cargo.?deny|cargo.?audit)' .github/workflows/ci.yml || { echo 'AC-6 FAIL'; exit 1; }
          # AC-7: semver check job exists (job-name anchor; 2-space indent; F-CIDISK-P4-HIGH-002)
          grep -qE '^  semver-checks:' .github/workflows/ci.yml || { echo 'AC-7 FAIL'; exit 1; }
          # AC-8: no-default-features job exists (job-name anchor; 2-space indent; F-CIDISK-P4-LOW-001)
          grep -qE '^  test-no-default-features:' .github/workflows/ci.yml || { echo 'AC-8 FAIL'; exit 1; }
          # AC-5 forward-compat enforcement job reachability (F-LP2-HIGH-002):
          # The non-exhaustive-violation-compile-fail job is the SOLE enforcement of
          # #[non_exhaustive] on all pub TOML-deserialized types. A future PR removing
          # the entire job block would not be caught by structural validation without
          # this check. This grep anchors the job name to the file so removal is detected.
          # Anchored job-definition pattern (F-MCPNULL-P3-LOW-003): greps must match the
          # actual job definition line (2-space-indented YAML key) so commented-out job
          # blocks — which still contain the name as text — do NOT pass the check.
          # Pattern: '^  <job-name>:' matches "  job-name:" at line start; a commented
          # block "#  job-name:" starts with '#' and does not match.
          grep -qE '^  non-exhaustive-violation-compile-fail:' .github/workflows/ci.yml || {
            echo "::error::AC-5 CI enforcement job 'non-exhaustive-violation-compile-fail' is missing from ci.yml — forward-compat #[non_exhaustive] enforcement removed (BC-2.01.013 AC-5)"
            exit 1
          }
          echo 'AC-5 reachability check passed: non-exhaustive-violation-compile-fail job definition present.'
          # F-LP5-HIGH-001 reachability assertion:
          # The wasm32-compile-check job is the SOLE CI gate proving the crowdstrike-oauth2
          # plugin's wit-bindgen Guest impl + export!(Component) macro actually compile.
          # A future PR removing this job block would silently disable the gate.
          grep -qE '^  wasm32-compile-check:' .github/workflows/ci.yml || {
            echo "::error::F-LP5-HIGH-001: wasm32-compile-check job is missing from ci.yml — Guest impl compile gate removed (PLUGIN-MIGRATION-001-E F-LP5-HIGH-001)"
            exit 1
          }
          echo 'F-LP5-HIGH-001 reachability check passed: wasm32-compile-check job definition present.'
          # S-PLUGIN-CI-001 AC-001 reachability assertion:
          # The wasm32-compile-check job must include the .prx build step that runs
          # `just build-plugin-crowdstrike-oauth2`. Anchored to the leading-whitespace run
          # command ('^[[:space:]]+just ... \s*$') so a commented-out step does NOT match
          # ('#          just ...' starts with '#', not whitespace-then-'just'); trailing
          # \s*$ ensures the assertion line cannot match itself (self-match-proof, fix-burst-3).
          grep -qE '^\s+just build-plugin-crowdstrike-oauth2\s*$' .github/workflows/ci.yml || {
            echo "::error::S-PLUGIN-CI-001 AC-001: 'just build-plugin-crowdstrike-oauth2' run step is missing from ci.yml — .prx build gate removed (S-PLUGIN-CI-001 AC-001)"
            exit 1
          }
          echo 'S-PLUGIN-CI-001 AC-001 reachability check passed: build-plugin-crowdstrike-oauth2 run step present.'
          # AC-006 PLUGIN-MIGRATION-001-F reachability assertion:
          # The no-hardcoded-sensors-compile-fail job is the SOLE CI gate enforcing ADR-023
          # Rule 3 (no sensor-named module references outside DTU clones). A future PR
          # removing this job block would silently allow regression of the deleted auth
          # modules (prism_sensors::auth::{armis,claroty,crowdstrike,cyberint}).
          grep -qE '^  no-hardcoded-sensors-compile-fail:' .github/workflows/ci.yml || {
            echo "::error::AC-006 PLUGIN-MIGRATION-001-F: 'no-hardcoded-sensors-compile-fail' job is missing from ci.yml — ADR-023 Rule 3 compile-fail enforcement removed"
            exit 1
          }
          echo 'AC-006 reachability check passed: no-hardcoded-sensors-compile-fail job definition present.'
          # S-DEMO-003 HIGH-2 / AC-014 reachability assertion:
          # The shellcheck-demo-scripts job is the required PR gate for demo script quality
          # (ADR-034 HIGH-2 remediation). A future PR removing this job would silently remove
          # the shellcheck gate.
          grep -qE '^  shellcheck-demo-scripts:' .github/workflows/ci.yml || {
            echo "::error::S-DEMO-003 AC-014: 'shellcheck-demo-scripts' job is missing from ci.yml — shellcheck PR gate removed (ADR-034 HIGH-2)"
            exit 1
          }
          echo 'S-DEMO-003 AC-014 reachability check passed: shellcheck-demo-scripts job definition present.'
          # F-MCPNULL-P2-OBS-002 / F-MCPNULL-P3-LOW-003 reachability assertion:
          # The wasm32-threatintel-staleness-check job is the SOLE CI gate enforcing that the
          # committed threatintel-lookup.prx and manifest stay in sync with their source crate.
          # A future PR removing this job block would silently allow the committed artifacts
          # to drift stale. Anchored to the 2-space job definition line (F-MCPNULL-P3-LOW-003).
          grep -qE '^  wasm32-threatintel-staleness-check:' .github/workflows/ci.yml || {
            echo "::error::F-MCPNULL-P2-OBS-002: 'wasm32-threatintel-staleness-check' job is missing from ci.yml — threatintel-lookup.prx staleness gate removed (DEFECT-MCP-ROWSHAPE-NULLS-001 F-MCPNULL-P2-OBS-002)"
            exit 1
          }
          echo 'F-MCPNULL-P2-OBS-002 reachability check passed: wasm32-threatintel-staleness-check job definition present.'
          # F-MCPRS-PRL14-LOW-001 reachability assertion (threatintel-lookup):
          # The committed-binary structural validation step must remain in
          # wasm32-threatintel-staleness-check BEFORE the build overwrites the binary.
          # Pattern: grep for the PASS echo unique to the committed-binary validation step.
          grep -q 'F-MCPRS-PRL14-LOW-001 PASS: committed threatintel' .github/workflows/ci.yml || {
            echo "::error::F-MCPRS-PRL14-LOW-001: committed threatintel-lookup.prx structural validation step missing from ci.yml — byte-corrupt committed .prx would pass CI undetected"
            exit 1
          }
          echo 'F-MCPRS-PRL14-LOW-001 reachability check passed: committed threatintel-lookup.prx wasm-tools validate step present.'
          # F-MCPRS-PRL14-LOW-001 reachability assertion (crowdstrike-oauth2):
          # The committed-binary structural validation step must remain in
          # wasm32-compile-check BEFORE the build overwrites the binary.
          grep -q 'F-MCPRS-PRL14-LOW-001 PASS: committed crowdstrike' .github/workflows/ci.yml || {
            echo "::error::F-MCPRS-PRL14-LOW-001: committed crowdstrike-oauth2.prx structural validation step missing from ci.yml — byte-corrupt committed .prx would pass CI undetected"
            exit 1
          }
          echo 'F-MCPRS-PRL14-LOW-001 reachability check passed: committed crowdstrike-oauth2.prx wasm-tools validate step present.'
          # S-MAINT-CI-DISK-EXHAUSTION-001 AC-001 reachability assertion:
          # The Test job must include a disk-free preflight step ("Report initial disk space" / df -h)
          # that runs before actions/checkout to capture a pristine baseline. A future PR removing
          # this step would silently remove post-hoc disk-exhaustion analysis capability.
          # Anchored to YAML step-name syntax (^\s+- name:) — indent-agnostic and self-match-proof.
          # Count-based: must appear in ≥2 Linux jobs (linux-test + test-no-default-features).
          # The assertion line starts with whitespace+count=$(grep..., not whitespace+"- name:", so
          # the ^ anchor cannot self-match.
          count=$(grep -cE '^\s+- name: Report initial disk space\s*$' .github/workflows/ci.yml)
          [ "$count" -ge 2 ] || {
            echo "::error::S-MAINT-CI-DISK-EXHAUSTION-001 AC-001: disk preflight step missing from ≥2 Linux jobs (found ${count}; need linux-test + test-no-default-features)"
            exit 1
          }
          echo "S-MAINT-CI-DISK-EXHAUSTION-001 AC-001 check passed: disk preflight step found ${count} times (≥2 required)."
          # Anchored to YAML uses: key syntax (^\s+uses:) — self-match-proof.
          # Count-based: must appear in ≥2 Linux jobs (linux-test + test-no-default-features).
          # The assertion line starts with whitespace+count=$(grep..., not whitespace+"uses:", so
          # the ^ anchor cannot self-match.
          count=$(grep -cE '^\s+uses: insightsengineering/disk-space-reclaimer' .github/workflows/ci.yml)
          [ "$count" -ge 2 ] || {
            echo "::error::S-MAINT-CI-DISK-EXHAUSTION-001 AC-002: disk-space-reclaimer missing from ≥2 Linux jobs (found ${count}; need linux-test + test-no-default-features)"
            exit 1
          }
          echo "S-MAINT-CI-DISK-EXHAUSTION-001 AC-002 check passed: disk-space-reclaimer action found ${count} times (≥2 required)."
          # Assertion 3: [profile.dev] section must contain debug = "line-tables-only".
          # Section-scoped awk: enters on exact [profile.dev] header, exits on any other [.
          # Context-aware: a stray debug = "line-tables-only" in another section does not satisfy.
          # Self-match impossible (file is .cargo/config.toml, not ci.yml).
          awk '/^\[profile\.dev\]$/{s=1;next} /^\[/{s=0} s && /^debug = "line-tables-only"$/{found=1} END{exit !found}' .cargo/config.toml || {
            echo "::error::S-MAINT-CI-DISK-EXHAUSTION-001 AC-003: .cargo/config.toml [profile.dev] section missing debug = \"line-tables-only\" — this disk-footprint invariant must not be removed"
            exit 1
          }
          echo 'S-MAINT-CI-DISK-EXHAUSTION-001 AC-003 assertion-3 passed: .cargo/config.toml debug = "line-tables-only" present.'
          # Assertion 4: [profile.dev.package."*"] section must contain debug = false.
          # Section-scoped awk: enters on exact [profile.dev.package."*"] header, exits on any other [.
          # Context-aware: section header alone is insufficient — the debug = false payload must be present.
          # Self-match impossible (file is .cargo/config.toml, not ci.yml).
          awk '/^\[profile\.dev\.package\."\*"\]$/{s=1;next} /^\[/{s=0} s && /^debug = false$/{found=1} END{exit !found}' .cargo/config.toml || {
            echo "::error::S-MAINT-CI-DISK-EXHAUSTION-001 AC-003: .cargo/config.toml [profile.dev.package.\"*\"] section missing debug = false — dependency debug-info override must not be removed"
            exit 1
          }
          echo 'S-MAINT-CI-DISK-EXHAUSTION-001 AC-003 assertion-4 passed: [profile.dev.package."*"] section present.'
          echo 'All verify-workflow-structure assertions pass: AC-5-TARGET_COUNT + AC-6-deny/audit + AC-7-semver-checks + AC-8-test-no-default-features + AC-5-non-exhaustive-job + F-LP5-HIGH-001 + S-PLUGIN-CI-001-AC-001 + AC-006 + S-DEMO-003-AC-014 + F-MCPNULL-P2-OBS-002 + F-MCPRS-PRL14-LOW-001 (×2) + S-MAINT-CI-DISK-EXHAUSTION-001-AC-001/AC-002 (count≥2) — all reachability assertions (anchored job-definition patterns, F-MCPNULL-P3-LOW-003, all self-match-proof) + AC-003 .cargo/config.toml invariant assertions (2 config-invariant).'
